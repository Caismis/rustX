description: Review the request with a native child agent.
block:
  input:
    type: object
    properties:
      task:
        type: string
    required:
    - task
    additionalProperties: false
  output:
    type: object
    properties:
      summary:
        type: string
    required:
    - summary
    additionalProperties: false
  nodes:
    workflow_start:
      type: start
    review:
      type: agent
      profile: reviewer
      task:
      - type: literal
        value: "Review the request and commit the result."
      - type: literal
        value: "\n\ntask: "
      - type: reference
        path: ["args", "task"]
      output:
        type: json_schema
        schema:
          type: object
          properties:
            passed:
              type: boolean
            summary:
              type: string
          required:
          - passed
          - summary
          additionalProperties: false
    decision:
      type: branch
      cases:
      - id: 'true'
        condition:
          type: boolean
          value:
            type: reference
            path:
            - review
            - passed
    success:
      type: return
      output:
        type: object
        fields:
          summary:
            type: reference
            path:
            - review
            - summary
    failure:
      type: return
      output:
        type: object
        fields:
          summary:
            type: reference
            path:
            - args
            - task
  edges:
  - from: workflow_start
    to: review
  - from: review
    to: decision
  - from: decision
    to: success
    port: true
  - from: decision
    to: failure
    port: false
