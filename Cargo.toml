[package]
name = "rustx"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "A standalone Rust execution runtime for durable, tool-using LLM agents."
repository = "https://github.com/Caismis/rustX"
publish = false

[lib]
name = "rustx"
path = "src/lib.rs"

[[bin]]
name = "rustx"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
