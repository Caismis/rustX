[package]
name = "rustx"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "A standalone Rust execution runtime for durable, tool-using LLM agents."
repository = "https://github.com/Caismis/rustX"
publish = false

[lib]
name = "rustx"
path = "src/lib.rs"

[[bin]]
name = "rustx"
path = "src/main.rs"

[[bin]]
name = "bash-supervisor"
path = "src/bin/bash_supervisor.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "time", "net", "io-util", "process"] }
tokio-util = { version = "0.7", features = ["rt"] }
futures-util = "0.3"
async-openai = { version = "0.41", default-features = true, features = ["chat-completion", "responses", "middleware", "byot"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls"] }
eventsource-stream = "0.2"
tower = { version = "0.5", features = ["util"] }
jsonschema = "0.26"
regex = "1.13.1"
globset = "0.4.19"
walkdir = "2.5.0"
nix = { version = "0.31.3", features = ["signal", "process", "fs"] }
libc = "0.2"

[lints.rust]
# The per-invocation Bash supervisor performs exactly one narrowly scoped
# libc prctl(PR_SET_CHILD_SUBREAPER) call, allowed explicitly in
# src/tools/native/bash_supervisor.rs; everything else stays unsafe-free.
unsafe_code = "warn"

[lints.clippy]
all = "warn"
pedantic = "warn"

[dev-dependencies]
tempfile = "3.27.0"
nix = { version = "0.31.3", features = ["signal", "process", "fs"] }
