[workspace]
# A bare `cargo test`/`cargo build` at the root selects every member, so the
# extracted crates share the default verification surface. `-p` selection
# keeps working unchanged for scripts that need the root alone.
members = [".", "crates/*"]
resolver = "3"

[package]
name = "rustx"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "MIT"
description = "A standalone Rust execution runtime for durable, tool-using LLM agents."
repository = "https://github.com/Caismis/rustX"
publish = false

[workspace.lints.rust]
# The runtime process-supervision capability and the per-invocation Bash
# supervisor perform a small bounded set of explicitly allowed OS shims:
# the runtime layer's one-time prctl(PR_SET_CHILD_SUBREAPER) activation,
# the supervisor's PR_SET_CHILD_SUBREAPER, the SIGTERM no-op handler
# installation, prctl(PR_SET_NO_NEW_PRIVS), and
# seccomp(SECCOMP_SET_MODE_FILTER) with a stack-local sock_fprog. Raw syscall
# execution otherwise exists only in test-local seccomp regressions.
unsafe_code = "deny"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

[features]
# Fixture executors for external Rust integration tests. Product admission
# continues to use the bound Execution Client with this feature enabled.
test-support = []
mcp-fixture = ["test-support", "rmcp/server", "rmcp/transport-io", "rmcp/transport-streamable-http-server"]
# Issue #387 measurement-only counters (reservation / conflict / legacy-layout
# probe and the rustX logical owner-operation counters). Non-default: ordinary
# production builds compile the recorders to no-ops and carry no measurement
# atomic increment. Enable explicitly for the Session-create benchmark:
#   cargo build --release --features issue-387-profile --example session_create_benchmark
issue-387-profile = ["rustx-types/issue-387-profile", "rustx-durable/issue-387-profile"]

[lib]
name = "rustx"
path = "src/lib.rs"

[[bin]]
name = "rustx"
path = "src/main.rs"

[[bin]]
name = "workflow-renderer"
path = "src/bin/workflow_renderer.rs"

[dependencies]
clap = { version = "4.6.7", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
uuid = { version = "1.24", features = ["v4", "v7"] }
serde = { version = "1", features = ["derive", "rc"] }
# Correctly rounded float parsing: authored request-parameter numbers must read
# back as exactly the binary64 value that was written (and that JSON clients
# print), or a native source round trip would silently move them.
serde_json = { version = "1", features = ["float_roundtrip", "preserve_order", "raw_value"] }
# Compact private observation records; already locked transitively.
rmp-serde = "1.3.1"
thiserror = "2"
# PEP 508 grammar and PyPA normalized distribution identities for managed
# Python requirements. Chumsky is direct only to normalize pep-508's public
# structured parser errors; rustX never parses with it independently.
pep-508 = "0.5.0"
chumsky = "=1.0.0-alpha.8"
uv-normalize = "0.0.40"
# Lossless editing of user-authored TOML settings.
toml_edit = "0.22"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = { version = "0.10", features = ["serde"] }
# Parser/search only; the native Scheduler retains timer and admission ownership.
croner = "=4.0.2"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "time", "net", "io-util", "io-std", "process", "signal", "fs"] }
tokio-util = { version = "0.7", features = ["rt", "codec"] }
notify = { version = "8", default-features = false, features = ["macos_fsevent"] }
futures-util = "0.3"
tracing = "0.1"
async-openai = { version = "0.41", default-features = true, features = ["chat-completion", "responses", "middleware", "byot"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls"] }
eventsource-stream = "0.2"
bytes = "1"
tower = { version = "0.5", default-features = false }
# Schemas never acquire host file/network authority from a reference URI.
# Generated meta validators avoid retaining bundled-draft trees at runtime.
jsonschema = { version = "0.60.2", default-features = false, features = ["macros"] }
# Reuse the validator's resource resolver when compiling invocation envelopes.
referencing = "=0.60.2"
# Glob/Grep pattern validation compiled Server-side for model-facing
# diagnostics; the physical engines live on the Execution Client. No `rg`
# executable is ever spawned, and none of their defaults are part of the
# model-facing tool contract.
globset = "0.4.19"
ignore = "0.4.33"
# POSIX/bash AST for Issue #544 Bash read-only admission (ZCode semantic port).
brush-parser = "0.4.0"
grep-regex = "0.1.14"
nix = { version = "0.31.3", features = ["signal", "process", "fs", "dir", "inotify", "event", "user", "poll", "socket", "resource", "term", "uio"] }
rustix = { version = "1.1.4", features = ["fs", "termios", "pty"] }
libc = "0.2"
serde_yaml_ng = "0.10.0"
serde_path_to_error = "0.1"
toml = "0.8"
url = "2"
sha2 = "0.10"
constant_time_eq = "0.4"
jsonwebtoken = { version = "10.4", default-features = false, features = ["aws_lc_rs"] }
# Bounded line comparisons for captured per-turn workspace changes.
imbl = { version = "7.0.0", features = ["serde"] }
base64 = "0.22"
rustx-types = { path = "crates/rustx-types" }
rustx-conversation = { path = "crates/rustx-conversation" }
rustx-publication = { path = "crates/rustx-publication" }
rustx-durable = { path = "crates/rustx-durable" }
rustx-workflow = { path = "crates/rustx-workflow" }
# Workspace crates extracted from src/ (bottom-up split).
rustx-bounded-json = { path = "crates/rustx-bounded-json" }
rustx-bounded-file = { path = "crates/rustx-bounded-file" }
rustx-identity = { path = "crates/rustx-identity" }
# Bounded validation of native managed PNG image outputs.
png = "0.18.1"
getrandom = "0.3.4"
unicode-normalization = "0.1.24"
http = "1"
httpdate = "1"
# The Server-Sent Events types of rmcp's Streamable HTTP client surface.
# rustX supplies its own `StreamableHttpClient` (`tools::mcp::http`) so a
# cancelled tool call can terminate — and prove the release of — its own
# in-flight HTTP request, and that trait's stream signatures name these
# types directly. This is rmcp's own SSE crate, unified to one version.
sse-stream = "0.2.5"
# Observe queued SSE tools/list responses before publishing them (SEP-2243).
# Bound buffered HTTP JSON and error bodies before parsing. See docs/exec-03-evidence.md.
rmcp = { git = "https://github.com/Caismis/rust-sdk.git", rev = "53f7aaef44d40d769ab1c274819019c6c457eead", default-features = false, features = [
    "client",
    "transport-async-rw",
    "transport-streamable-http-client-reqwest",
    "reqwest",
] }
schemars = { version = "1", features = ["chrono04"] }
strum = { version = "0.27.2", features = ["derive"] }
tempfile = "3.27.0"
# The M8 durability backend (Issue #63 / #11). `bundled` compiles the SQLite
# amalgamation so no system libsqlite3 is required on any CI platform.
# SQLite 3.53.2 includes the WAL-reset race fix required by concurrent checkpoints.
# Keep checked u64/usize SQL conversions explicit with rusqlite's fallible_uint.
rusqlite = { version = "0.40.2", features = ["bundled", "hooks", "functions", "preupdate_hook", "fallible_uint"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake", "connect"] }

zip = { version = "8.6", default-features = false, features = ["deflate"] }
# The proven descriptor-relative filesystem primitives the physical
# Execution Client shares; there is no parallel implementation.
rustx-confined-fs = { path = "crates/confined-fs" }
rustx-execution-protocol = { path = "crates/execution-protocol" }
rustx-execution-server = { path = "crates/execution-server" }
rustx-execution-transport = { path = "crates/execution-transport" }
rustx-process-supervisor = { path = "crates/process-supervisor" }
rustx-text-edit = { path = "crates/text-edit" }
biodivine-lib-bdd = "0.6.3"
minijinja = { version = "=2.24.0", features = ["fuel", "json", "unstable_machinery"] }
minijinja-contrib = { version = "2", features = ["pycompat"] }
pep440_rs = "0.7.3"

[lints]
workspace = true

[dev-dependencies]
rustx-execution-client = { path = "crates/execution-client", features = ["test-support"] }
rustx-process-supervisor = { path = "crates/process-supervisor", features = ["test-support"] }

# The physical structured-document decoder — production code reaches it
# only across the Execution Client process boundary; it is linked here
# only for parser-boundary tests.
rustx-document-reader = { path = "crates/document-reader" }
rusqlite = { version = "0.40.2", features = ["trace"] }
tokio = { version = "1", features = ["test-util"] }
axum = "0.8"
rustx-identity = { path = "crates/rustx-identity", features = ["test-fixtures"] }
rustx-types = { path = "crates/rustx-types", features = ["test-fixtures"] }
rustx-durable = { path = "crates/rustx-durable", features = ["test-hooks"] }

[profile.dev.build-override]
# Derive and proc-macro expansion dominates the serial front-end of each rustX
# unit; hosting proc macros and build scripts optimized shortens every rustc
# invocation that follows, at a one-time cost inside the dependency build.
opt-level = 2

[profile.test]
# Bound non-incremental harness compilation on standard runners while
# preserving file/line backtraces. Match incremental builds' CGU partitioning.
debug = "line-tables-only"
codegen-units = 256

[profile.release.package.rustx]
# Optimize the shared serde codec instances together to reduce resident code.
codegen-units = 1

[profile.dev.package."*"]
# Third-party dependency debuginfo is never consumed in CI: it only inflates
# the test binaries toward 1 GB and slows link, pack and artifact transfer.
# Workspace members keep their own line tables via the base profiles.
debug = false

[profile.test.package."*"]
debug = false
