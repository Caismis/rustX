[package]
name = "rustx-types"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
serde_path_to_error = "0.1"
toml = "0.8"
toml_edit = "0.22"
url = "2.5"
jsonschema = { version = "0.60.2", default-features = false, features = ["macros"] }
croner = "=4.0.2"
chrono-tz = { version = "0.10", features = ["serde"] }
referencing = "=0.60.2"
serde_yaml_ng = "0.10.0"
tempfile = "3"
serde = { version = "1", features = ["derive", "rc"] }
schemars = { version = "1", features = ["chrono04"] }
strum = { version = "0.27.2", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
libc = "0.2"
nix = { version = "0.31.3", features = ["signal", "process", "fs"] }
rustx-identity = { path = "../rustx-identity" }
rustx-bounded-file = { path = "../rustx-bounded-file" }
rustx-bounded-json = { path = "../rustx-bounded-json" }
rustx-confined-fs = { path = "../confined-fs" }
rustx-execution-protocol = { path = "../execution-protocol" }
rustx-process-supervisor = { path = "../process-supervisor" }
rmp-serde = "1.3.1"
constant_time_eq = "0.4"
jsonwebtoken = { version = "10.4", default-features = false, features = ["aws_lc_rs"] }
ignore = "0.4.33"
base64 = "0.22"
tokio = { version = "1", features = ["macros", "sync"] }
tokio-util = { version = "0.7", features = ["rt", "codec"] }
serde_json = { version = "1", features = ["float_roundtrip", "preserve_order", "raw_value"] }
png = "0.18.1"
rustix = { version = "1.1.4", features = ["fs", "termios", "pty"] }
sha2 = "0.10"
thiserror = "2"
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls"] }
http = "1"
httpdate = "1"
rmcp = { git = "https://github.com/Caismis/rust-sdk.git", rev = "53f7aaef44d40d769ab1c274819019c6c457eead", default-features = false, features = ["client"], optional = true }

imbl = { version = "7.0.0", features = ["serde"] }

[dev-dependencies]
toml = "0.8"
serde_json = { version = "1", features = ["float_roundtrip", "preserve_order", "raw_value"] }

[features]
# Monolith cfg(test) call sites reach the test-only lifecycle helpers
# (hold_commit_boundary, wait_for_no_active_operations,
# enter_ownership_commit) through the workspace dependency.
issue-387-profile = []
test-fixtures = ["dep:rmcp", "rustx-process-supervisor/test-support"]

[lints]
workspace = true
