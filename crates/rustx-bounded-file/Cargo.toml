[package]
name = "rustx-bounded-file"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "MIT"
publish = false

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["float_roundtrip", "preserve_order", "raw_value"] }

[dev-dependencies]
nix = { version = "0.31.3", features = ["fs"] }
tempfile = "3"

[lints]
workspace = true
