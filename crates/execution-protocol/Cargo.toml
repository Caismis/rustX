[package]
name = "rustx-execution-protocol"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "MIT"
description = "Single wire definition for the rustX execution protocol between the Agent Server (rustx) and the physical Execution Client (rustx-execution-client)."
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
base64 = "0.22"
sha2 = "0.10"
uuid = { version = "1.24", features = ["v4", "serde"] }
serde_json = { version = "1", features = ["float_roundtrip", "preserve_order", "raw_value"] }
thiserror = "2"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31.3", default-features = false, features = ["poll"] }

[target.'cfg(unix)'.dev-dependencies]
nix = { version = "0.31.3", default-features = false, features = ["fs"] }

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "warn"
pedantic = "warn"
