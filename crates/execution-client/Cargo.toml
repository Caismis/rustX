[package]
name = "rustx-execution-client"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "MIT"
description = "The physical rustX Execution Client. This layer implements exactly one authenticated local binding and typed liveness, bounded revision-checked range reads, logical-text pages, and whitelisted document pages of its workspace — no process, MCP, or Python I/O."
publish = false

[[bin]]
name = "rustx-execution-client"
path = "src/main.rs"

[dependencies]
rustx-execution-protocol = { path = "../execution-protocol" }
rustx-confined-fs = { path = "../confined-fs" }
rustx-document-reader = { path = "../document-reader" }
base64 = "0.22"
nix = { version = "0.31.3", default-features = false, features = ["user", "socket"] }
# The bounded glob/grep engines of the Search exchange — the same crates
# the Agent Server's pre-migration search used, never a spawned `rg`.
globset = "0.4.19"
grep-regex = "0.1.14"
grep-searcher = "0.1.17"

[dev-dependencies]
rustx-execution-server = { path = "../execution-server" }
serde_json = "1"
tempfile = "3.27.0"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "warn"
pedantic = "warn"
