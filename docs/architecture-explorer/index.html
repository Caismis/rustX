t = handle.settlement;\n        tokio::pin!(completion);\n        tokio::pin!(settlement);\n        let idle_wait = async {\n            let Some(idle) = idle else {","url":"https://github.com/Caismis/rustX/blob/8cb41624eb2dc2ca87e4409961f42553ceb029cf/src/tools/invocation.rs#L220-L257"},{"id":"map-invocation-winner","path":"src/tools/invocation.rs","start":276,"end":315,"label":"ForegroundInvocation chooses completion, cancellation or deadline","text":"        // Sole terminal winner: cancellation, hard, idle, physical completion.\n        // The pinned settlement plane retains operation ownership after select.\n        let winner = tokio::select! {\n            biased;\n            () = ancestor.cancelled() =\u003e {\n                let reason = ancestor.native_cause();\n                #[cfg(test)]\n                if let Some(hook) = self.cancellation_won { hook(); }\n                Winner::Cancellation(reason)\n            },\n            () = self.clock.wait_until_millis(hard_deadline) =\u003e Winner::Deadline(ToolDeadlineKind::Hard),\n            () = idle_wait =\u003e {\n                // Biased polling is not an atomic clock cut: time can advance\n                // after the hard future returned Pending, before idle is polled.\n                // Commit deadline priority from one current logical-clock read.\n                let kind = if self.clock.now_millis() \u003e= hard_deadline {\n                    ToolDeadlineKind::Hard\n                } else {\n                    ToolDeadlineKind::Idle\n                };\n                Winner::Deadline(kind)\n            },\n            result = completion.as_mut() =\u003e {\n                #[cfg(test)]\n                if let Some(hook) = self.completion_won { hook(); }\n                Winner::Physical(result)\n            },\n        };\n        let mut facts = Vec::new();\n        let cause = match winner {\n            Winner::Physical(mut result) =\u003e {\n                if let ToolExecutionStatus::Cancelled { phase, .. } = \u0026mut result.status {\n                    *phase = ToolCancellationPhase::DuringExecution;\n                }\n                return (result, facts);\n            }\n            Winner::Cancellation(cause) =\u003e cause,\n            Winner::Deadline(kind) =\u003e {\n                facts.push(InvocationFact::Deadline { kind });\n                ToolCancellationCause::Deadline(kind)","url":"https://github.com/Caismis/rustX/blob/8cb41624eb2dc2ca87e4409961f42553ceb029cf/src/tools/invocation.rs#L276-L315"},{"id":"map-invocation-settlement","path":"src/tools/invocation.rs","start":337,"end":377,"label":"Only {{settlement}} plane is awaited after cancellation wins","text":"                        .await;\n                }\n            }\n        };\n        let evidence = tokio::select! {\n            biased;\n            evidence = settlement.as_mut() =\u003e Some(evidence),\n            () = guard_wait =\u003e None,\n        };\n        let result = match evidence {\n            Some(ToolSettlement::Confirmed(mut result)) =\u003e {\n                facts.push(InvocationFact::SettlementObserved {\n                    certainty: ToolSettlementCertainty::Confirmed,\n                });\n                if matches!(result.status, ToolExecutionStatus::Cancelled { .. }) {\n                    result.status = match cause {\n                        ToolCancellationCause::Attempt(reason) =\u003e ToolExecutionStatus::Cancelled {\n                            reason,\n                            phase: ToolCancellationPhase::DuringExecution,\n                        },\n                        ToolCancellationCause::Deadline(_) =\u003e ToolExecutionStatus::TimedOut,\n                    };\n                }\n                result\n            }\n            Some(ToolSettlement::Unconfirmed { detail }) =\u003e {\n                facts.push(InvocationFact::SettlementObserved {\n                    certainty: ToolSettlementCertainty::Unconfirmed,\n                });\n                unknown(detail)\n            }\n            None =\u003e {\n                let reason = \"the executor's settlement control plane did not return within the guard window after the cancellation request; this is an executor settlement-contract violation, not proof about the physical operation\".to_owned();\n                facts.push(InvocationFact::SettlementControlFailed {\n                    reason: reason.clone(),\n                });\n                unknown(reason)\n            }\n        };\n        (result, facts)\n    }","url":"https://github.com/Caismis/rustX/blob/8cb41624eb2dc2ca87e4409961f42553ceb029cf/src/tools/invocation.rs#L337-L377"},{"id":"map-executor-handle","path":"src/tools/executor.rs","start":324,"end":341,"label":"ToolExecutor::start constructs a handle without {{dispatch-tool}}","text":"pub trait ToolExecutor: Send + Sync {\n    /// Constructs the handle of one caller-neutral native invocation.\n    ///\n    /// This method must not dispatch physical work. Dispatch and its cleanup\n    /// live inside the returned handle, so cancellation before the first\n    /// operation poll can prove that the invocation never had an effect.\n    ///\n    /// The returned [`ToolExecutionHandle`] splits the execution into its\n    /// physical completion plane and its independent cancellation/settlement\n    /// control plane; both are owned by the executor: implementations clone\n    /// or capture the data they need and never borrow past the call.\n    fn start\u003c'a\u003e(\n        \u0026'a self,\n        invocation: ToolInvocation,\n        context: ToolExecutionContext\u003c'a\u003e,\n    ) -\u003e ToolExecutionHandle\u003c'a\u003e;\n\n    /// Whether this executor can emit meaningful progress evidence for one","url":"https://github.com/Caismis/rustX/blob/8cb41624eb2dc2ca87e4409961f42553ceb029cf/src/tools/executor.rs#L324-L341"},{"id":"map-executor-settlement","path":"src/tools/executor.rs","start":356,"end":385,"label":"ToolSettlement distinguishes {{map-physical-terminal}} proof and remote uncertainty","text":"///\n/// The settlement plane is the executor's own authority over what physical\n/// cancellation achieved: it resolves only after the executor observed the\n/// cancellation request delivered through its context's\n/// [`ExecutionCancellation`] and ran its physical cancellation path to its\n/// end. It never means \"the owning lifecycle stopped waiting\" — that is the\n/// lifecycle's guard against a broken executor, and it is never settlement\n/// evidence.\npub enum ToolSettlement {\n    /// The executor proved its physical operation terminal; the carried\n    /// result is that proven terminal outcome (for example Bash's killed and\n    /// reaped process tree reported as `Cancelled`).\n    Confirmed(ToolExecutionResult),\n    /// Cancellation was physically propagated and the executor's local rustX\n    /// execution ownership reached its terminal cleanup boundary: no\n    /// rustX-owned Tokio task, subprocess, unreaped child process, worker\n    /// task, or other executor-owned local physical activity capable of\n    /// running remains. Only an external effect beyond rustX's ownership\n    /// domain — a dispatched remote MCP call, a remote HTTP operation, the\n    /// state of an external service — may still be uncertain. Never means\n    /// \"we stopped waiting\": local execution ownership that is still alive\n    /// must keep the settlement plane pending until it is\n    /// reclaimed/joined/aborted.\n    Unconfirmed {\n        /// The executor's own description of the unprovable frontier.\n        detail: String,\n    },\n}\n\n/// One started tool execution: the physical completion plane plus the","url":"https://github.com/Caismis/rustX/blob/8cb41624eb2dc2ca87e4409961f42553ceb029cf/src/tools/executor.rs#L356-L385"},{"id":"map-tool-runtime","path":"src/tools/runtime.rs","start":1,"end":16,"label":"ConversationToolRuntime owns stable conversation resources","text":"//! The conversation-owned tool runtime bundle.\n//!\n//! One conversation owns one [`ConversationToolRuntime`]: the canonical\n//! workspace boundary, the artifact store, the explicit authorized tool\n//! environment, the conversation inbound mailbox, the authoritative\n//! background registry, and the conversation's task list. An `AgentExecution` receives a reference to the\n//! bundle and drains `tool_runtime.mailbox()`; detached background runners\n//! receive cloned handles. No process-global tool state exists.\n//!\n//! # Immutable resource binding\n//!\n//! Every background-runtime dependency (mailbox, clock, event sink,\n//! environment, workspace, artifact store) is bound at construction time\n//! through [`ConversationRuntimeConfig`]. After construction the\n//! conversation background registry identity is stable: configuration can\n//! never replace or reset the registry, so existing execution records can","url":"https://github.com/Caismis/rustX/blob/8cb41624eb2dc2ca87e4409961f42553ceb029cf/src/tools/runtime.rs#L1-L16"},{"id":"map-native-child","path":"src/runtime/subagent.rs","start":1,"end":22,"label":"SubagentRegistry identities, sealing and final report {{map-subagent-authority}}","text":"//! Durable native child Agents and finite activation supervision.\n//!\n//! SubagentRegistry owns each stable AgentId, child ConversationId, lineage,\n//! frozen admitted authority and frozen Session execution binding, plus zero or one current\n//! activation. SubagentId names a finite activation, not the durable Agent.\n//! Catalog/resolver freeze creation authority; later send_message calls reuse it.\n//!\n//! Active message admission and activation sealing use the same registry mutex.\n//! Child SealRequested closes admission before the driver grants local sealing;\n//! previously admitted envelopes drain in FIFO order. Inactive message admission\n//! reserves one next activation. Stopping rejects transiently; unavailable\n//! settlement or publication authority requires explicit proof or repair.\n//!\n//! Drivers alone own process handles, cancellation escalation, reap and nested\n//! containment. Committed terminal publication with proven physical settlement\n//! leaves the Agent inactive and resumable. Recovery owns later durable proof\n//! without reopening the old activation. Workflow-owned finite children share\n//! supervision primitives without becoming native durable Agents.\n//!\n//! Canonical child history owns content. Each final report enters parent canonical\n//! inbound exactly once for its activation, adjacent to runtime-authored Agent\n//! and activation correlation. The Event Journal owns execution/admission facts;","url":"https://github.com/Caismis/rustX/blob/8cb41624eb2dc2ca87e4409961f42553ceb029cf/src/runtime/subagent.rs#L1-L22"},{"id":"map-child-process","path":"src/runtime/subagent/process.rs","start":1,"end":29,"label":"One process driver owns spawn, cancellation escalation and reap","text":"//! The sole low-level process owner of one subagent child (Issue #60).\n//!\n//! This module owns the **physical** boundary of a child rustX runtime:\n//!\n//! ```text\n//! spawn            (own process group, inherited control channel on fd 0,\n//!                   inherited disposable observation channel on fd 1)\n//! control channel  (bounded framed IPC; also the parent-liveness authority)\n//! observation      (Activity frames only, child-\u003eparent; its stall or loss\n//! channel          is diagnostics-only and never evidences lifecycle)\n//! start gate       (the child performs no semantic work before Delegate)\n//! escalation       (Cancel frame -\u003e SIGTERM group -\u003e SIGKILL group)\n//! wait/reap        (the direct child is reaped exactly here)\n//! ```\n//!\n//! The logical [`SubagentRegistry`](super::registry) never holds an OS\n//! process handle: it stages a [`StagedChild`], and the one ownership\n//! commit moves the handle into the registry-owned driver task. No second\n//! kill/reap authority exists anywhere.\n//!\n//! # Platform semantics\n//!\n//! The child is a **direct child** of the runtime process on both Linux and\n//! macOS, spawned into its own process group so escalation can signal the\n//! whole group. Parent-lifetime containment does not depend on a platform\n//! primitive: the control channel endpoint is inherited by the child as its\n//! fd 0, and every other copy of the parent's endpoint is `CLOEXEC` by\n//! construction (Rust socket creation), so a hard parent death — including\n//! `SIGKILL` — closes the channel and the child observes EOF. A child that","url":"https://github.com/Caismis/rustX/blob/8cb41624eb2dc2ca87e4409961f42553ceb029cf/src/runtime/subagent/process.rs#L1-L29"},{"id":"map-workflow-tool","path":"src/runtime/workflow/tool.rs","start":31,"end":72,"label":"Workflow Tool node uses ToolInvocationId::Workflow and {{native}} {{preflight}}","text":"\nimpl WorkflowRuntime {\n    /// One exact admitted registration through the standard native\n    /// invocation path and the invoking Session's execution binding.\n    /// External Tools keep their own admitted materialization contract.\n    #[allow(clippy::too_many_lines)]\n    pub(super) async fn invoke_tool(\n        \u0026self,\n        run: \u0026WorkflowRun,\n        context: \u0026AttemptSubagentContext,\n        node: \u0026WorkflowNodeInstance,\n        selector: \u0026ExactToolSelector,\n        arguments: Value,\n        cancellation: \u0026crate::runtime::cancellation::ExecutionCancellation,\n    ) -\u003e Result\u003cToolExecutionResult, WorkflowRunError\u003e {\n        let services = context.native.as_ref().ok_or_else(|| {\n            WorkflowRunError::InvocationAuthority(\n                \"attempt has no native invocation services\".into(),\n            )\n        })?;\n        let definition = run.tools.get(selector).ok_or_else(|| {\n            WorkflowRunError::CapabilityNotAdmitted(\n                \"capability was not admitted to this Workflow\".into(),\n            )\n        })?;\n        let registration = context\n            .resources()\n            .capability()\n            .available_tools()\n            .registration(definition)\n            .map_err(WorkflowRunError::IdentityChanged)?;\n        let id = ToolInvocationId::Workflow {\n            node: Box::new(node.clone()),\n        };\n        self.read_model.node(node, |view| {\n            view.invocation = Some(id.clone());\n            view.tool_id = Some(definition.id.clone());\n        });\n        let prepared = match registration\n            .prepare_fixed(id.clone(), definition, \u0026arguments)\n            .map_err(WorkflowRunError::IdentityChanged)?\n        {","url":"https://github.com/Caismis/rustX/blob/8cb41624eb2dc2ca87e4409961f42553ceb029cf/src/runtime/workflow/tool.rs#L31-L72"},{"id":"map-workflow-bound","path":"src/runtime/workflow/execution.rs","start":30,"end":67,"label":"Workflow recursively validates {{finite}} expansion bounds","text":"\n/// Deliberate worst-case expansion, including iteration admission steps. Each\n/// recursion is checked before multiplication, so overflow is not a bound.\npub(super) fn static_execution_bound(\n    block: \u0026WorkflowBlockProgram,\n) -\u003e Result\u003c(usize, usize), super::WorkflowCompileError\u003e {\n    let mut steps = block.nodes.len();\n    let mut agents = 0;\n    for node in block.nodes.values() {\n        match node {\n            WorkflowNodeProgram::Agent(_) =\u003e agents += 1,\n            WorkflowNodeProgram::Parallel { branches, .. } =\u003e {\n                for branch in branches.values() {\n                    let (child_steps, child_agents) = static_execution_bound(\u0026branch.block)?;\n                    steps += child_steps;\n                    agents += child_agents;\n                }\n            }\n            WorkflowNodeProgram::Loop {\n                body,\n                max_iterations,\n                ..\n            } =\u003e {\n                let (child_steps, child_agents) = static_execution_bound(body)?;\n                steps += (child_steps + 1) * *max_iterations as usize;\n                agents += child_agents * *max_iterations as usize;\n            }\n            _ =\u003e {}\n        }\n        if steps \u003e MAX_WORKFLOW_STEPS || agents \u003e MAX_WORKFLOW_AGENTS {\n            return Err(super::WorkflowCompileError::InvalidField(\n                \"aggregate expanded execution bound exceeded\".into(),\n            ));\n        }\n    }\n    Ok((steps, agents))\n}\n","url":"https://github.com/Caismis/rustX/blob/8cb41624eb2dc2ca87e4409961f42553ceb029cf/src/runtime/workflow/execution.rs#L30-L67"},{"id":"map-goal-state","path":"src/goal.rs","start":1,"end":8,"label":"GoalPhase::Active authorizes eligible autonomous {{admission-goal}}","text":"//! Revisioned Goal authority. History and events are observations, never state.\n//!\n//! `GoalPhase` is the one product-visible Goal lifecycle authority (Issue\n//! #351). `GoalPhase::Active` **is** durable authorization to continue: the\n//! owning `ConversationRuntime` may admit an autonomous round whenever it\n//! reaches an eligible safe idle boundary. There is no second, process-local\n//! activation state, so no reader can observe an Active Goal that is\n//! silently inert.","url":"https://github.com/Caismis/rustX/blob/8cb41624eb2dc2ca87e4409961f42553ceb029cf/src/goal.rs#L1-L8"},{"id":"map-goal-types","path":"src/goal.rs","start":24,"end":72,"label":"GoalRef, GoalPhase and {{durable}} GoalSnapshot","text":"/// Exact observation required by every mutation of an existing Goal.\n#[derive(Debug, Clone, PartialEq, Eq, Serialize, Deserialize, schemars::JsonSchema)]\n#[serde(deny_unknown_fields)]\npub struct GoalRef {\n    pub id: String,\n    pub revision: u64,\n}\n\n/// The single durable Goal lifecycle authority.\n///\n/// - `Active`: continuation is authorized when runtime admission is eligible.\n/// - `Paused` / `Blocked`: continuation is not authorized.\n/// - `Complete`: terminal.\n#[derive(Debug, Clone, Copy, PartialEq, Eq, Serialize, Deserialize)]\n#[serde(rename_all = \"snake_case\")]\n#[derive(schemars::JsonSchema)]\npub enum GoalPhase {\n    Active,\n    Paused,\n    Blocked,\n    Complete,\n}\n\n/// Trusted origin supplied by runtime, never by model arguments.\n#[derive(Debug, Clone, PartialEq, Eq, Serialize, Deserialize)]\n#[serde(tag = \"kind\", rename_all = \"snake_case\", deny_unknown_fields)]\n#[derive(schemars::JsonSchema)]\npub enum GoalOrigin {\n    HumanAttempt {\n        message_id: MessageId,\n        attempt_id: AttemptId,\n    },\n    RuntimeControl,\n}\n\n/// Authoritative bounded durable record.\n#[derive(Debug, Clone, PartialEq, Eq, Serialize, Deserialize)]\n#[serde(deny_unknown_fields)]\n#[derive(schemars::JsonSchema)]\npub struct GoalSnapshot {\n    pub reference: GoalRef,\n    pub objective: String,\n    pub phase: GoalPhase,\n    pub blocked_reason: Option\u003cString\u003e,\n    pub autonomous_round_budget: u32,\n    pub autonomous_rounds_consumed: u32,\n    pub origin: GoalOrigin,\n    pub last_round_message_id: Option\u003cMessageId\u003e,\n}","url":"https://github.com/Caismis/rustX/blob/8cb41624eb2dc2ca87e4409961f42553ceb029cf/src/goal.rs#L24-L72"},{"id":"map-extensions-bind","path":"src/extensions.rs","start":28,"end":65,"label":"NativeContextComposition registers Agent Status through ContextAssembly","text":"    }\n\n    pub(crate) fn bind(\n        \u0026mut self,\n        assembly: \u0026mut crate::context::ContextAssembly,\n        composition: Option\u003c\u0026NativeAgentExtensions\u003e,\n        runtime: \u0026crate::tools::runtime::ConversationToolRuntime,\n        lifecycle: crate::agent::lifecycle::AttemptLifecycle,\n    ) -\u003e Result\u003ccrate::agent::lifecycle::AttemptLifecycle, crate::context::ContextAssemblyError\u003e\n    {\n        if let Some(composition) = composition {\n            composition.register_domain_context(assembly, runtime)?;\n        }\n        if let Some(engine) = self.status.take() {\n            let background = runtime.background().clone();\n            let todos = composition\n                .filter(|c| c.todo().is_some())\n                .and_then(|_| runtime.todos())\n                .cloned();\n            assembly.register_native(\n                crate::runtime::identity::NativeContextContributor::AgentStatus,\n                Arc::new(crate::context::status::StatusContextContributor {\n                    engine: std::sync::Mutex::new(engine),\n                    background: Arc::new(move || background.active_snapshot()),\n                    todo: Arc::new(move || {\n                        todos\n                            .as_ref()\n                            .map(|todos| todos.committed().status_presentation())\n                    }),\n                    reminders: Arc::new(ContributionReminderReader(runtime.durable_store())),\n                }),\n            )?;\n        }\n        #[cfg(test)]\n        let lifecycle = composition\n            .into_iter()\n            .flat_map(|c| \u0026c.test_contributors)\n            .filter(|probe| probe.observe_tools)","url":"https://github.com/Caismis/rustX/blob/8cb41624eb2dc2ca87e4409961f42553ceb029cf/src/extensions.rs#L28-L65"},{"id":"map-publication-proposals","path":"src/publication/mod.rs","start":80,"end":93,"label":"{{publication}} Tool proposals confer no execution {{map-agent-authority}}","text":"//! `MessageId`. See [`carryover`] for the shared selector and renderer.\n//!\n//! # Tool proposals are not executions\n//!\n//! Tool-call frames are **model proposals**, never Tool Plane execution\n//! facts. The vocabulary names them so\n//! ([`PublicationPayload::ProposedToolCallStarted`] and siblings), and the\n//! durable store enforces the hard invariant that no proposal belonging to an\n//! Incomplete or Unaccepted publication may have a dependent\n//! `ToolExecutionStarted`, `ToolResult`, or side-effect authorization.\n//! The store also owns the proposal staging state machine: Started freezes the\n//! stream-local block/tool/name identity, arguments require Started, and\n//! Completion advances it exactly once to Completed.\n","url":"https://github.com/Caismis/rustX/blob/8cb41624eb2dc2ca87e4409961f42553ceb029cf/src/publication/mod.rs#L80-L93"},{"id":"map-conversation-hot","path":"src/conversation/mod.rs","start":1,"end":11,"label":"{{canonical}} {{map-ledger}}, historical {{projection-context}} and hot state {{ownership}}","text":"//! Immutable canonical conversation facts and their bounded hot working set.\n//!\n//! The Message Ledger owns committed messages. Surface bookkeeping records only\n//! ordinary canonical appends; it does not select compacted model history.\n//! Durable typed Projection Checkpoints and their activation timeline own\n//! historical inclusion and ordering. The Context Engine compiles a checkpoint\n//! plus eligible Tail, while the Agent Loop adds and freezes current core input.\n//!\n//! There is one mutable hot `ConversationState`: the coordinator owns it between\n//! attempts and `AgentExecution` owns it while running. It caches retained Original\n//! facts, never gives Derived projected content a canonical `MessageId`.","url":"https://github.com/Caismis/rustX/blob/8cb41624eb2dc2ca87e4409961f42553ceb029cf/src/conversation/mod.rs#L1-L11"}]},"terms":[{"id":"contract","label":"contract","explanation":"rustX 把调用规则写进内层接口；例如 ModelAdapter.stream 每次只发起一个 provider request，重试必须交回 AgentExecution，避免绕过请求启动记录。"},{"id":"contract-model","label":"contract","explanation":"ModelAdapter.stream 接到一个 ModelRequest 后只能执行一次 provider 尝试；不能私下重试、重连或切换提供方，否则 AgentExecution 无法为每次实际请求分配身份和保存输入。"},{"id":"contract-tool","label":"contract","explanation":"Tool Plane 用同一套定义、schema、策略与 ForegroundInvocation 管理原生 Tool、MCP 和 Python；Agent Loop 仍负责已接受调用的结果槽位和原子批次。"},{"id":"contract-runtime","label":"contract","explanation":"ConversationRuntime 是一个 Conversation 的协调入口；外部组件提交输入，只有它能决定何时启动 AgentExecution，扩展不能另建一条执行队列。"},{"id":"contract-publication","label":"contract","explanation":"AgentExecution 必须先把输出帧写入 Publication 存储，再交给客户端接口；最终仍须满足 P \u003c U \u003c C，客户端看到文本不等于 Assistant 已进入历史。"},{"id":"responsibility","label":"responsibility","explanation":"ConversationRuntime 决定何时运行一个 Attempt，AgentExecution 决定 Attempt 内的模型轮次和 Tool 批次；客户端只展示这些组件产生的事实。"},{"id":"ownership","label":"ownership","explanation":"rustX 将运行对象交给明确组件管理：ConversationRuntime 持有当前 Attempt，执行器收束自己启动的工作；取消信号不能代替资源回收。"},{"id":"owner","label":"owner","explanation":"这里指负责执行并收束该工作的组件。例如 Tool 执行器必须处理自己启动的进程和 worker，Agent Loop 才能得到可提交的结果。"},{"id":"owner-process","label":"owner","explanation":"本地 TUI 创建自己的 stdio App Server 子进程，因此正常退出时会显式请求关闭它；单纯 EOF 只会释放连接，不能代替该关闭请求。"},{"id":"authority","label":"authority","explanation":"rustX 读取对应领域已提交的事实来作决定；例如 Tool 是否完成要查执行结果证据，不能根据 UI 进度或客户端断线来推断。"},{"id":"authority-ledger","label":"authority","explanation":"ConversationStore 中不可变的 Message Ledger 决定 canonical 历史；Context Checkpoint、实时缓存与 Trace 都不能改写已提交消息。"},{"id":"authority-goal","label":"authority","explanation":"只有 GoalDomain 的 GoalPhase::Active 授权后续自主轮次；UI 投影出的生命周期、Workflow 完成或 runtime drain 都不能自行把 Goal 判为完成或暂停。"},{"id":"authority-request","label":"authority","explanation":"已启动请求的 RequestSnapshot 保存该请求确切输入；重新检查时按历史键读取，不能用当前配置或重新运行 compaction 猜测模型当时看到了什么。"},{"id":"authority-delivery","label":"authority","explanation":"只有已提交的类型化 Tool 交付元数据能授权对话记录卡片；文件写入成功、进度事件或模型声称文件存在都不足以证明交付。"},{"id":"authority-session","label":"authority","explanation":"SessionController 保存 Session 图、cwd 和显式选择；冷加载再解析当前资源。凭据、连接和当时的有效 Registry 不是 Session 保存的身份事实。"},{"id":"authority-checkpoint","label":"authority","explanation":"已激活 Checkpoint 决定历史 Context 选中哪些 Original/Derived；它能排除 M96…M100，却不能删除这些 canonical Ledger 消息。"},{"id":"native","label":"native","explanation":"rustX 自己的 runtime、Tool Plane 和领域接口直接处理操作；App Server 只转发到这些接口，不另造一套执行或取消规则。"},{"id":"composition","label":"composition","explanation":"LocalConversationCore::compose_with_access 把解析后的模型、Tools、扩展与资源装成一个本地运行核心；Session 冷加载复用这条路径。"},{"id":"residency","label":"residency","explanation":"SessionRuntimeManager 保存当前加载的 host/core 和 incarnation。成功 shutdown 并证明无剩余受管理工作后才卸载它们，Session 的磁盘数据继续保留。"},{"id":"adoption","label":"adoption","explanation":"adopt_pending_batch 在同一事务中取出当前 Pending Inbound 批次、追加 canonical User 事实并移除 pending 记录；输入先被保存，不代表已经进入模型历史。"},{"id":"acceptance","label":"acceptance","explanation":"rustX 先验证并提交事实，后续步骤才能据此运行；例如模型流中的 Tool 提案必须进入 canonical Assistant 后才产生可执行槽位。"},{"id":"acceptance-inbound","label":"acceptance","explanation":"accept_inbound 原子分配序号并保存 Pending Inbound；此时可向客户端展示排队输入，但它尚未被 adopt_pending_batch 纳入 canonical User 历史。"},{"id":"acceptance-assistant","label":"acceptance","explanation":"AgentExecution 在 provider 结果 P 和 Publication 终态 U 之后进行 Registry 检查，再提交 canonical Assistant C；只有其中的 ToolCall 才成为执行槽位。"},{"id":"acceptance-tool","label":"acceptance","explanation":"Agent Loop 提交 Assistant 的 ToolCall 后，必须为每个已接受调用保留一个结果槽位；后续策略拒绝或启动前取消仍要产生对应结果。"},{"id":"staging","label":"staging","explanation":"这里需区分两步：当前请求的 Context 可以只在内存中准备；Publication 输出帧则必须先写入存储，才能发给客户端。"},{"id":"staging-context","label":"staging","explanation":"Context 先在当前请求内准备，尚不写入历史；只有模型启动 gate 获胜后，事务才一起提交 Context、RequestSnapshot 与 ModelRequestStarted。"},{"id":"staging-publication","label":"staging","explanation":"flush_publication 先把合并后的输出帧持久写入 Publication，再向观测接口发送；这份审计只证明可能发出的内容，不证明用户看到。"},{"id":"publication","label":"publication","explanation":"模型的流式文本或 Tool 提案经 Publication 写入并向客户端输出；即使完整显示，仍要等待独立的 canonical Assistant 提交，提案也不能立即执行。"},{"id":"release","label":"release","explanation":"输出先进入 Publication 存储，再通过客户端接口向外发送；发送动作发生在 canonical Assistant 提交之前，不能据此认为提案已获执行许可或用户已经看到。"},{"id":"publish","label":"publish","explanation":"这里是把已准备的结果交给下游，例如向客户端发送已提交帧或报告卸载成功；发送动作本身不构成客户端已读证明。"},{"id":"dispatch","label":"dispatch","explanation":"AgentExecution 先提交实际请求启动、重建并校验 RequestSnapshot，随后才调用 ModelAdapter；有启动记录不等于已执行到这个调用。"},{"id":"dispatch-tool","label":"dispatch","explanation":"ForegroundInvocation 经过取消、策略与批准检查后才启动 Tool 操作；构造调用对象只捕获资源，不能作为物理工作已开始的证据。"},{"id":"arbitration","label":"arbitration","explanation":"request_cancel 与 arbitrate_model_turn_start 争用同一 Attempt gate：取消先进入则不执行启动事务；启动先进入则先提交，后来的取消不能撤销该身份。"},{"id":"boundary","label":"boundary","explanation":"rustX 在不同步骤记录不同事实：输出帧已提交、Assistant 已进入历史、Tool 已物理完成，不能因为其中一步发生就推断另一步完成。"},{"id":"boundary-contract","label":"boundary","explanation":"内层只依赖 rustX 的 ModelAdapter、ToolExecutor 等接口；提供方 SDK、MCP SDK、数据库和 HTTP 类型止于外层实现，不进入 Agent 内核。"},{"id":"frontier","label":"frontier","explanation":"请求启动事务一旦提交，rustX 就不能把这次请求当作从未开始并静默重发；即使随后崩溃，也不能证明远端没执行。"},{"id":"frontier-start","label":"frontier","explanation":"Context、RequestSnapshot 和 ModelRequestStarted 一起提交后，这次请求越过禁止重发的位置；崩溃可能发生在 ModelAdapter 调用前，恢复也不会盲目再发。"},{"id":"frontier-tool","label":"frontier","explanation":"执行器启动证据先于实际外部修改，是保守的恢复判断点；存在它却没有可信结果时，rustX 必须保留 OutcomeUnknown，不能重试未知副作用。"},{"id":"bounded","label":"bounded","explanation":"rustX 每次只读取给定 cut 内的历史或使用容量受限的缓存；例如 Context Tail 截止本次 request cut，后续消息不会偷偷进入已准备请求。"},{"id":"finite","label":"finite","explanation":"本次工作只覆盖已确定的一组项目，例如当前 pending 批次、所选来源需求或 Workflow 节点；它不代表能够持续调度新 Goal 轮次。"},{"id":"fold","label":"fold","explanation":"RuntimeClientProjection 把 runtime 事件依次合并为当前客户端视图，同时更新快照与游标；它不向执行层写回状态。"},{"id":"materialization","label":"materialization","explanation":"Checkpoint commit 保存 Derived 的实际正文，而不是以后再运行摘要生成器；检查旧请求时因此能读取相同内容。"},{"id":"normalization","label":"normalization","explanation":"ForegroundInvocation 先整理并校验 Tool 参数，再固定为不可变调用参数；批准展示与实际执行使用同一份参数，避免用户批准后执行内容又发生变化。"},{"id":"normalization-path","label":"normalization","explanation":"SessionFileReference 保存文件对应的 Conversation/cwd 身份和整理后的路径；它仍指向可变文件，重新打开可能得到新内容或 Missing。"},{"id":"normalization-events","label":"normalization","explanation":"ModelAdapter 把各家 provider 流转换成 ModelStreamItem；只有语义输出进入 Publication，内部进度不冒充模型正文。"},{"id":"shadowing","label":"shadowing","explanation":"同名 Workspace 资源在校验前整体覆盖 User 定义；上层定义无效时操作明确失败，不退回下层可用定义。"},{"id":"receipt","label":"receipt","explanation":"成功的存储事务返回已提交事实的凭证，例如模型启动或 Checkpoint commit；后来的取消不能抹掉它，也不能把它当作远端执行证明。"},{"id":"slot","label":"slot","explanation":"一个 canonical ToolCall 对应一个结果位置；Agent Loop 按调用顺序一次提交整个批次，实际完成顺序和取消不会改变这些位置。"},{"id":"effect","label":"effect","explanation":"Tool 可能已经写入共享 Session 文件或修改远端系统；取消、Workflow 失败和恢复都不会自动回滚这些已完成修改。"},{"id":"physical","label":"physical","explanation":"这里检查真正启动的进程、worker 或远端操作，而非只看模型提案或取消标记；本地资源收束和远端结果已知仍是两件事。"},{"id":"drain","label":"drain","explanation":"runtime 从 Running 进入 Draining 后关闭新输入 admission，继续监督已有 Attempt、后台工作、MCP 进程和 worker，直到各自完成 settlement。"},{"id":"terminal","label":"terminal state","explanation":"Attempt 最后只交回一个完成、取消或失败候选；若 Journal 追加失败，状态机仍已终止并保留结果候选，但不会虚构持久终态记录或观察者事件。"},{"id":"terminal-publication","label":"terminal state","explanation":"Publication 的最终帧/状态 U 在 provider 结果 P 之后提交、在 canonical Assistant C 之前提交；完整 U 没有 C 仍是 UnacceptedPublicationAudit。"},{"id":"terminal-tool","label":"terminal state","explanation":"Tool 必须返回有证据支撑的 Success、Failed、Cancelled 等结果；传输丢失时不能凭取消意图认定远端已停止。"},{"id":"terminal-goal","label":"terminal state","explanation":"GoalPhase::Complete 表示领域目标已结束；Workflow 返回或一个 Attempt 完成并不能自行把 Goal 写成 Complete。"},{"id":"source","label":"source","explanation":"这里看实际数据从哪个领域读入：Context 编译器读取 Ledger 与 Checkpoint，不能从界面缓存倒推出执行历史。"},{"id":"source-config","label":"source","explanation":"冷加载读取当前配置、MCP 定义和 Python 包；发现定义并不连接服务器或准备环境，只有选中并通过 admission 的需求才启动准备。"},{"id":"provenance","label":"provenance","explanation":"rustX 保留输入或派生项来自哪次受限操作的信息；这些线索有助检查，但不能替代 canonical MessageId 或实际执行身份。"},{"id":"provenance-derived","label":"provenance","explanation":"Derived Context 保存指向 canonical 消息或父 Checkpoint 项的来源引用；例如摘要可引用 M1…M20，但自身没有 canonical MessageId。这些引用不能移动 Checkpoint base 或让被排除消息重新进入 Tail。"},{"id":"frozen","label":"frozen","explanation":"Agent 捕获本轮语义输入后不再让当前配置和发现结果改变它；每次实际请求仍获得新身份，并在启动时保存自己的精确 RequestSnapshot。"},{"id":"replay","label":"replay","explanation":"RuntimeClientProjection 向重连客户端提供容量受限的事件记录以重建界面；这不是重新执行模型或 Tool，也不是恢复的事实依据。"},{"id":"replay-tool","label":"replay","explanation":"恢复不会重新调用结果不明的 Tool；启动证据存在而结果未知时填补 OutcomeUnknown，避免外部修改被重复执行。"},{"id":"recovery","label":"recovery","explanation":"加载时按持久事实修补缺失结果：无启动证据可报告启动前取消，有启动却结果未知则保留不确定性；已提交结果不覆盖，未知副作用不重跑。"},{"id":"revision","label":"revision","explanation":"Session 设置或 Goal 状态改变时推进对应版本；Goal 轮次的输入保存、版本推进和已消耗轮次数在同一个事务中提交。"},{"id":"snapshot","label":"snapshot","explanation":"客户端获取 runtime 当前视图的副本用于重建界面；它不是 canonical 历史，也不能作为请求恢复时重新执行工作的依据。"},{"id":"snapshot-request","label":"snapshot","explanation":"RequestSnapshot 在实际请求启动事务中保存确切输入及依赖；启动 gate 之前不会留下该请求的快照，后来检查也不会重新发现当前资源。"},{"id":"cursor","label":"cursor","explanation":"RuntimeClientProjection 为事件分配位置，客户端重连时据此读取可用事件；缓存有界，游标不是持久执行身份。"},{"id":"scope","label":"scope","explanation":"WorkflowRuntime 为 root、branch、body 各自保存局部值和实例，完成 join 后按定义顺序汇合；这些执行仍共享 Session 工作区。"},{"id":"scope-request","label":"scope","explanation":"本次请求的 Context 与 RequestSnapshot 只描述这次实际请求；它们不能代表整个 Attempt 后续重试和 continuation 的新请求身份。"},{"id":"scope-derived","label":"scope","explanation":"Derived 的产生线索只适用于对应 compaction/Checkpoint，不提供 canonical 消息身份，也不授权 Tool 执行。"},{"id":"preflight","label":"preflight","explanation":"Registry 在提交 canonical Assistant 前检查 Tool 结构和 schema；业务拒绝保留为结果槽位，不可信结构则不能进入执行批次。"},{"id":"observation","label":"observation","explanation":"Prepared、Started、Progress、Completed 或客户端状态通知让 UI 展示进展；它们不授予权限，也不能代替可信 Tool 结果和物理完成证据。"},{"id":"framing","label":"framing","explanation":"App Server 适配 Stdio JSONL 或 WebSocket 的消息封装，把带版本 JSON-RPC 请求交给相同路由，不把传输格式变成 Conversation 调度器。"},{"id":"canonical","label":"canonical","explanation":"提交到 Message Ledger 的 User、Assistant 与 Tool 消息构成 Conversation 历史；流式提案和 Checkpoint 摘要不能冒充这些消息。Event Journal 另记真实执行事实，不能与模型历史消息混为一谈。"},{"id":"projection","label":"projection","explanation":"RuntimeClientProjection 从 runtime 事实整理客户端视图；即使没有客户端连接，执行规则也相同，缓存不驱动恢复或取消。"},{"id":"projection-context","label":"projection","explanation":"Context Engine 用 Checkpoint 中的 Original/Derived 和严格 Tail 编译模型输入；该选择可以排除旧消息，但不修改 Ledger，也不会执行其中的 Tool 内容。"},{"id":"compaction","label":"compaction","explanation":"Context Engine 提交新的 Checkpoint 来选择历史输入，保存 Derived 正文和 base；M1…M100 等原始 Ledger 事实保持不可变，不插入 canonical 摘要消息。"},{"id":"settlement","label":"settlement","explanation":"组件必须把自己管理的工作带到有证据的结束状态并交回结果；Tool 需要先回收本地 worker，runtime 卸载还要等待所有受管理工作完成，取消信号本身不够。"},{"id":"settlement-publication","label":"settlement","explanation":"Publication 根据 P、U、C 已提交到哪一步，保留 Canonical、UnacceptedPublicationAudit 或 IncompletePublicationAudit；不能把未接受输出混入 Assistant 历史。"},{"id":"admission","label":"admission","explanation":"ConversationRuntime 在同一个协调器锁下决定是否启动 Attempt；Running → Draining 也使用这把锁，因此关闭后不能再有输入偷偷越过运行入口。"},{"id":"admission-config","label":"admission","explanation":"配置选择先形成有限的能力需求，rustX 校验并允许这些需求后才解析凭据、连接 MCP 或准备 Python；仅发现文件或列出子 Agent 不会激活资源。"},{"id":"admission-context","label":"admission","explanation":"ContextAssembly 的动态内容须在当前请求获得允许后才能合入输入；它不能自行变成 canonical 消息，模型启动失败也不会留下部分 Context 提交。"},{"id":"admission-transport","label":"admission","explanation":"WebSocket 连接建立前校验专用传输 token；initialize 只协商协议，不提供进程内租户身份验证。"},{"id":"admission-goal","label":"admission","explanation":"GoalRoundDriver 仅在协调器安全空闲点提交普通 Pending Inbound；接受轮次、推进 Goal 版本和消耗轮次计数在同一 SQLite 事务完成。"},{"id":"quiescence","label":"quiescence","explanation":"shutdown 必须证明所有 rustX 管理的 Attempt、worker、准备任务与进程已完成收束，SessionRuntimeManager 才能卸载旧组合并允许新写入者；断线或已发取消都不足够。"},{"id":"durable","label":"durable","explanation":"SessionController 的 catalog 保存 Session 身份与显式设置，ConversationStore 保存各 Conversation 的 Ledger、输入、请求与审计等领域事实；这些数据在运行核心卸载后仍保留，连接与凭据不因此成为 Session 状态。"},{"id":"persistence","label":"persistence","explanation":"rustX 将事实通过存储事务写入 SQLite；例如 Context、RequestSnapshot 和 ModelRequestStarted 同时成功或都不留下，准备好内存对象并不等于已经写入。"},{"id":"authority-runtime","label":"authority","explanation":"ConversationRuntime 决定 admission、取消与运行生命周期；RuntimeClientProjection 和 App Server 只转发控制或展示事实，不能凭连接状态替它判定执行结束。"},{"id":"authority-publication","label":"authority","explanation":"Assistant C 的提交关联已持久保存的 Publication 结果与终态 U；单凭实时输出、完整 U 或客户端进度都不能生成 canonical Assistant 事实。"},{"id":"contract-context","label":"contract","explanation":"Context Engine 只编译获授权的历史和动态输入；Checkpoint 决定历史选择，Agent 冻结当前输入并通过启动事务提交精确请求，编译器不能修改 Ledger 或执行 Tool。"},{"id":"contract-layering","label":"contract","explanation":"ModelAdapter、ToolExecutor 等内层接口只出现 rustX 自己的领域类型；提供方 SDK、MCP SDK、SQLite 与 HTTP 类型封装在适配器外层。"},{"id":"contract-no-ack","label":"contract","explanation":"runtime 没有证明用户已看到输出的 ACK 机制；PublicationAudit 只限定可能被发送的内容，不能用它宣称客户端已读。"},{"id":"composition-input","label":"composition","explanation":"Agent 将 Checkpoint/Tail 历史、Fresh Inbound、动态 Context、prompt、Tool 定义和 continuation 合成当前语义输入；这一步不重新创建 Session runtime。"},{"id":"frozen-agent","label":"frozen","explanation":"DurableAgentAuthority 创建时捕获模型、Tools、Skills、Plugins、资源、策略和工作区；后续 activation 使用这组能力，不重新寻找另一个 profile。"},{"id":"frozen-package","label":"frozen","explanation":"Managed Python 准备已捕获的包字节和隔离 uv 环境；子 Agent 获得已捕获的 Skills 包，后续调用不靠重新发现当前文件来改变输入。"},{"id":"frozen-workspace","label":"frozen","explanation":"Agent activation 绑定 Session 已确定的绝对工作区目录；父子 Agent 共享该目录，能看到彼此未 commit 的文件写入，没有独立 worktree。"},{"id":"frozen-config","label":"frozen","explanation":"一个配置 generation 捕获这次组合的能力与扩展；已通过 admission 的工作继续使用该 generation，后续配置变化不改写它。"},{"id":"snapshot-model","label":"snapshot","explanation":"ConversationRuntime 保存当前 Attempt 使用的模型选择；子 Agent 省略模型选择时继承调用方 Attempt 已捕获的有效模型，不能临时重读默认配置。"},{"id":"snapshot-content","label":"snapshot","explanation":"SessionFileReference 指向可变路径，不能保存当时的文件字节；与不可变 ArtifactStore 不同，再次打开可能得到变化后的内容或 Missing。"},{"id":"physical-message","label":"physical","explanation":"canonical User、Assistant、Tool 消息各有真实 MessageId；Derived Context 没有这个身份，projection 中相似的 Tool 文本也不代表执行过一次 Tool。"},{"id":"admission-subagent","label":"admission","explanation":"SubagentRegistry 针对具体 Agent 和 activation 分配受管理运行；使用已捕获的能力，精确控制这一次 activation，不能让后续任务替换已有等待目标。"},{"id":"admission-workflow","label":"admission","explanation":"Workflow 静态检查并捕获本次程序需要的有限能力；执行 root、branch、body block 时复用它们，不重新发现资源或伪造模型 ToolCall。"},{"id":"scope-agent","label":"scope","explanation":"子 Agent 的能力按其命名 profile 捕获；Root 专属 Goal 追求在子 Agent 范围内被拒绝，不会把 Root 的长期目标控制扩散到子运行。"},{"id":"settlement-attempt","label":"settlement","explanation":"AgentExecution 把最终 ConversationState 和唯一的 Attempt 完成/取消/失败候选交回协调器；终态 Journal 追加失败时，候选与内存终止状态仍在，但不能伪造持久终态记录或观察者事件。"},{"id":"replay-effect","label":"replay","explanation":"已有启动证据却没有可信结果时，rustX 不重新执行模型请求或 Tool；远端可能已发生修改，恢复须报告不确定性，避免重复副作用。"},{"id":"replay-cursor","label":"replay","explanation":"重连客户端按游标读取 RuntimeClientProjection 已保存的有限事件，再重建界面；缓存不会重新执行 Tool 或充当 canonical 历史与恢复输入。"},{"id":"allocation","label":"allocation","explanation":"SessionRuntimeManager 加载期间保留 Conversation 的目录/文件系统分配和运行 incarnation；只有旧运行成功收束后才释放，避免同一 Conversation 出现第二个可写 runtime。"},{"id":"slot-attempt","label":"slot","explanation":"ConversationRuntime 在协调器锁下只持有一个当前 Attempt；生产者可以保存 pending 输入，但不能绕开这个位置另启 AgentExecution。"},{"id":"release-output","label":"release","explanation":"flush_publication 在每帧写入 Publication 后才向客户端接口发送；审计只限定可能发送的内容，既不证明客户端已读，也不授权 Tool 提案执行。"},{"id":"release-residency","label":"release","explanation":"SessionRuntimeManager 只有在 shutdown 成功并证明无剩余受管理工作后才释放 host/core、分配与条目；随后公布卸载成功，旧句柄成为 StaleIncarnation，Session 数据继续保留。"},{"id":"source-code","label":"source","explanation":"这里展示固定 main commit 中指定文件与行号的 Rust 或文档摘录，用于核对 rustX 的实际接口和执行顺序；它不是当前 Session 重新发现的配置资源，也不会随运行状态变化。"},{"id":"authority-result","label":"authority","explanation":"已提交的 canonical Tool 结果就是该调用的最终结果；恢复只补缺失项，不能用迟到取消、缓存进度或新的猜测覆盖它。"},{"id":"authority-recovery","label":"authority","explanation":"恢复读取对应 Conversation 的持久 Ledger、请求启动、执行结果等领域事实；RuntimeClientProjection 的事件缓存和 Trace 只供展示，不能触发恢复或覆盖这些事实。"},{"id":"provenance-context","label":"provenance","explanation":"Checkpoint 的 Original 项保留 canonical 消息引用与 digest；Derived 项保存 canonical 消息或父 Checkpoint 项的来源引用。两者都只是历史输入选择，不能产生 ToolExecution 事实。"},{"id":"terminal-managed","label":"terminal state","explanation":"shutdown 等待每类受管理工作通过自己的完成规则：Attempt 交回最终候选，进程和 worker 完成本地收束，结果未知的远端操作保留不确定性；发出取消不能替代这些结束证据。"},{"id":"contract-model-cancellation","label":"contract","explanation":"ModelAdapter 接收 Attempt 的子取消信号 model_cancellation()；取消按统一 ModelStreamItem 语义以 Failed(Cancelled) 结束流，不会撤销已提交启动或证明远端没有执行。"},{"id":"acceptance-continuation","label":"acceptance","explanation":"Agent 只保留已经接受的 continuation，并与同一不可变输入版本一起进入下一轮；每次实际续接仍生成新请求身份并经过启动 gate，适配器不能私下续接。"},{"id":"snapshot-source","label":"snapshot","explanation":"导览固定使用 8cb41624 这次 commit 的代码与文档视图；摘录字节和行号链接独立固定，不会跟随当前 checkout 改动。这是源码版本视图，不是 runtime/client 状态副本，也不是保存实际模型请求输入的 RequestSnapshot。"},{"id":"concept-session","label":"Session","explanation":"你从 TUI 打开一个 Session，稍后可以换用 Web 客户端继续访问同一份数据。SessionController 保存它的 SessionNode/Conversation 图、cwd 与显式设置；连接断开或运行核心卸载后，这些数据仍然保留，凭据与实时连接则不属于 Session 状态。"},{"id":"concept-conversation","label":"Conversation","explanation":"一个 Session 节点指向一个 Conversation。它以线性的 canonical 消息历史保存 User、Assistant 与 Tool 事实；进程内同时最多只有一个可写的活跃 runtime。子 Agent 有自己的 Conversation，但仍可共享 Session 工作区。"},{"id":"concept-attempt","label":"Attempt","explanation":"用户输入被协调器允许执行后，AgentExecution 开始一次 Attempt。它可能先请求模型，再运行一批 Tool，随后继续请求模型；重试和 continuation 各有新请求身份，但可以仍属于同一次 Attempt。最后只交回一个完成、取消或失败候选。"},{"id":"concept-tool","label":"Tool","explanation":"模型可以提出读取文件、运行命令或交付文件的 Tool 调用。提案先进入 canonical Assistant，才获得结果位置；策略、批准与调度仍会继续检查。Agent Loop 最后按调用顺序一次提交同批结果，取消不撤销已完成的文件或外部修改。"},{"id":"concept-workflow","label":"Workflow","explanation":"例如把检查、并行处理与 Review 写成一个固定程序，选中的 Workflow 就作为前台 Tool 运行。WorkflowRuntime 管理 Agent、Tool、Branch、Parallel、Review、Loop、Return 节点和局部值；节点共享 Session 工作区，失败或取消不会回滚写入。"},{"id":"concept-subagent","label":"Subagent","explanation":"Root 可以将任务交给允许列表中的命名 Agent。受管理的 Subagent 复用同一 runtime 栈，但有独立 Conversation 与 activation 身份；创建时捕获模型和能力，父子 Agent 在同一 Session 目录中读写文件。"},{"id":"concept-checkpoint","label":"Checkpoint","explanation":"历史已有 M1…M100 时，Context Engine 可以创建以 L100 为 base 的 Checkpoint，保留部分 Original、加入 Derived，并排除 M96…M100。激活后它决定模型历史输入选用什么；Message Ledger 不变，Tail 只从 base 之后接入新消息。"},{"id":"concept-original","label":"Original","explanation":"Checkpoint 若决定保留 M20，就以 Original 引用它，并保存 canonical 消息身份与 digest。它仍指向原来那条历史消息；最后保留的 Original 即使早于 Checkpoint base，也不会让被排除的后缀重新进入 Tail。"},{"id":"concept-derived","label":"Derived","explanation":"Context Engine 可把一段旧历史整理为 Derived 正文，并在 Checkpoint 提交时保存实际内容与来源引用。它供模型读取，但没有 canonical MessageId；其中即使出现 ToolCall/ToolResult，也不会因此执行 Tool 或产生执行统计。"},{"id":"concept-tail","label":"Tail","explanation":"Checkpoint base 为 L100，而下一请求的历史截止于 L101 时，Tail 只纳入区间 (L100,L101] 中合格的 canonical 消息。它补上 Checkpoint 之后的新历史，不会找回 base 之前已经排除的 M96…M100。"},{"id":"concept-message-ledger","label":"Message Ledger","explanation":"Pending Inbound 经过 adoption 后，User 消息才进入 Message Ledger；Assistant 与 Tool 结果也只在各自提交成功后写入。ConversationStore 追加保存这些不可变事实。Context compaction 可以改变模型看到的历史选择，但不能修改消息或插入 canonical 摘要。"},{"id":"concept-event-journal","label":"Event Journal","explanation":"一次实际模型请求开始、Tool 执行或 Attempt 结束，都有对应的执行事实，由 Event Journal 记录。Context 里引用过去的调用不会新增执行事件、usage 或时长；终态追加失败时也不能凭内存结果虚构记录。"},{"id":"concept-request-snapshot","label":"RequestSnapshot","explanation":"一次实际请求通过启动 gate 后，启动事务保存它确切的、与提供方无关的输入与不可变依赖。以后检查这次请求时按历史键重建，不重读当前配置、不重新生成摘要；有快照只证明启动已提交，不能证明远端已经收到请求。"},{"id":"concept-publication","label":"Publication","explanation":"模型流中的文字与 Tool 提案先分帧写入 Publication，再发往客户端。提供方结果 P、输出终态 U、canonical Assistant 提交 C 按 P \u003c U \u003c C 保存；完整输出仍可能未进入 Assistant 历史，审计也不能证明用户已读。"},{"id":"concept-goal","label":"Goal","explanation":"Root 开始持续任务时，GoalDomain 保存目标与阶段。只有 Active 授权下一自主轮次，GoalRoundDriver 还需等待协调器安全空闲并提交普通输入；Workflow 结束或 runtime drain 都不会自行把 Goal 改成 Complete 或 Paused。"},{"id":"concept-skills","label":"Skills","explanation":"选中 Skills 后，模型先看到渐进披露的指令信息，再用普通 Tool 读取正文与支持文件。选择影响 prompt 可见性，不授予文件系统权限；子 Agent 使用创建时已捕获的包，后续不重新发现当前文件。"},{"id":"concept-mcp","label":"MCP","explanation":"rustX 通过 MCP 接入外部 Tool 服务。发现 .agents/mcp.toml 只读取定义；选中的需求获准后才连接并暴露能力。传输中断时，即使本地资源已回收，也可能无法确认远端操作结果，必须保留 OutcomeUnknown。"},{"id":"concept-managed-python","label":"Managed Python","explanation":"选中的 Python 工具包先捕获包字节，准备隔离 uv 环境并生成 McpServerBinding，然后通过通用 MCP runtime 运行。它复用 Tool Plane 的调用、取消与结果规则，不另建一套执行协议。"},{"id":"concept-agent-status","label":"agent_status","explanation":"启用 agent_status 后，rustX 按当前运行窗口整理状态 Context，帮助模型了解执行状态；它通过封闭的 Rust 扩展接入现有运行核心。这个扩展默认关闭，展示出的状态不替代 Goal、Ledger 或执行结果各自的事实。"},{"id":"concept-todo","label":"todo","explanation":"启用 todo 后，Conversation 保存自己的任务列表，模型可用 todo Tool 更新它。列表更新与对应 canonical Tool 批次一起提交；客户端从运行快照读取已提交列表，而不会把它变成另一条独立存储路径。"},{"id":"concept-app-server","label":"App Server","explanation":"TUI 或 Web 通过带版本 JSON-RPC 明确指定 Session/runtime，App Server 把操作转给对应本地组件。它适配 Stdio JSONL 与 WebSocket、管理连接 attachment；Conversation 的执行调度仍交给 ConversationRuntime。"},{"id":"concept-runtime-client","label":"Runtime Client","explanation":"TUI 重新连接时，Runtime Client 提供当前快照和有限的事件记录，帮助界面恢复显示。RuntimeClientProjection 统一整理这些视图；客户端是否连接都不改变执行规则，缓存与 Trace 也不驱动恢复。"},{"id":"concept-context-engine","label":"Context Engine","explanation":"模型下一次请求前，Context Engine 先读取获授权的历史，用 Checkpoint 的 Original/Derived 与严格 Tail 编译输入，并校验结构、计量 token、规划 compaction。Agent 再加入本轮输入并固定请求；编译器不修改 Ledger，也不执行历史中的 Tool。"},{"id":"concept-tool-plane","label":"Tool Plane","explanation":"原生 Tool、MCP 与 Managed Python 都通过 Tool Plane 使用统一定义、schema、策略和 ForegroundInvocation。执行器负责实际工作与资源收束；canonical 调用位置和整个有序结果批次仍由 Agent Loop 管理。"},{"id":"concept-agent-kernel","label":"Agent kernel","explanation":"Agent kernel 中的 AgentExecution 运行一个 Attempt：保存固定的逻辑输入，协调实际模型请求、重试、输出与 Tool 批次。它只依赖 rustX 内层接口，提供方 SDK、MCP SDK、数据库与 HTTP 类型留在外层适配器。"},{"id":"concept-runtime","label":"ConversationRuntime","explanation":"输入可以先排队保存，但只有 ConversationRuntime 能决定何时启动下一次 AgentExecution。它为一个 Conversation 保留唯一的当前 Attempt，在同一锁下处理 admission 与 Running → Draining，并等待已有工作完成后证明可以卸载。"},{"id":"map-read-cut","label":"read cut","explanation":"Context 开始读取前，先固定 Ledger、Journal 和 activation 的位置。之后追加的 ToolResult 不会混入同一次历史压缩输入。"},{"id":"map-checkpoint","label":"Checkpoint","explanation":"旧历史过长时，rustX 用 Original 引用和 Derived 内容完整描述历史取舍。Checkpoint 改变后续模型看到的历史，不改写已提交的 Message Ledger。"},{"id":"map-tail","label":"Tail","explanation":"当前 Checkpoint 决定基准位置之前的历史取舍，Tail 只接上基准之后仍符合条件的 canonical 消息，避免重复拼接旧内容。"},{"id":"map-activation","label":"activation","explanation":"Checkpoint 内容与它何时生效分别记录。读取历史时按独立的 activation 顺序选择当前内容，不能用 Journal 序号替代。"},{"id":"map-gate","label":"start gate","explanation":"AgentCancellation 用同一把锁处理取消和实际请求启动。取消先发生时不提交请求快照；启动事务先成功时，后到的取消按已启动请求处理。"},{"id":"map-grant","label":"compaction grant","explanation":"历史压缩校验通过后，从 CancellationSignal 取得绑定 operation_id 的提交授权。之后到达的取消不能撤销这次已授权的 Checkpoint 提交。"},{"id":"map-single-flight","label":"single-flight","explanation":"两个客户端同时加载同一 Conversation 时，会等待同一次管理操作。某个等待者断开，不会丢弃仍在组装或卸载的任务。"},{"id":"map-incarnation","label":"runtime incarnation","explanation":"同一 Conversation 卸载再加载后，会取得新的 RuntimeIncarnationId。旧 attachment 不能凭相同 Session 身份控制新 runtime。"},{"id":"map-watermark","label":"watermark","explanation":"ConversationRuntime 在安全输入点固定一个 Pending Inbound 位置，本次只采纳到这里。后来到达的消息留给后续机会，防止当前输入批次无限增长。"},{"id":"map-continuation","label":"continuation","explanation":"Tool 批次结束后，AgentExecution 使用已接受的结果继续逻辑步骤。adapter 不能在一次 stream 内自行增加提供方请求。"},{"id":"map-preparation","label":"preparation","explanation":"发现 MCP server 配置时尚未连接。只有实际选中的能力才进入准备，准备成功后才有资格进入有效 CapabilitySnapshot。"},{"id":"map-semantic","label":"semantic","explanation":"加载 Session 时，先按领域规则组装 Conversation 身份、历史和执行组件，再激活 runtime。这些规则由对应组件决定，传输只负责携带类型化请求。"},{"id":"map-idempotent","label":"idempotent","explanation":"同一次请求启动的精确重试返回已有回执。Agent 看到 IdempotentReplay 后，不会向在线观察器重复发送回执中已经提交的启动事件。"},{"id":"map-linearization","label":"linearization point","explanation":"Running → Draining 与新 Attempt 启动共用协调器的同一把锁。谁先成功，就决定这次新工作能否开始，不能根据界面状态显示的先后推测。"},{"id":"map-rollback","label":"rollback","explanation":"Workflow 并行节点共享 Session 目录。某个节点失败时，之前已经完成的文件写入仍会保留；执行失败不包含撤销文件修改的承诺。"},{"id":"map-exactly-once","label":"exactly-once","explanation":"rustX 能原子提交一个 ToolResult 批次，但远程 MCP 超时后仍可能不知道服务端是否完成。历史中只有一个结果，不保证外部操作只发生一次。"},{"id":"map-proposal","label":"Tool proposal","explanation":"Publication 中的 ToolCall 只是模型建议。Agent 接受 canonical Assistant 并通过 Tool Plane 检查后，才可能为其分配真实执行身份。"},{"id":"map-pending","label":"Pending Inbound","explanation":"输入接受成功后先持久保存在 Inbox。ConversationRuntime 在安全点提交采纳事务后，它才成为不可变的 canonical 对话内容。"},{"id":"map-coalescer","label":"publication coalescer","explanation":"提供方输出细碎 delta 时，Publication 按字节量、结构和最早 payload 的绝对 deadline 合帧。后来的 delta 不会延长最早内容的等待期限。"},{"id":"map-attachment","label":"attachment","explanation":"客户端 attach 在同一切面取得目标身份、snapshot 和 cursor。detach 只移除连接关系，不取消 Attempt，也不能证明 runtime 已经卸载。"},{"id":"map-settlement-plane","label":"settlement plane","explanation":"取消先发生后，ForegroundInvocation 只等待 executor 的独立清理通道。通道保留本地任务与进程，直到 join 或 reap 完成，停止等待不能当作清理成功。"},{"id":"map-ledger","label":"Message Ledger","explanation":"输入采纳和 canonical Assistant 接受会向不可变 Ledger 追加消息。Context 压缩、客户端重连和 Trace 读取都不能改写这些消息事实。"},{"id":"map-journal","label":"Event Journal","explanation":"ModelRequestStarted、ToolExecutionStarted 等执行事实按 Journal 自己的序号提交。它不同于 Checkpoint 的 activation 顺序，也不同于客户端 cursor。"},{"id":"map-fencing","label":"fencing","explanation":"旧通知即使晚到，也必须同时匹配当前 Session、Conversation、incarnation 和 attachment。任一身份过期，就不能覆盖当前客户端视图。"},{"id":"map-quiescence-proof","label":"quiescence proof","explanation":"shutdown 必须等 Attempt task、Tool、本地后台任务、能力准备、MCP 进程和启动 worker 都到达各自结束点。仅取消返回或注册表为空都不够。"},{"id":"map-result-certainty","label":"result certainty","explanation":"executor 完成本地清理，但远程 MCP 结果仍不明确时，返回 Unconfirmed，并形成 OutcomeUnknown。调用者必须保留这种不确定性，不能据此盲目重试。"},{"id":"map-puc","label":"P \u003c U \u003c C","explanation":"提供方完成提交 P，可释放的最终输出提交 U，canonical Assistant 接受提交 C。三者分开记录，进程中途崩溃后仍能判断输出到达哪一层。"},{"id":"map-model-materialization","label":"materialization","explanation":"父进程将选定的模型协议、endpoint、预算和凭据绑定写入 FrozenModelSpec。子进程据此构造 adapter 与 ResolvedModelInvocation，不重读可变 rustx.toml 另选模型。"},{"id":"map-projection-publish","label":"publish","explanation":"RuntimeClientProjection 在同一同步点更新 snapshot、分配 cursor 并交付 RuntimeClientEvent。这只更新客户端事件流，不提交 Publication 帧或接受 canonical Assistant。"},{"id":"map-caller-admission","label":"admission","explanation":"ForegroundInvocation 接手前，AgentExecution 已检查 canonical Tool 批次的调用资格，WorkflowRuntime 已检查固定节点的调用资格。共享执行器不会替任一调用方放行新工作。"},{"id":"map-caller-publication","label":"publication","explanation":"调用结束后，AgentExecution 提交 canonical ToolResult 批次，WorkflowRuntime 推进节点并报告事实。各调用者记录自己的结果，这不同于模型文本的 Publication 输出。"},{"id":"map-cancellation-authority","label":"authority","explanation":"AgentCancellation 保留首个成功记录的语义取消原因。已启动的 Tool 从只读 execution_cancellation 视图读取该原因，后来的取消不能改写它。"},{"id":"map-attempt-slot","label":"slot","explanation":"ConversationRuntime 持锁登记唯一的当前 Attempt。前一轮 Attempt 及承载它的 task 尚未完成移交时，新 Attempt 不能占用这个位置。"},{"id":"map-residency-slot","label":"slot","explanation":"卸载尚不能证明旧 runtime 已无写入者时，SessionRuntimeManager 保留原 Unloading 条目和资源分配，阻止同一 Conversation 新建替代写入者。"},{"id":"map-physical-terminal","label":"terminal state","explanation":"executor 必须给出其管理的进程、worker 或操作已经到达结束点的证据。Unconfirmed 仍要求本地清理完成，但保留远端可能已发生修改的不确定性。"},{"id":"map-invocation-terminal","label":"terminal state","explanation":"ForegroundInvocation 在自然完成、取消和 deadline 中只确定一个结果。取消或超时先发生后，仍需等待独立清理通道，不能把调用终结当作外部操作已停止。"},{"id":"map-background-publication","label":"publication","explanation":"后台执行结果先通过 ConversationInboundMailbox 持久接受为普通输入，再将注册表记录推进为结束状态。shutdown 要等待这条通知路径收束；它不使用 Publication 输出帧。"},{"id":"map-start-event-replay","label":"replay","explanation":"请求启动的精确重试可能返回 IdempotentReplay 和旧回执。AgentExecution 只向在线观察器报告本次新提交的启动事件，不重复发送回执中的历史事实。"},{"id":"map-capability-revision","label":"revision","explanation":"CapabilityCoordinator 只在有效可执行能力集合改变时推进 CapabilityRevision。MCP 不可用原因等诊断文字变化不产生新执行版本，已有 Attempt 也继续保留旧集合。"},{"id":"map-semantic-owner","label":"owner","explanation":"SessionController 管持久身份，ConversationRuntime 管 Attempt 启动与生命周期，RuntimeClientProjection 管客户端视图与 cursor。连接层将操作交给对应组件，不替它作领域决定。"},{"id":"map-agent-authority","label":"authority","explanation":"AgentExecution 决定本轮实际模型请求启动、canonical Assistant 与 Tool 批次，以及唯一最终状态候选。Context contributor 和 Tool executor 只交回提案或事实，不能自行推进这些决定。"},{"id":"map-client-settlement","label":"settlement","explanation":"传输结束时，AppServerClient 逐个处理仍在等待的请求。可能改变服务端状态的请求留下 UncertainOutcomeError；客户端等待结束，不代表 runtime 执行已经停止。"},{"id":"map-subagent-authority","label":"authority","explanation":"创建持久 Agent 时固定能力、模型和 Session execution binding。后续 send_message 只能复用该权限，不能因当前 profile 或父调用配置改变而扩大能力。"},{"id":"map-host-admission","label":"admission","explanation":"AppServerHost 先检查进程仍为 Accepting，再为请求、attachment 或文件操作预留容量。容量不足或服务器停机时拒绝新操作；这不同于 ConversationRuntime 的 Attempt 启动检查。"},{"id":"map-invocation-arbitration","label":"arbitration","explanation":"ForegroundInvocation 同时观察自然完成、Attempt 取消和 deadline，只确定一个结果。取消或超时先发生后，不再轮询 completion，改等独立清理通道提供证据。"},{"id":"map-concept-client-session","label":"Session","explanation":"TUI 客户端的 Session 对象负责 attach、安装 snapshot、处理订阅和重新同步。它是远端 Conversation 的本地视图包装，不是保存目录与设置的持久 Session。"},{"id":"map-concept-app-server-client","label":"AppServerClient","explanation":"TUI 用它发送 JSON-RPC 请求、关联响应并分发通知。连接结束时，它逐个处理待响应请求；修改操作结果不明时返回 UncertainOutcomeError，不自动重试。"},{"id":"map-concept-app-server-connection","label":"AppServerConnection","explanation":"服务端每条连接的协议入口。它检查初始化与请求版本，按请求明确指定的 Session、Conversation 和 runtime 身份路由，不根据界面焦点选择目标。"},{"id":"map-concept-app-server-host","label":"AppServerHost","explanation":"同一服务进程中的资源管理组件，持有 SessionRuntimeManager，并为请求、attachment、上传和归档等操作预留容量；额度检查不决定 Attempt 是否能启动。"},{"id":"map-concept-session-runtime-manager","label":"SessionRuntimeManager","explanation":"管理 Conversation 在当前进程中的 Loading、Loaded、Unloading 状态。并发操作汇合到同一次转换；卸载证明不足时保留旧 runtime，阻止另建写入者。"},{"id":"map-concept-runtime-client-host","label":"RuntimeClientHost","explanation":"把客户端控制与观察接到指定 ConversationRuntime 上，维护一个控制 attachment 和只读观察关系。客户端全部离线时，执行仍由原来的 runtime 继续管理。"},{"id":"map-concept-runtime-client-projection","label":"RuntimeClientProjection","explanation":"根据已确定的运行事实维护客户端视图。在一个同步点内更新 snapshot、分配 cursor 并交付事件；它不会自行推测 Agent 结果或启动执行。"},{"id":"map-concept-conversation-store","label":"ConversationStore","explanation":"Agent 使用的持久存储接口，提供输入采纳、请求启动、Checkpoint 生效和 Publication 等领域事务。它保证结构与原子性，不替 Agent 决定取消策略。"},{"id":"map-concept-session-controller","label":"SessionController","explanation":"维护持久 Session → SessionNode → Conversation 目录图和用户显式设置。加载后的 runtime 注册表由 SessionRuntimeManager 另行管理。"},{"id":"map-concept-runtime-incarnation-id","label":"RuntimeIncarnationId","explanation":"每次加载 runtime 都生成的新身份。即使 Session 和 Conversation 没变，旧控制句柄也不能用旧 incarnation 操作后来加载的实例。"},{"id":"map-concept-local-conversation-core","label":"LocalConversationCore","explanation":"统一组装 ConversationRuntime、Tool runtime 和能力协调器，先产生 Inactive runtime，完成客户端绑定后再激活；TUI、headless 与子进程共用这套入口。"},{"id":"map-concept-session-config-input","label":"SessionConfigInput","explanation":"表示已保存或准备采用的 Session 输入，包括 cwd 和可选模型选择，并将它们交给配置解析流程。未指定的值保持为空；它不负责持久存储，也不保存有效凭据或执行状态。"},{"id":"map-concept-user-config-manager","label":"UserConfigManager","explanation":"每次解析都重读当前配置文件，按完整资源定义处理覆盖关系，并精确解析 profile。它提供组装输入与诊断，不直接切换正在执行的 Attempt。"},{"id":"map-concept-capability-coordinator","label":"CapabilityCoordinator","explanation":"准备候选可执行能力，并在所有 AttemptCapabilityLease 释放后原子切换 CapabilitySnapshot。已有 Attempt 保留原版本，单纯诊断变化不推进执行版本。"},{"id":"map-concept-attempt-capability-lease","label":"AttemptCapabilityLease","explanation":"Attempt 持有的能力租约，用来固定本轮实际可用的能力。租约尚未释放时，CapabilityCoordinator 不能切换有效能力集合。"},{"id":"map-concept-capability-snapshot","label":"CapabilitySnapshot","explanation":"已经准备好并可供执行的能力集合。发现一段 MCP 配置不等于它已进入该集合；每个 Attempt 通过租约保留自己取得的版本。"},{"id":"map-concept-conversation-inbound-mailbox","label":"ConversationInboundMailbox","explanation":"输入生产者提交普通输入和唤醒 runtime 的入口。输入先持久接受为 Pending Inbound，再由协调器在安全点采纳；生产者不能直接启动 Attempt。"},{"id":"map-concept-conversation-state","label":"ConversationState","explanation":"Conversation 在两次 Attempt 之间保留的内存热状态。协调器把它交给当前 AgentExecution，执行收束后再接回，避免同时出现两个执行所有者。"},{"id":"map-concept-session-model-state","label":"SessionModelState","explanation":"协调器持有的可变模型选择状态。新 Attempt 启动时取得固定视图，之后的模型更新只影响后续 Attempt。"},{"id":"map-concept-agent-execution","label":"AgentExecution","explanation":"获准启动后运行一个 Attempt 的组件，接管热状态，完成模型与 Tool 循环，负责实际请求启动、canonical 批次和唯一最终状态候选。Conversation 生命周期仍由 runtime 管理。"},{"id":"map-concept-execution-state-machine","label":"ExecutionStateMachine","explanation":"显式记录一个 Attempt 正在调用模型、等待 Tool，还是已经完成、失败或取消。若最终状态无法持久追加，必须明确返回失败。"},{"id":"map-concept-agent-cancellation","label":"AgentCancellation","explanation":"保存 Attempt 的首个语义取消原因，并通过共享启动锁与每次实际请求启动竞争。给模型和 Tool 的子信号只能传递取消要求，不能证明操作已停止或清理完成。"},{"id":"map-concept-model-turn-start-gate","label":"ModelTurnStartGate","explanation":"AgentCancellation 内部的共享临界区。取消先进入时不提交启动；启动事务先成功时保留 Started，后来取消不能撤销。初始调用、重试和继续调用都要经过这里。"},{"id":"map-concept-attempt-lifecycle","label":"AttemptLifecycle","explanation":"为单次 Attempt 固定的策略与观察器组合，通过 PreStepPolicy、PreToolPolicy 和 ToolResultObserver 参与既有执行阶段，不另外取得消息接受或取消权限。"},{"id":"map-concept-native-agent-extensions","label":"NativeAgentExtensions","explanation":"根据 Root 或 named profile 显式组装 Agent Status、Todo、Goal 等内置 Rust 扩展；自主推进 Goal 仅限 Root。扩展集合随配置 generation 固定，默认关闭，不提供动态第三方加载。"},{"id":"map-concept-native-context-composition","label":"NativeContextComposition","explanation":"在 ContextAssembly 中注册内置 Context contributor，让 Agent Status 等扩展沿用现有请求组装流程；模型与客户端使用同一份组合观察结果。"},{"id":"map-concept-agent-status-engine","label":"AgentStatusEngine","explanation":"在请求准备时读取后台任务与 Todo 等状态，生成 Agent Status 观察结果，交由 ContextAssembly 纳入本次请求；它不单独调度 Agent。"},{"id":"map-concept-goal-domain","label":"GoalDomain","explanation":"管理 Goal 当前持久状态的领域组件，包括阶段、预算、轮次和版本。只有 Active 阶段可以授权安全空闲时继续，不能从旧事件推断当前授权。"},{"id":"map-concept-goal-phase","label":"GoalPhase","explanation":"Goal 当前的持久阶段。GoalPhase::Active 允许 runtime 在其他条件也满足时继续；Paused 和 Blocked 都不会授权下一轮。"},{"id":"map-concept-goal-ref","label":"GoalRef","explanation":"标识 Goal 及其版本的引用，用于对准本次要操作的目标状态，避免把基于旧版本的操作当作当前授权。"},{"id":"map-concept-goal-snapshot","label":"GoalSnapshot","explanation":"Goal 的当前持久快照，保存预算、阶段和计数。是否仍允许继续应以它为准，历史事件只是过程记录。"},{"id":"map-concept-goal-round-driver","label":"GoalRoundDriver","explanation":"runtime 到达安全空闲点后，原子消耗 Goal 的一轮预算，再把普通 Pending Inbound 送入已有流程。它不另起执行队列或模型调度器。"},{"id":"map-concept-context-engine-class","label":"ContextEngine","explanation":"编译有限范围内的历史，按模型窗口估算 token，并规划与验证压缩。它不改写 Message Ledger，也不处理提供方的具体传输协议。"},{"id":"map-concept-context-assembly","label":"ContextAssembly","explanation":"汇集 contributor 的类型化 Context 提案，检查兼容性后决定本次纳入哪些输入，并区分 canonical 用户内容与只用于当前请求的 system sections。"},{"id":"map-concept-context-projection","label":"ContextProjection","explanation":"本次模型输入的可计量视图，包含有序类型化消息、实际 System Prompt 和 token 计量，用于确定性 fingerprint。它区别于客户端界面的 RuntimeClientProjection。"},{"id":"map-concept-resolved-model-invocation","label":"ResolvedModelInvocation","explanation":"已经完成模型选择和提供方绑定的调用配置。子进程根据父进程固定的 FrozenModelSpec 构造它，不再读取可变配置重新选模型。"},{"id":"map-concept-frozen-model-spec","label":"FrozenModelSpec","explanation":"父进程交给子进程的固定模型说明，包含协议、endpoint、预算和凭据绑定。子进程只据此构造 adapter，保持创建时确定的模型语义。"},{"id":"map-concept-model-request","label":"ModelRequest","explanation":"Agent 交给 adapter 的提供方无关请求，精确包含本次类型化消息、Tool definitions 和 prompt；实际发送前要与 RequestSnapshot 重建结果比较。"},{"id":"map-concept-model-adapter","label":"ModelAdapter","explanation":"把 ModelRequest 转成某个提供方协议，再将原始事件规范化为 ModelStreamItem。一次 stream 只做一次提供方请求，重试与继续调用由 Agent 显式发起。"},{"id":"map-concept-model-stream-item","label":"ModelStreamItem","explanation":"adapter 返回给 Agent 的统一流项，区分有语义的 ModelEvent 和只表示执行进度的信息；进度不会写成 canonical 对话内容。"},{"id":"map-concept-model-event","label":"ModelEvent","explanation":"adapter 规范化后交给 Agent 组装器的语义事件，例如文本、Tool 调用建议和完成事件。事件仍需经过后续接受流程，不代表已经成为 canonical 对话历史。"},{"id":"map-concept-tool-registry","label":"ToolRegistry","explanation":"根据精确定义查找 Tool，校验调用 schema 和元数据，形成 PreparedInvocation；检查通过仍不代表真实执行已经开始。"},{"id":"map-concept-prepared-invocation","label":"PreparedInvocation","explanation":"执行前固定的完整调用事实，包括选中的 Tool、参数和策略。权限检查只读取这些事实，Approval 不允许临时换一组参数。"},{"id":"map-concept-foreground-invocation","label":"ForegroundInvocation","explanation":"Agent 和 Workflow 共用的前台调用状态机。它裁定完成、取消和 deadline 的先后，并在取消或超时后继续等待清理证据，不负责写对话历史或推进图。"},{"id":"map-concept-tool-executor","label":"ToolExecutor","explanation":"真实 Tool 执行器接口。start 只构造 handle，实际操作在驱动 handle 后开始；执行器还要提供取消后的本地清理与操作结束证据。"},{"id":"map-concept-tool-execution-handle","label":"ToolExecutionHandle","explanation":"持有真实操作和清理资源的执行句柄，提供 completion 与 settlement 两条通道。取消或 deadline 获胜后仍保留清理通道，直到 join 或 reap 等步骤结束。"},{"id":"map-concept-invocation-fact","label":"InvocationFact","explanation":"共享调用机制交回的类型化执行事实。Agent 用结果提交有序 ToolResult 批次，Workflow 用结果推进自己的节点；事实本身不授予写历史或调度权限。"},{"id":"map-concept-conversation-tool-runtime","label":"ConversationToolRuntime","explanation":"单个 Conversation 长期使用的 Tool 资源集合，稳定绑定工作区、artifact store、mailbox 和后台注册表。配置更新不能用新注册表掩盖已有执行。"},{"id":"map-concept-agent-catalog","label":"AgentCatalog","explanation":"创建持久 Agent 时查找 named Agent，并与 resolver 一起固定其能力、模型和 Session execution binding。之后发送消息复用创建时的权限。"},{"id":"map-concept-subagent-registry","label":"SubagentRegistry","explanation":"关联稳定 Agent 身份、子 Conversation 和当前 activation，管理输入检查、封闭与精确控制。旧运行仍在停止或缺少结束证明时，不静默启动替代运行。"},{"id":"map-concept-workflow-runtime","label":"WorkflowRuntime","explanation":"执行编译好的 Workflow 程序，管理 Root、Parallel、Loop、局部值和结果汇合。Tool 与 Agent 节点复用现有执行机制，图的推进仍由它决定。"},{"id":"map-concept-workflow-program","label":"WorkflowProgram","explanation":"编译后的固定 Workflow 程序，包含 block、node、类型化绑定和递归展开上界。它限定本次执行范围，不是模型临时扩展的开放队列。"},{"id":"map-concept-projection-checkpoint","label":"ProjectionCheckpoint","explanation":"持久保存的历史选择内容，与 head、activation、completion 和回执通过领域事务提交。它影响后续模型历史，不改写 canonical Ledger。"},{"id":"map-concept-sqlite-conversation-store","label":"SqliteConversationStore","explanation":"ConversationStore 的 SQLite 实现，负责具体数据保存与事务原子性；Agent 只依赖领域接口，不接触 SQL 或数据库框架类型。"},{"id":"map-concept-publication-coalescer","label":"PublicationCoalescer","explanation":"把细碎模型 delta 合成有限大小的输出帧，按字节、结构和最早 payload 的绝对 deadline 刷出；后来的内容不能延长最早内容的等待时间。"},{"id":"map-concept-publication-frame","label":"PublicationFrame","explanation":"Publication 的持久输出单位。每帧先提交、再发送给客户端；已提交表示获准释放，不表示客户端已收到或用户已看到。"},{"id":"map-concept-proposed-tool-call","label":"ProposedToolCall","explanation":"流式输出中标明的模型 Tool 调用建议。即使整段建议已展示，仍需 canonical Assistant 接受及 Tool 执行检查才能成为真实调用。"},{"id":"map-concept-prepared-model-turn","label":"PreparedModelTurn","explanation":"请求启动前准备好的 Context、本轮语义输入和请求参数，能够构造精确 RequestSnapshot；准备阶段可能失败，不能提前发送提供方请求。"},{"id":"map-concept-resource-read-cut","label":"ResourceReadCut","explanation":"读取资源前固定的历史位置集合，用于确定本次编译可见的 Ledger、Journal 和 activation；之后追加的内容不能混入同一次输入。"},{"id":"map-concept-request-history-cut","label":"RequestHistoryCut","explanation":"为本次请求历史固定的读取切面，记录选中的 activation 和基准位置。Agent 当前暂存的 Context 在切面之外，稍后再单独纳入。"},{"id":"map-concept-checkpoint-candidate","label":"CheckpointCandidate","explanation":"完整描述基准位置之前历史取舍的候选内容，使用 Original 引用和 Derived 值，并保留来源、Tool 配对与结构预算，之后交给编译器验证。"},{"id":"map-concept-compiled-checkpoint","label":"CompiledCheckpoint","explanation":"Checkpoint 编译器校验依赖、来源、Tool 配对和顺序之后生成的类型化历史内容。历史中的调用关联不等于一次真实执行身份。"},{"id":"map-concept-unaccepted-publication-audit","label":"UnacceptedPublicationAudit","explanation":"输出终结 U 已提交，但 canonical 接受 C 最终未提交时保留的审计。它证明完整输出曾获准释放，不能当作正式 Assistant 消息或 Tool 执行授权。"},{"id":"map-concept-incomplete-publication-audit","label":"IncompletePublicationAudit","explanation":"缺少持久输出终结 U 的审计。即使提供方完成 P 已提交，输出仍属于不完整 Publication；它不判断提供方传输是否已经结束。"},{"id":"map-concept-agent-status-display","label":"Agent Status","explanation":"内置状态扩展在请求准备时汇集后台执行与 Todo 等观察，供模型与客户端使用；底层 agent_status 接口只报告状态，不因此启动新的 Attempt。"},{"id":"map-concept-todo-display","label":"Todo","explanation":"Conversation 的内置任务状态扩展。其当前状态可以作为 Agent Status 的输入进入本次 Context，保存或观察任务状态不会绕开原有 Attempt 启动流程。"}]}</script>
  <script>(() => {
  'use strict';
  const data = JSON.parse(document.getElementById('explorer-data').textContent);
  const workspace = document.getElementById('workspace');
  const nodes = new Map(data.nodes.map((node) => [node.id, node]));
  const evidence = new Map(data.evidence.map((item) => [item.id, item]));
  const views = new Map(data.architecture.views.map((view) => [view.id, view]));
  const terms = new Map(data.terms.map((term) => [term.id, term]));
  const history = [];
  const memories = new Map();
  const state = { mode: 'map', view: 'overview', node: data.nodes[0].id, relation: 'all', request: 0, scenario: 0, choice: 0, step: 0, topic: 0 };
  const escape = (value) => String(value).replace(/[&<>"']/g, (character) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[character]);
  const plain = (value) => String(value).replace(/\{\{([a-z][a-z0-9-]*)\}\}/g, (_, id) => terms.get(id).label);
  const rich = (value) => String(value).split(/(\{\{[a-z][a-z0-9-]*\}\})/g).map((part) => {
    const match = /^\{\{([a-z][a-z0-9-]*)\}\}$/.exec(part);
    if (!match) return escape(part);
    const term = terms.get(match[1]);
    return `<span class="term" data-term="${term.id}" lang="en">${escape(term.label)}</span>`;
  }).join('');
  const list = (items) => `<ul class="plain-list">${items.map((item) => `<li>${rich(item)}</li>`).join('')}</ul>`;
  const badge = (kind) => `<span class="relation-kind ${kind}">${rich({ call: '运行时调用', data: '数据流', dependency: '代码依赖' }[kind])}</span>`;
  const graph = () => state.view === 'overview' ? { title: '架构总览', summary: '先了解各模块如何协作，再进入内部，逐层查看实现。', nodes: data.nodes, relations: data.relations } : views.get(state.view);
  const targetOf = (node) => state.view === 'overview' ? data.architecture.entries[node.id] : node.target;
  const visibleRelations = () => state.view === 'overview' ? selectedRelations() : graph().relations.filter((relation) => state.relation === 'all' || relation.kind === state.relation);
  const selectedRelations = () => graph().relations.filter((relation) => (relation.from === state.node || relation.to === state.node) && (state.relation === 'all' || relation.kind === state.relation));
  const sourceDetails = (ids) => `<section class="source-section" aria-label="源码依据"><h3>查看 {{source-code}} <span class="count">${ids.length}</span></h3><p class="source-help">{{source-code}} 摘录已打包，可离线查看。GitHub 链接会打开固定基线。</p>${ids.map((id) => {
    const item = evidence.get(id);
    return `<details class="source" data-source="${escape(id)}"><summary><span>${rich(item.label)}</span><code>${escape(item.path)}:${item.start}–${item.end}</code></summary><div class="source-body"><div class="source-toolbar"><span>基线 ${escape(data.baseline.commit.slice(0, 8))}</span><a href="${escape(item.url)}" target="_blank" rel="noopener noreferrer">在 GitHub 查看 ↗</a></div><pre tabindex="0" lang="en" aria-label="${escape(item.path)}，第 ${item.start} 至 ${item.end} 行"><code>${item.text.split('\n').map((line, index) => `<span class="source-line"><span class="line-number" aria-hidden="true">${item.start + index}</span><span>${escape(line) || ' '}</span></span>`).join('')}</code></pre></div></details>`;
  }).join('')}</section>`;
  const nodeChips = (ids) => `<div class="node-chips">${ids.map((id) => `<button type="button" class="node-chip" data-inspect="${escape(id)}">${rich(nodes.get(id).label)} <span aria-hidden="true">↗</span></button>`).join('')}</div>`;
  function mapMarkup(active = [], compact = false) {
    const current = compact ? { nodes: data.nodes } : graph();
    const groups = [...new Set(current.nodes.map((node) => node.layer))];
    const neighbors = new Set(compact ? [] : selectedRelations().flatMap((relation) => [relation.from, relation.to]));
    const markers = ['call', 'data', 'dependency'].map((kind) => `<marker id="arrow-${kind}" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 8 4 L 0 8 z"/></marker>`).join('');
    return `<div class="architecture-map ${compact ? 'compact' : state.view !== 'overview' ? 'detail-graph' : ''}" data-map>${compact ? '' : `<svg class="map-lines" aria-hidden="true"><defs>${markers}</defs><g data-lines></g></svg>`}${groups.map((layer, index) => `<section class="map-layer"><h3><span>${String(index + 1).padStart(2, '0')}</span>${rich(layer)}</h3><div class="layer-nodes">${current.nodes.filter((node) => node.layer === layer).map((node) => {
      const classes = `${!compact && node.id === state.node ? 'selected' : ''} ${compact && active.includes(node.id) ? 'active' : ''} ${!compact && neighbors.has(node.id) && node.id !== state.node ? 'neighbor' : ''} ${node.external ? 'external-node' : ''}`;
      const selection = `<button type="button" data-node="${escape(node.id)}" class="map-node ${classes}" aria-label="${escape(plain(node.label))}，${compact ? '在架构总览中查看' : '选择并查看右侧说明'}" ${!compact ? `aria-pressed="${node.id === state.node}"` : ''}><span class="node-name">${rich(node.label)}</span>${!compact ? `<span class="node-summary">${rich(node.summary)}</span>` : ''}${compact && active.includes(node.id) ? '<span class="active-dot" aria-hidden="true"></span>' : ''}</button>`;
      if (compact) return selection;
      const target = targetOf(node);
      const action = target ? `<button type="button" class="node-enter" data-enter="${escape(target)}" aria-label="进入 ${escape(plain(node.label))} 内部">进入内部 <span aria-hidden="true">${node.external ? '↗' : '→'}</span></button>` : '<span class="node-leaf">查看实现</span>';
      return `<div class="node-card ${classes}">${selection}<div class="node-action">${node.external ? `<span class="external-owner">${rich('外部 {{owner}}')}</span>` : ''}${action}</div></div>`;
    }).join('')}</div></section>`).join('')}</div>`;
  }
  function relationsMarkup(node) {
    const relations = selectedRelations();
    const local = new Map(graph().nodes.map((item) => [item.id, item]));
    return `<section class="relationships"><h3>相关关系</h3><p class="source-help">箭头表示关系方向。代码依赖不代表运行时调用。</p>${relations.length ? `<ul>${relations.map((relation) => `<li>${badge(relation.kind)}<span class="relation-endpoints"><button type="button" data-select="${escape(relation.from)}">${rich(local.get(relation.from).label)}</button><span aria-hidden="true">→</span><button type="button" data-select="${escape(relation.to)}">${rich(local.get(relation.to).label)}</button></span><p>${rich(relation.label)}</p></li>`).join('')}</ul>` : '<p>此节点没有这种类型的关联。</p>'}</section>`;
  }
  function breadcrumbs() {
    const path = [];
    let current = state.view;
    while (current !== 'overview') { path.unshift(views.get(current)); current = views.get(current).parent; }
    return `<nav class="graph-navigation" aria-label="图层导航"><button type="button" class="secondary-button" data-back ${history.length ? '' : 'disabled'}>← 返回上一处</button><ol><li><button type="button" data-view="overview" ${state.view === 'overview' ? 'aria-current="page"' : ''}>架构总览</button></li>${path.map((view) => `<li><span aria-hidden="true">/</span><button type="button" data-view="${view.id}" ${view.id === state.view ? 'aria-current="page"' : ''}>${rich(view.title)}</button></li>`).join('')}</ol></nav>`;
  }
  function relationControls() {
    const options = [['all', '所有关系'], ['call', '运行时调用'], ['data', '数据流'], ['dependency', '代码依赖']];
    return `<div class="map-controls" role="group" aria-label="关系类型">${options.map(([value, label]) =>
      `<button type="button" class="filter ${value}" data-relation="${value}" aria-pressed="${state.relation === value}"><span aria-hidden="true"></span>${label}</button>`
    ).join('')}</div>`;
  }
  function inspectorMarkup(node) {
    const target = targetOf(node);
    const next = target
      ? `<button type="button" class="primary-button enter-graph" data-enter="${target}">${node.external ? '进入内部 ↗' : '进入内部 →'}</button>`
      : `<p class="leaf-note">${rich('此处为实现末端，可展开下方 {{source-code}} 依据。')}</p>`;
    return `<aside class="inspector" aria-label="所选节点">
      <p class="eyebrow">${rich(node.layer)}${node.external ? ' · 外部模块' : ''}</p>
      <h2>${rich(node.label)}</h2><p class="lead">${rich(node.summary)}</p>${next}
      <h3>负责什么</h3>${list(node.owns)}
      <h3>需要留意什么</h3>${list(node.boundaries)}
      ${relationsMarkup(node)}${sourceDetails(node.evidence)}
    </aside>`;
  }
  function renderMap() {
    const current = graph();
    const node = current.nodes.find((item) => item.id === state.node);
    const groupCount = new Set(current.nodes.map((item) => item.layer)).size;
    const caption = '选择卡片主体查看右侧说明，点击“进入内部”继续探索。将鼠标停在带点状下划线的术语上，可查看该词的解释。实现末端可展开 {{source-code}}。虚线外框表示由其他模块负责的节点。' + (state.view === 'overview' ? '总览显示选中节点的关系。' : '内部图显示当前过滤下的所有关系，粗线突出选中节点的关系。') + '右侧清单解释选中节点的关系。';
    workspace.innerHTML = `${breadcrumbs()}
      <div class="section-heading">
        <div><p class="eyebrow">01 / ${state.view === 'overview' ? '模块总览' : '模块内部'}</p>
        <h2 tabindex="-1" data-graph-heading>${rich(current.title)}</h2></div><p>${rich(current.summary)}</p>
      </div>
      ${relationControls()}
      <div class="map-layout"><div class="map-board">
        <div class="board-label"><span>${state.view === 'overview' ? '模块入口' : '内部结构'}</span><span>${current.nodes.length} 个节点 / ${groupCount} 个分组</span></div>
        ${mapMarkup()}<p class="map-caption">${rich(caption)}</p>
      </div>${inspectorMarkup(node)}</div>`;
    drawLines();
  }
  function stepperMarkup(steps, index, context) {
    const step = steps[index];
    return `<div class="walk-layout"><aside class="step-index" aria-label="步骤导航"><p class="eyebrow">${context === 'request' ? '请求路径' : '结果路径'}</p><ol>${steps.map((item, itemIndex) => `<li><button type="button" data-step="${itemIndex}" ${index === itemIndex ? 'aria-current="step"' : ''}><span class="step-number">${String(itemIndex + 1).padStart(2, '0')}</span><span>${rich(item.title)}</span>${itemIndex < index ? '<span class="completed" aria-label="已浏览">✓</span>' : ''}</button></li>`).join('')}</ol></aside><article class="step-content"><div class="step-control"><span class="step-progress">第 ${index + 1} 步 / 共 ${steps.length} 步</span><div><button type="button" class="text-button" data-replay ${index === 0 ? 'disabled' : ''}>↺ 重置</button><button type="button" class="square-button" data-prev ${index === 0 ? 'disabled' : ''} aria-label="上一步">←</button><button type="button" class="square-button" data-next ${index === steps.length - 1 ? 'disabled' : ''} aria-label="下一步">→</button></div></div><div class="step-announcement" aria-live="polite" aria-atomic="true"><p class="eyebrow">执行方 / ${rich(step.actor)}</p><h2>${rich(step.title)}</h2></div><p class="step-description">${rich(step.description)}</p><div class="fact-grid"><section><h3><span aria-hidden="true">▣</span> 已保存的事实</h3><p>${rich(step.durable)}</p></section><section><h3><span aria-hidden="true">◉</span> 客户端可见内容</h3><p>${rich(step.visible)}</p></section></div><section class="active-responsibilities"><h3>这一步涉及哪些模块</h3>${nodeChips(step.active)}<p class="source-help">下方突出显示参与这一步的模块。选择模块可查看它在架构中的位置。</p>${mapMarkup(step.active, true)}</section>${sourceDetails(step.evidence)}<div class="bottom-step-control"><button type="button" class="secondary-button" data-prev ${index === 0 ? 'disabled' : ''}>← 上一步</button>${index < steps.length - 1 ? '<button type="button" class="primary-button" data-next>下一步 →</button>' : '<span class="path-complete">路径结束 <span aria-hidden="true">✓</span></span>'}</div></article></div>`;
  }
  function renderRequest() {
    workspace.innerHTML = `<div class="section-heading"><div><p class="eyebrow">02 / 一次请求的完整路径</p><h2>追踪一次请求。</h2></div><p>按自己的节奏逐步前进，看看一次请求如何经过各个模块，以及每一步会留下什么结果。</p></div>${stepperMarkup(data.request, state.request, 'request')}`;
  }
  function renderScenarios() {
    const scenario = data.scenarios[state.scenario];
    const choice = scenario.choices[state.choice];
    workspace.innerHTML = `<div class="section-heading"><div><p class="eyebrow">03 / 特殊情况如何处理</p><h2>遇到这些情况时……</h2></div><p>选择一种情境和结果。沿着有 {{source-code}} 依据的路径，看看系统如何处理这些情况。</p></div><div class="scenario-tabs" role="group" aria-label="特殊情况">${data.scenarios.map((item, index) => `<button type="button" data-scenario="${index}" aria-pressed="${index === state.scenario}"><span>${String(index + 1).padStart(2, '0')}</span>${rich(item.title)}</button>`).join('')}</div><section class="scenario-intro"><div><h2>${rich(scenario.title)}</h2><p>${rich(scenario.intro)}</p></div><fieldset><legend>选择一种结果</legend>${scenario.choices.map((item, index) => `<label class="choice ${state.choice === index ? 'chosen' : ''}"><input type="radio" name="outcome" data-choice="${index}" value="${index}" ${state.choice === index ? 'checked' : ''}><span>${rich(item.label)}</span></label>`).join('')}</fieldset></section>${stepperMarkup(choice.steps, state.step, 'scenario')}`;
  }
  function renderTopics() {
    const topic = data.topics[state.topic];
    workspace.innerHTML = `<div class="section-heading"><div><p class="eyebrow">04 / 深入一层</p><h2>理解系统如何协同运作。</h2></div><p>从一个设计问题出发，了解相关模块如何协作，并查看对应的 {{source-code}}。</p></div><div class="topic-layout"><aside class="topic-nav" aria-label="深入专题">${data.topics.map((item, index) => `<button type="button" data-topic="${index}" ${index === state.topic ? 'aria-current="true"' : ''}><span>${String(index + 1).padStart(2, '0')}</span>${rich(item.title)}<span aria-hidden="true">↗</span></button>`).join('')}</aside><article class="topic-content"><p class="eyebrow">深入专题 / ${String(state.topic + 1).padStart(2, '0')}</p><h2>${rich(topic.title)}</h2><p class="lead">${rich(topic.summary)}</p><div class="topic-details">${topic.details.map((detail) => `<p>${rich(detail)}</p>`).join('')}</div><h3>相关模块</h3>${nodeChips(topic.nodes)}${sourceDetails(topic.evidence)}</article></div>`;
  }
  function render() {
    document.querySelectorAll('[data-mode]').forEach((button) => {
      if (button.dataset.mode === state.mode) button.setAttribute('aria-current', 'page');
      else button.removeAttribute('aria-current');
    });
    hideTooltip();
    ({ map: renderMap, request: renderRequest, scenarios: renderScenarios, topics: renderTopics })[state.mode]();
    hydrateTerms();
    revealCurrentStep();
  }
  function revealCurrentStep() {
    const strip = workspace.querySelector('.step-index ol');
    const current = strip?.querySelector('[aria-current="step"]');
    if (!current || strip.scrollWidth <= strip.clientWidth) return;
    const stripBounds = strip.getBoundingClientRect();
    const currentBounds = current.getBoundingClientRect();
    if (currentBounds.right > stripBounds.right - 4) {
      strip.scrollLeft += currentBounds.right - stripBounds.right + 4;
    } else if (currentBounds.left < stripBounds.left + 4) {
      strip.scrollLeft += currentBounds.left - stripBounds.left - 4;
    }
  }
  function drawLines() {
    const map = workspace.querySelector('[data-map]:not(.compact)');
    if (!map) return;
    const svg = map.querySelector('svg');
    const group = svg.querySelector('[data-lines]');
    const bounds = map.getBoundingClientRect();
    svg.setAttribute('viewBox', `0 0 ${bounds.width} ${bounds.height}`);
    const relations = visibleRelations().sort((a, b) => Number(a.from === state.node || a.to === state.node) - Number(b.from === state.node || b.to === state.node));
    group.replaceChildren();
    relations.forEach((relation) => {
      const from = map.querySelector(`[data-node="${relation.from}"]`).closest('.node-card').getBoundingClientRect();
      const to = map.querySelector(`[data-node="${relation.to}"]`).closest('.node-card').getBoundingClientRect();
      const down = to.top >= from.top;
      const sameRow = Math.abs(from.top - to.top) < Math.min(from.height, to.height) / 2;
      const right = to.left >= from.left;
      const x1 = (sameRow ? (right ? from.right : from.left) : from.left + from.width / 2) - bounds.left;
      const y1 = (sameRow ? from.top + from.height / 2 : down ? from.bottom : from.top) - bounds.top;
      const x2 = (sameRow ? (right ? to.left : to.right) : to.left + to.width / 2) - bounds.left;
      const y2 = (sameRow ? to.top + to.height / 2 : down ? to.top : to.bottom) - bounds.top;
