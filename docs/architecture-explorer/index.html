<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="description" content="离线、基于源码的 rustX 架构导览。">
  <title>rustX · 架构导览</title>
  <style>:root {
  --paper:#f6f3eb;
  --surface:#fffdf7;
  --ink:#26332f;
  --muted:#59655d;
  --line:#d6d9cc;
  --rust:#a44525;
  --rust-soft:#f4e5d8;
  --green:#276c61;
  --blue:#536b88;
  --serif:Georgia,'Times New Roman',serif;
  --sans:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --mono:ui-monospace,SFMono-Regular,Consolas,'Liberation Mono',monospace;
}

* {
  box-sizing:border-box;
}

html {
  scroll-behavior:auto;
}

body {
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:var(--sans);
  font-size:14px;
  line-height:1.55;
}

button,input {
  font:inherit;
}

button,a,input,summary {
  -webkit-tap-highlight-color:transparent;
}

button {
  color:inherit;
  cursor:pointer;
}

button {
  border:0;
  background:none;
}

button:disabled {
  opacity:.38;
  cursor:default;
}

a {
  color:var(--rust);
  text-underline-offset:3px;
}

button:focus-visible,a:focus-visible,summary:focus-visible,input:focus-visible,pre:focus-visible,[tabindex]:focus-visible {
  outline:3px solid var(--rust);
  outline-offset:4px;
}

h1,h2,h3,p {
  margin:0;
}

h1,h2 {
  font-weight:400;
}

h3 {
  font-size:12px;
  letter-spacing:.025em;
  font-weight:700;
}

code {
  font-family:var(--mono);
}

.page-shell {
  max-width:1440px;
  padding:0 48px;
  margin:0 auto;
}

.masthead {
  height:87px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-bottom:1px solid var(--line);
  gap:20px;
}

.wordmark {
  font-size:27px;
  line-height:1;
  font-weight:750;
  text-decoration:none;
  color:var(--ink);
  letter-spacing:-1.6px;
  display:flex;
  align-items:center;
}

.wordmark>span:first-child {
  color:var(--rust);
}

.wordmark-note {
  font-size:11px;
  font-weight:500;
  letter-spacing:1px;
  text-transform:uppercase;
  margin-left:24px;
  padding-left:24px;
  border-left:1px solid var(--line);
}

.offline-label {
  font:11px var(--mono);
  color:var(--muted);
  white-space:nowrap;
}

.offline-label>span {
  color:var(--green);
  font-size:11px;
  margin-right:7px;
}

.introduction {
  display:grid;
  grid-template-columns:1.3fr 1fr;
  gap:80px;
  padding:48px 0 36px;
  align-items:end;
}

.eyebrow {
  font-size:11px;
  font-weight:650;
  letter-spacing:1.6px;
  text-transform:uppercase;
  color:var(--rust);
  margin-bottom:14px;
}

h1 {
  font-family:var(--serif);
  font-size:clamp(42px,4.6vw,66px);
  line-height:1.04;
  letter-spacing:-2px;
}

.intro-copy {
  font-size:15px;
  line-height:1.8;
  max-width:490px;
}

.reading-note {
  font-size:11px;
  color:var(--muted);
  margin-top:17px;
  line-height:1.6;
}

.baseline-bar {
  min-height:42px;
  border-top:1px solid var(--line);
  border-bottom:1px solid var(--line);
  display:flex;
  align-items:center;
  gap:18px;
  font-size:11px;
  position:relative;
}

.baseline-tag {
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:1.2px;
  color:var(--muted);
}

.baseline-details summary {
  list-style:none;
  cursor:pointer;
  display:flex;
  gap:12px;
  align-items:center;
}

.baseline-details summary::-webkit-details-marker {
  display:none;
}

.baseline-details summary code {
  font-size:11px;
}

.baseline-details summary>span {
  color:var(--muted);
}

.baseline-details[open]>div {
  position:absolute;
  left:100px;
  top:100%;
  z-index:5;
  background:var(--surface);
  border:1px solid var(--line);
  padding:20px;
  max-width:500px;
  box-shadow:0 10px 20px #26332f12;
}

.baseline-details[open]>div code {
  font-size:11px;
  overflow-wrap:anywhere;
}

.baseline-details p {
  margin-top:10px;
  color:var(--muted);
}

.simulation-label {
  margin-left:auto;
  color:var(--muted);
  font-size:11px;
}

.mode-nav {
  display:grid;
  grid-template-columns:repeat(4,1fr);
  border-bottom:1px solid var(--line);
  margin:18px 0 0;
}

.mode-nav button {
  display:flex;
  align-items:center;
  gap:12px;
  text-align:left;
  font-size:12px;
  padding:19px 14px 20px 0;
  border-bottom:3px solid transparent;
  margin-bottom:-1px;
  line-height:1.4;
  color:var(--muted);
}

.mode-nav button>span {
  font:11px var(--mono);
}

.mode-nav button[aria-current] {
  border-bottom-color:var(--rust);
  color:var(--rust);
  font-weight:650;
}

.mode-nav button:hover {
  color:var(--rust);
}

main {
  min-height:550px;
  padding-top:34px;
  overflow-wrap:anywhere;
}

.section-heading {
  display:flex;
  justify-content:space-between;
  align-items:end;
  gap:50px;
  margin-bottom:28px;
}

.section-heading .eyebrow {
  margin-bottom:9px;
}

.section-heading h2 {
  font-family:var(--serif);
  font-size:31px;
  letter-spacing:-.75px;
  line-height:1.25;
}

.section-heading>p {
  font-size:12px;
  line-height:1.7;
  max-width:370px;
  color:var(--muted);
}

.map-controls {
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-bottom:17px;
}

.filter {
  border:1px solid var(--line);
  padding:6px 10px;
  font-size:11px;
  display:flex;
  align-items:center;
  gap:7px;
  border-radius:3px;
}

.filter>span {
  display:block;
  width:16px;
  height:0;
  border-top:2px solid var(--muted);
}

.filter.call>span {
  border-color:var(--rust);
}

.filter.data>span {
  border-color:var(--green);
  border-top-style:dashed;
}

.filter.dependency>span {
  border-color:var(--blue);
  border-top-style:dotted;
}

.filter[aria-pressed=true] {
  background:var(--ink);
  border-color:var(--ink);
  color:var(--surface);
}

.filter[aria-pressed=true]>span {
  border-color:var(--surface);
}

.map-layout {
  display:grid;
  grid-template-columns:minmax(0,1.65fr) minmax(0,1fr);
  align-items:start;
  gap:28px;
}

.map-board {
  background:#eceee4;
  border:1px solid var(--line);
  padding:20px 24px;
}

.board-label {
  display:flex;
  justify-content:space-between;
  font:11px var(--mono);
  text-transform:uppercase;
  letter-spacing:.8px;
  color:var(--muted);
  gap:10px;
  margin-bottom:18px;
}

.architecture-map {
  position:relative;
  isolation:isolate;
}

.map-layer {
  position:relative;
  padding:12px 0 22px;
}

.map-layer>h3 {
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:1.3px;
  color:var(--muted);
  margin-bottom:10px;
  display:flex;
  gap:9px;
}

.map-layer>h3>span {
  font:11px var(--mono);
  color:var(--muted);
}

.layer-nodes {
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:12px;
}

.map-node {
  background:var(--surface);
  border:1px solid #c8cec0;
  padding:13px 12px 15px;
  text-align:left;
  border-radius:3px;
  position:relative;
  min-width:0;
  box-shadow:0 2px 1px #26332f05;
  z-index:1;
}

.node-name {
  display:block;
  font-size:12px;
  font-weight:650;
  line-height:1.4;
  overflow-wrap:anywhere;
}

.node-summary {
  font-size:11px;
  line-height:1.65;
  color:var(--muted);
  display:block;
  margin-top:7px;
}

.map-node.selected {
  border:2px solid var(--rust);
  padding:12px 11px 14px;
  background:var(--rust-soft);
}

.map-node.selected .node-name {
  color:var(--rust);
}

.map-node.neighbor {
  border-color:#8a9887;
}

.map-node:hover {
  border-color:var(--rust);
}

.map-lines {
  position:absolute;
  width:100%;
  height:100%;
  inset:0;
  z-index:0;
  overflow:visible;
  pointer-events:none;
}

.map-line {
  fill:none;
  stroke-width:1.5;
  opacity:.8;
}

.map-line.call {
  stroke:var(--rust);
}

.map-line.data {
  stroke:var(--green);
  stroke-dasharray:5 4;
}

.map-line.dependency {
  stroke:var(--blue);
  stroke-dasharray:2 4;
}

#arrow-call {
  fill:var(--rust);
}

#arrow-data {
  fill:var(--green);
}

#arrow-dependency {
  fill:var(--blue);
}

.map-caption {
  border-top:1px solid #d2d7c9;
  padding-top:15px;
  font-size:11px;
  color:var(--muted);
  line-height:1.7;
}

.inspector {
  min-width:0;
  background:var(--surface);
  padding:25px;
  border-top:3px solid var(--rust);
}

.inspector .eyebrow {
  font-size:11px;
  margin-bottom:9px;
}

.inspector>h2 {
  font-family:var(--serif);
  font-size:30px;
  letter-spacing:-.7px;
  line-height:1.2;
  overflow-wrap:anywhere;
}

.lead {
  font-size:13px;
  line-height:1.8;
  color:var(--muted);
  margin-top:14px;
}

.inspector>h3 {
  margin-top:24px;
}

.plain-list {
  margin:8px 0 0;
  padding-left:17px;
  font-size:12px;
  line-height:1.75;
}

.plain-list li {
  padding-left:2px;
  margin-bottom:7px;
}

.plain-list li::marker {
  color:var(--rust);
  font-size:11px;
}

.relationships {
  margin-top:25px;
  padding-top:22px;
  border-top:1px solid var(--line);
}

.source-help {
  font-size:11px;
  line-height:1.6;
  color:var(--muted);
  margin:7px 0 12px;
}

.relationships>ul {
  list-style:none;
  padding:0;
  margin:14px 0 0;
}

.relationships li {
  padding:13px 0;
  border-top:1px solid #e9e9df;
}

.relation-kind {
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:.9px;
  font-weight:700;
  color:var(--rust);
}

.relation-kind.data {
  color:var(--green);
}

.relation-kind.dependency {
  color:var(--blue);
}

.relation-endpoints {
  display:flex;
  gap:7px;
  align-items:baseline;
  font-size:11px;
  margin:6px 0;
  flex-wrap:wrap;
}

.relation-endpoints button {
  text-align:left;
  padding:0;
  text-decoration:underline;
  text-decoration-color:#bcc3b4;
  text-underline-offset:3px;
}

.relation-endpoints button:hover {
  color:var(--rust);
}

.relationships li>p {
  font-size:11px;
  line-height:1.7;
  color:var(--muted);
}

.source-section {
  border-top:1px solid var(--line);
  margin-top:26px;
  padding-top:22px;
  min-width:0;
}

.count {
  font:11px var(--mono);
  color:var(--muted);
  margin-left:6px;
}

.source {
  border-top:1px solid var(--line);
}

.source:last-child {
  border-bottom:1px solid var(--line);
}

.source summary {
  cursor:pointer;
  padding:13px 0;
  font-size:11px;
  list-style:none;
  position:relative;
  padding-left:17px;
}

.source summary:before {
  content:'+';
  position:absolute;
  left:0;
  color:var(--rust);
  font:14px var(--mono);
  top:12px;
}

.source[open] summary:before {
  content:'−';
}

.source summary::-webkit-details-marker {
  display:none;
}

.source summary>span {
  display:block;
  font-weight:600;
  line-height:1.6;
}

.source summary>code {
  font-size:11px;
  line-height:1.6;
  color:var(--muted);
  display:block;
  margin-top:3px;
  overflow-wrap:anywhere;
}

.source-body {
  min-width:0;
  border:1px solid var(--line);
  margin-bottom:12px;
  background:#f0f1e9;
}

.source-toolbar {
  display:flex;
  justify-content:space-between;
  gap:10px;
  flex-wrap:wrap;
  font:11px var(--mono);
  padding:9px;
  border-bottom:1px solid var(--line);
  color:var(--muted);
}

.source pre {
  font:11px/1.8 var(--mono);
  margin:0;
  padding:12px 10px 14px 0;
  overflow:auto;
  max-height:440px;
  text-align:left;
}

.source-line {
  display:grid;
  grid-template-columns:42px 1fr;
  min-width:max-content;
}

.line-number {
  text-align:right;
  color:var(--muted);
  user-select:none;
  border-right:1px solid var(--line);
  padding-right:9px;
  margin-right:10px;
  font-size:11px;
}

.walk-layout {
  display:grid;
  grid-template-columns:250px minmax(0,1fr);
  gap:40px;
  align-items:start;
}

.step-index {
  padding-top:20px;
  border-top:1px solid var(--line);
}

.step-index .eyebrow {
  font-size:11px;
  color:var(--muted);
}

.step-index ol {
  list-style:none;
  padding:0;
  margin:0;
}

.step-index li {
  position:relative;
}

.step-index button {
  display:flex;
  align-items:baseline;
  text-align:left;
  gap:12px;
  width:100%;
  font-size:11px;
  color:var(--muted);
  padding:12px 10px;
  border-left:2px solid transparent;
  line-height:1.65;
}

.step-number {
  font:11px var(--mono);
  color:var(--muted);
  min-width:18px;
}

.step-index button[aria-current] {
  border-left-color:var(--rust);
  background:var(--rust-soft);
  color:var(--rust);
  font-weight:650;
}

.step-index button[aria-current] .step-number {
  color:var(--rust);
}

.step-index button:hover {
  background:#eeeede;
}

.completed {
  margin-left:auto;
  color:var(--green);
  font-size:11px;
}

.step-content {
  min-width:0;
  border-top:3px solid var(--rust);
  background:var(--surface);
  padding:20px 32px 26px;
}

.step-control {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:14px;
  border-bottom:1px solid var(--line);
  padding-bottom:16px;
  margin-bottom:25px;
}

.step-control>div {
  display:flex;
  align-items:center;
  gap:8px;
}

.step-progress {
  font:11px var(--mono);
  text-transform:uppercase;
  letter-spacing:1px;
  color:var(--muted);
}

.text-button {
  font-size:11px;
  color:var(--muted);
  margin-right:5px;
  padding:6px;
}

.square-button {
  border:1px solid var(--line);
  width:32px;
  height:30px;
  font-size:15px;
  line-height:1;
}

.square-button:hover:enabled {
  border-color:var(--rust);
  color:var(--rust);
}

.step-announcement .eyebrow {
  font-size:11px;
  margin-bottom:10px;
}

.step-announcement h2 {
  font-family:var(--serif);
  font-size:35px;
  line-height:1.2;
  letter-spacing:-.7px;
}

.step-description {
  font-size:14px;
  line-height:1.85;
  margin-top:18px;
  max-width:760px;
}

.fact-grid {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:25px;
  margin:27px 0;
  padding:23px 0;
  border-top:1px solid var(--line);
  border-bottom:1px solid var(--line);
}

.fact-grid h3 {
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:.8px;
}

.fact-grid h3>span {
  color:var(--rust);
  margin-right:5px;
}

.fact-grid p {
  font-size:12px;
  line-height:1.8;
  color:var(--muted);
  margin-top:9px;
}

.node-chips {
  display:flex;
  gap:7px;
  flex-wrap:wrap;
  margin-top:12px;
}

.node-chip {
  border:1px solid #cccfbf;
  background:#f2f2e7;
  padding:6px 9px;
  font-size:11px;
  text-align:left;
  border-radius:2px;
  overflow-wrap:anywhere;
}

.node-chip>span {
  color:var(--rust);
  margin-left:6px;
}

.node-chip:hover {
  border-color:var(--rust);
  color:var(--rust);
}

.active-responsibilities>h3 {
  font-size:11px;
}

.compact {
  background:#eef0e6;
  border:1px solid var(--line);
  padding:10px 16px;
  margin-top:15px;
}

.compact .map-lines {
  display:none;
}

.compact .map-layer {
  padding:7px 0 10px;
}

.compact .map-layer>h3 {
  font-size:11px;
  margin-bottom:6px;
  letter-spacing:.9px;
}

.compact .map-layer>h3>span {
  font-size:11px;
}

.compact .layer-nodes {
  gap:7px;
}

.compact .map-node {
  padding:9px 10px;
  box-shadow:none;
}

.compact .node-name {
  font-size:11px;
  font-weight:500;
}

.compact .map-node.active {
  background:var(--rust-soft);
  border-color:var(--rust);
  padding-right:19px;
}

.compact .map-node.active .node-name {
  font-weight:650;
  color:var(--rust);
}

.active-dot {
  position:absolute;
  right:7px;
  top:12px;
  width:4px;
  height:4px;
  border-radius:50%;
  background:var(--rust);
}

.bottom-step-control {
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-top:25px;
}

.primary-button,.secondary-button {
  font-size:11px;
  padding:10px 15px;
  border:1px solid var(--line);
}

.primary-button {
  background:var(--rust);
  border-color:var(--rust);
  color:white;
}

.secondary-button:hover:enabled {
  border-color:var(--rust);
  color:var(--rust);
}

.path-complete {
  font-size:11px;
  color:var(--green);
}

.path-complete>span {
  margin-left:10px;
}

.scenario-tabs {
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:10px;
  margin-bottom:24px;
}

.scenario-tabs button {
  display:flex;
  gap:10px;
  text-align:left;
  padding:13px 14px;
  border:1px solid var(--line);
  font-size:11px;
  line-height:1.6;
}

.scenario-tabs button>span {
  font:11px var(--mono);
  padding-top:3px;
  color:var(--muted);
}

.scenario-tabs button[aria-pressed=true] {
  border-color:var(--rust);
  background:var(--rust-soft);
  color:var(--rust);
}

.scenario-intro {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:40px;
  margin:0 0 30px;
  padding:24px 0;
  border-top:1px solid var(--line);
  border-bottom:1px solid var(--line);
}

.scenario-intro h2 {
  font-family:var(--serif);
  font-size:25px;
  letter-spacing:-.4px;
  line-height:1.3;
}

.scenario-intro p {
  font-size:12px;
  color:var(--muted);
  line-height:1.8;
  margin-top:10px;
}

.scenario-intro fieldset {
  border:0;
  margin:0;
  padding:0;
  min-width:0;
}

.scenario-intro legend {
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:1px;
  color:var(--muted);
  margin-bottom:10px;
}

.choice {
  display:flex;
  align-items:center;
  gap:9px;
  padding:9px 11px;
  border:1px solid var(--line);
  margin-bottom:7px;
  cursor:pointer;
  background:var(--surface);
  font-size:11px;
}

.choice.chosen {
  border-color:var(--rust);
  background:var(--rust-soft);
}

.choice input {
  accent-color:var(--rust);
  margin:0;
  flex-shrink:0;
}

.topic-layout {
  display:grid;
  grid-template-columns:280px minmax(0,1fr);
  gap:40px;
}

.topic-nav {

e":["agent","tools","durable"],"description":"执行器启动事实先于物理工作。它是保守的恢复边界，与适配器的实际副作用边界不同。","durable":"启动证据不能证明外部修改是否发生或完成。","visible":"运行/进度 UI 不能证明最终副作用。","evidence":["tool-acceptance"]},{"id":"tool-unknown-settle","title":"先回收本地持有资源","actor":"执行器 settlement 责任方","active":["tools","runtime"],"description":"远程传输丢失且没有关联终态结果时，先完成 rustX 持有的本地传输/worker 资源的 settlement。取消意图不能证明远程已停止。","durable":"只有回收本地持有资源后，Unconfirmed 才能变为 OutcomeUnknown；本地 worker 仍在运行则属于控制面 settlement 失败。","visible":"对于 MCP，本地释放证明与远程结果未知是不同证据。Managed Python 使用相同边界。","evidence":["tool-evidence","tool-adapters"]},{"id":"tool-unknown-recover","title":"commit 不确定性，不进行重放","actor":"runtime 恢复 + Agent Loop","active":["runtime","agent","durable"],"description":"若结果缺失，且持久启动证据没有可信终态结果，则恢复为 OutcomeUnknown。不要静默重试结果不明的副作用。","durable":"恢复是原子/幂等的，绝不替换已 commit 的 canonical 事实。这不承诺外部副作用 exactly-once。","visible":"用户看到显式不确定性，可先调查外部系统再决定是否开展新工作。","evidence":["tool-recovery","tool-evidence"]}]},{"id":"known-result","label":"结果已知，或结果已经 commit","steps":[{"id":"tool-known-proof","title":"保留已证明的完成结果","actor":"执行器 → Agent Loop","active":["tools","agent"],"description":"即使已有取消意图，物理 settlement 仍可返回已知的 Success 或 Failed。已知证据保持不可变，不会被迟到信号重新标记。","durable":"该证据是调用结果；有序的 canonical 结果批次可能仍待 commit。","visible":"完成已获证明时，取消操作不一定产生 Cancelled 结果。","evidence":["tool-evidence"]},{"id":"tool-known-batch","title":"将同批结果一起 commit","actor":"Agent Loop + ConversationStore","active":["agent","durable"],"description":"准备完整结果组，并在一个事务中按 canonical 调用顺序追加所有同批 Tool 消息/事件。","durable":"持久批次失败则不写入任何结果。成功时确立的 canonical 结果与物理完成顺序无关。","visible":"只有已 commit 的类型化 Tool 事实才能授权持久对话记录/交付展示。","evidence":["tool-batch","tool-acceptance","delivery-commit"]},{"id":"tool-known-recovery","title":"只修复缺失部分","actor":"runtime 恢复","active":["runtime","durable"],"description":"持久的已知结果证据可以补齐缺失结果。若 canonical 结果已经存在，它就是权威终值。","durable":"不会发生恢复覆盖或结果不明的重放。Session 共享工作区中已完成的副作用不会回滚。","visible":"恢复解释现有事实，不会虚构第二次调用。","evidence":["tool-recovery","agents-workspace","workflow-workspace"]}]}]}],"topics":[{"id":"direction","title":"依赖指向 runtime 契约","summary":"图中区分调用、数据流与代码依赖。箭头不表示外部 SDK 拥有内核职责。","details":["crate 分别公开 agent、runtime、model、context、tools、durable、publication、local_runtime、app_server 与 runtime_client 模块。外部 SDK 类型止于适配器。","ConversationRuntime 协调一个 Conversation。AgentExecution 协调一个 Attempt。ModelAdapter 与 ToolExecutor 是与提供方无关的边界；SQLite 与传输实现外层能力。","从持久事实指向 Context 编译器的数据箭头表示输入来源，并非数据库框架到 Agent 内核的依赖。调用共享 Tool Plane 可以到达 MCP 或 Python 实现，而无需向内核暴露其传输协议。"],"nodes":["agent","model","tools","durable","app-server","runtime"],"evidence":["layering","model-contract","tool-contract","runtime-ownership","inward-contracts"]},{"id":"resources","title":"配置、Skills 与选定需求的激活","summary":"定义、可见性、admission 与物理准备是不同阶段。","details":["SessionPersistentState 保存显式 cwd 与可选的完整模型选择。冷加载时，原生责任方重新解析当前提供方定义、凭据、策略、profile、Skills 与资源；有效状态不是持久化的 Session 权威状态。","校验之前，Workspace 资源会整体遮蔽 User 定义。无效的上层定义绝不回退到下层有效资源。选择无效资源会使类型化操作失败；未使用的无效资源只产生有界诊断。","发现 .agents/mcp.toml 中的 MCP 定义与 .agents/tools 下的 Python 包字节时，不会激活它们。选择产生有限且经过 admission 的需求；随后由现有生命周期解析凭据、连接或准备、校验并暴露精确能力。仅将 Agent 加入允许列表不会准备该子 Agent 的来源。","Managed Python 准备冻结的包字节与隔离的 uv 环境，生成 McpServerBinding，随后使用通用 MCP 机制。它不是第二套 runtime 协议。","Skills 是渐进式披露的指令包。选择控制 prompt 可见性，不控制文件系统访问。正文/支持文件通过普通 Tool 读取；子 Agent 的 admission 携带已捕获的包，而不重新发现当前文件。"],"nodes":["config","sessions","tools","subagents","context"],"evidence":["session-config","resources","source-demand","python-mcp","skills-contract"]},{"id":"children","title":"Subagents：冻结权限、独立历史、共享文件","summary":"受管理的子 Agent 拥有自己的 Conversation 与 activation 生命周期，文件副作用则发生在同一 Session 工作区。","details":["Root 的显式命名 Agent 允许列表授权委派。命名 profile 拥有完整的受支持能力，不存在通用 Root Tool/Plugin 上限。若子 Agent 省略模型选择，admission 会继承调用方 Attempt 冻结的有效模型。","DurableAgentAuthority 在创建时冻结解析后的模型、Tools、Skills、Plugins、资源、策略与工作区。ActivationAdmission 提供新的任务/Context 和来源信息；后续 activation 不会查找不同的 profile。","interrupt_agent 针对预留/当前 activation，并等待物理 settlement。wait_agent 捕获一个 activation；后续 activation 不能重新指定该等待的目标。send_message 只有在子 Agent 输入被 canonical 接受后才成功；确认丢失意味着显式的交付未知，不构成重试许可。","每次 Agent activation 都使用 Session 冻结的绝对工作区绑定。它能看到父 Agent 未 commit 的改动。成功、失败与取消都保留已完成的写入；不存在 Agent worktree、复制、交接或销毁操作。","子 Conversation 的 canonical 历史仍由子方管理。Workflow 管理的有限子运行归具体 Workflow 节点所有，不能通过普通持久 Agent 控制恢复。"],"nodes":["subagents","tools","runtime","durable","config"],"evidence":["resources","agents-authority","agent-controls","agents-workspace"]},{"id":"workflow","title":"Workflow 执行有限的作用域程序","summary":"WorkflowRuntime 负责图/值/作用域的推进，并共享原生执行与 settlement 机制。","details":["被选中的 Workflow 是一个前台 Tool。静态 admission 冻结所需能力；block 不会重新发现它们。封闭的节点词汇为 Agent、Tool、Branch、Parallel、Review、Loop 与 Return。","WorkflowRuntime::execute_block 是 root/branch/body 共用的生命周期入口。WorkflowRunId、WorkflowBlockInstance 与 WorkflowNodeInstance 标识实际调用，不从自然语言、PID 或完成顺序推导身份。","原生 Workflow Tool 节点具有 Workflow 调用身份，绝不伪造 canonical 模型 ToolCall。共享的 ForegroundInvocation 负责归一化/批准/期限/取消/物理 settlement；只有 Agent 执行负责外层 canonical 调用槽位与有序结果批次。","Parallel join 在分支完成 settlement 后按定义顺序报告带键结果；这不承诺进程时序确定。所有 Agent 与 Tool 节点都使用 Session 共享工作区。并发写入由作者负责；Review 拒绝、检查失败或取消都不会回滚副作用。","Workflow 完成不意味着 Goal 完成。恢复会创建全新的原生 Attempt 身份，而不恢复旧 Workflow 运行。"],"nodes":["workflows","tools","subagents","agent","extensions"],"evidence":["workflow-program","workflow-owner","workflow-workspace","agent-owns","native-invocation"]},{"id":"goal","title":"Goal 与扩展保留原生领域职责","summary":"封闭组合模型通过现有契约添加能力，不引入第二套 Agent 引擎。","details":["agent_status、todo 与 goal 默认关闭。一个配置 generation 冻结组合，已 admission 的工作保留其 generation。Todo 列表与 Goal 状态仍属于 Conversation 领域状态；子作用域拒绝仅限 Root 的 Goal 追求。","GoalPhase::Active 是持久授权：当 runtime admission 满足条件时继续执行。Paused 与 Blocked 移除此授权；Complete 是终态。投影出的生命周期视图绝不能覆盖 Goal 领域状态。","GoalRoundDriver 在协调器现有的安全空闲边界同步参与，并提交普通 Pending Inbound。同一个 SQLite 事务接受该轮次、推进 Goal 修订/已消耗轮次，并写入有界 admission 事实。","Runtime drain 不会将 Active 改写为 Paused，也不退还已 commit 轮次。显式中断自主运行中的 Goal Attempt 时，会先持久化暂停 Goal 并请求取消，再确认成功。","Goal 不负责模型执行、Tool 执行、canonical 历史、请求组装或第二条队列。Workflow 有限执行 HOW；Goal 负责持续追求 WHAT。"],"nodes":["extensions","runtime","durable","context","workflows"],"evidence":["config-selection","extensions-code","goal-authority","goal-runtime","extensions-owner","workflow-program"]},{"id":"history","title":"canonical 历史、请求快照、Journal 与 Trace","summary":"不同视图分别回答发生了什么、模型看到了什么、发布了什么，以及客户端当前显示什么。","details":["不可变 Message Ledger 负责已 commit 的 Conversation 事实。类型化 Checkpoint 与激活坐标选择历史模型 Context，不修改这些事实。Original 引用保留 canonical 身份 / digest；Derived Context 具有作用域内来源信息，但没有 canonical MessageId。","RequestSnapshot 为一个实际已启动请求冻结精确的、与提供方无关的输入，包括不可变依赖、Derived 正文、Context、Tool 关联与调用。重建执行按键历史读取，不重新运行发现、贡献者、图片选择或 compaction。","Event Journal 事实描述实际执行。projection 中的调用/结果不产生 usage、时长或执行次数。原生 Tool 的 Prepared/Started/Progress/Completed 观测既不是权限 gate，也不是另一结果权威来源；持久交互批准仍有自己显式的 gate。","RuntimeClientProjection 负责唯一的实时读取模型、游标/重放与订阅者状态折叠。它的缓存和 TraceProjection 都是只读展示，绝不是执行、取消、settlement 或恢复的输入。","导览的请求导览与执行顺序都是确定性教学场景，并非记录下来的实时运行轨迹。下方源码摘录将契约固定到一个不可变的仓库 commit。"],"nodes":["durable","context","agent","projection","publication"],"evidence":["canonical-history","context-typed","frozen-input","tool-evidence","client-owners","trace-owner","native-invocation"]},{"id":"publication-delivery","title":"Publication 与文件交付具有不同的 commit 边界","summary":"流式发布、canonical 接受与已 commit 的文件声明不可混淆。","details":["模型输出先合并、持久化暂存，然后才发布。提供方结果 P、Publication 终态 U 与 canonical 接受 C 彼此独立，顺序保持 P \u003c U \u003c C。不完整或未接受的流不属于 canonical Assistant 历史。","PublicationAudit 记录已 commit、可能发布的输出。它是可能出现内容的上界，绝不证明客户端已看到；runtime 没有面向用户的 ACK 契约。","present 是普通原生 Tool。成功 commit 的类型化 Tool 交付授权对话记录卡片。写入、执行完成观测或声称文件存在的文字都不是交付权威依据。","受管理的 ArtifactId 标识不可变 ArtifactStore 字节。SessionFileReference 标识原始 Conversation/cwd 身份与可变文件的规范化路径。重新打开时可能看到变化，或显式的 Missing/Unauthorized/Unavailable 结果；它不是内容快照。","已 commit 交付的访问由 app_server::delivery_access 负责。经过传输身份验证的调用方获取权限；精确的 attachment/请求/Publication 检查约束响应发布。客户端消费类型化事实，并负责本地预览展示。"],"nodes":["publication","agent","durable","tools","app-server","clients"],"evidence":["publication-contract","publication-outcomes","delivery-commit","delivery-access"]},{"id":"lifetimes-security","title":"Session、驻留、连接与安全边界","summary":"区分持久身份、活跃写入者归属、attachment 路由与宿主隔离。","details":["外部管理的部署中，一个已认证用户对应一个 App Server 进程/配置环境/持久根目录。更上层宿主负责用户路由、身份验证、工作区分配/隔离、环境注入与重启策略。","Session cwd 是执行与配置解析的上下文，不是文件系统沙箱。原生文件 Tool 可以接受普通宿主绝对路径。进程内单写入者管理不是多进程租户/租约设计。","SessionRuntimeManager 对加载/卸载实施 single-flight，并保留驻留组合。v1 中，一个 Session 只有一个驻留节点；不同 Session 可以同时驻留。弱引用 ManagedRuntimeClient 句柄不能让已卸载组合继续存活。","断开连接/EOF 与显式 detach 释放外部 attachment，不取消 Attempt，也不对交互进行 settlement。本地 TUI 正常退出会显式请求关闭自有子进程。外部管理的服务器支持在客户端断开后继续执行。","只有 shutdown 证明原生 quiescence 后，卸载才成功。失败时保留 Unloading 与精确诊断，不发布新的写入者。成功卸载保留持久数据，并使旧句柄成为 StaleIncarnation。","WebSocket admission 在构建连接前使用专用传输 token。可选的交付访问具有独立的传输授予权限。initialize 是协议协商，不是服务器内部的身份验证或租户边界。"],"nodes":["clients","app-server","sessions","runtime","tools","projection"],"evidence":["topology","tool-contract","session-residency","residency-load","residency-unload","connection-detach","transport-security"]}],"evidence":[{"id":"layering","path":"src/lib.rs","start":1,"end":27,"label":"Runtime 契约与 SDK 边界","text":"//! rustX runtime library.\n//!\n//! The crate is intentionally layered around runtime-owned contracts. External\n//! SDK types must terminate at adapter boundaries and must not leak into the\n//! agent kernel.\n\npub mod agent;\npub mod app_server;\nmod bounded_file;\npub mod capabilities;\npub mod context;\npub mod conversation;\npub mod durable;\npub mod events;\npub mod extensions;\npub mod goal;\npub mod local_runtime;\npub mod message;\npub mod model;\npub mod protocol;\npub mod publication;\npub mod runtime;\npub mod runtime_client;\npub mod session_archive;\npub mod skills;\npub mod toml_authoring;\npub mod tools;","url":"https://github.com/Caismis/rustX/blob/8cb41624eb2dc2ca87e4409961f42553ceb029cf/src/lib.rs#L1-L27"},{"id":"topology","path":"docs/architecture.md","start":76,"end":102,"label":"客户端、进程拓扑与独立生命周期","text":"## App Server product topology\n\nIn externally managed deployments, one authenticated user maps to one rustX\nApp Server process, one configuration/source environment and one durable runtime\nroot. A process hosts many durable Sessions and independently loaded runtimes;\nthere is no process-global active Session. The manager admits at most one writable\nlive runtime per Conversation, with one resident node per Session in v1.\n\nThe higher-level host owns authentication, user/process routing, workspace\nallocation/isolation, environment/credential injection and external restart policy.\nThe internal `AppServerHost` owns rustX admission/drain and diagnostics; it is not\nthat higher-level product host. Configuration, catalog, runtime, interaction and\nprojection owners retain their native authority after commit.\n\n```text\nlocal TUI   -\u003e stdio JSONL -\u003e TUI-owned App Server child\nWeb Console -\u003e WebSocket  -\u003e externally managed App Server\nremote TUI  -\u003e WebSocket  -\u003e the same externally managed App Server\n                            one semantic protocol, many Sessions\n```\n\nConnection lifetime, runtime residency, durable Session lifetime and process\nlifetime are independent. Network disconnect is detach. Normal local TUI exit\nexplicitly requests owned-child drain; persistent work across client exit uses an\nexternal server. Session cwd is execution/config-resolution context, not a\nfilesystem sandbox. See [protocol and ownership](app-server-protocol.md) and the\n[composition evidence and developer flows](app-server-acceptance.md).","url":"https://github.com/Caismis/rustX/blob/8cb41624eb2dc2ca87e4409961f42553ceb029cf/docs/architecture.md#L76-L102"},{"id":"app-boundary","path":"src/app_server/mod.rs","start":1,"end":19,"label":"与传输无关的 App Server 模块","text":"//! Transport-neutral App Server connection and versioned JSON-RPC contract.\n\npub mod connection;\npub mod protocol;\npub mod schema;\npub mod session_deletion;\nmod wire;\n\npub mod process;\npub mod transport;\n\npub mod host;\n\npub mod archive_download;\n\npub(crate) mod delivery_access;\npub(crate) mod product_host;\n\npub mod upload_transfer;","url":"https://github.com/Caismis/rustX/blob/8cb41624eb2dc2ca87e4409961f42553ceb029cf/src/app_server/mod.rs#L1-L19"},{"id":"composition","path":"src/local_runtime/mod.rs","start":1,"end":24,"label":"共享的本地配置与组合责任方","text":"//! Shared local configuration, durable Session, and runtime owners.\n//!\n//! `rustx app-server` composes these owners through [`crate::app_server`],\n//! the only external product control protocol:\n//!\n//! - [`config`] — the bounded explicit current runtime/project configuration;\n//! - [`composition`] — the one Rust-side composition owner;\n//! - [`session_controller`] / [`session_runtime_manager`] — durable Session\n//!   authority and process-local runtime residency;\n//! - [`cli`] — the bounded public argument contract;\n//! - [`process`] — the single process entry and its stream ownership.\n//!\n//! # Process output contract\n//!\n//! Help and argument diagnostics go to stderr before any effect; a bare\n//! `rustx` prints help. App Server stdout is protocol-only. Configuration\n//! subcommands own stdout for their bounded human/JSON results and never\n//! create a runtime.\n//!\n//! The internal `rustx --subagent-child` mode ([`subagent_child`]) is an\n//! independent transport: fd 0 is the reliable subagent control IPC and\n//! fd 1/stdout is the protocol-owned framed Activity observation IPC\n//! (Issue #178), not human-readable output. Its read-only live inspection\n//! endpoint (`live_inspection`) is child-local routing state.","url":"https://github.com/Caismis/rustX/blob/8cb41624eb2dc2ca87e4409961f42553ceb029cf/src/local_runtime/mod.rs#L1-L24"},{"id":"session-identity","path":"docs/durable-sessions.md","start":1,"end":23,"label":"Session 图与目录权威来源","text":"# Durable Sessions, runtime residency, and client focus\n\nOne user runtime root has one native `ProductController` and one\n`SessionController`. Opening that controller creates no Session, selects no\nSession, resolves no configuration, and starts no runtime. A Session remains a\ngraph: `Session -\u003e SessionNode -\u003e Conversation`. Each node has its own linear\nConversation identity, canonical history and retained Surface operations.\n\nThe catalog owns identity, name, timestamps, graph, Session-local `active_node`\n(the default node inside that graph), explicit settings, settings revision,\nlineage origins, and pending deletion authority. This node pointer does not\nidentify a globally open Session. The catalog also owns the bounded derived\ndisplay projection (`display_preview`). The projection is display metadata,\nnot canonical history: canonical history is never reconstructed from it, and\nthe catalog never re-derives it while listing. It reaches the catalog through\nexactly three seams — the one-shot publisher armed on the root runtime, which\ncommits it after the first canonical root-lineage ordinary user commit; the\nfrozen-seed derivation carried into a clone/fork visibility commit; and the\nexplicit, idempotent repair seam run at reopen/compose/recovery, which\nderives the line from the root conversation store and never manufactures a\nsubject from a later message. Preview publication is a metadata-only commit:\nit never touches `updated_at`, and the catalog generation moves only when a\nreal change commits (an already-present projection commits nothing).","url":"https://github.com/Caismis/rustX/blob/8cb41624eb2dc2ca87e4409961f42553ceb029cf/docs/durable-sessions.md#L1-L23"},{"id":"session-residency","path":"docs/durable-sessions.md","start":44,"end":76,"label":"显式 Session 控制、驻留与客户端焦点","text":"`read_session`, `rename_session`, `tree`, `fork_session`, `read_settings`,\n`replace_settings`, `acquire_session`, and deletion all address explicit\nidentities. Creation always allocates an independent Session. Lists include\nunused Sessions and have no global active marker. The monotonic accepted-inbound\nusage classifier remains available by identity; it no longer controls creation\nor catalog visibility.\n\nRuntime residency is a separate lifetime. `SessionRuntimeManager` owns single-flight\nload/unload, multiple resident runtimes, and one writable live incarnation per\nConversation. In v1, one Session may have only one resident Conversation/node;\ndifferent Sessions remain concurrent. Successful unload releases composition and\nallocation even when stale client handles remain. See [runtime residency](runtime-residency.md) for synchronization and\nclient lifetime contracts.\n`SessionAccess` provides the Session snapshot, selected node, explicit settings\nand revision, plus retained Conversation allocation access. Different\nConversations can hold these accesses concurrently. Allocation access is\nnecessary destructive exclusion, not a replacement for the manager's single-writer\nruntime admission.\n\nClient focus is routing/UI state. Ordinary local TUI switching uses the same\nApp Server child and changes only the focused attachment. Remote TUI and Web\nConsole use WebSocket to an externally managed process. A focus change never\nquiesces another Session, unloads its runtime, or replaces the process.\n\nAn explicit node route does not change catalog bytes, generation, timestamps,\nor the Session graph default. Only an explicit graph operation changes the\nSession-local default node. Changing the loaded node uses confirmed, targeted\nunload/cold attachment; other Sessions remain independent. The CLI cold-resume\npath also requires an explicit Session identity, with an optional node.\n\nSession identifiers are scoped to their product root. Two independent users'\nprocesses can allocate the same identifier spelling; routing to the right user\nprocess is the higher-level host's responsibility, never an in-server tenant key.","url":"https://github.com/Caismis/rustX/blob/8cb41624eb2dc2ca87e4409961f42553ceb029cf/docs/durable-sessions.md#L44-L76"},{"id":"session-config","path":"docs/durable-sessions.md","start":79,"end":106,"label":"持久化选择与解析后的有效配置","text":"## Persisted configuration classification\n\n`SessionPersistentState` is explicit input, not effective configuration:\n\n| Persisted field | Reason |\n| --- | --- |\n| `cwd` | Absolute execution and project-resolution context; never ambient process cwd or an OS sandbox. |\n| `model: Option\u003cSessionModelConfig\u003e` | Intentional whole-model selection: model reference, Model Profile, request parameters, output cap and summary policy. `None` uses current source defaults. |\n\nThe bound User `rustx.toml`, HOME, fixed User resource root and runtime root\nare process bindings. Provider credentials belong to their complete winning\nProvider definition. Agent profiles, user policy, model/provider catalogs,\nMCP and Python definitions, Skill content, defaults, instructions and resource\ncatalogs remain current source content. Registries, connections, credentials,\nresource generations, provenance, prospective/admitted effective configuration,\nand execution state are never persisted as Session authority.\n\nCold load acquires the native `ProductController` before opening the authoritative\ncatalog and reading persisted settings. That owner remains retained through\nresolution, admission and composition, excluding competing settings publishers.\nThe complete settings value and revision come from this one catalog snapshot;\nno catalog mutex spans resolution or runtime composition. Cold load reconstructs\n`SessionConfigInput` and uses the CFG3\n`UserConfigManager::resolve_session` and admission. No second resolver exists.\nCurrent authorization and availability are checked again. Missing explicit\nmodels/resources and invalid selections fail through existing typed resolution\nor admission outcomes; an old selection never grants authority or triggers a\nfallback to a different model or broader selection.","url":"https://github.com/Caismis/rustX/blob/8cb41624eb2dc2ca87e4409961f42553ceb029cf/docs/durable-sessions.md#L79-L106"},{"id":"runtime-ownership","path":"src/runtime/conversation_runtime.rs","start":1,"end":35,"label":"ConversationRuntime 负责语义协调","text":"//! The conversation runtime coordinator (Issue #61): the semantic owner of\n//! conversation coordination for one conversation.\n//!\n//! [`ConversationRuntime`] owns the semantic conversation/runtime state that\n//! used to live inside the old Runtime Client host:\n//!\n//! ```text\n//! conversation identity / agent identity\n//! authoritative mutable session model state\n//! between-attempt bounded ConversationState hot read model\n//! ConversationStore and its RequestHistory durable read handle\n//! attempt-id allocation\n//! the current-attempt slot and its cancellation handle\n//! attempt admission (the ONE admission owner)\n//! current model request timeout execution policy and monotonic clock\n//! ordinary inbound acceptance/admission coordination\n//! the ConversationInboundMailbox active-process relationship\n//! ConversationToolRuntime / ConversationBackgroundRegistry\n//! CapabilityCoordinator\n//! context/request assembly dependencies (policy, estimator, Agent Status engine)\n//! the lifecycle/drain authority\n//! attempt settlement handoff back into conversation state\n//! ```\n//!\n//! The Runtime Client (see `crate::runtime_client`) is a projection + control\n//! + attachment adapter over this coordinator. It observes runtime\n//! observations and forwards control requests; it never owns the semantic\n//! state above.\n//!\n//! # The one admission owner\n//!\n//! Any producer may publish ordinary inbound work through the conversation\n//! inbound boundary (the [`ConversationInboundMailbox`](crate::runtime::inbound::ConversationInboundMailbox)\n//! of the owned tool runtime). Only [`ConversationRuntime`] admits the next\n//! [`AgentExecution`](crate::agent::AgentExecution):","url":"https://github.com/Caismis/rustX/blob/8cb41624eb2dc2ca87e4409961f42553ceb029cf/src/runtime/conversation_runtime.rs#L1-L35"},{"id":"runtime-admission","path":"src/runtime/conversation_runtime.rs","start":48,"end":74,"label":"一个 admission 锁与一个活跃 Attempt","text":"//! ```\n//!\n//! A producer never starts an attempt itself: the coordinator worker is the\n//! single admission trigger for enqueue-driven admission, and the\n//! coordinator's own settlement handoff is the second (internal) trigger.\n//! Both run the same [`admit_next_attempt`](ConversationRuntime) linearization.\n//!\n//! # Admission linearization\n//!\n//! All of the following share the one coordinator state lock:\n//!\n//! ```text\n//! idle observation (no current attempt, gate open)\n//! finite inbound selection (one watermark-bounded mailbox drain)\n//! canonical commit of the drained inbound\n//! attempt-id allocation\n//! model snapshot freeze (SessionModelState::snapshot)\n//! current-attempt publication\n//! ```\n//!\n//! There is therefore at most one active [`AgentExecution`] per\n//! conversation, one finite inbound batch is admitted exactly once (either\n//! consumed by the active attempt at its safe boundary, or used to create\n//! the next attempt after settlement — never both), and a session model\n//! update linearizes either before an admission (observed by that attempt)\n//! or after it (affects only future attempts). See the deterministic race\n//! regressions in the test module.","url":"https://github.com/Caismis/rustX/blob/8cb41624eb2dc2ca87e4409961f42553ceb029cf/src/runtime/conversation_runtime.rs#L48-L74"},{"id":"runtime-drain","path":"src/runtime/conversation_runtime.rs","start":76,"end":111,"label":"Drain、settlement 与经过证明的 quiescence","text":"//! # Lifecycle: activation, drain, and quiescence\n//!\n//! The runtime has one authoritative lifecycle, shared with every\n//! conversation-owned semantic boundary:\n//!\n//! ```text\n//! ConversationRuntime::new(..)          -\u003e Inactive\n//!     [optional] pre-activation MCP settlement failure -\u003e Draining\n//!     [optional] RuntimeClientHost::new(..)   binds the client adapter\n//! ConversationRuntime::activate()       -\u003e Running\n//! ConversationRuntime::shutdown()       -\u003e Draining, then awaits Quiescent\n//! ```\n//!\n//! `Running -\u003e Draining` is the exact drain linearization point. It is\n//! performed under the coordinator lock that also serializes inbound\n//! acceptance, model updates, and attempt admission. Background ownership and\n//! capability revision commits use the same lifecycle at their native\n//! synchronization boundaries. After the transition, no new semantic work\n//! may begin; already-owned work retains only its typed settlement path.\n//!\n//! Cancellation requested, operation settled, and runtime quiescent are\n//! different facts. A cancellation signal, a dropped waiter, an OS signal,\n//! or an empty registry is not settlement. Quiescence is published only\n//! after the current Agent Execution **and its attempt task**, foreground\n//! tools, conversation-owned background terminal publication, counted\n//! capability/environment preparation (including in-flight MCP connection\n//! owners), retained MCP process closure, owned process terminality, and\n//! the admission worker's exit boundary have all settled.\n//!\n//! Drain is a supervisor, not a short-circuiting pipeline: it closes\n//! admission, requests cancellation/closure of every concrete owner,\n//! supervises each owner to its own native terminal boundary, and only then\n//! decides between `Quiescent` and one aggregated settlement failure. A\n//! failure in one participant is evidence, never permission to abandon a\n//! sibling that can still act.\n//!","url":"https://github.com/Caismis/rustX/blob/8cb41624eb2dc2ca87e4409961f42553ceb029cf/src/runtime/conversation_runtime.rs#L76-L111"},{"id":"residency-load","path":"docs/runtime-residency.md","start":93,"end":116,"label":"Single-flight 冷组合与激活前的 projection 绑定","text":"## Load\n\n1. `SessionController::resolve_session_target` reads the durable Session/node and\n   Conversation identity without `ConversationAccess`. No managed allocation\n   authority exists before the registry claim.\n2. Under the registry mutex, the manager checks the Session fence and installs\n   `by_session` plus `Loading(flight)` atomically. Only that flight's owner may\n   call `acquire_session` for the exact resolved node, obtaining current persisted\n   settings and native allocation access. Other callers join without acquiring\n   redundant allocation handles. Deletion can identify every blocking managed\n   acquisition, including one parked before storage acquisition.\n3. The manager resolves current sources using `UserConfigManager`, converts the\n   acquired persisted selections to `SessionConfigInput`, and performs ordinary\n   trust/credential admission. Effective configuration is never durable authority.\n4. Native composition and durable recovery run with the allocation retained.\n   The existing `RuntimeClientHost` binds while the runtime remains inert.\n5. The flight owner installs a fresh `RuntimeIncarnationId` and its inert\n   composition, then calls the infallible native activation boundary outside the\n   registry mutex. Activation may synchronously admit recovered SQLite work.\n   The slot remains Loading and other callers join the flight until the manager\n   publishes Loaded and the shared ready result, with no intervening await.\n\nA warm load returns the existing incarnation. It does not resolve files, restart,\nmutate composition, or transfer residency ownership to its caller. Existing safe","url":"https://github.com/Caismis/rustX/blob/8cb41624eb2dc2ca87e4409961f42553ceb029cf/docs/runtime-residency.md#L93-L116"},{"id":"residency-unload","path":"docs/runtime-residency.md","start":132,"end":164,"label":"卸载要求 shutdown 成功，并证明已无写入者","text":"## Unload and replacement\n\nInstalling `Unloading` wins residency exclusion. It does not compete with the\nruntime's execution gate. `ConversationRuntime::shutdown` takes the existing\ncoordinator lock and commits `Running -\u003e Draining`; inbound acceptance uses that\nsame lock. Acceptance either wins first and is settled by the runtime, or sees\nthe closed gate and commits nothing. The manager adds no execution gate.\n\nUnload commits only after native shutdown returns success and proves quiescence.\nThe manager releases its host/core and retained allocation, removes the entry\nand its Session claim, and publishes success. Durable Session and Conversation\ndata remains. A later load performs ordinary cold recovery. Previously issued\nclient/identity handles remain values, but are non-owning and fail explicitly with\n`StaleIncarnation`. They cannot keep the runtime or allocation alive, prevent\nnative deletion, or reopen residency. No owning runtime/endpoint API escapes the\nmanager. Narrow test-only inspection clones are used solely for native gate tests.\n\nA shutdown failure leaves `Unloading` with the old composition and its exact\nterminal diagnostic. Load, unload and replacement observers receive that failure;\nthe manager cannot claim successful unload or publish a new writer without proven\nquiescence. This is an isolated Conversation failure, not a poisoned manager.\n\nA load racing unload joins the unload flight, then retries cold load after success.\nFlight terminals explicitly distinguish `Resident`, `WriterAbsent(operation_result)`\nand `RetirementUnproven(error)`. Deletion requires absence proof, not operation\nsuccess: an acquisition/composition error after proven retirement does not poison\ndelete. Native shutdown/projection uncertainty retains the unproven writer and fence.\nAn unload racing load waits for the load result and then drains that incarnation.\nAn unload racing replacement waits for replacement and drains its resulting\nincarnation. Concurrent explicit replacements serialize: each explicit replacement\nmust cross its own quiescence boundary; ordinary load only reuses or waits.\n\nReplacement retains allocation through old shutdown. Successful native quiescence","url":"https://github.com/Caismis/rustX/blob/8cb41624eb2dc2ca87e4409961f42553ceb029cf/docs/runtime-residency.md#L132-L164"},{"id":"client-authority","path":"src/runtime_client/mod.rs","start":1,"end":33,"label":"基于 runtime 权威事实的 projection，支持零 attachment","text":"//! Runtime Client projection/control owners reused by the App Server boundary.\n//! The only external product control protocol is [`crate::app_server`]. The\n//! Runtime Client envelopes are internal: a host's typed request surface and\n//! the read-only child live inspection socket.\n//!\n//! # Architecture\n//!\n//! ```text\n//! ConversationRuntime semantic facts/observations (Issue #61)\n//!                 |\n//!                 v\n//!  deterministic Runtime Client projection\n//!                 |\n//!                 v\n//!  RuntimeClientEvent / RuntimeClientSnapshot\n//!                 |\n//!                 v\n//!       App Server protocol (client-neutral generated schemas)\n//! ```\n//!\n//! The governing invariant:\n//!\n//! \u003e All authoritative execution and conversation state originates from\n//! \u003e rustX Runtime. External clients observe projections of that state;\n//! \u003e they never become a second authority.\n//!\n//! Issue #61 extracted the conversation runtime coordinator\n//! ([`ConversationRuntime`](crate::runtime::conversation_runtime::ConversationRuntime))\n//! from this boundary: the coordinator owns conversation execution/admission\n//! authority, and [`RuntimeClientHost`](host::RuntimeClientHost) is the\n//! projection + control + attachment adapter over it. A conversation runs\n//! the exact same admission/execution path with zero Runtime Client\n//! attachments.","url":"https://github.com/Caismis/rustX/blob/8cb41624eb2dc2ca87e4409961f42553ceb029cf/src/runtime_client/mod.rs#L1-L33"},{"id":"client-owners","path":"src/runtime_client/mod.rs","start":48,"end":90,"label":"Projection、重放、控制与 attachment 的归属","text":"//!\n//! - [`RuntimeClientEndpoint`](endpoint::RuntimeClientEndpoint) is the\n//!   semantic protocol entry point: it dispatches every Runtime Client request,\n//!   `initialize` included, so a transport stays a framing adapter and\n//!   never owns negotiation or attachment admission.\n//! - [`RuntimeClientHost`](host::RuntimeClientHost) is the projection +\n//!   control + attachment adapter over the conversation runtime: it owns\n//!   the projection (snapshot read model, cursor allocation, bounded\n//!   replay, subscribers), one control attachment plus read-only\n//!   observation attachments, and\n//!   protocol adaptation. `AgentExecution` remains the attempt settlement\n//!   authority and the conversation runtime remains the admission owner.\n//! - [`RuntimeClientProjection`](projection::RuntimeClientProjection) is\n//!   the one linearization owner of the externally visible read model,\n//!   cursor allocation, event publication, bounded replay, and\n//!   subscribers.\n//! - The canonical mailbox, background registry, and capability\n//!   coordinator remain authoritative; the projection observes them\n//!   through narrow read-only seams.\n//! - `SessionController` owns durable Session/catalog control; `SessionRuntimeManager`\n//!   owns residency, composition and configuration adoption. App Server addresses\n//!   those owners directly; Runtime Client has no Session control surface.\n//! - Native Approval interactions are another runtime-owned observation:\n//!   `InteractionCoordinator` owns the pending rendezvous and this boundary\n//!   carries only typed request/response/projection facts. A client cannot\n//!   rewrite a prepared tool invocation, and detach never settles a pending\n//!   interaction.\n//! - Agent Status is composed exactly once per request preparation; the\n//!   model path and the client projection consume the same composed\n//!   observation.\n//!\n//! # Protocol scope\n//!\n//! - one control attachment per live runtime instance, plus explicitly\n//!   read-only observation attachments;\n//! - detach is never cancellation;\n//! - interaction availability follows runtime binding, not client presence;\n//! - live pending interactions are reconstructed from the snapshot/cursor\n//!   projection, never from TUI state or recovery logs;\n//! - bounded in-memory projection replay (the durable Event Journal and\n//!   current Surface bootstrap remain `ConversationStore` authorities; the\n//!   client cursor/cache is never recovery input);\n//! - no App Server stdio/WebSocket bindings (Issue #36), no TUI (Issue #39), no M9 cancellation","url":"https://github.com/Caismis/rustX/blob/8cb41624eb2dc2ca87e4409961f42553ceb029cf/src/runtime_client/mod.rs#L48-L90"},{"id":"canonical-history","path":"src/conversation/mod.rs","start":1,"end":11,"label":"不可变 Ledger、projection Checkpoint 与热状态","text":"//! Immutable canonical conversation facts and their bounded hot working set.\n//!\n//! The Message Ledger owns committed messages. Surface bookkeeping records only\n//! ordinary canonical appends; it does not select compacted model history.\n//! Durable typed Projection Checkpoints and their activation timeline own\n//! historical inclusion and ordering. The Context Engine compiles a checkpoint\n//! plus eligible Tail, while the Agent Loop adds and freezes current core input.\n//!\n//! There is one mutable hot `ConversationState`: the coordinator owns it between\n//! attempts and `AgentExecution` owns it while running. It caches retained Original\n//! facts, never gives Derived projected content a canonical `MessageId`.","url":"https://github.com/Caismis/rustX/blob/8cb41624eb2dc2ca87e4409961f42553ceb029cf/src/conversation/mod.rs#L1-L11"},{"id":"durable-inbound","path":"src/durable/mod.rs","start":1,"end":26,"label":"独立的输入、canonical 事实、Journal 与 Publication 领域","text":"//! The native durable conversation authority (Issue #11).\n//!\n//! This module exposes one backend-independent semantic store for the six\n//! distinct durable domains. Pending Inbound remains its own authority for\n//! accepted-but-not-yet-canonically-adopted work:\n//!\n//! ```text\n//! Pending Inbound Inbox\n//!     owns accepted / not-yet-adopted inbound durability\n//!     owns the one per-conversation InboundSequence allocator\n//!     owns the acceptance linearization point\n//!     participates in the canonical-adoption transaction\n//! ```\n//!\n//! It is **not** the Message Ledger, not the Conversation Surface, not the\n//! Event Journal, not a generic queue framework, and not a second scheduler.\n//! The semantic ownership split is:\n//!\n//! ```text\n//! Pending Inbound Inbox  = accepted / not-yet-adopted inbound durability\n//! ConversationInboundMailbox = process-local coordination / wakeup\n//! Message Ledger         = adopted canonical conversational facts\n//! Conversation Surface   = current model-visible ordering/projection\n//! ConversationRuntime    = admission + safe-boundary adoption owner\n//! Event Journal          = execution facts\n//! Publication plane      = user-facing release durability (Issue #108)","url":"https://github.com/Caismis/rustX/blob/8cb41624eb2dc2ca87e4409961f42553ceb029cf/src/durable/mod.rs#L1-L26"},{"id":"inbound-commit","path":"src/durable/mod.rs","start":49,"end":67,"label":"接受与 canonical 采纳事务","text":"//! the same observable contract. The abstraction level is deliberately the\n//! rustX domain transitions — never a generic repository/queue/CRUD frame.\n//!\n//! # Pending inbound linearization points\n//!\n//! 1. **Acceptance**: [`ConversationStore::accept_inbound`] commits the sequence\n//!    allocation, the pending record, and any correlation/idempotency state\n//!    in one transaction. Success is reported only after that commit.\n//! 2. **Adoption**: [`ConversationStore::adopt_pending_batch`] atomically\n//!    reads current rows through the watermark, appends them to the canonical\n//!    Ledger/Surface, constructs their exact answer obligation, and removes\n//!    pending records. Its committed receipt is the only post-claim payload.\n//! 3. **Mutation**: exact pending edit/remove compare occurrence and revision\n//!    inside a durable transaction ordered against adoption. Removal also\n//!    retires the pending transcript reference; canonical history is immutable.\n//!\n//! The publication plane adds its own three (Issue #108): the provider outcome\n//! **P**, the publication terminal **U**\n//! ([`ConversationStore::commit_publication_terminal`]), and canonical","url":"https://github.com/Caismis/rustX/blob/8cb41624eb2dc2ca87e4409961f42553ceb029cf/src/durable/mod.rs#L49-L67"},{"id":"agent-owns","path":"docs/agent-loop.md","start":44,"end":83,"label":"Attempt 循环、Publication 与 Tool 批次的归属","text":"## 1. What the Agent Loop owns\n\nWF-02 extracts caller-independent foreground invocation into\n`tools::invocation`. The Agent Loop retains accepted Assistant ToolCalls, call\nslots, outer sibling ordering, atomic ToolResult batch commit and canonical\nhistory. WorkflowRuntime owns graph progression, concrete node identity, typed\nbindings, validated local values and scope settlement. Both use the same native\nnormalization, approval and foreground deadline/cancellation/settlement owner;\nexecutors still own physical execution and evidence. A fixed Tool node has a\nWorkflow invocation identity, never a fabricated model ToolCall. Outer Sequential\nordering holds no capacity token needed by nested leaves; leaf scheduling is\nseparate from canonical sibling ordering. See `docs/workflow-programs.md`.\n\nThe loop (`src/agent`) executes one attempt to its single terminal outcome:\n\n- attempt lifecycle (`AttemptStarted` → one terminal settlement candidate,\n  normally one committed terminal event)\n- turn lifecycle (one model response plus its tool calls and results)\n- provider-independent `ModelStreamItem` consumption and canonical `Event`\n  validation/message assembly\n- the durable publication stream of every model request (Issue #108): opening\n  it, feeding the bounded coalescer, committing frames before releasing them,\n  committing the publication terminal (U) after the provider outcome (P), and\n  settling the stream exactly once as canonical, unaccepted, or incomplete\n- tool resolution and tool execution (in deterministic block order)\n- canonical continuation state retention and propagation\n- safe-boundary inbound mailbox consumption (one finite drain per boundary)\n- the attempt-local post-tool-batch delivery marker: one marker after one\n  complete canonical ToolResult batch, consumed only by the next existing\n  primary step\n- cancellation observation and terminal cancellation outcome\n- the recorded `RuntimeEvent` trace\n- the moved `ConversationState` owned by the attempt while it runs\n- the pending fresh inbound trigger lifecycle (`FreshInboundTurn`), the\n  attempt-local `PostToolBatch` opportunity, and their composition into one\n  native Context Assembly generation\n- the finite `ContributorInputSnapshot` boundary and certified-extension\n  proposal admission\n- the one cancellation-vs-start arbitration point of every model turn\n  (Issue #12, M9b): staging without durable effect, then the fused durable","url":"https://github.com/Caismis/rustX/blob/8cb41624eb2dc2ca87e4409961f42553ceb029cf/docs/agent-loop.md#L44-L83"},{"id":"context-contract","path":"src/context/mod.rs","start":1,"end":12,"label":"历史编译器与动态 Context Assembly","text":"//! The context plane: bounded read-only resources, typed historical projections,\n//! deterministic compilation, token accounting and compaction planning.\n//!\n//! Immutable Canonical History supplies committed facts. Durable checkpoint\n//! activations select Original and Derived context. Compilation includes only\n//! eligible Tail strictly after the checkpoint base. The Agent Loop adds current\n//! core-owned input and freezes exact semantic model requests before dispatch.\n//! Default Summary writes a Derived checkpoint item and never a canonical User.\n//!\n//! Context Assembly remains the sole admission path for dynamic contributors.\n//! `ContextRuntime` bundles the engine, summary service and admitted Agent Status\n//! contributor; execution owns timeout policy, cancellation and monotonic clocks.","url":"https://github.com/Caismis/rustX/blob/8cb41624eb2dc2ca87e4409961f42553ceb029cf/src/context/mod.rs#L1-L12"},{"id":"context-owners","path":"docs/context-engine.md","start":18,"end":36,"label":"Context 职责与有限 canonical 缓存","text":"## Ownership\n\n| Owner | Authority |\n| --- | --- |\n| Canonical History | Real committed User, Assistant and Tool facts, with physical Message and Tool-call occurrence identities |\n| Context Engine | Historical selection compilation, structural/native replay validation, token accounting and compaction planning |\n| CompactionResources | Cut-bounded, read-only canonical/trajectory/lifecycle, Journal, checkpoint, frozen request and settled Artifact access; admitted model budgets and supervised summary capability |\n| Durable Store | Immutable checkpoint bodies, projection activations/head, fencing/CAS, atomic local completion and operation receipts |\n| Agent Loop | Current frozen logical-generation input, cancellation grants, actual starts, independent recovery/retry budgets and tool settlement |\n| Provider adapters | Wire encoding, native reasoning replay and accepted-output continuation rules |\n| Event Journal | Actual execution facts; projected calls/results never become executions |\n| RequestSnapshot | Exact provider-neutral input of one actual started request |\n| Runtime Client and clients | Canonical execution trajectory and separately labelled projected context/request detail |\n\nThe ordinary canonical working-set cache can append real committed identities.\nIt cannot replace a span, create a summary identity, or select historical model\ncontext independently of the checkpoint compiler. Normal head reads resolve\ncheckpoint Original identities and post-base Tail identities within finite\nbounds; they do not replay or hydrate the complete old Ledger.","url":"https://github.com/Caismis/rustX/blob/8cb41624eb2dc2ca87e4409961f42553ceb029cf/docs/context-engine.md#L18-L36"},{"id":"context-cuts","path":"docs/context-engine.md","start":38,"end":54,"label":"Read cut、Checkpoint base、激活与严格的 Tail","text":"## Four different boundaries\n\n1. **Resource Read Cut** freezes source Ledger, Journal, Transcript and projection\n   activation coordinates together. Reads after capture are short-lived and return\n   detached owned values. A completion committed after the Journal cut remains\n   invisible to that operation's lifecycle queries.\n2. **Checkpoint Base Ledger Frontier B** is a complete inclusion/exclusion\n   decision for eligible canonical history through B. Provenance references and\n   the last retained Original do not move this frontier.\n3. **Checkpoint Activation** is a separate monotonic timeline coordinate. Two\n   activations can occur at the same Ledger frontier and remain distinct boundaries.\n4. **Request History Cut** freezes checkpoint identity/activation/base and the\n   request's pre-start Ledger frontier. Default Tail is strictly `(B, request L]`.\n\nA checkpoint at L100 that excludes M96–M100 never revives those messages through\nTail. A later M101 remains eligible. Unrelated Journal appends do not change a\ncandidate's head, immutable dependencies or execution fence.","url":"https://github.com/Caismis/rustX/blob/8cb41624eb2dc2ca87e4409961f42553ceb029cf/docs/context-engine.md#L38-L54"},{"id":"context-typed","path":"docs/context-engine.md","start":56,"end":82,"label":"Original 与 Derived 身份不是执行身份","text":"## Typed checkpoints and occurrence identity\n\nA checkpoint contains ordered Original references and materialized Derived\nmessages. An Original is scoped to a conversation and complete immutable-body\nSHA-256 digest. A Derived has typed User, Assistant or Tool content and scoped\ncanonical/checkpoint provenance, without a canonical MessageId. Text, Reasoning,\nToolCall, ToolResult, Refusal and supported media retain their typed representation.\nEvery historical Derived item must name at least one canonical or parent-checkpoint\nsource. A transformation label alone is not provenance. The compiler enforces this\nuniversal historical rule and scope/self-reference checks; durable authority validates\nimmutable bodies, digests, eligibility and dependency ordering. Parent-only summaries\nare permitted. This rule does not apply to request-only synthetic material.\n\nThese identity domains are distinct:\n\n- Physical canonical ToolCall: accepted Assistant MessageId and canonical block index.\n- Checkpoint occurrence: CheckpointId, item index and projected block index.\n- Actual-request occurrence: new RequestId, item index and request block index.\n- Provider wire correlation: the provider's string label.\n\nRepeated wire strings do not identify one historical execution. The compiler\nvalidates Original/Original, Original/Derived, Derived/Original and Derived/Derived\ncall/result pairs, complete batches, explicit reordered coordinates and physical\nsources. Ambiguous associations, orphan results and split batches fail. Snapshots\nfreeze the resulting actual-request association map, reidentified on a new request.\nNo ToolExecution event, duration, usage or execution statistic comes from a\nprojected call/result.","url":"https://github.com/Caismis/rustX/blob/8cb41624eb2dc2ca87e4409961f42553ceb029cf/docs/context-engine.md#L56-L82"},{"id":"compaction-commit","path":"docs/context-engine.md","start":94,"end":115,"label":"原子 Checkpoint commit、回执与取消授权","text":"## Durable commit and recovery\n\nAllocate CompactionOperationId before its associated Started fact. A candidate\nfingerprint describes checkpoint content; it is separate from an actual semantic\nrequest fingerprint. One immediate transaction validates the expected head,\nexisting execution owner/fence, immutable dependencies and trusted metadata, then\npersists content, activation/head, diagnostics, the actual local CompactionCompleted\nfact and an idempotent receipt. Every transaction-stage failure rolls back all of\nthose writes.\n\nThe same operation and candidate recover the same historical receipt. Reusing\nan operation with different candidate content conflicts. Uncertain commit outcomes\nare resolved by operation lookup, without another summary invocation. A confirmed\nsuccessful commit cannot be followed by a contradictory CompactionFailed fact.\nInstallation reads the current durable head under the current owner; an old receipt\ncannot install an old checkpoint over a newer head. Unreconciled installation stops\nexecution before a provider start.\n\nCancellation and checkpoint authorization share a short grant gate. Cancellation\nbefore grant prevents commit; cancellation after grant cannot undo the authorized\ntransaction. Actual model-request start arbitration remains a separate existing\nAgent owner gate. Neither path adds a durable execution state machine.","url":"https://github.com/Caismis/rustX/blob/8cb41624eb2dc2ca87e4409961f42553ceb029cf/docs/context-engine.md#L94-L115"},{"id":"frozen-input","path":"docs/context-engine.md","start":267,"end":300,"label":"冻结的语义 generation、实际请求与精确重建","text":"## Exact frozen input and composed retries\n\nThe Agent Loop retains the latest immutable semantic input of a logical generation.\nAn authorized semantic correction or compaction advances that version. A transient\nretry uses the latest version, with new request, publication and provisional-output\nidentities and equivalent content/wire associations:\n\n```text\nQ1(I1) -\u003e overflow -\u003e authorized P2 -\u003e freeze I2\nQ2(I2) -\u003e transient failure -\u003e Q3(I2)\n\nQ1(I1) -\u003e authorized correction -\u003e freeze I2\nQ2(I2) -\u003e overflow -\u003e authorized compaction -\u003e freeze I3\nQ3(I3) -\u003e transient failure -\u003e Q4(I3), including corrective material\n```\n\nRetry and recovery budgets remain independent and share the actual-request ordinal.\nSemantic fingerprints do not deduplicate starts, provider usage or execution facts.\nFor Context K, Q1 records Visible=[K], Introduced=[K]; a genuinely new Q2 records\nVisible=[K], Introduced=[] with K appearing once. Recovery of the exact same Q1\nreceipt retains Q1's original introduction records.\n\nContent-changing image downgrade and upload-path rendering produce request-local\nDerived messages with scoped provenance. Dynamic materialization is complete\nbefore final token validation, snapshot commit and dispatch. Changed semantic\ncontent never silently keeps an Original identity. System/tool/workflow/correction\nmaterial stays with the frozen input version through all later transient retries.\n\nRequestSnapshot stores ordered immutable Original dependencies, complete Derived\nbodies, request-only context, selected image bytes, invocation, continuation source,\nTool associations and semantic fingerprint. Reconstruction performs keyed immutable\nreads only; it never reruns compaction, contributors, upload mappings, image selection\nor dynamic discovery. Exact reconstruction, current resendability and generation\nreproducibility are different capabilities.","url":"https://github.com/Caismis/rustX/blob/8cb41624eb2dc2ca87e4409961f42553ceb029cf/docs/context-engine.md#L267-L300"},{"id":"context-start","path":"docs/agent-loop.md","start":626,"end":662,"label":"暂存 Context、冻结请求，再进行合并的持久化启动","text":"## 4.2 Context Assembly and model-turn start\n\nThe Agent Loop is the coordination owner. It creates one finite immutable\n`ContributorInputSnapshot`, samples native observations, invokes the one\n`ContextAssembly` contract, awaits every bounded contributor future, and\nreceives transient typed proposals. The assembly layer assigns trusted\nprovenance, finite semantic lanes, stable extension ordering, and\n`ContextGeneration`; contributors cannot allocate canonical IDs or mutate\nthe conversation.\n\nAssembly output is then **staged**, not committed:\n`AgentExecution::stage_context` validates the proposals against a scratch\nconversation state (no durable effect), and `prepare_model_turn` derives\nthe frozen `RequestSnapshot` and provider-neutral `ModelRequest` from the\nstaged surface. Cancellation observed anywhere up to this point settles\nthe attempt with nothing committed.\n\nThe one cancellation-vs-start linearization point of every model turn is\n`AgentCancellation::arbitrate_model_turn_start`: the attempt's start gate\nis held across the cancellation check and the fused durable start commit,\nso exactly one of cancellation and the start commit can linearize first\n(Issue #12, M9b):\n\n```text\ntransient proposals\n    ↓\nstage_context: validate in scratch state, prepare canonical commits\n    ↓ (no durable effect)\nprepare_model_turn: freeze RequestSnapshot + ModelRequest\n    ↓\n┌─ start gate held ─────────────────────────────────────────────┐\n│ cancellation check                                            │\n│     ↓ not cancelled                                           │\n│ ConversationStore::commit_model_turn_start — ONE transaction: │\n│   canonical request-scoped User context + RequestSnapshot    │\n│   (including the frozen Effective System Prompt) +           │\n│   ModelRequestStarted + sequence binding                      │","url":"https://github.com/Caismis/rustX/blob/8cb41624eb2dc2ca87e4409961f42553ceb029cf/docs/agent-loop.md#L626-L662"},{"id":"start-meaning","path":"docs/agent-loop.md","start":664,"end":691,"label":"Started 是禁止重发的边界，不证明提供方已执行","text":"    ↓\nindependent durable reconstruction/equality verification\n    ↓ prepared-request equality is guaranteed by the construction contract;\n      any durable read/reconstruction failure aborts before provider dispatch\ninvoke adapter\n```\n\nCancellation before the arbitration commits nothing: no request-scoped\ncontext, no Surface advancement, no snapshot, no start fact, and no\nprovider request. A start-commit durability failure rolls the whole\ntransaction back — no half-committed context — and settles the attempt as\nthe honest durable-store failure. Once the start commit linearizes first,\nthe request is durably started: a later cancellation is necessarily\npost-start, settles the started request, and can never be reclassified as\nnever-started. The provider is invoked only after the start commit\nsucceeded, but a committed start fact does **not** prove the provider\nreceived and executed the request: after the commit the loop still performs\nindependent durable reconstruction/equality verification before adapter\ninvocation, and a process can crash anywhere between the durable commit and\nprovider dispatch. The durable contract is therefore:\n\n- no `ModelRequestStarted` ⇒ rustX proves the provider invocation could\n  not have crossed the request-start boundary;\n- `ModelRequestStarted` ⇒ rustX crossed the durable no-resend /\n  external-start boundary; provider execution may or may not have actually\n  occurred, so recovery must never silently resend it.\n\nIf cancellation becomes observable while a contributor future is pending,","url":"https://github.com/Caismis/rustX/blob/8cb41624eb2dc2ca87e4409961f42553ceb029cf/docs/agent-loop.md#L664-L691"},{"id":"start-code","path":"src/agent/execution.rs","start":3013,"end":3045,"label":"取消仲裁下实际合并的请求启动 commit","text":"            let context: Vec\u003cMessageBlock\u003e = prepared\n                .context\n                .iter()\n                .map(|commit| commit.message().clone())\n                .collect();\n            // Pair the monotonic origin with the exact timestamp this transaction\n            // persists. The cancellation gate still owns start arbitration; no\n            // dispatch can precede commit or reconstruction verification.\n            let request_start_ms = self.monotonic_clock.now_millis();\n            let timestamp = Utc::now();\n            store\n                .commit_model_turn_start(\u0026context, \u0026prepared.snapshot, timestamp)\n                .map(|commit| (commit, request_start_ms))\n        });\n        let (start_commit, request_start_ms) = match arbitration {\n            Ok(StartAdjudication::CancelledBeforeStart) =\u003e {\n                return Err(Terminal::Cancelled {\n                    reason: self.cancellation.reason(),\n                });\n            }\n            Ok(StartAdjudication::Started(start_commit)) =\u003e start_commit,\n            Err(error) =\u003e {\n                // The durable start transaction failed: no start fact, no\n                // request-scoped context, and no provider invocation\n                // exist. This is a durable-authority failure (Issue #63),\n                // never a context-preparation failure.\n                self.durable_failure_kind = Some(DurableFailureKind::RequestStart);\n                self.durable_failure = Some(format!(\n                    \"request start could not be committed durably: {error}\"\n                ));\n                return Err(Terminal::Failed {\n                    failure: AttemptFailure::Runtime {\n                        error: RuntimeError::DurableStore {","url":"https://github.com/Caismis/rustX/blob/8cb41624eb2dc2ca87e4409961f42553ceb029cf/src/agent/execution.rs#L3013-L3045"},{"id":"cancel-gate","path":"src/agent/cancellation.rs","start":180,"end":217,"label":"arbitrate_model_turn_start 实现","text":"    /// The one cancellation-vs-start linearization point of every model\n    /// turn of this attempt (Issue #12, M9b).\n    ///\n    /// The Agent Loop calls this exactly once per actual model request —\n    /// the first turn, every tool→model continuation, every recovered\n    /// continuation, every transient retry, and every context-overflow retry\n    /// — with the durable\n    /// request-start commit as `commit`. The gate is held across the check\n    /// and the commit, so exactly one of cancellation and the durable start\n    /// commit can linearize first:\n    ///\n    /// - cancellation already requested ⇒\n    ///   [`StartAdjudication::CancelledBeforeStart`], `commit` never runs,\n    ///   and no request-scoped fact becomes durable;\n    /// - the durable commit runs and succeeds ⇒\n    ///   [`StartAdjudication::Started`], and a cancellation arriving while\n    ///   the commit executed (blocked on the gate) is post-start\n    ///   cancellation of the now-started request;\n    /// - the durable commit fails ⇒ the `Err` propagates, no start fact\n    ///   exists, and no start claim is left behind.\n    ///\n    /// The provider invocation is never part of this arbitration: it may\n    /// only happen after [`StartAdjudication::Started`] returned.\n    pub(crate) fn arbitrate_model_turn_start\u003cT, E\u003e(\n        \u0026self,\n        commit: impl FnOnce() -\u003e Result\u003cT, E\u003e,\n    ) -\u003e Result\u003cStartAdjudication\u003cT\u003e, E\u003e {\n        let _critical = self\n            .start_gate\n            .critical\n            .lock()\n            .expect(\"model-turn start gate poisoned\");\n        if self.signal.is_cancelled() {\n            return Ok(StartAdjudication::CancelledBeforeStart);\n        }\n        let committed = commit()?;\n        Ok(StartAdjudication::Started(committed))\n    }","url":"https://github.com/Caismis/rustX/blob/8cb41624eb2dc2ca87e4409961f42553ceb029cf/src/agent/cancellation.rs#L180-L217"},{"id":"cancel-cause","path":"src/agent/cancellation.rs","start":143,"end":178,"label":"request_cancel 保留首个语义原因","text":"    /// Requests cancellation with an explicit semantic cause.\n    ///\n    /// The first cancellation request that enters the M9b start gate owns\n    /// the attempt's terminal cancellation cause. Later requests still\n    /// deliver the signal, but cannot relabel the already-winning cause.\n    /// This is the runtime-drain seam: it can report `RuntimeShutdown` even\n    /// though ordinary attempts are constructed with `UserRequested` as\n    /// their default cause.\n    ///\n    /// Returns `true` only when this request established the cause.\n    ///\n    /// # Panics\n    ///\n    /// Panics if the start-gate or cancellation-reason mutex is poisoned,\n    /// which would mean a previous cancellation critical section panicked.\n    #[must_use]\n    pub fn request_cancel(\u0026self, reason: CancellationReason) -\u003e bool {\n        {\n            let _critical = self\n                .start_gate\n                .critical\n                .lock()\n                .expect(\"model-turn start gate poisoned\");\n            self.signal.cancel_with(|| {\n                let mut cause = self\n                    .reason\n                    .lock()\n                    .expect(\"cancellation reason lock poisoned\");\n                let first = cause.is_none();\n                if first {\n                    *cause = Some(reason);\n                }\n                first\n            })\n        }\n    }","url":"https://github.com/Caismis/rustX/blob/8cb41624eb2dc2ca87e4409961f42553ceb029cf/src/agent/cancellation.rs#L143-L178"},{"id":"cancel-child","path":"src/agent/cancellation.rs","start":230,"end":255,"label":"模型子信号与执行器取消视图","text":"    /// The owning runtime cancellation signal of the attempt.\n    ///\n    /// This owner-only handle is used by Agent Loop/runtime boundaries. Tool\n    /// executors receive [`ExecutionCancellation`] instead and derive child\n    /// signals, so they cannot acquire this trigger through their context.\n    #[must_use]\n    pub fn signal(\u0026self) -\u003e CancellationSignal {\n        self.signal.clone()\n    }\n\n    /// A model-invocation signal cancelled together with this attempt signal.\n    #[must_use]\n    pub fn model_cancellation(\u0026self) -\u003e CancellationSignal {\n        self.signal.child()\n    }\n\n    /// The foreground execution cancellation view of this attempt.\n    ///\n    /// The view carries the attempt signal **and this handle as the cause\n    /// authority**, so an exec
