<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="description" content="可以离线阅读的 rustX 架构导览，说明均附源码依据。">
  <title>rustX · 架构导览</title>
  <style>:root {
  --paper:#f6f3eb;
  --surface:#fffdf7;
  --ink:#26332f;
  --muted:#59655d;
  --line:#d6d9cc;
  --rust:#a44525;
  --rust-soft:#f4e5d8;
  --green:#276c61;
  --blue:#536b88;
  --serif:Georgia,'Times New Roman',serif;
  --sans:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --mono:ui-monospace,SFMono-Regular,Consolas,'Liberation Mono',monospace;
}

* {
  box-sizing:border-box;
}

html {
  scroll-behavior:auto;
}

body {
  margin:0;
  min-width:1200px;
  background:var(--paper);
  color:var(--ink);
  font-family:var(--sans);
  font-size:14px;
  line-height:1.55;
}

button,input {
  font:inherit;
}

button,a,input,summary {
  -webkit-tap-highlight-color:transparent;
}

button {
  color:inherit;
  cursor:pointer;
}

button {
  border:0;
  background:none;
}

button:disabled {
  opacity:.38;
  cursor:default;
}

a {
  color:var(--rust);
  text-underline-offset:3px;
}

button:focus-visible,a:focus-visible,summary:focus-visible,input:focus-visible,pre:focus-visible,[tabindex]:focus-visible {
  outline:3px solid var(--rust);
  outline-offset:4px;
}

h1,h2,h3,p {
  margin:0;
}

h1,h2 {
  font-weight:400;
}

h3 {
  font-size:12px;
  letter-spacing:.025em;
  font-weight:700;
}

code {
  font-family:var(--mono);
}

.page-shell {
  max-width:1680px;
  padding:0 48px;
  margin:0 auto;
}

.masthead {
  height:87px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-bottom:1px solid var(--line);
  gap:20px;
}

.wordmark {
  font-size:27px;
  line-height:1;
  font-weight:750;
  text-decoration:none;
  color:var(--ink);
  letter-spacing:-1.6px;
  display:flex;
  align-items:center;
}

.wordmark>span:first-child {
  color:var(--rust);
}

.wordmark-note {
  font-size:11px;
  font-weight:500;
  letter-spacing:1px;
  text-transform:uppercase;
  margin-left:24px;
  padding-left:24px;
  border-left:1px solid var(--line);
}

.offline-label {
  font:11px var(--mono);
  color:var(--muted);
  white-space:nowrap;
}

.offline-label>span {
  color:var(--green);
  font-size:11px;
  margin-right:7px;
}

.introduction {
  display:grid;
  grid-template-columns:1.3fr 1fr;
  gap:80px;
  padding:48px 0 36px;
  align-items:end;
}

.eyebrow {
  font-size:11px;
  font-weight:650;
  letter-spacing:1.6px;
  text-transform:uppercase;
  color:var(--rust);
  margin-bottom:14px;
}

h1 {
  font-family:var(--serif);
  font-size:clamp(42px,4.6vw,66px);
  line-height:1.04;
  letter-spacing:-2px;
}

.intro-copy {
  font-size:15px;
  line-height:1.8;
  max-width:490px;
}

.reading-note {
  font-size:11px;
  color:var(--muted);
  margin-top:17px;
  line-height:1.6;
}

.baseline-bar {
  min-height:42px;
  border-top:1px solid var(--line);
  border-bottom:1px solid var(--line);
  display:flex;
  align-items:center;
  gap:18px;
  font-size:11px;
  position:relative;
}

.baseline-tag {
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:1.2px;
  color:var(--muted);
}

.baseline-details summary {
  list-style:none;
  cursor:pointer;
  display:flex;
  gap:12px;
  align-items:center;
}

.baseline-details summary::-webkit-details-marker {
  display:none;
}

.baseline-details summary code {
  font-size:11px;
}

.baseline-details summary>span {
  color:var(--muted);
}

.baseline-details[open]>div {
  position:absolute;
  left:100px;
  top:100%;
  z-index:5;
  background:var(--surface);
  border:1px solid var(--line);
  padding:20px;
  max-width:500px;
  box-shadow:0 10px 20px #26332f12;
}

.baseline-details[open]>div code {
  font-size:11px;
  overflow-wrap:anywhere;
}

.baseline-details p {
  margin-top:10px;
  color:var(--muted);
}

.simulation-label {
  margin-left:auto;
  color:var(--muted);
  font-size:11px;
}

.mode-nav {
  display:grid;
  grid-template-columns:repeat(4,1fr);
  border-bottom:1px solid var(--line);
  margin:18px 0 0;
}

.mode-nav button {
  display:flex;
  align-items:center;
  gap:12px;
  text-align:left;
  font-size:12px;
  padding:19px 14px 20px 0;
  border-bottom:3px solid transparent;
  margin-bottom:-1px;
  line-height:1.4;
  color:var(--muted);
}

.mode-nav button>span {
  font:11px var(--mono);
}

.mode-nav button[aria-current] {
  border-bottom-color:var(--rust);
  color:var(--rust);
  font-weight:650;
}

.mode-nav button:hover {
  color:var(--rust);
}

main {
  min-height:550px;
  padding-top:34px;
  overflow-wrap:anywhere;
}

.section-heading {
  display:flex;
  justify-content:space-between;
  align-items:end;
  gap:50px;
  margin-bottom:28px;
}

.section-heading .eyebrow {
  margin-bottom:9px;
}

.section-heading h2 {
  font-family:var(--serif);
  font-size:31px;
  letter-spacing:-.75px;
  line-height:1.25;
}

.section-heading>p {
  font-size:12px;
  line-height:1.7;
  max-width:370px;
  color:var(--muted);
}

.map-controls {
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-bottom:17px;
}

.filter {
  border:1px solid var(--line);
  padding:6px 10px;
  font-size:11px;
  display:flex;
  align-items:center;
  gap:7px;
  border-radius:3px;
}

.filter>span {
  display:block;
  width:16px;
  height:0;
  border-top:2px solid var(--muted);
}

.filter.call>span {
  border-color:var(--rust);
}

.filter.data>span {
  border-color:var(--green);
  border-top-style:dashed;
}

.filter.dependency>span {
  border-color:var(--blue);
  border-top-style:dotted;
}

.filter[aria-pressed=true] {
  background:var(--ink);
  border-color:var(--ink);
  color:var(--surface);
}

.filter[aria-pressed=true]>span {
  border-color:var(--surface);
}

.map-layout {
  display:grid;
  grid-template-columns:minmax(0,1.7fr) minmax(340px,1fr);
  align-items:start;
  gap:28px;
}

.map-board {
  background:#eceee4;
  border:1px solid var(--line);
  padding:20px 24px;
}

.board-label {
  display:flex;
  justify-content:space-between;
  font:11px var(--mono);
  text-transform:uppercase;
  letter-spacing:.8px;
  color:var(--muted);
  gap:10px;
  margin-bottom:18px;
}

.architecture-map {
  position:relative;
  isolation:isolate;
}

.detail-graph {
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  column-gap:44px;
  row-gap:22px;
  padding:0 14px;
  align-items:start;
}

.detail-graph .map-layer {
  min-width:0;
  padding:12px 0 18px;
}

.detail-graph .layer-nodes {
  grid-template-columns:minmax(0,1fr);
  gap:18px;
}

.detail-graph .map-line.subdued {
  opacity:.42;
  stroke-width:1.25;
}

.detail-graph .map-line.emphasized {
  opacity:1;
  stroke-width:2.3;
}

.map-layer {
  position:relative;
  padding:12px 0 36px;
}

.map-layer>h3 {
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:1.3px;
  color:var(--muted);
  margin-bottom:10px;
  display:flex;
  gap:9px;
}

.map-layer>h3>span {
  font:11px var(--mono);
  color:var(--muted);
}

.layer-nodes {
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:22px;
}

.node-card,.compact .map-node {
  background:var(--surface);
  border:1px solid #c8cec0;
  padding:0;
  text-align:left;
  border-radius:3px;
  position:relative;
  min-width:0;
  box-shadow:0 2px 1px #26332f05;
  z-index:1;
}

.node-card { display:flex; flex-direction:column; }
.node-card>.map-node { padding:13px 12px 0; text-align:left; width:100%; flex:1; }

.node-name {
  display:block;
  font-size:12px;
  font-weight:650;
  line-height:1.4;
  overflow-wrap:anywhere;
}

.node-summary {
  font-size:11px;
  line-height:1.65;
  color:var(--muted);
  display:block;
  margin-top:7px;
}

.node-card.selected {
  border:2px solid var(--rust);
  background:var(--rust-soft);
}

.node-card.selected>.map-node { padding:12px 11px 0; }

.node-card.selected .node-name {
  color:var(--rust);
}

.node-card.neighbor {
  border-color:#8a9887;
}

.node-card:hover,.compact .map-node:hover {
  border-color:var(--rust);
}

.map-lines {
  position:absolute;
  width:100%;
  height:100%;
  inset:0;
  z-index:0;
  overflow:visible;
  pointer-events:none;
}

.map-line {
  fill:none;
  stroke-width:1.5;
  opacity:.8;
}

.map-line.call {
  stroke:var(--rust);
}

.map-line.data {
  stroke:var(--green);
  stroke-dasharray:5 4;
}

.map-line.dependency {
  stroke:var(--blue);
  stroke-dasharray:2 4;
}

#arrow-call {
  fill:var(--rust);
}

#arrow-data {
  fill:var(--green);
}

#arrow-dependency {
  fill:var(--blue);
}

.map-caption {
  border-top:1px solid #d2d7c9;
  padding-top:15px;
  font-size:11px;
  color:var(--muted);
  line-height:1.7;
}

.inspector {
  min-width:0;
  background:var(--surface);
  padding:25px;
  border-top:3px solid var(--rust);
}

.inspector .eyebrow {
  font-size:11px;
  margin-bottom:9px;
}

.inspector>h2 {
  font-family:var(--serif);
  font-size:30px;
  letter-spacing:-.7px;
  line-height:1.2;
  overflow-wrap:anywhere;
}

.lead {
  font-size:13px;
  line-height:1.8;
  color:var(--muted);
  margin-top:14px;
}

.inspector>h3 {
  margin-top:24px;
}

.plain-list {
  margin:8px 0 0;
  padding-left:17px;
  font-size:12px;
  line-height:1.75;
}

.plain-list li {
  padding-left:2px;
  margin-bottom:7px;
}

.plain-list li::marker {
  color:var(--rust);
  font-size:11px;
}

.relationships {
  margin-top:25px;
  padding-top:22px;
  border-top:1px solid var(--line);
}

.source-help {
  font-size:11px;
  line-height:1.6;
  color:var(--muted);
  margin:7px 0 12px;
}

.relationships>ul {
  list-style:none;
  padding:0;
  margin:14px 0 0;
}

.relationships li {
  padding:13px 0;
  border-top:1px solid #e9e9df;
}

.relation-kind {
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:.9px;
  font-weight:700;
  color:var(--rust);
}

.relation-kind.data {
  color:var(--green);
}

.relation-kind.dependency {
  color:var(--blue);
}

.relation-endpoints {
  display:flex;
  gap:7px;
  align-items:baseline;
  font-size:11px;
  margin:6px 0;
  flex-wrap:wrap;
}

.relation-endpoints button {
  text-align:left;
  padding:0;
  text-decoration:underline;
  text-decoration-color:#bcc3b4;
  text-underline-offset:3px;
}

.relation-endpoints button:hover {
  color:var(--rust);
}

.relationships li>p {
  font-size:11px;
  line-height:1.7;
  color:var(--muted);
}

.source-section {
  border-top:1px solid var(--line);
  margin-top:26px;
  padding-top:22px;
  min-width:0;
}

.count {
  font:11px var(--mono);
  color:var(--muted);
  margin-left:6px;
}

.source {
  border-top:1px solid var(--line);
}

.source:last-child {
  border-bottom:1px solid var(--line);
}

.source summary {
  cursor:pointer;
  padding:13px 0;
  font-size:11px;
  list-style:none;
  position:relative;
  padding-left:17px;
}

.source summary:before {
  content:'+';
  position:absolute;
  left:0;
  color:var(--rust);
  font:14px var(--mono);
  top:12px;
}

.source[open] summary:before {
  content:'−';
}

.source summary::-webkit-details-marker {
  display:none;
}

.source summary>span {
  display:block;
  font-weight:600;
  line-height:1.6;
}

.source summary>code {
  font-size:11px;
  line-height:1.6;
  color:var(--muted);
  display:block;
  margin-top:3px;
  overflow-wrap:anywhere;
}

.source-body {
  min-width:0;
  border:1px solid var(--line);
  margin-bottom:12px;
  background:#f0f1e9;
}

.source-toolbar {
  display:flex;
  justify-content:space-between;
  gap:10px;
  flex-wrap:wrap;
  font:11px var(--mono);
  padding:9px;
  border-bottom:1px solid var(--line);
  color:var(--muted);
}

.source pre {
  font:11px/1.8 var(--mono);
  margin:0;
  padding:12px 10px 14px 0;
  overflow:auto;
  max-height:440px;
  text-align:left;
}

.source-line {
  display:grid;
  grid-template-columns:42px 1fr;
  min-width:max-content;
}

.line-number {
  text-align:right;
  color:var(--muted);
  user-select:none;
  border-right:1px solid var(--line);
  padding-right:9px;
  margin-right:10px;
  font-size:11px;
}

.walk-layout {
  display:grid;
  grid-template-columns:250px minmax(0,1fr);
  gap:40px;
  align-items:start;
}

.step-index {
  padding-top:20px;
  border-top:1px solid var(--line);
}

.step-index .eyebrow {
  font-size:11px;
  color:var(--muted);
}

.step-index ol {
  list-style:none;
  padding:0;
  margin:0;
}

.step-index li {
  position:relative;
}

.step-index button {
  display:flex;
  align-items:baseline;
  text-align:left;
  gap:12px;
  width:100%;
  font-size:11px;
  color:var(--muted);
  padding:12px 10px;
  border-left:2px solid transparent;
  line-height:1.65;
}

.step-number {
  font:11px var(--mono);
  color:var(--muted);
  min-width:18px;
}

.step-index button[aria-current] {
  border-left-color:var(--rust);
  background:var(--rust-soft);
  color:var(--rust);
  font-weight:650;
}

.step-index button[aria-current] .step-number {
  color:var(--rust);
}

.step-index button:hover {
  background:#eeeede;
}

.completed {
  margin-left:auto;
  color:var(--green);
  font-size:11px;
}

.step-content {
  min-width:0;
  border-top:3px solid var(--rust);
  background:var(--surface);
  padding:20px 32px 26px;
}

.step-control {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:14px;
  border-bottom:1px solid var(--line);
  padding-bottom:16px;
  margin-bottom:25px;
}

.step-control>div {
  display:flex;
  align-items:center;
  gap:8px;
}

.step-progress {
  font:11px var(--mono);
  text-transform:uppercase;
  letter-spacing:1px;
  color:var(--muted);
}

.text-button {
  font-size:11px;
  color:var(--muted);
  margin-right:5px;
  padding:6px;
}

.square-button {
  border:1px solid var(--line);
  width:32px;
  height:30px;
  font-size:15px;
  line-height:1;
}

.square-button:hover:enabled {
  border-color:var(--rust);
  color:var(--rust);
}

.step-announcement .eyebrow {
  font-size:11px;
  margin-bottom:10px;
}

.step-announcement h2 {
  font-family:var(--serif);
  font-size:35px;
  line-height:1.2;
  letter-spacing:-.7px;
}

.step-description {
  font-size:14px;
  line-height:1.85;
  margin-top:18px;
  max-width:760px;
}

.fact-grid {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:25px;
  margin:27px 0;
  padding:23px 0;
  border-top:1px solid var(--line);
  border-bottom:1px solid var(--line);
}

.fact-grid h3 {
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:.8px;
}

.fact-grid h3>span {
  color:var(--rust);
  margin-right:5px;
}

.fact-grid p {
  font-size:12px;
  line-height:1.8;
  color:var(--muted);
  margin-top:9px;
}

.node-chips {
  display:flex;
  gap:7px;
  flex-wrap:wrap;
  margin-top:12px;
}

.node-chip {
  border:1px solid #cccfbf;
  background:#f2f2e7;
  padding:6px 9px;
  font-size:11px;
  text-align:left;
  border-radius:2px;
  overflow-wrap:anywhere;
}

.node-chip>span {
  color:var(--rust);
  margin-left:6px;
}

.node-chip:hover {
  border-color:var(--rust);
  color:var(--rust);
}

.active-responsibilities>h3 {
  font-size:11px;
}

.compact {
  background:#eef0e6;
  border:1px solid var(--line);
  padding:10px 16px;
  margin-top:15px;
}

.compact .map-lines {
  display:none;
}

.compact .map-layer {
  padding:7px 0 10px;
}

.compact .map-layer>h3 {
  font-size:11px;
  margin-bottom:6px;
  letter-spacing:.9px;
}

.compact .map-layer>h3>span {
  font-size:11px;
}

.compact .layer-nodes {
  gap:7px;
}

.compact .map-node {
  padding:9px 10px;
  box-shadow:none;
}

.compact .node-name {
  font-size:11px;
  font-weight:500;
}

.compact .map-node.active {
  background:var(--rust-soft);
  border-color:var(--rust);
  padding-right:19px;
}

.compact .map-node.active .node-name {
  font-weight:650;
  color:var(--rust);
}

.active-dot {
  position:absolute;
  right:7px;
  top:12px;
  width:4px;
  height:4px;
  border-radius:50%;
  background:var(--rust);
}

.bottom-step-control {
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-top:25px;
}

.primary-button,.secondary-button {
  font-size:11px;
  padding:10px 15px;
  border:1px solid var(--line);
}

.primary-button {
  background:var(--rust);
  border-color:var(--rust);
  color:white;
}

.secondary-button:hover:enabled {
  border-color:var(--rust);
  color:var(--rust);
}

.path-complete {
  font-size:11px;
  color:var(--green);
}

.path-complete>span {
  margin-left:10px;
}

.scenario-tabs {
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:10px;
  margin-bottom:24px;
}

.scenario-tabs button {
  display:flex;
  gap:10px;
  text-align:left;
  padding:13px 14px;
  border:1px solid var(--line);
  font-size:11px;
  line-height:1.6;
}

.scenario-tabs button>span {
  font:11px var(--mono);
  padding-top:3px;
  color:var(--muted);
}

.scenario-tabs button[aria-pressed=true] {
  border-color:var(--rust);
  background:var(--rust-soft);
  color:var(--rust);
}

.scenario-intro {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:40px;
  margin:0 0 30px;
  padding:24px 0;
  border-top:1px solid var(--line);
  border-bottom:1px solid var(--line);
}

.scenario-intro h2 {
  font-family:var(--serif);
  font-size:25px;
  letter-spacing:-.4px;
  line-height:1.3;
}

.scenario-intro p {
  font-size:12px;
  color:var(--muted);
  line-height:1.8;
  margin-top:10px;
}

.scenario-intro fieldset {

  margin:0;

  background:var(--rust-soft);
}

  flex-shrink:0;
}

.topic-layout {
  display:grid;

  gap:40px;
}

.topic-nav {
  border-top:1px solid var(--line);
}

.topic-nav button {
  display:flex;
  align-items:baseline;
  gap:11px;
  width:100%;
  text-align:left;
  font-size:12px;
  line-height:1.6;
  border-bottom:1px solid var(--line);
  padding:16px 12px;
}

.topic-nav button>span:first-child {
  font:11px var(--mono);
  color:var(--muted);
}

.topic-nav button>span:last-child {
  margin-left:auto;
  color:var(--muted);
  font-size:11px;
}

.topic-nav button[aria-current] {

  color:var(--rust);

}

  color:var(--rust);
}

  min-width:0;
  padding:28px 35px 35px;
  background:var(--surface);
  border-top:3px solid var(--rust);
}

  font-family:var(--serif);
  font-size:37px;
  line-height:1.2;
  letter-spacing:-.8px;
}

.topic-content .lead {
  font-size:15px;
  margin-top:17px;
  color:var(--ink);
}

.topic-details {
  border-top:1px solid var(--line);
  margin-top:24px;
  padding-top:6px;
}

.topic-details p {
  font-size:13px;
  color:var(--muted);
  line-height:1.9;
  margin:17px 0;
}

.topic-content>h3 {
  margin-top:28px;
}

.topic-content .source-section {
  margin-top:30px;
}

footer {
  display:flex;
  justify-content:space-between;
  gap:20px;
  border-top:1px solid var(--line);
  margin-top:50px;
  padding:22px 0 35px;
  font-size:11px;
  color:var(--muted);
}

.notice {
  padding:30px;
  font-size:14px;
}

.skip-link {
  position:fixed;
  left:20px;
  top:-100px;
  z-index:20;
  background:var(--ink);
  color:white;
  padding:12px;
}

.skip-link:focus {

}

.graph-navigation { display:flex; align-items:center; gap:22px; margin-bottom:26px; }

.node-action { display:flex; align-items:center; justify-content:space-between; gap:8px; margin:12px 12px 0; padding:9px 0 12px; border-top:1px solid var(--line); font-size:11px; line-height:1.5; }
.node-card.selected .node-action { margin-right:11px; margin-left:11px; padding-bottom:11px; }
.node-enter { padding:0; color:var(--rust); text-align:left; font-weight:650; }
.node-enter:hover { text-decoration:underline; text-underline-offset:3px; }
.node-leaf,.external-owner { color:var(--muted); }
.node-card.external-node { border-style:dashed; background:#f0f2f5; }
.external-node .node-enter { color:var(--blue); }
.external-node.selected .node-enter { color:var(--rust); }
.enter-graph { margin-top:18px; }
.leaf-note { margin-top:17px; font-size:11px; color:var(--muted); }
.term { text-decoration:underline dotted; text-decoration-color:currentColor; text-underline-offset:3px; text-decoration-thickness:1px; cursor:help; }
.term:hover,.term:focus-visible { color:var(--rust); }
.term-tooltip { position:fixed; z-index:100; width:max-content; max-width:370px; max-height:calc(100vh - 24px); overflow:auto; padding:15px 17px; border:1px solid #9ba795; border-radius:4px; background:var(--surface); color:var(--ink); box-shadow:0 8px 25px #26332f25; font-size:12px; line-height:1.8; }
.term-tooltip[hidden] { display:none; }
.term-tooltip strong { display:block; color:var(--rust); font-size:13px; margin-bottom:4px; }
.term-tooltip span { display:block; }

  *,*::before,*::after { scroll-behavior:auto!important; animation:none!important; transition:none!important; }

  <script id="explorer-data" type="application/json">{"title":"架构导览","baseline":{"commit":"8cb41624eb2dc2ca87e4409961f42553ceb029cf","branch":"main","subject":"Refactor compaction into immutable-history context projections (#466) (#477)"},"intro":"本导览以固定的 main commit 为依据，介绍 rustX 各组件的 {{responsibility}}，以及它们交接工作的 {{boundary}}。你可以沿着一次请求阅读源码，也可以切换教学场景，比较不同先后顺序的结果。场景不会调用模型、启动 {{concept-tool}} 或改变 {{concept-session}} 状态。","nodes":[{"id":"clients","label":"TUI / Web Console","layer":"产品界面","summary":"客户端展示 {{concept-conversation}} 状态，并明确指定用户操作的目标。","owns":["管理 TUI 交互、Web 对话界面、本地草稿与焦点。","本地客户端通过 Stdio JSONL 连接自有的 {{concept-app-server}} 子进程；外部管理的服务器使用 WebSocket。"],"boundaries":["焦点只决定客户端将操作发往哪里，不会选出一个进程全局的活跃 {{concept-session}}。","客户端断开连接时，服务端的执行可能仍在继续。"],"evidence":["topology","session-residency"]},{"id":"app-server","label":"{{concept-app-server}}","layer":"产品界面","summary":"{{concept-app-server}} 接收产品协议请求，将它们交给负责执行的 {{native}} 组件。","owns":["为带版本的 JSON-RPC 请求维护连接路由，并适配传输 {{framing}}。","明确寻址 {{concept-session}}/runtime；建立连接前，由传输 {{admission-transport}} 检查身份凭证。"],"boundaries":["更上层的产品宿主负责宿主身份验证、用户/进程路由与工作区隔离。","协议层转接权限检查与控制操作；{{concept-conversation}} 调度仍由 {{concept-runtime}} 决定。"],"evidence":["app-boundary","topology","transport-security"]},{"id":"projection","label":"{{concept-runtime-client}}","layer":"产品界面","summary":"{{concept-runtime-client}} 将运行事实整理为客户端 {{projection}}，提供 {{snapshot}} 与 {{cursor}}，并保存事件供客户端 {{replay-cursor}}；缓存容量有固定上限。","owns":["RuntimeClientProjection 统一合并事件、分配 {{cursor}}、保存回放记录并管理订阅者。","RuntimeClientHost 在 {{concept-runtime}} 之上提供视图、控制与 attachment。"],"boundaries":["即使没有任何 attachment，执行也遵循相同路径。","实时视图、事件缓存与 Trace 只供展示；{{recovery}} 从对应领域的持久事实读取依据。"],"evidence":["client-authority","client-owners","trace-owner"]},{"id":"sessions","label":"{{concept-session}} / {{residency}} 管理","layer":"本地 {{composition}}","summary":"SessionController 保存 {{concept-session}} 身份与设置，负责 {{persistence}}；SessionRuntimeManager 管理加载中的运行核心，负责其 {{residency}}。","owns":["保存 {{concept-session}} → SessionNode → {{concept-conversation}} 目录图、显式设置与 {{revision}}。","以 single-flight 串行处理同一目标的加载/卸载，并保留 {{allocation}} 与 RuntimeIncarnationId。"],"boundaries":["每个 {{concept-conversation}} 最多有一个可写的活跃 runtime；v1 还要求每个 {{concept-session}} 最多只能加载其中一个节点。","卸载成功前必须证明 {{quiescence}}，然后才能释放运行核心。{{concept-session}} 数据已经写入存储，卸载后仍会保留。"],"evidence":["session-identity","session-residency","residency-unload"]},{"id":"config","label":"配置 / 资源","layer":"本地 {{composition}}","summary":"本地配置解析先读取 {{concept-session}} 的显式选择与当前资源定义，再由 {{admission-config}} 检查本次需要的能力。","owns":["UserConfigManager 解析完整资源定义，并精确选择 profile。","统一通过 LocalConversationCore::compose_with_access 组装本地运行核心。"],"boundaries":["发现资源定义不会连接 {{concept-mcp}}，也不会准备 Python 环境。","{{concept-session}} 只保存显式输入；有效配置、凭据与执行状态要在解析和运行时确定。"],"evidence":["composition","session-config","source-demand","residency-load"]},{"id":"runtime","label":"{{concept-runtime}}","layer":"执行 {{owner}}","summary":"{{concept-runtime}} 协调一个 {{concept-conversation}}：由 {{admission}} 决定何时启动工作，并管理运行生命周期。","owns":["保留唯一的当前 {{concept-attempt}} 与模型选择；在 {{concept-attempt}} 之间保存 ConversationState，并通过 {{adoption}} 接纳输入。","串行处理 Running → Draining，接回已有工作的结果，并等待 {{quiescence}} 证明。"],"boundaries":["生产者只提交输入。只有 {{concept-runtime}} 能启动 AgentExecution；是否允许启动由 {{admission}} 决定。","收到取消、实际工作已结束、runtime 已可安全卸载，这三个判断需要各自的证据。"],"evidence":["runtime-ownership","runtime-admission","runtime-drain"]},{"id":"agent","label":"{{concept-agent-kernel}}","layer":"执行 {{owner}}","summary":"AgentExecution 运行一个 {{concept-attempt}}，协调模型轮次与 {{canonical}} {{concept-tool}} 批次；这些规则不依赖具体提供方。","owns":["保存固定的逻辑生成输入，为实际请求记录启动，并管理重试预算与取消 {{arbitration}}。","提交 canonical Assistant，为同批 {{concept-tool}} 保留有序结果位置，再一次提交整个 ToolResult 批次。"],"boundaries":["按内核 {{contract-layering}}，提供方 SDK、MCP SDK、数据库与 HTTP 框架类型应留在外层实现。","执行器负责实际工作与完成证据；输出进入 {{concept-publication}} 后，还需独立提交 Assistant 历史。"],"evidence":["layering","agent-owns","tool-acceptance","inward-contracts"]},{"id":"extensions","label":"Native Agent Extensions","layer":"执行 {{owner}}","summary":"封闭的 {{native}} 扩展通过现有 runtime {{contract-runtime}} 增加能力，并各自保存领域状态。","owns":["在运行核心完成 {{composition}} 时接入 {{concept-agent-status}}、{{concept-todo}} 与 goal。","由 GoalDomain 保存 {{durable}} 状态；GoalRoundDriver 在安全空闲点通过 {{admission-goal}} 提交下一轮输入。"],"boundaries":["Plugins 默认关闭，不提供动态 hook 市场。","{{concept-goal}} 只管理目标与继续执行的条件；模型、{{concept-tool}} 与请求组装仍由现有执行路径负责，也不另建队列。"],"evidence":["config-selection","extensions-owner","goal-runtime","extensions-code"]},{"id":"context","label":"{{concept-context-engine}}","layer":"Runtime {{contract-layering}} 与适配器","summary":"{{concept-context-engine}} 从 {{concept-checkpoint}} 选择 {{concept-original}}/{{concept-derived}}，再接上符合条件的 {{concept-tail}}；Agent 随后保存一份固定的本轮输入。","owns":["校验历史、计量 token、规划 {{compaction}}，并只读取授权范围内的有限资源。","检查 ContextAssembly 动态提案是否满足 {{admission-context}}，再组装精确的请求输入。"],"boundaries":["{{compaction}} 创建独立的历史选择，不修改 {{canonical}} {{concept-message-ledger}}，也不向其中加入摘要消息。","历史 {{projection-context}} 中出现的 {{concept-tool}} 调用/结果，只是模型输入内容，不产生实际执行记录。"],"evidence":["context-contract","context-owners","context-typed"]},{"id":"model","label":"模型 {{contract-model}} / 适配器","layer":"Runtime {{contract-layering}} 与适配器","summary":"ModelAdapter 把与提供方无关的 ModelRequest 转换为一次请求，并返回 ModelStreamItem 流。","owns":["适配 OpenAI Chat Completions、OpenAI Responses 与 Anthropic Messages 协议。","处理提供方编码、不透明 continuation，并通过 {{normalization-events}} 统一流事件。"],"boundaries":["一次 stream 调用只执行一次提供方尝试；重试、重连或切换提供方都必须交回内核。","先将启动事实写入存储，重建并校验请求后才调用适配器；启动记录不能证明提供方已经执行。"],"evidence":["model-contract","model-dispatch","start-meaning","model-protocols"]},{"id":"tools","label":"{{concept-tool-plane}} / 执行器","layer":"Runtime {{contract-layering}} 与适配器","summary":"{{concept-tool-plane}} 为 {{native}} {{concept-tool}}、{{concept-mcp}} 与 {{concept-managed-python}} 提供统一的定义、schema、策略与调用 {{contract-tool}}。","owns":["由 ToolRegistry 解析与 {{preflight}} 检查调用，并管理 ForegroundInvocation 生命周期。","执行实际工作，处理取消与进度，记录外部操作的 {{effect}} 证据，并回收自己管理的资源。"]," 许列表，也不会准备它的资源。","{{concept-managed-python}} 先准备已捕获的包字节与隔离 uv 环境，生成 McpServerBinding，再交给通用 {{concept-mcp}} 机制运行。","{{concept-skills}} 按需提供指令：选择决定 prompt 中可见的内容，文件系统权限仍按原规则检查。正文与支持文件由普通 {{concept-tool}} 读取；子 Agent 通过 {{admission-subagent}} 获得已捕获的包，后续不重新发现当前文件。"],"nodes":["config","sessions","tools","subagents","context"],"evidence":["session-config","resources","source-demand","python-mcp","skills-contract"]},{"id":"children","title":"{{concept-subagent}}：权限固定，历史独立，文件共享","summary":"每个受管理的 {{concept-subagent}} 有自己的 {{concept-conversation}} 与 activation 生命周期，文件写入则落在同一 {{concept-session}} 工作区。","details":["Root 显式列出的命名 Agent 才能接受委派。命名 profile 定义完整的受支持能力，不套用统一的 Root {{concept-tool}}/Plugin 上限。子 Agent 若未指定模型，会继承调用方 {{concept-attempt}} 已捕获的有效模型。","DurableAgentAuthority 创建时就固定解析后的模型、Tools、{{concept-skills}}、Plugins、资源、策略与工作区。ActivationAdmission 为每次运行提供新任务、Context 与来源信息；后续 activation 直接沿用已捕获的 profile。","interrupt_agent 中断预留或当前 activation，并等待实际工作收束。wait_agent 一经捕获目标 activation，就不会转而等待后续运行。send_message 只有在子 Agent 保存输入后才成功；确认丢失时交付结果未知，不能据此重试。","每次 activation 都绑定 {{concept-session}} 已确定的绝对工作区目录，因此能看到父 Agent 未 commit 的改动。成功、失败或取消都保留已完成写入；系统不会为 Agent 创建独立 worktree、复制目录或安排文件交接与销毁。","子 {{concept-conversation}} 独立管理自己的 {{canonical}} 历史。{{concept-workflow}} 的 {{finite}} 子运行归具体节点管理，普通 {{durable}} Agent 控制不能用来恢复它们。"],"nodes":["subagents","tools","runtime","durable","config"],"evidence":["resources","agents-authority","agent-controls","agents-workspace"]},{"id":"workflow","title":"{{concept-workflow}}：执行预先确定的程序","summary":"WorkflowRuntime 推进节点、保存局部值，并复用 {{native}} 执行与 {{settlement}} 机制。","details":["选中的 {{concept-workflow}} 是一个前台 {{concept-tool}}。静态 {{admission-workflow}} 先检查并捕获程序所需能力，block 运行时直接复用。节点类型固定为 Agent、{{concept-tool}}、Branch、Parallel、Review、Loop 与 Return。","WorkflowRuntime::execute_block 为 root、branch、body 提供统一生命周期入口。WorkflowRunId、WorkflowBlockInstance 与 WorkflowNodeInstance 明确标识实际调用，无需从自然语言、PID 或完成顺序推断。","{{concept-workflow}} {{concept-tool}} 节点使用自己的调用身份，不伪造 {{canonical}} 模型 ToolCall。共享 ForegroundInvocation 负责参数 {{normalization}}、批准、期限、取消与 {{physical}} 工作的 {{settlement}}；外层 {{canonical}} 结果 {{slot}} 和有序批次由 Agent 执行负责。","Parallel join 等待分支完成 {{settlement}} 后，按定义顺序返回带键结果；进程实际完成的时序仍可能不同。所有 Agent 与 {{concept-tool}} 节点共享 {{concept-session}} 工作区，作者须自行处理并发写入。Review 拒绝、检查失败或取消都不会回滚已发生的 {{effect}}。","{{concept-workflow}} 返回只说明这次程序执行结束，{{concept-goal}} 是否完成仍由目标状态决定。{{recovery}} 使用全新的 {{native}} {{concept-attempt}} 身份，不恢复旧 {{concept-workflow}} 运行。"],"nodes":["workflows","tools","subagents","agent","extensions"],"evidence":["workflow-program","workflow-owner","workflow-workspace","agent-owns","native-invocation"]},{"id":"goal","title":"{{concept-goal}} 与扩展：各自管理领域状态","summary":"扩展在封闭的运行 {{composition}} 中通过现有 {{contract-runtime}} 接入能力，继续使用同一条 Agent 执行路径。","details":["{{concept-agent-status}}、{{concept-todo}} 与 goal 默认关闭。配置 generation 捕获本次运行核心的能力；已经通过 {{admission}} 的工作继续使用原 generation。Todo 列表与 {{concept-goal}} 状态属于 {{concept-conversation}} 领域；子 {{scope-agent}} 不允许追求仅限 Root 的 {{concept-goal}}。","{{concept-goal}} 以 GoalDomain 保存的 GoalPhase 为准：Active 授权后续自主轮次，runtime 仍需满足 {{admission}} 条件才能执行。Paused 与 Blocked 收回授权，Complete 表示目标已经结束。生命周期视图不能改写这些状态。","GoalRoundDriver 在协调器现有的安全空闲点同步提交普通 Pending Inbound。同一 SQLite 事务接收本轮输入、推进 {{concept-goal}} 版本与已消耗轮次数，并保存本轮获准执行的有限事实。","Runtime 进入 {{drain}} 时，Active 保持原值，已经提交的轮次也不会退还。若用户显式中断正在自主运行的 {{concept-goal}} {{concept-attempt}}，系统先将暂停状态写入存储并请求取消，再确认成功。","{{concept-goal}} 决定是否继续追求目标；{{concept-workflow}} 描述一次确定的工作如何完成。模型执行、{{concept-tool}} 执行、canonical 历史与请求组装仍归现有组件负责，{{concept-goal}} 不另建队列。"],"nodes":["extensions","runtime","durable","context","workflows"],"evidence":["config-selection","extensions-code","goal-authority","goal-runtime","extensions-owner","workflow-program"]},{"id":"history","title":"历史、精确请求、执行记录与客户端视图","summary":"{{concept-message-ledger}} 记录对话事实，{{concept-request-snapshot}} 保存模型输入，{{concept-event-journal}} 记录执行事实，{{concept-publication}} 与客户端视图分别展示输出与当前状态。","details":["不可变 {{concept-message-ledger}} 保存已提交的 {{concept-conversation}} 事实。{{concept-checkpoint}} 与激活坐标只选择历史 Context：{{concept-original}} 保留 {{canonical}} 身份与 digest；{{concept-derived}} 通过 {{provenance-derived}} 记录来源，但没有 {{canonical}} MessageId。","{{concept-request-snapshot}} 保存一次实际已启动请求的精确输入，包括不可变依赖、{{concept-derived}} 正文、Context、{{concept-tool}} 关联与调用。重建时按历史键读取，无需重新发现资源、运行贡献者、选择图片或进行 {{compaction}}。","{{concept-event-journal}} 记录实际执行。历史 {{projection-context}} 中的调用/结果不产生 usage、时长或执行次数。{{native}} {{concept-tool}} 的 Prepared/Started/Progress/Completed 只提供 {{observation}}；权限、可信结果与持久交互批准各有明确的规则和证据。","RuntimeClientProjection 统一合并运行事件、更新实时读取模型、分配 {{cursor}}、保存回放记录并管理订阅者。它的缓存与 TraceProjection 只供展示，不驱动执行、取消、工作收束或恢复。","本导览以确定的先后顺序演示机制，场景不是实时运行记录。下方源码摘录固定到同一个不可变仓库 commit，可用于核对接口与执行规则。"],"nodes":["durable","context","agent","projection","publication"],"evidence":["canonical-history","context-typed","frozen-input","tool-evidence","client-owners","trace-owner","native-invocation"]},{"id":"publication-delivery","title":"{{concept-publication}} 与文件交付分别何时成立","summary":"流式输出写入 {{concept-publication}} 后，还需独立提交 Assistant 历史；文件卡片则需要已提交的类型化交付事实。","details":["模型输出先合并并写入 {{concept-publication}}，再发往客户端。提供方结果 P、{{concept-publication}} 终态 U 与 canonical Assistant 提交 C 按 P \u003c U \u003c C 保存。不完整或未被接受的流不会成为 canonical Assistant 消息。","PublicationAudit 记录已提交、可能发出的输出，只能限定用户可能看到的内容。runtime 没有证明用户已读的 ACK {{contract-no-ack}}。","present 是普通 {{native}} {{concept-tool}}。只有成功提交的类型化 {{concept-tool}} 交付元数据，才授权对话记录显示文件卡片；文件写入、完成 {{observation}} 或模型文字声明都不能提供这种 {{authority-delivery}}。","ArtifactId 指向 ArtifactStore 中不可变的字节。SessionFileReference 保存原始 {{concept-conversation}}/cwd 身份与可变文件的 {{normalization-path}} 路径；再次打开可能读到新内容，也可能返回 Missing、Unauthorized 或 Unavailable。它没有保存当时字节的 {{snapshot-content}}。","app_server::delivery_access 管理已提交交付的访问。调用方通过传输身份验证后获得权限；响应发出前还须精确检查 attachment、请求与 {{concept-publication}}。客户端读取类型化事实，再提供本地预览。"],"nodes":["publication","agent","durable","tools","app-server","clients"],"evidence":["publication-contract","publication-outcomes","delivery-commit","delivery-access"]},{"id":"lifetimes-security","title":"{{concept-session}}、运行核心与连接各有生命周期","summary":"{{concept-session}} 数据可以长期保存；当前写入者、attachment 路由与宿主隔离分别由对应组件管理。","details":["外部管理部署为每个已认证用户提供一个 {{concept-app-server}} 进程、配置环境与 {{durable}} 根目录。更上层宿主负责用户路由、身份验证、工作区分配与隔离、环境注入及重启策略。","{{concept-session}} cwd 决定执行与配置解析的上下文，并不提供文件系统沙箱；{{native}} 文件 {{concept-tool}} 可以使用普通宿主绝对路径。进程内的单写入者规则也不提供多进程租户管理或租约。","SessionRuntimeManager 以 single-flight 管理加载/卸载，并保留正在使用的运行核心。v1 中，每个 {{concept-session}} 最多有一个处于 {{residency}} 的节点，不同 {{concept-session}} 则可同时加载。ManagedRuntimeClient 只持有弱引用，不能让已卸载核心继续存活。","断线、EOF 或显式 detach 都会释放外部 attachment；{{concept-attempt}} 仍可运行，待处理交互也不会自动结束。本地 TUI 正常退出时显式请求关闭自有子进程；外部管理的服务器则支持断线后继续执行。","shutdown 证明所有受管理工作已收束、达到 {{quiescence}} 后，才能卸载成功。失败时保持 Unloading 并保留精确诊断，避免新写入者进入。成功后持久数据继续保留，旧句柄返回 StaleIncarnation。","WebSocket 在建立连接前通过 {{admission-transport}} 检查专用传输 token。可选交付访问另需传输授予的权限。initialize 只协商协议，不承担进程内身份验证或租户隔离。"],"nodes":["clients","app-server","sessions","runtime","tools","projection"],"evidence":["topology","tool-contract","session-residency","residency-load","residency-unload","connection-detach","transport-security"]}],"evidence":[{"id":"layering","path":"src/lib.rs","start":1,"end":27,"label":"Runtime 接口与外部 SDK 的边界","text":"//! rustX runtime library.\n//!\n//! The crate is intentionally layered around runtime-owned contracts. External\n//! SDK types must terminate at adapter boundaries and must not leak into the\n//! agent kernel.\n\npub mod agent;\npub mod app_server;\nmod bounded_file;\npub mod capabilities;\npub mod context;\npub mod conversation;\npub mod durable;\npub mod events;\npub mod extensions;\npub mod goal;\npub mod local_runtime;\npub mod message;\npub mod model;\npub mod protocol;\npub mod publication;\npub mod runtime;\npub mod runtime_client;\npub mod session_archive;\npub mod skills;\npub mod toml_authoring;\npub mod tools;","url":"https://github.com/Caismis/rustX/blob/8cb41624eb2dc2ca87e4409961f42553ceb029cf/src/lib.rs#L1-L27"},{"id":"topology","path":"docs/architecture.md","start":76,"end":102,"label":"客户端、进程拓扑与独立生命周期","text":"## App Server product topology\n\nIn externally managed deployments, one authenticated user maps to one rustX\nApp Server process, one configuration/source environment and one durable runtime\nroot. A process hosts many durable Sessions and independently loaded runtimes;\nthere is no process-global active Session. The manager admits at most one writable\nlive runtime per Conversation, with one resident node per Session in v1.\n\nThe higher-level host owns authentication, user/process routing, workspace\nallocation/isolation, environment/credential injection and external restart policy.\nThe internal `AppServerHost` owns rustX admission/drain and diagnostics; it is not\nthat higher-level product host. Configuration, catalog, runtime, interaction and\nprojection owners retain their native authority after commit.\n\n```text\nlocal TUI   -\u003e stdio JSONL -\u003e TUI-owned App Server child\nWeb Console -\u003e WebSocket  -\u003e externally managed App Server\nremote TUI  -\u003e WebSocket  -\u003e the same externally managed App Server\n                            one semantic protocol, many Sessions\n```\n\nConnection lifetime, runtime residency, durable Session lifetime and process\nlifetime are independent. Network disconnect is detach. Normal local TUI exit\nexplicitly requests owned-child drain; persistent work across client exit uses an\nexternal server. Session cwd is execution/config-resolution context, not a\nfilesystem sandbox. See [protocol and ownership](app-server-protocol.md) and the\n[composition evidence and developer flows](app-server-acceptance.md).","url":"https://github.com/Caismis/rustX/blob/8cb41624eb2dc2ca87e4409961f42553ceb029cf/docs/architecture.md#L76-L102"},{"id":"app-boundary","path":"src/app_server/mod.rs","start":1,"end":19,"label":"与传输无关的 {{concept-app-server}} 模块","text":"//! Transport-neutral App Server connection and versioned JSON-RPC contract.\n\npub mod connection;\npub mod protocol;\npub mod schema;\npub mod session_deletion;\nmod wire;\n\npub mod process;\npub mod transport;\n\npub mod host;\n\npub mod archive_download;\n\npub(crate) mod delivery_access;\npub(crate) mod product_host;\n\npub mod upload_transfer;","url":"https://github.com/Caismis/rustX/blob/8cb41624eb2dc2ca87e4409961f42553ceb029cf/src/app_server/mod.rs#L1-L19"},{"id":"composition","path":"src/local_runtime/mod.rs","start":1,"end":24,"label":"本地配置与运行核心由谁组装","text":"//! Shared local configuration, durable Session, and runtime owners.\n//!\n//! `rustx app-server` composes these owners through [`crate::app_server`],\n//! the only external product control protocol:\n//!\n//! - [`config`] — the bounded explicit current runtime/project configuration;\n//! - [`composition`] — the one Rust-side composition owner;\n//! - [`session_controller`] / [`session_runtime_manager`] — durable Session\n//!   authority and process-local runtime residency;\n//! - [`cli`] — the bounded public argument contract;\n//! - [`process`] — the single process entry and its stream ownership.\n//!\n//! # Process output contract\n//!\n//! Help and argument diagnostics go to stderr before any effect; a bare\n//! `rustx` prints help. App Server stdout is protocol-only. Configuration\n//! subcommands own stdout for their bounded human/JSON results and never\n//! create a runtime.\n//!\n//! The internal `rustx --subagent-child` mode ([`subagent_child`]) is an\n//! independent transport: fd 0 is the reliable subagent control IPC and\n//! fd 1/stdout is the protocol-owned framed Activity observation IPC\n//! (Issue #178), not human-readable output. Its read-only live inspection\n//! endpoint (`live_inspection`) is child-local routing state.","url":"https://github.com/Caismis/rustX/blob/8cb41624eb2dc2ca87e4409961f42553ceb029cf/src/local_runtime/mod.rs#L1-L24"},{"id":"session-identity","path":"docs/durable-sessions.md","start":1,"end":23,"label":"{{concept-session}} 图与目录身份由谁保存","text":"# Durable Sessions, runtime residency, and client focus\n\nOne user runtime root has one native `ProductController` and one\n`SessionController`. Opening that controller creates no Session, selects no\nSession, resolves no configuration, and starts no runtime. A Session remains a\ngraph: `Session -\u003e SessionNode -\u003e Conversation`. Each node has its own linear\nConversation identity, canonical history and retained Surface operations.\n\nThe catalog owns identity, name, timestamps, graph, Session-local `active_node`\n(the default node inside that graph), explicit settings, settings revision,\nlineage origins, and pending deletion authority. This node pointer does not\nidentify a globally open Session. The catalog also owns the bounded derived\ndisplay projection (`display_preview`). The projection is display metadata,\nnot canonical history: canonical history is never reconstructed from it, and\nthe catalog never re-derives it while listing. It reaches the catalog through\nexactly three seams — the one-shot publisher armed on the root runtime, which\ncommits it after the first canonical root-lineage ordinary user commit; the\nfrozen-seed derivation carried into a clone/fork visibility commit; and the\nexplicit, idempotent repair seam run at reopen/compose/recovery, which\nderives the line from the root conversation store and never manufactures a\nsubject from a later message. Preview publication is a metadata-only commit:\nit never touches `updated_at`, and the catalog generation moves only when a\nreal change commits (an already-present projection commits nothing).","url":"https://github.com/Caismis/rustX/blob/8cb41624eb2dc2ca87e4409961f42553ceb029cf/docs/durable-sessions.md#L1-L23"},{"id":"session-residency","path":"docs/durable-sessions.md","start":44,"end":76,"label":"显式 {{concept-session}} 控制、{{residency}} 与客户端焦点","text":"`read_session`, `rename_session`, `tree`, `fork_session`, `read_settings`,\n`replace_settings`, `acquire_session`, and deletion all address explicit\nidentities. Creation always allocates an independent Session. Lists include\nunused Sessions and have no global active marker. The monotonic accepted-inbound\nusage classifier remains available by identity; it no longer controls creation\nor catalog visibility.\n\nRuntime residency is a separate lifetime. `SessionRuntimeManager` owns single-flight\nload/unload, multiple resident runtimes, and one writable live incarnation per\nConversation. In v1, one Session may have only one resident Conversation/node;\ndifferent Sessions remain concurrent. Successful unload releases composition and\nallocation even when stale client handles remain. See [runtime residency](runtime-residency.md) for synchronization and\nclient lifetime contracts.\n`SessionAccess` provides the Session snapshot, selected node, explicit settings\nand revision, plus retained Conversation allocation access. Different\nConversations can hold these accesses concurrently. Allocation access is\nnecessary destructive exclusion, not a replacement for the manager's single-writer\nruntime admission.\n\nClient focus is routing/UI state. Ordinary local TUI switching uses the same\nApp Server child and changes only the focused attachment. Remote TUI and Web\nConsole use WebSocket to an externally managed process. A focus change never\nquiesces another Session, unloads its runtime, or replaces the process.\n\nAn explicit node route does not change catalog bytes, generation, timestamps,\nor the Session graph default. Only an explicit graph operation changes the\nSession-local default node. Changing the loaded node uses confirmed, targeted\nunload/cold attachment; other Sessions remain independent. The CLI cold-resume\npath also requires an explicit Session identity, with an optional node.\n\nSession identifiers are scoped to their product root. Two independent users'\nprocesses can allocate the same identifier spelling; routing to the right user\nprocess is the higher-level host's responsibility, never an in-server tenant key.","url":"https://github.com/Caismis/rustX/blob/8cb41624eb2dc2ca87e4409961f42553ceb029cf/docs/durable-sessions.md#L44-L76"},{"id":"session-config","path":"docs/durable-sessions.md","start":79,"end":106,"label":"已保存的显式选择与解析后的有效配置","text":"## Persisted configuration classification\n\n`SessionPersistentState` is explicit input, not effective configuration:\n\n| Persisted field | Reason |\n| --- | --- |\n| `cwd` | Absolute execution and project-resolution context; never ambient process cwd or an OS sandbox. |\n| `model: Option\u003cSessionModelConfig\u003e` | Intentional whole-model selection: model reference, Model Profile, request parameters, output cap and summary policy. `None` uses current source defaults. |\n\nThe bound User `rustx.toml`, HOME, fixed User resource root and runtime root\nare process bindings. Provider credentials belong to their complete winning\nProvider definition. Agent profiles, user policy, model/provider catalogs,\nMCP and Python definitions, Skill content, defaults, instructions and resource\ncatalogs remain current source content. Registries, connections, credentials,\nresource generations, provenance, prospective/admitted effective configuration,\nand execution state are never persisted as Session authority.\n\nCold load acquires the native `ProductController` before opening the authoritative\ncatalog and reading persisted settings. That owner remains retained through\nresolution, admission and composition, excluding competing settings publishers.\nThe complete settings value and revision come from this one catalog snapshot;\nno catalog mutex spans resolution or runtime composition. Cold load reconstructs\n`SessionConfigInput` and uses the CFG3\n`UserConfigManager::resolve_session` and admission. No second resolver exists.\nCurrent authorization and availability are checked again. Missing explicit\nmodels/resources and invalid selections fail through existing typed resolution\nor admission outcomes; an old selection never grants authority or triggers a\nfallback to a different model or broader selection.","url":"https://github.com/Caismis/rustX/blob/8cb41624eb2dc2ca87e4409961f42553ceb029cf/docs/durable-sessions.md#L79-L106"},{"id":"runtime-ownership","path":"src/runtime/conversation_runtime.rs","start":1,"end":35,"label":"{{concept-runtime}} 负责语义协调","text":"//! The conversation runtime coordinator (Issue #61): the semantic owner of\n//! conversation coordination for one conversation.\n//!\n//! [`ConversationRuntime`] owns the semantic conversation/runtime state that\n//! used to live inside the old Runtime Client host:\n//!\n//! ```text\n//! conversation identity / agent identity\n//! authoritative mutable session model state\n//! between-attempt bounded ConversationState hot read model\n//! ConversationStore and its RequestHistory durable read handle\n//! attempt-id allocation\n//! the current-attempt slot and its cancellation handle\n//! attempt admission (the ONE admission owner)\n//! current model request timeout execution policy and monotonic clock\n//! ordinary inbound acceptance/admission coordination\n//! the ConversationInboundMailbox active-process relationship\n//! ConversationToolRuntime / ConversationBackgroundRegistry\n//! CapabilityCoordinator\n//! context/request assembly dependencies (policy, estimator, Agent Status engine)\n//! the lifecycle/drain authority\n//! attempt settlement handoff back into conversation state\n//! ```\n//!\n//! The Runtime Client (see `crate::runtime_client`) is a projection + control\n//! + attachment adapter over this coordinator. It observes runtime\n//! observations and forwards control requests; it never owns the semantic\n//! state above.\n//!\n//! # The one admission owner\n//!\n//! Any producer may publish ordinary inbound work through the conversation\n//! inbound boundary (the [`ConversationInboundMailbox`](crate::runtime::inbound::ConversationInboundMailbox)\n//! of the owned tool runtime). Only [`ConversationRuntime`] admits the next\n//! [`AgentExecution`](crate::agent::AgentExecution):","url":"https://github.com/Caismis/rustX/blob/8cb41624eb2dc2ca87e4409961f42553ceb029cf/src/runtime/conversation_runtime.rs#L1-L35"},{"id":"runtime-admission","path":"src/runtime/conversation_runtime.rs","start":48,"end":74,"label":"一把运行入口锁，一个活跃 {{concept-attempt}}","text":"//! ```\n//!\n//! A producer never starts an attempt itself: the coordinator worker is the\n//! single admission trigger for enqueue-driven admission, and the\n//! coordinator's own settlement handoff is the second (internal) trigger.\n//! Both run the same [`admit_next_attempt`](ConversationRuntime) linearization.\n//!\n//! # Admission linearization\n//!\n//! All of the following share the one coordinator state lock:\n//!\n//! ```text\n//! idle observation (no current attempt, gate open)\n//! finite inbound selection (one watermark-bounded mailbox drain)\n//! canonical commit of the drained inbound\n//! attempt-id allocation\n//! model snapshot freeze (SessionModelState::snapshot)\n//! current-attempt publication\n//! ```\n//!\n//! There is therefore at most one active [`AgentExecution`] per\n//! conversation, one finite inbound batch is admitted exactly once (either\n//! consumed by the active attempt at its safe boundary, or used to create\n//! the next attempt after settlement — never both), and a session model\n//! update linearizes either before an admission (observed by that attempt)\n//! or after it (affects only future attempts). See the deterministic race\n//! regressions in the test module.","url":"https://github.com/Caismis/rustX/blob/8cb41624eb2dc2ca87e4409961f42553ceb029cf/src/runtime/conversation_runtime.rs#L48-L74"},{"id":"runtime-drain","path":"src/runtime/conversation_runtime.rs","start":76,"end":111,"label":"关闭新工作入口，等待现有工作收束","text":"//! # Lifecycle: activation, drain, and quiescence\n//!\n//! The runtime has one authoritative lifecycle, shared with every\n//! conversation-owned semantic boundary:\n//!\n//! ```text\n//! ConversationRuntime::new(..)          -\u003e Inactive\n//!     [optional] pre-activation MCP settlement failure -\u003e Draining\n//!     [optional] RuntimeClientHost::new(..)   binds the client adapter\n//! ConversationRuntime::activate()       -\u003e Running\n//! ConversationRuntime::shutdown()       -\u003e Draining, then awaits Quiescent\n//! ```\n//!\n//! `Running -\u003e Draining` is the exact drain linearization point. It is\n//! performed under the coordinator lock that also serializes inbound\n//! acceptance, model updates, and attempt admission. Background ownership and\n//! capability revision commits use the same lifecycle at their native\n//! synchronization boundaries. After the transition, no new semantic work\n//! may begin; already-owned work retains only its typed settlement path.\n//!\n//! Cancellation requested, operation settled, and runtime quiescent are\n//! different facts. A cancellation signal, a dropped waiter, an OS signal,\n//! or an empty registry is not settlement. Quiescence is published only\n//! after the current Agent Execution **and its attempt task**, foreground\n//! tools, conversation-owned background terminal publication, counted\n//! capability/environment preparation (including in-flight MCP connection\n//! owners), retained MCP process closure, owned process terminality, and\n//! the admission worker's exit boundary have all settled.\n//!\n//! Drain is a supervisor, not a short-circuiting pipeline: it closes\n//! admission, requests cancellation/closure of every concrete owner,\n//! supervises each owner to its own native terminal boundary, and only then\n//! decides between `Quiescent` and one aggregated settlement failure. A\n//! failure in one participant is evidence, never permission to abandon a\n//! sibling that can still act.\n//!","url":"https://github.com/Caismis/rustX/blob/8cb41624eb2dc2ca87e4409961f42553ceb029cf/src/runtime/conversation_runtime.rs#L76-L111"},{"id":"residency-load","path":"docs/runtime-residency.md","start":93,"end":116,"label":"Single-flight 冷加载，激活前绑定客户端视图","text":"## Load\n\n1. `SessionController::resolve_session_target` reads the durable Session/node and\n   Conversation identity without `ConversationAccess`. No managed allocation\n   authority exists before the registry claim.\n2. Under the registry mutex, the manager checks the Session fence and installs\n   `by_session` plus `Loading(flight)` atomically. Only that flight's owner may\n   call `acquire_session` for the exact resolved node, obtaining current persisted\n   settings and native allocation access. Other callers join without acquiring\n   redundant allocation handles. Deletion can identify every blocking managed\n   acquisition, including one parked before storage acquisition.\n3. The manager resolves current sources using `UserConfigManager`, converts the\n   acquired persisted selections to `SessionConfigInput`, and performs ordinary\n   trust/credential admission. Effective configuration is never durable authority.\n4. Native composition and durable recovery run with the allocation retained.\n   The existing `RuntimeClientHost` binds while the runtime remains inert.\n5. The flight owner installs a fresh `RuntimeIncarnationId` and its inert\n   composition, then calls the infallible native activation boundary outside the\n   registry mutex. Activation may synchronously admit recovered SQLite work.\n   The slot remains Loading and other callers join the flight until the manager\n   publishes Loaded and the shared ready result, with no intervening await.\n\nA warm load returns the existing incarnation. It does not resolve files, restart,\nmutate composition, or transfer residency ownership to its caller. Existing safe","url":"https://github.com/Caismis/rustX/blob/8cb41624eb2dc2ca87e4409961f42553ceb029cf/docs/runtime-residency.md#L93-L116"},{"id":"residency-unload","path":"docs/runtime-residency.md","start":132,"end":164,"label":"卸载要求 shutdown 成功，并证明已无写入者","text":"## Unload and replacement\n\nInstalling `Unloading` wins residency exclusion. It does not compete with the\nruntime's execution gate. `ConversationRuntime::shutdown` takes the existing\ncoordinator lock and commits `Running -\u003e Draining`; inbound acceptance uses that\nsame lock. Acceptance either wins first and is settled by the runtime, or sees\nthe closed gate and commits nothing. The manager adds no execution gate.\n\nUnload commits only after native shutdown returns success and proves quiescence.\nThe manager releases its host/core and retained allocation, removes the entry\nand its Session claim, and publishes success. Durable Session and Conversation\ndata remains. A later load performs ordinary cold recovery. Previously issued\nclient/identity handles remain values, but are non-owning and fail explicitly with\n`StaleIncarnation`. They cannot keep the runtime or allocation alive, prevent\nnative deletion, or reopen residency. No owning runtime/endpoint API escapes the\nmanager. Narrow test-only inspection clones are used solely for native gate tests.\n\nA shutdown failure leaves `Unloading` with the old composition and its exact\nterminal diagnostic. Load, unload and replacement observers receive that failure;\nthe manager cannot claim successful unload or publish a new writer without proven\nquiescence. This is an isolated Conversation failure, not a poisoned manager.\n\nA load racing unload joins the unload flight, then retries cold load after success.\nFlight terminals explicitly distinguish `Resident`, `WriterAbsent(operation_result)`\nand `RetirementUnproven(error)`. Deletion requires absence proof, not operation\nsuccess: an acquisition/composition error after proven retirement does not poison\ndelete. Native shutdown/projection uncertainty retains the unproven writer and fence.\nAn unload racing load waits for the load result and then drains that incarnation.\nAn unload racing replacement waits for replacement and drains its resulting\nincarnation. Concurrent explicit replacements serialize: each explicit replacement\nmust cross its own quiescence boundary; ordinary load only reuses or waits.\n\nReplacement retains allocation through old shutdown. Successful native quiescence","url":"https://github.com/Caismis/rustX/blob/8cb41624eb2dc2ca87e4409961f42553ceb029cf/docs/runtime-residency.md#L132-L164"},{"id":"client-authority","path":"src/runtime_client/mod.rs","start":1,"end":33,"label":"客户端从 runtime 事实生成视图，无连接也能执行","text":"//! Runtime Client projection/control owners reused by the App Server boundary.\n//! The only external product control protocol is [`crate::app_server`]. The\n//! Runtime Client envelopes are internal: a host's typed request surface and\n//! the read-only child live inspection socket.\n//!\n//! # Architecture\n//!\n//! ```text\n//! ConversationRuntime semantic facts/observations (Issue #61)\n//!                 |\n//!                 v\n//!  deterministic Runtime Client projection\n//!                 |\n//!                 v\n//!  RuntimeClientEvent / RuntimeClientSnapshot\n//!                 |\n//!                 v\n//!       App Server protocol (client-neutral generated schemas)\n//! ```\n//!\n//! The governing invariant:\n//!\n//! \u003e All authoritative execution and conversation state originates from\n//! \u003e rustX Runtime. External clients observe projections of that state;\n//! \u003e they never become a second authority.\n//!\n//! Issue #61 extracted the conversation runtime coordinator\n//! ([`ConversationRuntime`](crate::runtime::conversation_runtime::ConversationRuntime))\n//! from this boundary: the coordinator owns conversation execution/admission\n//! authority, and [`RuntimeClientHost`](host::RuntimeClientHost) is the\n//! projection + control + attachment adapter over it. A conversation runs\n//! the exact same admission/execution path with zero Runtime Client\n//! attachments.","url":"https://github.com/Caismis/rustX/blob/8cb41624eb2dc2ca87e4409961f42553ceb029cf/src/runtime_client/mod.rs#L1-L33"},{"id":"client-owners","path":"src/runtime_client/mod.rs","start":48,"end":90,"label":"客户端视图、事件回放与 attachment 由谁管理","text":"//!\n//! - [`RuntimeClientEndpoint`](endpoint::RuntimeClientEndpoint) is the\n//!   semantic protocol entry point: it dispatches every Runtime Client request,\n//!   `initialize` included, so a transport stays a framing adapter and\n//!   never owns negotiation or attachment admission.\n//! - [`RuntimeClientHost`](host::RuntimeClientHost) is the projection +\n//!   control + attachment adapter over the conversation runtime: it owns\n//!   the projection (snapshot read model, cursor allocation, bounded\n//!   replay, subscribers), one control attachment plus read-only\n//!   observation attachments, and\n//!   protocol adaptation. `AgentExecution` remains the attempt settlement\n//!   authority and the conversation runtime remains the admission owner.\n//! - [`RuntimeClientProjection`](projection::RuntimeClientProjection) is\n//!   the one linearization owner of the externally visible read model,\n//!   cursor allocation, event publication, bounded replay, and\n//!   subscribers.\n//! - The canonical mailbox, background registry, and capability\n//!   coordinator remain authoritative; the projection observes them\n//!   through narrow read-only seams.\n//! - `SessionController` owns durable Session/catalog control; `SessionRuntimeManager`\n//!   owns residency, composition and configuration adoption. App Server addresses\n//!   those owners directly; Runtime Client has no Session control surface.\n//! - Native Approval interactions are another runtime-owned observation:\n//!   `InteractionCoordinator` owns the pending rendezvous and this boundary\n//!   carries only typed request/response/projection facts. A client cannot\n//!   rewrite a prepared tool invocation, and detach never settles a pending\n//!   interaction.\n//! - Agent Status is composed exactly once per request preparation; the\n//!   model path and the client projection consume the same composed\n//!   observation.\n//!\n//! # Protocol scope\n//!\n//! - one control attachment per live runtime instance, plus explicitly\n//!   read-only observation attachments;\n//! - detach is never cancellation;\n//! - interaction availability follows runtime binding, not client presence;\n//! - live pending interactions are reconstructed from the snapshot/cursor\n//!   projection, never from TUI state or recovery logs;\n//! - bounded in-memory projection replay (the durable Event Journal and\n//!   current Surface bootstrap remain `ConversationStore` authorities; the\n//!   client cursor/cache is never recovery input);\n//! - no App Server stdio/WebSocket bindings (Issue #36), no TUI (Issue #39), no M9 cancellation","url":"https://github.com/Caismis/rustX/blob/8cb41624eb2dc2ca87e4409961f42553ceb029cf/src/runtime_client/mod.rs#L48-L90"},{"id":"canonical-history","path":"src/conversation/mod.rs","start":1,"end":11,"label":"不可变 {{concept-message-ledger}}、{{concept-checkpoint}} 与热状态","text":"//! Immutable canonical conversation facts and their bounded hot working set.\n//!\n//! The Message Ledger owns committed messages. Surface bookkeeping records only\n//! ordinary canonical appends; it does not select compacted model history.\n//! Durable typed Projection Checkpoints and their activation timeline own\n//! historical inclusion and ordering. The Context Engine compiles a checkpoint\n//! plus eligible Tail, while the Agent Loop adds and freezes current core input.\n//!\n//! There is one mutable hot `ConversationState`: the coordinator owns it between\n//! attempts and `AgentExecution` owns it while running. It caches retained Original\n//! facts, never gives Derived projected content a canonical `MessageId`.","url":"https://github.com/Caismis/rustX/blob/8cb41624eb2dc2ca87e4409961f42553ceb029cf/src/conversation/mod.rs#L1-L11"},{"id":"durable-inbound","path":"src/durable/mod.rs","start":1,"end":26,"label":"分别保存输入、对话历史、{{concept-event-journal}} 与 {{concept-publication}}","text":"//! The native durable conversation authority (Issue #11).\n//!\n//! This module exposes one backend-independent semantic store for the six\n//! distinct durable domains. Pending Inbound remains its own authority for\n//! accepted-but-not-yet-canonically-adopted work:\n//!\n//! ```text\n//! Pending Inbound Inbox\n//!     owns accepted / not-yet-adopted inbound durability\n//!     owns the one per-conversation InboundSequence allocator\n//!     owns the acceptance linearization point\n//!     participates in the canonical-adoption transaction\n//! ```\n//!\n//! It is **not** the Message Ledger, not the Conversation Surface, not the\n//! Event Journal, not a generic queue framework, and not a second scheduler.\n//! The semantic ownership split is:\n//!\n//! ```text\n//! Pending Inbound Inbox  = accepted / not-yet-adopted inbound durability\n//! ConversationInboundMailbox = process-local coordination / wakeup\n//! Message Ledger         = adopted canonical conversational facts\n//! Conversation Surface   = current model-visible ordering/projection\n//! ConversationRuntime    = admission + safe-boundary adoption owner\n//! Event Journal          = execution facts\n//! Publication plane      = user-facing release durability (Issue #108)","url":"https://github.com/Caismis/rustX/blob/8cb41624eb2dc2ca87e4409961f42553ceb029cf/src/durable/mod.rs#L1-L26"},{"id":"inbound-commit","path":"src/durable/mod.rs","start":49,"end":67,"label":"先接收输入，再原子纳入 canonical 历史","text":"//! the same observable contract. The abstraction level is deliberately the\n//! rustX domain transitions — never a generic repository/queue/CRUD frame.\n//!\n//! # Pending inbound linearization points\n//!\n//! 1. **Acceptance**: [`ConversationStore::accept_inbound`] commits the sequence\n//!    allocation, the pending record, and any correlation/idempotency state\n//!    in one transaction. Success is reported only after that commit.\n//! 2. **Adoption**: [`ConversationStore::adopt_pending_batch`] atomically\n//!    reads current rows through the watermark, appends them to the canonical\n//!    Ledger/Surface, constructs their exact answer obligation, and removes\n//!    pending records. Its committed receipt is the only post-claim payload.\n//! 3. **Mutation**: exact pending edit/remove compare occurrence and revision\n//!    inside a durable transaction ordered against adoption. Removal also\n//!    retires the pending transcript reference; canonical history is immutable.\n//!\n//! The publication plane adds its own three (Issue #108): the provider outcome\n//! **P**, the publication terminal **U**\n//! ([`ConversationStore::commit_publication_terminal`]), and canonical","url":"https://github.com/Caismis/rustX/blob/8cb41624eb2dc2ca87e4409961f42553ceb029cf/src/durable/mod.rs#L49-L67"},{"id":"agent-owns","path":"docs/agent-loop.md","start":44,"end":83,"label":"{{concept-attempt}}、{{concept-publication}} 与 {{concept-tool}} 批次由谁管理","text":"## 1. What the Agent Loop owns\n\nWF-02 extracts caller-independent foreground invocation into\n`tools::invocation`. The Agent Loop retains accepted Assistant ToolCalls, call\nslots, outer sibling ordering, atomic ToolResult batch commit and canonical\nhistory. WorkflowRuntime owns graph progression, concrete node identity, typed\nbindings, validated local values and scope settlement. Both use the same native\nnormalization, approval and foreground deadline/cancellation/settlement owner;\nexecutors still own physical execution and evidence. A fixed Tool node has a\nWorkflow invocation identity, never a fabricated model ToolCall. Outer Sequential\nordering holds no capacity token needed by nested leaves; leaf scheduling is\nseparate from canonical sibling ordering. See `docs/workflow-programs.md`.\n\nThe loop (`src/agent`) executes one attempt to its single terminal outcome:\n\n- attempt lifecycle (`AttemptStarted` → one terminal settlement candidate,\n  normally one committed terminal event)\n- turn lifecycle (one model response plus its tool calls and results)\n- provider-independent `ModelStreamItem` consumption and canonical `Event`\n  validation/message assembly\n- the durable publication stream of every model request (Issue #108): opening\n  it, feeding the bounded coalescer, committing frames before releasing them,\n  committing the publication terminal (U) after the provider outcome (P), and\n  settling the stream exactly once as canonical, unaccepted, or incomplete\n- tool resolution and tool execution (in deterministic block order)\n- canonical continuation state retention and propagation\n- safe-boundary inbound mailbox consumption (one finite drain per boundary)\n- the attempt-local post-tool-batch delivery marker: one marker after one\n  complete canonical ToolResult batch, consumed only by the next existing\n  primary step\n- cancellation observation and terminal cancellation outcome\n- the recorded `RuntimeEvent` trace\n- the moved `ConversationState` owned by the attempt while it runs\n- the pending fresh inbound trigger lifecycle (`FreshInboundTurn`), the\n  attempt-local `PostToolBatch` opportunity, and their composition into one\n  native Context Assembly generation\n- the finite `ContributorInputSnapshot` boundary and certified-extension\n  proposal admission\n- the one cancellation-vs-start arbitration point of every model turn\n  (Issue #12, M9b): staging without durable effect, then the fused durable","url":"https://github.com/Caismis/rustX/blob/8cb41624eb2dc2ca87e4409961f42553ceb029cf/docs/agent-loop.md#L44-L83"},{"id":"context-contract","path":"src/context/mod.rs","start":1,"end":12,"label":"历史编译器的接口与动态 Context Assembly","text":"//! The context plane: bounded read-only resources, typed historical projections,\n//! deterministic compilation, token accounting and compaction planning.\n//!\n//! Immutable Canonical History supplies committed facts. Durable checkpoint\n//! activations select Original and Derived context. Compilation includes only\n//! eligible Tail strictly after the checkpoint base. The Agent Loop adds current\n//! core-owned input and freezes exact semantic model requests before dispatch.\n//! Default Summary writes a Derived checkpoint item and never a canonical User.\n//!\n//! Context Assembly remains the sole admission path for dynamic contributors.\n//! `ContextRuntime` bundles the engine, summary service and admitted Agent Status\n//! contributor; execution owns timeout policy, cancellation and monotonic clocks.","url":"https://github.com/Caismis/rustX/blob/8cb41624eb2dc2ca87e4409961f42553ceb029cf/src/context/mod.rs#L1-L12"},{"id":"context-owners","path":"docs/context-engine.md","start":18,"end":36,"label":"Context 编译职责与有限历史缓存","text":"## Ownership\n\n| Owner | Authority |\n| --- | --- |\n| Canonical History | Real committed User, Assistant and Tool facts, with physical Message and Tool-call occurrence identities |\n| Context Engine | Historical selection compilation, structural/native replay validation, token accounting and compaction planning |\n| CompactionResources | Cut-bounded, read-only canonical/trajectory/lifecycle, Journal, checkpoint, frozen request and settled Artifact access; admitted model budgets and supervised summary capability |\n| Durable Store | Immutable checkpoint bodies, projection activations/head, fencing/CAS, atomic local completion and operation receipts |\n| Agent Loop | Current frozen logical-generation input, cancellation grants, actual starts, independent recovery/retry budgets and tool settlement |\n| Provider adapters | Wire encoding, native reasoning replay and accepted-output continuation rules |\n| Event Journal | Actual execution facts; projected calls/results never become executions |\n| RequestSnapshot | Exact provider-neutral input of one actual started request |\n| Runtime Client and clients | Canonical execution trajectory and separately labelled projected context/request detail |\n\nThe ordinary canonical working-set cache can append real committed identities.\nIt cannot replace a span, create a summary identity, or select historical model\ncontext independently of the checkpoint compiler. Normal head reads resolve\ncheckpoint Original identities and post-base Tail identities within finite\nbounds; they do not replay or hydrate the complete old Ledger.","url":"https://github.com/Caismis/rustX/blob/8cb41624eb2dc2ca87e4409961f42553ceb029cf/docs/context-engine.md#L18-L36"},{"id":"context-cuts","path":"docs/context-engine.md","start":38,"end":54,"label":"Read cut、{{concept-checkpoint}} base、激活与严格的 {{concept-tail}}","text":"## Four different boundaries\n\n1. **Resource Read Cut** freezes source Ledger, Journal, Transcript and projection\n   activation coordinates together. Reads after capture are short-lived and return\n   detached owned values. A completion committed after the Journal cut remains\n   invisible to that operation's lifecycle queries.\n2. **Checkpoint Base Ledger Frontier B** is a complete inclusion/exclusion\n   decision for eligible canonical history through B. Provenance references and\n   the last retained Original do not move this frontier.\n3. **Checkpoint Activation** is a separate monotonic timeline coordinate. Two\n   activations can occur at the same Ledger frontier and remain distinct boundaries.\n4. **Request History Cut** freezes checkpoint identity/activation/base and the\n   request's pre-start Ledger frontier. Default Tail is strictly `(B, request L]`.\n\nA checkpoint at L100 that excludes M96–M100 never revives those messages through\nTail. A later M101 remains eligible. Unrelated Journal appends do not change a\ncandidate's head, immutable dependencies or execution fence.","url":"https://github.com/Caismis/rustX/blob/8cb41624eb2dc2ca87e4409961f42553ceb029cf/docs/context-engine.md#L38-L54"},{"id":"context-typed","path":"docs/context-engine.md","start":56,"end":82,"label":"{{concept-original}} 与 {{concept-derived}} 身份不是执行身份","text":"## Typed checkpoints and occurrence identity\n\nA checkpoint contains ordered Original references and materialized Derived\nmessages. An Original is scoped to a conversation and complete immutable-body\nSHA-256 digest. A Derived has typed User, Assistant or Tool content and scoped\ncanonical/checkpoint provenance, without a canonical MessageId. Text, Reasoning,\nToolCall, ToolResult, Refusal and supported media retain their typed representation.\nEvery historical Derived item must name at least one canonical or parent-checkpoint\nsource. A transformation label alone is not provenance. The compiler enforces this\nuniversal historical rule and scope/self-reference checks; durable authority validates\nimmutable bodies, digests, eligibility and dependency ordering. Parent-only summaries\nare permitted. This rule does not apply to request-only synthetic material.\n\nThese identity domains are distinct:\n\n- Physical canonical ToolCall: accepted Assistant MessageId and canonical block index.\n- Checkpoint occurrence: CheckpointId, item index and projected block index.\n- Actual-request occurrence: new RequestId, item index and request block index.\n- Provider wire correlation: the provider's string label.\n\nRepeated wire strings do not identify one historical execution. The compiler\nvalidates Original/Original, Original/Derived, Derived/Original and Derived/Derived\ncall/result pairs, complete batches, explicit reordered coordinates and physical\nsources. Ambiguous associations, orphan results and split batches fail. Snapshots\nfreeze the resulting actual-request association map, reidentified on a new request.\nNo ToolExecution event, duration, usage or execution statistic comes from a\nprojected call/result.","url":"https://github.com/Caismis/rustX/blob/8cb41624eb2dc2ca87e4409961f42553ceb029cf/docs/context-engine.md#L56-L82"},{"id":"compaction-commit","path":"docs/context-engine.md","start":94,"end":115,"label":"{{concept-checkpoint}} 的原子提交与取消授权","text":"## Durable commit and recovery\n\nAllocate CompactionOperationId before its associated Started fact. A candidate\nfingerprint describes checkpoint content; it is separate from an actual semantic\nrequest fingerprint. One immediate transaction validates the expected head,\nexisting execution owner/fence, immutable dependencies and trusted metadata, then\npersists content, activation/head, diagnostics, the actual local CompactionCompleted\nfact and an idempotent receipt. Every transaction-stage failure rolls back all of\nthose writes.\n\nThe same operation and candidate recover the same historical receipt. Reusing\nan operation with different candidate content conflicts. Uncertain commit outcomes\nare resolved by operation lookup, without another summary invocation. A confirmed\nsuccessful commit cannot be followed by a contradictory CompactionFailed fact.\nInstallation reads the current durable head under the current owner; an old receipt\ncannot install an old checkpoint over a newer head. Unreconciled installation stops\nexecution before a provider start.\n\nCancellation and checkpoint authorization share a short grant gate. Cancellation\nbefore grant prevents commit; cancellation after grant cannot undo the authorized\ntransaction. Actual model-request start arbitration remains a separate existing\nAgent owner gate. Neither path adds a durable execution state machine.","url":"https://github.com/Caismis/rustX/blob/8cb41624eb2dc2ca87e4409961f42553ceb029cf/docs/context-engine.md#L94-L115"},{"id":"frozen-input","path":"docs/context-engine.md","start":267,"end":300,"label":"固定逻辑输入，为实际请求保存精确快照","text":"## Exact frozen input and composed retries\n\nThe Agent Loop retains the latest immutable semantic input of a logical generation.\nAn authorized semantic correction or compaction advances that version. A transient\nretry uses the latest version, with new request, publication and provisional-output\nidentities and equivalent content/wire associations:\n\n```text\nQ1(I1) -\u003e overflow -\u003e authorized P2 -\u003e freeze I2\nQ2(I2) -\u003e transient failure -\u003e Q3(I2)\n\nQ1(I1) -\u003e authorized correction -\u003e freeze I2\nQ2(I2) -\u003e overflow -\u003e authorized compaction -\u003e freeze I3\nQ3(I3) -\u003e transient failure -\u003e Q4(I3), including corrective material\n```\n\nRetry and recovery budgets remain independent and share the actual-request ordinal.\nSemantic fingerprints do not deduplicate starts, provider usage or execution facts.\nFor Context K, Q1 records Visible=[K], Introduced=[K]; a genuinely new Q2 records\nVisible=[K], Introduced=[] with K appearing once. Recovery of the exact same Q1\nreceipt retains Q1's original introduction records.\n\nContent-changing image downgrade and upload-path rendering produce request-local\nDerived messages with scoped provenance. Dynamic materialization is complete\nbefore final token validation, snapshot commit and dispatch. Changed semantic\ncontent never silently keeps an Original identity. System/tool/workflow/correction\nmaterial stays with the frozen input version through all later transient retries.\n\nRequestSnapshot stores ordered immutable Original dependencies, complete Derived\nbodies, request-only context, selected image bytes, invocation, continuation source,\nTool associations and semantic fingerprint. Reconstruction performs keyed immutable\nreads only; it never reruns compaction, contributors, upload mappings, image selection\nor dynamic discovery. Exact reconstruction, current resendability and generation\nreproducibility are different capabilities.","url":"https://github.com/Caismis/rustX/blob/8cb41624eb2dc2ca87e4409961f42553ceb029cf/docs/context-engine.md#L267-L300"},{"id":"context-start","path":"docs/agent-loop.md","start":626,"end":662,"label":"先准备 Context 与请求，再原子提交启动事实","text":"## 4.2 Context Assembly and model-turn start\n\nThe Agent Loop is the coordination owner. It creates one finite immutable\n`ContributorInputSnapshot`, samples native observations, invokes the one\n`ContextAssembly` contract, awaits every bounded contributor future, and\nreceives transient typed proposals. The assembly layer assigns trusted\nprovenance, finite semantic lanes, stable extension ordering, and\n`ContextGeneration`; contributors cannot allocate canonical IDs or mutate\nthe conversation.\n\nAssembly output is then **staged**, not committed:\n`AgentExecution::stage_context` validates the proposals against a scratch\nconversation state (no durable effect), and `prepare_model_turn` derives\nthe frozen `RequestSnapshot` and provider-neutral `ModelRequest` from the\nstaged surface. Cancellation observed anywhere up to this point settles\nthe attempt with nothing committed.\n\nThe one cancellation-vs-start linearization point of every model turn is\n`AgentCancellation::arbitrate_model_turn_start`: the attempt's start gate\nis held across the cancellation check and the fused durable start commit,\nso exactly one of cancellation and the start commit can linearize first\n(Issue #12, M9b):\n\n```text\ntransient proposals\n    ↓\nstage_context: validate in scratch state, prepare canonical commits\n    ↓ (no durable effect)\nprepare_model_turn: freeze RequestSnapshot + ModelRequest\n    ↓\n┌─ start gate held ─────────────────────────────────────────────┐\n│ cancellation check                                            │\n│     ↓ not cancelled                                           │\n│ ConversationStore::commit_model_turn_start — ONE transaction: │\n│   canonical request-scoped User context + RequestSnapshot    │\n│   (including the frozen Effective System Prompt) +           │\n│   ModelRequestStarted + sequence binding                      │","url":"https://github.com/Caismis/rustX/blob/8cb41624eb2dc2ca87e4409961f42553ceb029cf/docs/agent-loop.md#L626-L662"},{"id":"start-meaning","path":"docs/agent-loop.md","start":664,"end":691,"label":"Started 禁止静默重发，但不证明远端已执行","text":"    ↓\nindependent durable reconstruction/equality verification\n    ↓ prepared-request equality
