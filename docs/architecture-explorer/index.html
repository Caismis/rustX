   (Activity frames only, child-\u003eparent; its stall or loss\n//! channel          is diagnostics-only and never evidences lifecycle)\n//! start gate       (the child performs no semantic work before Delegate)\n//! escalation       (Cancel frame -\u003e SIGTERM group -\u003e SIGKILL group)\n//! wait/reap        (the direct child is reaped exactly here)\n//! ```\n//!\n//! The logical [`SubagentRegistry`](super::registry) never holds an OS\n//! process handle: it stages a [`StagedChild`], and the one ownership\n//! commit moves the handle into the registry-owned driver task. No second\n//! kill/reap authority exists anywhere.\n//!\n//! # Platform semantics\n//!\n//! The child is a **direct child** of the runtime process on both Linux and\n//! macOS, spawned into its own process group so escalation can signal the\n//! whole group. Parent-lifetime containment does not depend on a platform\n//! primitive: the control channel endpoint is inherited by the child as its\n//! fd 0, and every other copy of the parent's endpoint is `CLOEXEC` by\n//! construction (Rust socket creation), so a hard parent death — including\n//! `SIGKILL` — closes the channel and the child observes EOF. A child that","url":"https://github.com/Caismis/rustX/blob/8cb41624eb2dc2ca87e4409961f42553ceb029cf/src/runtime/subagent/process.rs#L1-L29"},{"id":"map-workflow-tool","path":"src/runtime/workflow/tool.rs","start":31,"end":72,"label":"Workflow Tool node uses ToolInvocationId::Workflow and {{native}} {{preflight}}","text":"\nimpl WorkflowRuntime {\n    /// One exact admitted registration through the standard native\n    /// invocation path and the invoking Session's execution binding.\n    /// External Tools keep their own admitted materialization contract.\n    #[allow(clippy::too_many_lines)]\n    pub(super) async fn invoke_tool(\n        \u0026self,\n        run: \u0026WorkflowRun,\n        context: \u0026AttemptSubagentContext,\n        node: \u0026WorkflowNodeInstance,\n        selector: \u0026ExactToolSelector,\n        arguments: Value,\n        cancellation: \u0026crate::runtime::cancellation::ExecutionCancellation,\n    ) -\u003e Result\u003cToolExecutionResult, WorkflowRunError\u003e {\n        let services = context.native.as_ref().ok_or_else(|| {\n            WorkflowRunError::InvocationAuthority(\n                \"attempt has no native invocation services\".into(),\n            )\n        })?;\n        let definition = run.tools.get(selector).ok_or_else(|| {\n            WorkflowRunError::CapabilityNotAdmitted(\n                \"capability was not admitted to this Workflow\".into(),\n            )\n        })?;\n        let registration = context\n            .resources()\n            .capability()\n            .available_tools()\n            .registration(definition)\n            .map_err(WorkflowRunError::IdentityChanged)?;\n        let id = ToolInvocationId::Workflow {\n            node: Box::new(node.clone()),\n        };\n        self.read_model.node(node, |view| {\n            view.invocation = Some(id.clone());\n            view.tool_id = Some(definition.id.clone());\n        });\n        let prepared = match registration\n            .prepare_fixed(id.clone(), definition, \u0026arguments)\n            .map_err(WorkflowRunError::IdentityChanged)?\n        {","url":"https://github.com/Caismis/rustX/blob/8cb41624eb2dc2ca87e4409961f42553ceb029cf/src/runtime/workflow/tool.rs#L31-L72"},{"id":"map-workflow-bound","path":"src/runtime/workflow/execution.rs","start":30,"end":67,"label":"Workflow recursively validates {{finite}} expansion bounds","text":"\n/// Deliberate worst-case expansion, including iteration admission steps. Each\n/// recursion is checked before multiplication, so overflow is not a bound.\npub(super) fn static_execution_bound(\n    block: \u0026WorkflowBlockProgram,\n) -\u003e Result\u003c(usize, usize), super::WorkflowCompileError\u003e {\n    let mut steps = block.nodes.len();\n    let mut agents = 0;\n    for node in block.nodes.values() {\n        match node {\n            WorkflowNodeProgram::Agent(_) =\u003e agents += 1,\n            WorkflowNodeProgram::Parallel { branches, .. } =\u003e {\n                for branch in branches.values() {\n                    let (child_steps, child_agents) = static_execution_bound(\u0026branch.block)?;\n                    steps += child_steps;\n                    agents += child_agents;\n                }\n            }\n            WorkflowNodeProgram::Loop {\n                body,\n                max_iterations,\n                ..\n            } =\u003e {\n                let (child_steps, child_agents) = static_execution_bound(body)?;\n                steps += (child_steps + 1) * *max_iterations as usize;\n                agents += child_agents * *max_iterations as usize;\n            }\n            _ =\u003e {}\n        }\n        if steps \u003e MAX_WORKFLOW_STEPS || agents \u003e MAX_WORKFLOW_AGENTS {\n            return Err(super::WorkflowCompileError::InvalidField(\n                \"aggregate expanded execution bound exceeded\".into(),\n            ));\n        }\n    }\n    Ok((steps, agents))\n}\n","url":"https://github.com/Caismis/rustX/blob/8cb41624eb2dc2ca87e4409961f42553ceb029cf/src/runtime/workflow/execution.rs#L30-L67"},{"id":"map-goal-state","path":"src/goal.rs","start":1,"end":8,"label":"GoalPhase::Active authorizes eligible autonomous {{admission-goal}}","text":"//! Revisioned Goal authority. History and events are observations, never state.\n//!\n//! `GoalPhase` is the one product-visible Goal lifecycle authority (Issue\n//! #351). `GoalPhase::Active` **is** durable authorization to continue: the\n//! owning `ConversationRuntime` may admit an autonomous round whenever it\n//! reaches an eligible safe idle boundary. There is no second, process-local\n//! activation state, so no reader can observe an Active Goal that is\n//! silently inert.","url":"https://github.com/Caismis/rustX/blob/8cb41624eb2dc2ca87e4409961f42553ceb029cf/src/goal.rs#L1-L8"},{"id":"map-goal-types","path":"src/goal.rs","start":24,"end":72,"label":"GoalRef, GoalPhase and {{durable}} GoalSnapshot","text":"/// Exact observation required by every mutation of an existing Goal.\n#[derive(Debug, Clone, PartialEq, Eq, Serialize, Deserialize, schemars::JsonSchema)]\n#[serde(deny_unknown_fields)]\npub struct GoalRef {\n    pub id: String,\n    pub revision: u64,\n}\n\n/// The single durable Goal lifecycle authority.\n///\n/// - `Active`: continuation is authorized when runtime admission is eligible.\n/// - `Paused` / `Blocked`: continuation is not authorized.\n/// - `Complete`: terminal.\n#[derive(Debug, Clone, Copy, PartialEq, Eq, Serialize, Deserialize)]\n#[serde(rename_all = \"snake_case\")]\n#[derive(schemars::JsonSchema)]\npub enum GoalPhase {\n    Active,\n    Paused,\n    Blocked,\n    Complete,\n}\n\n/// Trusted origin supplied by runtime, never by model arguments.\n#[derive(Debug, Clone, PartialEq, Eq, Serialize, Deserialize)]\n#[serde(tag = \"kind\", rename_all = \"snake_case\", deny_unknown_fields)]\n#[derive(schemars::JsonSchema)]\npub enum GoalOrigin {\n    HumanAttempt {\n        message_id: MessageId,\n        attempt_id: AttemptId,\n    },\n    RuntimeControl,\n}\n\n/// Authoritative bounded durable record.\n#[derive(Debug, Clone, PartialEq, Eq, Serialize, Deserialize)]\n#[serde(deny_unknown_fields)]\n#[derive(schemars::JsonSchema)]\npub struct GoalSnapshot {\n    pub reference: GoalRef,\n    pub objective: String,\n    pub phase: GoalPhase,\n    pub blocked_reason: Option\u003cString\u003e,\n    pub autonomous_round_budget: u32,\n    pub autonomous_rounds_consumed: u32,\n    pub origin: GoalOrigin,\n    pub last_round_message_id: Option\u003cMessageId\u003e,\n}","url":"https://github.com/Caismis/rustX/blob/8cb41624eb2dc2ca87e4409961f42553ceb029cf/src/goal.rs#L24-L72"},{"id":"map-extensions-bind","path":"src/extensions.rs","start":28,"end":65,"label":"NativeContextComposition registers Agent Status through ContextAssembly","text":"    }\n\n    pub(crate) fn bind(\n        \u0026mut self,\n        assembly: \u0026mut crate::context::ContextAssembly,\n        composition: Option\u003c\u0026NativeAgentExtensions\u003e,\n        runtime: \u0026crate::tools::runtime::ConversationToolRuntime,\n        lifecycle: crate::agent::lifecycle::AttemptLifecycle,\n    ) -\u003e Result\u003ccrate::agent::lifecycle::AttemptLifecycle, crate::context::ContextAssemblyError\u003e\n    {\n        if let Some(composition) = composition {\n            composition.register_domain_context(assembly, runtime)?;\n        }\n        if let Some(engine) = self.status.take() {\n            let background = runtime.background().clone();\n            let todos = composition\n                .filter(|c| c.todo().is_some())\n                .and_then(|_| runtime.todos())\n                .cloned();\n            assembly.register_native(\n                crate::runtime::identity::NativeContextContributor::AgentStatus,\n                Arc::new(crate::context::status::StatusContextContributor {\n                    engine: std::sync::Mutex::new(engine),\n                    background: Arc::new(move || background.active_snapshot()),\n                    todo: Arc::new(move || {\n                        todos\n                            .as_ref()\n                            .map(|todos| todos.committed().status_presentation())\n                    }),\n                    reminders: Arc::new(ContributionReminderReader(runtime.durable_store())),\n                }),\n            )?;\n        }\n        #[cfg(test)]\n        let lifecycle = composition\n            .into_iter()\n            .flat_map(|c| \u0026c.test_contributors)\n            .filter(|probe| probe.observe_tools)","url":"https://github.com/Caismis/rustX/blob/8cb41624eb2dc2ca87e4409961f42553ceb029cf/src/extensions.rs#L28-L65"},{"id":"map-publication-proposals","path":"src/publication/mod.rs","start":80,"end":93,"label":"{{publication}} Tool proposals confer no execution {{map-agent-authority}}","text":"//! `MessageId`. See [`carryover`] for the shared selector and renderer.\n//!\n//! # Tool proposals are not executions\n//!\n//! Tool-call frames are **model proposals**, never Tool Plane execution\n//! facts. The vocabulary names them so\n//! ([`PublicationPayload::ProposedToolCallStarted`] and siblings), and the\n//! durable store enforces the hard invariant that no proposal belonging to an\n//! Incomplete or Unaccepted publication may have a dependent\n//! `ToolExecutionStarted`, `ToolResult`, or side-effect authorization.\n//! The store also owns the proposal staging state machine: Started freezes the\n//! stream-local block/tool/name identity, arguments require Started, and\n//! Completion advances it exactly once to Completed.\n","url":"https://github.com/Caismis/rustX/blob/8cb41624eb2dc2ca87e4409961f42553ceb029cf/src/publication/mod.rs#L80-L93"},{"id":"map-conversation-hot","path":"src/conversation/mod.rs","start":1,"end":11,"label":"{{canonical}} {{map-ledger}}, historical {{projection-context}} and hot state {{ownership}}","text":"//! Immutable canonical conversation facts and their bounded hot working set.\n//!\n//! The Message Ledger owns committed messages. Surface bookkeeping records only\n//! ordinary canonical appends; it does not select compacted model history.\n//! Durable typed Projection Checkpoints and their activation timeline own\n//! historical inclusion and ordering. The Context Engine compiles a checkpoint\n//! plus eligible Tail, while the Agent Loop adds and freezes current core input.\n//!\n//! There is one mutable hot `ConversationState`: the coordinator owns it between\n//! attempts and `AgentExecution` owns it while running. It caches retained Original\n//! facts, never gives Derived projected content a canonical `MessageId`.","url":"https://github.com/Caismis/rustX/blob/8cb41624eb2dc2ca87e4409961f42553ceb029cf/src/conversation/mod.rs#L1-L11"}]},"terms":[{"id":"contract","label":"contract","explanation":"rustX 把调用规则写进内层接口；例如 ModelAdapter.stream 每次只发起一个 provider request，重试必须交回 AgentExecution，避免绕过请求启动记录。"},{"id":"contract-model","label":"contract","explanation":"ModelAdapter.stream 接到一个 ModelRequest 后只能执行一次 provider 尝试；不能私下重试、重连或切换提供方，否则 AgentExecution 无法为每次实际请求分配身份和保存输入。"},{"id":"contract-tool","label":"contract","explanation":"Tool Plane 用同一套定义、schema、策略与 ForegroundInvocation 管理原生 Tool、MCP 和 Python；Agent Loop 仍负责已接受调用的结果槽位和原子批次。"},{"id":"contract-runtime","label":"contract","explanation":"ConversationRuntime 是一个 Conversation 的协调入口；外部组件提交输入，只有它能决定何时启动 AgentExecution，扩展不能另建一条执行队列。"},{"id":"contract-publication","label":"contract","explanation":"AgentExecution 必须先把输出帧写入 Publication 存储，再交给客户端接口；最终仍须满足 P \u003c U \u003c C，客户端看到文本不等于 Assistant 已进入历史。"},{"id":"responsibility","label":"responsibility","explanation":"ConversationRuntime 决定何时运行一个 Attempt，AgentExecution 决定 Attempt 内的模型轮次和 Tool 批次；客户端只展示这些组件产生的事实。"},{"id":"ownership","label":"ownership","explanation":"rustX 将运行对象交给明确组件管理：ConversationRuntime 持有当前 Attempt，执行器收束自己启动的工作；取消信号不能代替资源回收。"},{"id":"owner","label":"owner","explanation":"这里指负责执行并收束该工作的组件。例如 Tool 执行器必须处理自己启动的进程和 worker，Agent Loop 才能得到可提交的结果。"},{"id":"owner-process","label":"owner","explanation":"本地 TUI 创建自己的 stdio App Server 子进程，因此正常退出时会显式请求关闭它；单纯 EOF 只会释放连接，不能代替该关闭请求。"},{"id":"authority","label":"authority","explanation":"rustX 读取对应领域已提交的事实来作决定；例如 Tool 是否完成要查执行结果证据，不能根据 UI 进度或客户端断线来推断。"},{"id":"authority-ledger","label":"authority","explanation":"ConversationStore 中不可变的 Message Ledger 决定 canonical 历史；Context Checkpoint、实时缓存与 Trace 都不能改写已提交消息。"},{"id":"authority-goal","label":"authority","explanation":"只有 GoalDomain 的 GoalPhase::Active 授权后续自主轮次；UI 投影出的生命周期、Workflow 完成或 runtime drain 都不能自行把 Goal 判为完成或暂停。"},{"id":"authority-request","label":"authority","explanation":"已启动请求的 RequestSnapshot 保存该请求确切输入；重新检查时按历史键读取，不能用当前配置或重新运行 compaction 猜测模型当时看到了什么。"},{"id":"authority-delivery","label":"authority","explanation":"只有已提交的类型化 Tool 交付元数据能授权对话记录卡片；文件写入成功、进度事件或模型声称文件存在都不足以证明交付。"},{"id":"authority-session","label":"authority","explanation":"SessionController 保存 Session 图、cwd 和显式选择；冷加载再解析当前资源。凭据、连接和当时的有效 Registry 不是 Session 保存的身份事实。"},{"id":"authority-checkpoint","label":"authority","explanation":"已激活 Checkpoint 决定历史 Context 选中哪些 Original/Derived；它能排除 M96…M100，却不能删除这些 canonical Ledger 消息。"},{"id":"native","label":"native","explanation":"rustX 自己的 runtime、Tool Plane 和领域接口直接处理操作；App Server 只转发到这些接口，不另造一套执行或取消规则。"},{"id":"composition","label":"composition","explanation":"LocalConversationCore::compose_with_access 把解析后的模型、Tools、扩展与资源装成一个本地运行核心；Session 冷加载复用这条路径。"},{"id":"residency","label":"residency","explanation":"SessionRuntimeManager 保存当前加载的 host/core 和 incarnation。成功 shutdown 并证明无剩余受管理工作后才卸载它们，Session 的磁盘数据继续保留。"},{"id":"adoption","label":"adoption","explanation":"adopt_pending_batch 在同一事务中取出当前 Pending Inbound 批次、追加 canonical User 事实并移除 pending 记录；输入先被保存，不代表已经进入模型历史。"},{"id":"acceptance","label":"acceptance","explanation":"rustX 先验证并提交事实，后续步骤才能据此运行；例如模型流中的 Tool 提案必须进入 canonical Assistant 后才产生可执行槽位。"},{"id":"acceptance-inbound","label":"acceptance","explanation":"accept_inbound 原子分配序号并保存 Pending Inbound；此时可向客户端展示排队输入，但它尚未被 adopt_pending_batch 纳入 canonical User 历史。"},{"id":"acceptance-assistant","label":"acceptance","explanation":"AgentExecution 在 provider 结果 P 和 Publication 终态 U 之后进行 Registry 检查，再提交 canonical Assistant C；只有其中的 ToolCall 才成为执行槽位。"},{"id":"acceptance-tool","label":"acceptance","explanation":"Agent Loop 提交 Assistant 的 ToolCall 后，必须为每个已接受调用保留一个结果槽位；后续策略拒绝或启动前取消仍要产生对应结果。"},{"id":"staging","label":"staging","explanation":"这里需区分两步：当前请求的 Context 可以只在内存中准备；Publication 输出帧则必须先写入存储，才能发给客户端。"},{"id":"staging-context","label":"staging","explanation":"Context 先在当前请求内准备，尚不写入历史；只有模型启动 gate 获胜后，事务才一起提交 Context、RequestSnapshot 与 ModelRequestStarted。"},{"id":"staging-publication","label":"staging","explanation":"flush_publication 先把合并后的输出帧持久写入 Publication，再向观测接口发送；这份审计只证明可能发出的内容，不证明用户看到。"},{"id":"publication","label":"publication","explanation":"模型的流式文本或 Tool 提案经 Publication 写入并向客户端输出；即使完整显示，仍要等待独立的 canonical Assistant 提交，提案也不能立即执行。"},{"id":"release","label":"release","explanation":"输出先进入 Publication 存储，再通过客户端接口向外发送；发送动作发生在 canonical Assistant 提交之前，不能据此认为提案已获执行许可或用户已经看到。"},{"id":"publish","label":"publish","explanation":"这里是把已准备的结果交给下游，例如向客户端发送已提交帧或报告卸载成功；发送动作本身不构成客户端已读证明。"},{"id":"dispatch","label":"dispatch","explanation":"AgentExecution 先提交实际请求启动、重建并校验 RequestSnapshot，随后才调用 ModelAdapter；有启动记录不等于已执行到这个调用。"},{"id":"dispatch-tool","label":"dispatch","explanation":"ForegroundInvocation 经过取消、策略与批准检查后才启动 Tool 操作；构造调用对象只捕获资源，不能作为物理工作已开始的证据。"},{"id":"arbitration","label":"arbitration","explanation":"request_cancel 与 arbitrate_model_turn_start 争用同一 Attempt gate：取消先进入则不执行启动事务；启动先进入则先提交，后来的取消不能撤销该身份。"},{"id":"boundary","label":"boundary","explanation":"rustX 在不同步骤记录不同事实：输出帧已提交、Assistant 已进入历史、Tool 已物理完成，不能因为其中一步发生就推断另一步完成。"},{"id":"boundary-contract","label":"boundary","explanation":"内层只依赖 rustX 的 ModelAdapter、ToolExecutor 等接口；提供方 SDK、MCP SDK、数据库和 HTTP 类型止于外层实现，不进入 Agent 内核。"},{"id":"frontier","label":"frontier","explanation":"请求启动事务一旦提交，rustX 就不能把这次请求当作从未开始并静默重发；即使随后崩溃，也不能证明远端没执行。"},{"id":"frontier-start","label":"frontier","explanation":"Context、RequestSnapshot 和 ModelRequestStarted 一起提交后，这次请求越过禁止重发的位置；崩溃可能发生在 ModelAdapter 调用前，恢复也不会盲目再发。"},{"id":"frontier-tool","label":"frontier","explanation":"执行器启动证据先于实际外部修改，是保守的恢复判断点；存在它却没有可信结果时，rustX 必须保留 OutcomeUnknown，不能重试未知副作用。"},{"id":"bounded","label":"bounded","explanation":"rustX 每次只读取给定 cut 内的历史或使用容量受限的缓存；例如 Context Tail 截止本次 request cut，后续消息不会偷偷进入已准备请求。"},{"id":"finite","label":"finite","explanation":"本次工作只覆盖已确定的一组项目，例如当前 pending 批次、所选来源需求或 Workflow 节点；它不代表能够持续调度新 Goal 轮次。"},{"id":"fold","label":"fold","explanation":"RuntimeClientProjection 把 runtime 事件依次合并为当前客户端视图，同时更新快照与游标；它不向执行层写回状态。"},{"id":"materialization","label":"materialization","explanation":"Checkpoint commit 保存 Derived 的实际正文，而不是以后再运行摘要生成器；检查旧请求时因此能读取相同内容。"},{"id":"normalization","label":"normalization","explanation":"ForegroundInvocation 先整理并校验 Tool 参数，再固定为不可变调用参数；批准展示与实际执行使用同一份参数，避免用户批准后执行内容又发生变化。"},{"id":"normalization-path","label":"normalization","explanation":"SessionFileReference 保存文件对应的 Conversation/cwd 身份和整理后的路径；它仍指向可变文件，重新打开可能得到新内容或 Missing。"},{"id":"normalization-events","label":"normalization","explanation":"ModelAdapter 把各家 provider 流转换成 ModelStreamItem；只有语义输出进入 Publication，内部进度不冒充模型正文。"},{"id":"shadowing","label":"shadowing","explanation":"同名 Workspace 资源在校验前整体覆盖 User 定义；上层定义无效时操作明确失败，不退回下层可用定义。"},{"id":"receipt","label":"receipt","explanation":"成功的存储事务返回已提交事实的凭证，例如模型启动或 Checkpoint commit；后来的取消不能抹掉它，也不能把它当作远端执行证明。"},{"id":"slot","label":"slot","explanation":"一个 canonical ToolCall 对应一个结果位置；Agent Loop 按调用顺序一次提交整个批次，实际完成顺序和取消不会改变这些位置。"},{"id":"effect","label":"effect","explanation":"Tool 可能已经写入共享 Session 文件或修改远端系统；取消、Workflow 失败和恢复都不会自动回滚这些已完成修改。"},{"id":"physical","label":"physical","explanation":"这里检查真正启动的进程、worker 或远端操作，而非只看模型提案或取消标记；本地资源收束和远端结果已知仍是两件事。"},{"id":"drain","label":"drain","explanation":"runtime 从 Running 进入 Draining 后关闭新输入 admission，继续监督已有 Attempt、后台工作、MCP 进程和 worker，直到各自完成 settlement。"},{"id":"terminal","label":"terminal state","explanation":"Attempt 最后只交回一个完成、取消或失败候选；若 Journal 追加失败，状态机仍已终止并保留结果候选，但不会虚构持久终态记录或观察者事件。"},{"id":"terminal-publication","label":"terminal state","explanation":"Publication 的最终帧/状态 U 在 provider 结果 P 之后提交、在 canonical Assistant C 之前提交；完整 U 没有 C 仍是 UnacceptedPublicationAudit。"},{"id":"terminal-tool","label":"terminal state","explanation":"Tool 必须返回有证据支撑的 Success、Failed、Cancelled 等结果；传输丢失时不能凭取消意图认定远端已停止。"},{"id":"terminal-goal","label":"terminal state","explanation":"GoalPhase::Complete 表示领域目标已结束；Workflow 返回或一个 Attempt 完成并不能自行把 Goal 写成 Complete。"},{"id":"source","label":"source","explanation":"这里看实际数据从哪个领域读入：Context 编译器读取 Ledger 与 Checkpoint，不能从界面缓存倒推出执行历史。"},{"id":"source-config","label":"source","explanation":"冷加载读取当前配置、MCP 定义和 Python 包；发现定义并不连接服务器或准备环境，只有选中并通过 admission 的需求才启动准备。"},{"id":"provenance","label":"provenance","explanation":"rustX 保留输入或派生项来自哪次受限操作的信息；这些线索有助检查，但不能替代 canonical MessageId 或实际执行身份。"},{"id":"provenance-derived","label":"provenance","explanation":"Derived Context 保存指向 canonical 消息或父 Checkpoint 项的来源引用；例如摘要可引用 M1…M20，但自身没有 canonical MessageId。这些引用不能移动 Checkpoint base 或让被排除消息重新进入 Tail。"},{"id":"frozen","label":"frozen","explanation":"Agent 捕获本轮语义输入后不再让当前配置和发现结果改变它；每次实际请求仍获得新身份，并在启动时保存自己的精确 RequestSnapshot。"},{"id":"replay","label":"replay","explanation":"RuntimeClientProjection 向重连客户端提供容量受限的事件记录以重建界面；这不是重新执行模型或 Tool，也不是恢复的事实依据。"},{"id":"replay-tool","label":"replay","explanation":"恢复不会重新调用结果不明的 Tool；启动证据存在而结果未知时填补 OutcomeUnknown，避免外部修改被重复执行。"},{"id":"recovery","label":"recovery","explanation":"加载时按持久事实修补缺失结果：无启动证据可报告启动前取消，有启动却结果未知则保留不确定性；已提交结果不覆盖，未知副作用不重跑。"},{"id":"revision","label":"revision","explanation":"Session 设置或 Goal 状态改变时推进对应版本；Goal 轮次的输入保存、版本推进和已消耗轮次数在同一个事务中提交。"},{"id":"snapshot","label":"snapshot","explanation":"客户端获取 runtime 当前视图的副本用于重建界面；它不是 canonical 历史，也不能作为请求恢复时重新执行工作的依据。"},{"id":"snapshot-request","label":"snapshot","explanation":"RequestSnapshot 在实际请求启动事务中保存确切输入及依赖；启动 gate 之前不会留下该请求的快照，后来检查也不会重新发现当前资源。"},{"id":"cursor","label":"cursor","explanation":"RuntimeClientProjection 为事件分配位置，客户端重连时据此读取可用事件；缓存有界，游标不是持久执行身份。"},{"id":"scope","label":"scope","explanation":"WorkflowRuntime 为 root、branch、body 各自保存局部值和实例，完成 join 后按定义顺序汇合；这些执行仍共享 Session 工作区。"},{"id":"scope-request","label":"scope","explanation":"本次请求的 Context 与 RequestSnapshot 只描述这次实际请求；它们不能代表整个 Attempt 后续重试和 continuation 的新请求身份。"},{"id":"scope-derived","label":"scope","explanation":"Derived 的产生线索只适用于对应 compaction/Checkpoint，不提供 canonical 消息身份，也不授权 Tool 执行。"},{"id":"preflight","label":"preflight","explanation":"Registry 在提交 canonical Assistant 前检查 Tool 结构和 schema；业务拒绝保留为结果槽位，不可信结构则不能进入执行批次。"},{"id":"observation","label":"observation","explanation":"Prepared、Started、Progress、Completed 或客户端状态通知让 UI 展示进展；它们不授予权限，也不能代替可信 Tool 结果和物理完成证据。"},{"id":"framing","label":"framing","explanation":"App Server 适配 Stdio JSONL 或 WebSocket 的消息封装，把带版本 JSON-RPC 请求交给相同路由，不把传输格式变成 Conversation 调度器。"},{"id":"canonical","label":"canonical","explanation":"提交到 Message Ledger 的 User、Assistant 与 Tool 消息构成 Conversation 历史；流式提案和 Checkpoint 摘要不能冒充这些消息。Event Journal 另记真实执行事实，不能与模型历史消息混为一谈。"},{"id":"projection","label":"projection","explanation":"RuntimeClientProjection 从 runtime 事实整理客户端视图；即使没有客户端连接，执行规则也相同，缓存不驱动恢复或取消。"},{"id":"projection-context","label":"projection","explanation":"Context Engine 用 Checkpoint 中的 Original/Derived 和严格 Tail 编译模型输入；该选择可以排除旧消息，但不修改 Ledger，也不会执行其中的 Tool 内容。"},{"id":"compaction","label":"compaction","explanation":"Context Engine 提交新的 Checkpoint 来选择历史输入，保存 Derived 正文和 base；M1…M100 等原始 Ledger 事实保持不可变，不插入 canonical 摘要消息。"},{"id":"settlement","label":"settlement","explanation":"组件必须把自己管理的工作带到有证据的结束状态并交回结果；Tool 需要先回收本地 worker，runtime 卸载还要等待所有受管理工作完成，取消信号本身不够。"},{"id":"settlement-publication","label":"settlement","explanation":"Publication 根据 P、U、C 已提交到哪一步，保留 Canonical、UnacceptedPublicationAudit 或 IncompletePublicationAudit；不能把未接受输出混入 Assistant 历史。"},{"id":"admission","label":"admission","explanation":"ConversationRuntime 在同一个协调器锁下决定是否启动 Attempt；Running → Draining 也使用这把锁，因此关闭后不能再有输入偷偷越过运行入口。"},{"id":"admission-config","label":"admission","explanation":"配置选择先形成有限的能力需求，rustX 校验并允许这些需求后才解析凭据、连接 MCP 或准备 Python；仅发现文件或列出子 Agent 不会激活资源。"},{"id":"admission-context","label":"admission","explanation":"ContextAssembly 的动态内容须在当前请求获得允许后才能合入输入；它不能自行变成 canonical 消息，模型启动失败也不会留下部分 Context 提交。"},{"id":"admission-transport","label":"admission","explanation":"WebSocket 连接建立前校验专用传输 token；initialize 只协商协议，不提供进程内租户身份验证。"},{"id":"admission-goal","label":"admission","explanation":"GoalRoundDriver 仅在协调器安全空闲点提交普通 Pending Inbound；接受轮次、推进 Goal 版本和消耗轮次计数在同一 SQLite 事务完成。"},{"id":"quiescence","label":"quiescence","explanation":"shutdown 必须证明所有 rustX 管理的 Attempt、worker、准备任务与进程已完成收束，SessionRuntimeManager 才能卸载旧组合并允许新写入者；断线或已发取消都不足够。"},{"id":"durable","label":"durable","explanation":"SessionController 的 catalog 保存 Session 身份与显式设置，ConversationStore 保存各 Conversation 的 Ledger、输入、请求与审计等领域事实；这些数据在运行核心卸载后仍保留，连接与凭据不因此成为 Session 状态。"},{"id":"persistence","label":"persistence","explanation":"rustX 将事实通过存储事务写入 SQLite；例如 Context、RequestSnapshot 和 ModelRequestStarted 同时成功或都不留下，准备好内存对象并不等于已经写入。"},{"id":"authority-runtime","label":"authority","explanation":"ConversationRuntime 决定 admission、取消与运行生命周期；RuntimeClientProjection 和 App Server 只转发控制或展示事实，不能凭连接状态替它判定执行结束。"},{"id":"authority-publication","label":"authority","explanation":"Assistant C 的提交关联已持久保存的 Publication 结果与终态 U；单凭实时输出、完整 U 或客户端进度都不能生成 canonical Assistant 事实。"},{"id":"contract-context","label":"contract","explanation":"Context Engine 只编译获授权的历史和动态输入；Checkpoint 决定历史选择，Agent 冻结当前输入并通过启动事务提交精确请求，编译器不能修改 Ledger 或执行 Tool。"},{"id":"contract-layering","label":"contract","explanation":"ModelAdapter、ToolExecutor 等内层接口只出现 rustX 自己的领域类型；提供方 SDK、MCP SDK、SQLite 与 HTTP 类型封装在适配器外层。"},{"id":"contract-no-ack","label":"contract","explanation":"runtime 没有证明用户已看到输出的 ACK 机制；PublicationAudit 只限定可能被发送的内容，不能用它宣称客户端已读。"},{"id":"composition-input","label":"composition","explanation":"Agent 将 Checkpoint/Tail 历史、Fresh Inbound、动态 Context、prompt、Tool 定义和 continuation 合成当前语义输入；这一步不重新创建 Session runtime。"},{"id":"frozen-agent","label":"frozen","explanation":"DurableAgentAuthority 创建时捕获模型、Tools、Skills、Plugins、资源、策略和工作区；后续 activation 使用这组能力，不重新寻找另一个 profile。"},{"id":"frozen-package","label":"frozen","explanation":"Managed Python 准备已捕获的包字节和隔离 uv 环境；子 Agent 获得已捕获的 Skills 包，后续调用不靠重新发现当前文件来改变输入。"},{"id":"frozen-workspace","label":"frozen","explanation":"Agent activation 绑定 Session 已确定的绝对工作区目录；父子 Agent 共享该目录，能看到彼此未 commit 的文件写入，没有独立 worktree。"},{"id":"frozen-config","label":"frozen","explanation":"一个配置 generation 捕获这次组合的能力与扩展；已通过 admission 的工作继续使用该 generation，后续配置变化不改写它。"},{"id":"snapshot-model","label":"snapshot","explanation":"ConversationRuntime 保存当前 Attempt 使用的模型选择；子 Agent 省略模型选择时继承调用方 Attempt 已捕获的有效模型，不能临时重读默认配置。"},{"id":"snapshot-content","label":"snapshot","explanation":"SessionFileReference 指向可变路径，不能保存当时的文件字节；与不可变 ArtifactStore 不同，再次打开可能得到变化后的内容或 Missing。"},{"id":"physical-message","label":"physical","explanation":"canonical User、Assistant、Tool 消息各有真实 MessageId；Derived Context 没有这个身份，projection 中相似的 Tool 文本也不代表执行过一次 Tool。"},{"id":"admission-subagent","label":"admission","explanation":"SubagentRegistry 针对具体 Agent 和 activation 分配受管理运行；使用已捕获的能力，精确控制这一次 activation，不能让后续任务替换已有等待目标。"},{"id":"admission-workflow","label":"admission","explanation":"Workflow 静态检查并捕获本次程序需要的有限能力；执行 root、branch、body block 时复用它们，不重新发现资源或伪造模型 ToolCall。"},{"id":"scope-agent","label":"scope","explanation":"子 Agent 的能力按其命名 profile 捕获；Root 专属 Goal 追求在子 Agent 范围内被拒绝，不会把 Root 的长期目标控制扩散到子运行。"},{"id":"settlement-attempt","label":"settlement","explanation":"AgentExecution 把最终 ConversationState 和唯一的 Attempt 完成/取消/失败候选交回协调器；终态 Journal 追加失败时，候选与内存终止状态仍在，但不能伪造持久终态记录或观察者事件。"},{"id":"replay-effect","label":"replay","explanation":"已有启动证据却没有可信结果时，rustX 不重新执行模型请求或 Tool；远端可能已发生修改，恢复须报告不确定性，避免重复副作用。"},{"id":"replay-cursor","label":"replay","explanation":"重连客户端按游标读取 RuntimeClientProjection 已保存的有限事件，再重建界面；缓存不会重新执行 Tool 或充当 canonical 历史与恢复输入。"},{"id":"allocation","label":"allocation","explanation":"SessionRuntimeManager 加载期间保留 Conversation 的目录/文件系统分配和运行 incarnation；只有旧运行成功收束后才释放，避免同一 Conversation 出现第二个可写 runtime。"},{"id":"slot-attempt","label":"slot","explanation":"ConversationRuntime 在协调器锁下只持有一个当前 Attempt；生产者可以保存 pending 输入，但不能绕开这个位置另启 AgentExecution。"},{"id":"release-output","label":"release","explanation":"flush_publication 在每帧写入 Publication 后才向客户端接口发送；审计只限定可能发送的内容，既不证明客户端已读，也不授权 Tool 提案执行。"},{"id":"release-residency","label":"release","explanation":"SessionRuntimeManager 只有在 shutdown 成功并证明无剩余受管理工作后才释放 host/core、分配与条目；随后公布卸载成功，旧句柄成为 StaleIncarnation，Session 数据继续保留。"},{"id":"source-code","label":"source","explanation":"这里展示固定 main commit 中指定文件与行号的 Rust 或文档摘录，用于核对 rustX 的实际接口和执行顺序；它不是当前 Session 重新发现的配置资源，也不会随运行状态变化。"},{"id":"authority-result","label":"authority","explanation":"已提交的 canonical Tool 结果就是该调用的最终结果；恢复只补缺失项，不能用迟到取消、缓存进度或新的猜测覆盖它。"},{"id":"authority-recovery","label":"authority","explanation":"恢复读取对应 Conversation 的持久 Ledger、请求启动、执行结果等领域事实；RuntimeClientProjection 的事件缓存和 Trace 只供展示，不能触发恢复或覆盖这些事实。"},{"id":"provenance-context","label":"provenance","explanation":"Checkpoint 的 Original 项保留 canonical 消息引用与 digest；Derived 项保存 canonical 消息或父 Checkpoint 项的来源引用。两者都只是历史输入选择，不能产生 ToolExecution 事实。"},{"id":"terminal-managed","label":"terminal state","explanation":"shutdown 等待每类受管理工作通过自己的完成规则：Attempt 交回最终候选，进程和 worker 完成本地收束，结果未知的远端操作保留不确定性；发出取消不能替代这些结束证据。"},{"id":"contract-model-cancellation","label":"contract","explanation":"ModelAdapter 接收 Attempt 的子取消信号 model_cancellation()；取消按统一 ModelStreamItem 语义以 Failed(Cancelled) 结束流，不会撤销已提交启动或证明远端没有执行。"},{"id":"acceptance-continuation","label":"acceptance","explanation":"Agent 只保留已经接受的 continuation，并与同一不可变输入版本一起进入下一轮；每次实际续接仍生成新请求身份并经过启动 gate，适配器不能私下续接。"},{"id":"snapshot-source","label":"snapshot","explanation":"导览固定使用 8cb41624 这次 commit 的代码与文档视图；摘录字节和行号链接独立固定，不会跟随当前 checkout 改动。这是源码版本视图，不是 runtime/client 状态副本，也不是保存实际模型请求输入的 RequestSnapshot。"},{"id":"map-read-cut","label":"read cut","explanation":"Context 读取历史时先固定 Ledger、Journal 与 activation 的位置；之后追加的 ToolResult 不能混进同一次 compaction 输入。"},{"id":"map-checkpoint","label":"Checkpoint","explanation":"当旧历史需要缩短时，rustX 保存 Original 引用与 Derived 内容的完整选择；它改变下次模型看到的历史，不会改写已经提交的 Message Ledger。"},{"id":"map-tail","label":"Tail","explanation":"激活某个 Checkpoint 后，Context 只接上其 base frontier 之后仍符合条件的 canonical 消息，避免把已经由 Checkpoint 决定的旧消息再拼一次。"},{"id":"map-activation","label":"activation","explanation":"同一份 Checkpoint 内容可以带有独立的安装顺序；读取历史时选择生效的 activation，而不是拿 Journal 序号冒充它。"},{"id":"map-gate","label":"start gate","explanation":"AgentCancellation 的同一个 mutex 包住 request_cancel 和实际 request-start commit；取消先进入就没有请求快照，commit 先成功则后到取消只能按已启动处理。"},{"id":"map-grant","label":"compaction grant","explanation":"compaction 完成校验后向 CancellationSignal 取得一个带 operation_id 的授权；之后到达的取消不能撤销该次已授权的 Checkpoint commit。"},{"id":"map-single-flight","label":"single-flight","explanation":"两个客户端同时 load 同一个 Conversation 时加入同一次 manager transition；某个等待者断开不会丢弃仍在组合或卸载的任务。"},{"id":"map-incarnation","label":"runtime incarnation","explanation":"同一 Conversation 卸载再加载会得到新的 RuntimeIncarnationId；旧 attachment 不能借相同 Session 身份控制新 runtime。"},{"id":"map-watermark","label":"watermark","explanation":"ConversationRuntime 在一次安全输入点只取到固定的 Pending Inbound 位置；随后到达的消息留给后面的采纳机会，不让当前批次无限增长。"},{"id":"map-continuation","label":"continuation","explanation":"模型完成一次 Tool 批次后，AgentExecution 用已接受的结果继续逻辑步骤；adapter 不得在一次 stream 内偷偷再发一个提供方请求。"},{"id":"map-preparation","label":"preparation","explanation":"配置发现某个 MCP server 后仍未连接；只有选定的能力需求进入原生准备步骤，成功对象才有资格进入有效 CapabilitySnapshot。"},{"id":"map-semantic","label":"semantic","explanation":"Session load 先组合 Conversation 的身份、历史和执行规则，再激活 runtime；这些规则由原生 owner 决定，传输只携带类型化请求。"},{"id":"map-idempotent","label":"idempotent","explanation":"同一 request-start 的精确重试返回历史 receipt；Agent 看到 IdempotentReplay 后不再向在线 observer 重发那些已经提交的启动事件。"},{"id":"map-linearization","label":"linearization point","explanation":"Running 转 Draining 与新 Attempt admission 争用同一个 coordinator lock；谁先成功决定这次新工作能否开始，而不是根据客户端看到状态的先后猜测。"},{"id":"map-rollback","label":"rollback","explanation":"Workflow 的几个并行节点共享 Session 目录；一个节点失败时已经写入的文件仍保留，结果失败不包含文件系统撤销承诺。"},{"id":"map-exactly-once","label":"exactly-once","explanation":"rustX 可以原子提交一次 ToolResult 批次，但远程 MCP 超时后可能无法知道外部服务是否完成；历史里只有一个结果不保证外部操作只发生一次。"},{"id":"map-proposal","label":"Tool proposal","explanation":"Publication 帧里的 ToolCall 只是模型建议；只有 Agent 接受 canonical Assistant 并完成 Tool Plane 的检查后，才可能获得真实执行身份。"},{"id":"map-pending","label":"Pending Inbound","explanation":"用户输入接受成功后先在 Inbox 持久保存；ConversationRuntime 到安全点提交 adoption 后，它才进入不可变 canonical 对话历史。"},{"id":"map-coalescer","label":"publication coalescer","explanation":"提供方连续发来很多细碎 delta 时，Publication 按字节、结构和首个 payload 的绝对 deadline 合帧；后来的 delta 不延后最老内容的释放期限。"},{"id":"map-attachment","label":"attachment","explanation":"客户端 attach 得到目标身份、snapshot 与 cursor 的同一切面；detach 只移除连接观察关系，不取消 Attempt，也不证明 runtime 已卸载。"},{"id":"map-settlement-plane","label":"settlement plane","explanation":"ForegroundInvocation 判定取消胜出后只等待 executor 的清理通道；该通道必须保有本地任务和进程直到 join/reap，不能把停止等待当作清理完成。"},{"id":"map-ledger","label":"Message Ledger","explanation":"adopt_pending_batch 与 canonical Assistant 接受把消息写入不可变 Ledger；Context 压缩、客户端重连和 Trace 读取都不能改写这些事实。"},{"id":"map-journal","label":"Event Journal","explanation":"ModelRequestStarted、ToolExecutionStarted 等执行事实按自己的序号提交；这个序号不能用作 Checkpoint activation 或客户端 cursor。"},{"id":"map-fencing","label":"fencing","explanation":"旧 runtime 的通知即使晚到，客户端仍要同时匹配 Session、Conversation、incarnation 和 attachment；任何一项过期都不能覆盖当前 projection。"},{"id":"map-quiescence-proof","label":"quiescence proof","explanation":"runtime shutdown 必须等 Attempt task、Tool、本地后台任务、能力准备、MCP 进程及 admission worker 都到达各自结束点；仅 cancel 返回或 registry 为空都不够。"},{"id":"map-result-certainty","label":"result certainty","explanation":"Tool executor 已清理本地执行但远程 MCP 结果无法确认时，返回 Unconfirmed 并形成 OutcomeUnknown；调用者看到显式不确定，不能据此盲目重试。"},{"id":"map-puc","label":"P \u003c U \u003c C","explanation":"提供方完成先提交 P，准备向用户释放的最终帧提交 U，canonical Assistant 接受提交 C；进程在任意两点间崩溃时，恢复仍能分辨输出到达哪一层。"},{"id":"map-model-materialization","label":"materialization","explanation":"父进程把已经选定的模型协议、endpoint、预算和 credential binding 装入 FrozenModelSpec；child 只据此构造 adapter 和 ResolvedModelInvocation，不再读取可变 rustx.toml 重新选模型。"},{"id":"map-projection-publish","label":"publish","explanation":"RuntimeClientProjection 在同一个同步点更新 snapshot、分配 cursor 并交付 RuntimeClientEvent；这里更新的是客户端事件流，不提交模型输出的 Publication 帧，也不接受 canonical Assistant。"},{"id":"map-caller-admission","label":"admission","explanation":"ForegroundInvocation 接手之前，AgentExecution 已决定 canonical Tool 批次中的调用资格，WorkflowRuntime 已决定固定程序节点的调用资格；共享执行器不会代替任一调用方放行新工作。"},{"id":"map-caller-publication","label":"publication","explanation":"ForegroundInvocation 返回执行结果和 InvocationFact 后，由调用方决定如何记录并呈现：AgentExecution 提交 canonical ToolResult 批次，WorkflowRuntime 推进节点并报告节点事实；这不是模型文本的 Publication 输出平面。"},{"id":"map-cancellation-authority","label":"authority","explanation":"AgentCancellation 保留第一次成功进入 start gate 的语义取消原因；已经启动的 Tool 通过 execution_cancellation 读取这个 owner 当前保存的原因，后来的取消不能改写它。"},{"id":"map-attempt-slot","label":"slot","explanation":"ConversationRuntime 在 coordinator lock 内登记唯一 current Attempt；前一个 Attempt 和其 task 没有完成移交前，新的 Attempt 不能占用这个位置。"},{"id":"map-residency-slot","label":"slot","explanation":"unload 尚不能证明旧 runtime 已无写入者时，SessionRuntimeManager 保留原来的 Unloading 条目和分配，阻止同一 Conversation 产生替代 writer。"},{"id":"map-physical-terminal","label":"terminal state","explanation":"执行器必须证明自己管理的进程、worker 或 operation 已到结束点；Unconfirmed 仍要求本地清理完成，但保留远端服务可能已经发生修改的不确定性。"},{"id":"map-invocation-terminal","label":"terminal state","explanation":"ForegroundInvocation 在自然完成、取消和 deadline 中只选一个 winner；取消或 deadline 获胜后，它仍须等待独立 settlement 通道，不能把 winner 当作外部操作已经停止的证明。"},{"id":"map-background-publication","label":"publication","explanation":"background runner 的结果先通过 ConversationInboundMailbox 持久接受为 runtime 输入，再把 registry 记录推进到结束状态；runtime shutdown 要等待这条结果通知路径收束，它不走模型输出的 Publication 帧。"},{"id":"map-start-event-replay","label":"replay","explanation":"commit_model_turn_start 的精确重试可能返回 IdempotentReplay 和旧 receipt；AgentExecution 只向在线 observer 报告新提交的启动事件，不把 receipt 里的历史事实再次发送。"},{"id":"map-capability-revision","label":"revision","explanation":"CapabilityCoordinator 只在有效可执行能力集合变化时推进 CapabilityRevision；MCP 不可用原因等诊断文字变化不会生成新执行版本，已有 Attempt 仍保留取得的旧能力集合。"},{"id":"map-semantic-owner","label":"owner","explanation":"SessionController 决定持久 Session 身份，ConversationRuntime 决定 Attempt admission 和 lifecycle，RuntimeClientProjection 决定客户端视图的 fold/cursor；同一操作要交给对应组件，连接层不能代替它作领域决定。"},{"id":"map-agent-authority","label":"authority","explanation":"AgentExecution 负责本次 Attempt 的实际 model-request start、canonical Assistant/Tool 批次和唯一 terminal 候选；Context contributor 与 Tool executor 只能交回提案或执行事实，不能自行推进这些决定。"},{"id":"map-client-settlement","label":"settlement","explanation":"AppServerClient 在 transport 结束时逐个结束仍在等待的 JSON-RPC 请求；可能改变服务端状态的请求会留下 UncertainOutcomeError，这只结束客户端等待，不证明 runtime 执行已经停止。"},{"id":"map-subagent-authority","label":"authority","explanation":"创建持久 Agent 时，catalog/resolver 冻结它的能力、模型和 Session execution binding；后续 send_message 只能复用该权限，不能靠改变当前 profile 或父调用配置扩大子 Agent 能力。"},{"id":"map-host-admission","label":"admission","explanation":"AppServerHost 在处理请求前检查进程是否仍 Accepting，并为 request、attachment 或文件操作保留容量；额度不足或 server drain 会拒绝新操作，这不是 ConversationRuntime 的 Attempt gate。"},{"id":"map-invocation-arbitration","label":"arbitration","explanation":"ForegroundInvocation 同时观察自然完成、Attempt 取消与 deadline，只确定一个 winner；取消或 deadline 获胜后不再轮询 completion，改由独立 settlement 通道证明清理结果。"}]}</script>
  <script>(() => {
  'use strict';
  const data = JSON.parse(document.getElementById('explorer-data').textContent);
  const workspace = document.getElementById('workspace');
  const nodes = new Map(data.nodes.map((node) => [node.id, node]));
  const evidence = new Map(data.evidence.map((item) => [item.id, item]));
  const views = new Map(data.architecture.views.map((view) => [view.id, view]));
  const terms = new Map(data.terms.map((term) => [term.id, term]));
  const history = [];
  const memories = new Map();
  const state = { mode: 'map', view: 'overview', node: data.nodes[0].id, relation: 'all', request: 0, scenario: 0, choice: 0, step: 0, topic: 0 };
  const escape = (value) => String(value).replace(/[&<>"']/g, (character) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[character]);
  const plain = (value) => String(value).replace(/\{\{([a-z][a-z0-9-]*)\}\}/g, (_, id) => terms.get(id).label);
  const rich = (value) => String(value).split(/(\{\{[a-z][a-z0-9-]*\}\})/g).map((part) => {
    const match = /^\{\{([a-z][a-z0-9-]*)\}\}$/.exec(part);
    if (!match) return escape(part);
    const term = terms.get(match[1]);
    return `<span class="term" data-term="${term.id}" lang="en">${escape(term.label)}</span>`;
  }).join('');
  const list = (items) => `<ul class="plain-list">${items.map((item) => `<li>${rich(item)}</li>`).join('')}</ul>`;
  const badge = (kind) => `<span class="relation-kind ${kind}">${rich({ call: '运行时调用', data: '数据流', dependency: '代码依赖' }[kind])}</span>`;
  const graph = () => state.view === 'overview' ? { title: '架构总览', summary: '从模块进入内部图，再沿机制逐层查看实现。', nodes: data.nodes, relations: data.relations } : views.get(state.view);
  const targetOf = (node) => state.view === 'overview' ? data.architecture.entries[node.id] : node.target;
  const visibleRelations = () => state.view === 'overview' ? selectedRelations() : graph().relations.filter((relation) => state.relation === 'all' || relation.kind === state.relation);
  const selectedRelations = () => graph().relations.filter((relation) => (relation.from === state.node || relation.to === state.node) && (state.relation === 'all' || relation.kind === state.relation));
  const sourceDetails = (ids) => `<section class="source-section" aria-label="source 依据"><h3>查看 {{source-code}} <span class="count">${ids.length}</span></h3><p class="source-help">{{source-code}} 摘录已打包，可离线查看。GitHub 链接会打开固定基线。</p>${ids.map((id) => {
    const item = evidence.get(id);
    return `<details class="source" data-source="${escape(id)}"><summary><span>${rich(item.label)}</span><code>${escape(item.path)}:${item.start}–${item.end}</code></summary><div class="source-body"><div class="source-toolbar"><span>基线 ${escape(data.baseline.commit.slice(0, 8))}</span><a href="${escape(item.url)}" target="_blank" rel="noopener noreferrer">在 GitHub 查看 ↗</a></div><pre tabindex="0" lang="en" aria-label="${escape(item.path)}，第 ${item.start} 至 ${item.end} 行"><code>${item.text.split('\n').map((line, index) => `<span class="source-line"><span class="line-number" aria-hidden="true">${item.start + index}</span><span>${escape(line) || ' '}</span></span>`).join('')}</code></pre></div></details>`;
  }).join('')}</section>`;
  const nodeChips = (ids) => `<div class="node-chips">${ids.map((id) => `<button type="button" class="node-chip" data-inspect="${escape(id)}">${rich(nodes.get(id).label)} <span aria-hidden="true">↗</span></button>`).join('')}</div>`;
  function mapMarkup(active = [], compact = false) {
    const current = compact ? { nodes: data.nodes } : graph();
    const groups = [...new Set(current.nodes.map((node) => node.layer))];
    const neighbors = new Set(compact ? [] : selectedRelations().flatMap((relation) => [relation.from, relation.to]));
    const markers = ['call', 'data', 'dependency'].map((kind) => `<marker id="arrow-${kind}" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 8 4 L 0 8 z"/></marker>`).join('');
    return `<div class="architecture-map ${compact ? 'compact' : state.view !== 'overview' ? 'detail-graph' : ''}" data-map>${compact ? '' : `<svg class="map-lines" aria-hidden="true"><defs>${markers}</defs><g data-lines></g></svg>`}${groups.map((layer, index) => `<section class="map-layer"><h3><span>${String(index + 1).padStart(2, '0')}</span>${rich(layer)}</h3><div class="layer-nodes">${current.nodes.filter((node) => node.layer === layer).map((node) => {
      const target = !compact && targetOf(node);
      return `<button type="button" data-node="${escape(node.id)}" class="map-node ${!compact && node.id === state.node ? 'selected' : ''} ${compact && active.includes(node.id) ? 'active' : ''} ${!compact && neighbors.has(node.id) && node.id !== state.node ? 'neighbor' : ''} ${node.external ? 'external-node' : ''}" aria-label="${escape(plain(node.label))}，${compact || target ? '进入内部图' : '查看实现与 source'}"><span class="node-name">${rich(node.label)}</span>${!compact ? `<span class="node-summary">${rich(node.summary)}</span><span class="node-action">${node.external ? rich('外部 {{owner}} · 跨模块 ↗') : target ? '进入内部图 →' : rich('实现末端 · 查看 {{source-code}}')}</span>` : ''}${compact && active.includes(node.id) ? '<span class="active-dot" aria-hidden="true"></span>' : ''}</button>`;
    }).join('')}</div></section>`).join('')}</div>`;
  }
  function relationsMarkup(node) {
    const relations = selectedRelations();
    const local = new Map(graph().nodes.map((item) => [item.id, item]));
    return `<section class="relationships"><h3>${rich('关联 {{responsibility}}')}</h3><p class="source-help">箭头表示关系方向。代码依赖不代表运行时调用。</p>${relations.length ? `<ul>${relations.map((relation) => `<li>${badge(relation.kind)}<span class="relation-endpoints"><button type="button" data-select="${escape(relation.from)}">${rich(local.get(relation.from).label)}</button><span aria-hidden="true">→</span><button type="button" data-select="${escape(relation.to)}">${rich(local.get(relation.to).label)}</button></span><p>${rich(relation.label)}</p></li>`).join('')}</ul>` : '<p>此节点没有这种类型的关联。</p>'}</section>`;
  }
  function breadcrumbs() {
    const path = [];
    let current = state.view;
    while (current !== 'overview') { path.unshift(views.get(current)); current = views.get(current).parent; }
    return `<nav class="graph-navigation" aria-label="图层导航"><button type="button" class="secondary-button" data-back ${history.length ? '' : 'disabled'}>← 返回上一处</button><ol><li><button type="button" data-view="overview" ${state.view === 'overview' ? 'aria-current="page"' : ''}>架构总览</button></li>${path.map((view) => `<li><span aria-hidden="true">/</span><button type="button" data-view="${view.id}" ${view.id === state.view ? 'aria-current="page"' : ''}>${rich(view.title)}</button></li>`).join('')}</ol></nav>`;
  }
  function relationControls() {
    const options = [['all', '所有关系'], ['call', '运行时调用'], ['data', '数据流'], ['dependency', '代码依赖']];
    return `<div class="map-controls" role="group" aria-label="关系类型">${options.map(([value, label]) =>
      `<button type="button" class="filter ${value}" data-relation="${value}" aria-pressed="${state.relation === value}"><span aria-hidden="true"></span>${label}</button>`
    ).join('')}</div>`;
  }
  function inspectorMarkup(node) {
    const target = targetOf(node);
    const next = target
      ? `<button type="button" class="primary-button enter-graph" data-enter="${target}">${node.external ? '进入外部模块 ↗' : '进入内部图 →'}</button>`
      : `<p class="leaf-note">${rich('此处为实现末端，可展开下方 {{source-code}} 依据。')}</p>`;
    return `<aside class="inspector" aria-label="所选节点">
      <p class="eyebrow">${rich(node.layer)}${node.external ? ' · 外部模块' : ''}</p>
      <h2>${rich(node.label)}</h2><p class="lead">${rich(node.summary)}</p>${next}
      <h3>${rich('{{responsibility}}')}</h3>${list(node.owns)}
      <h3>${rich('{{boundary}}')}</h3>${list(node.boundaries)}
      ${relationsMarkup(node)}${sourceDetails(node.evidence)}
    </aside>`;
  }
  function renderMap() {
    const current = graph();
    const node = current.nodes.find((item) => item.id === state.node);
    const groupCount = new Set(current.nodes.map((item) => item.layer)).size;
    const caption = '卡片箭头进入下一层；实现末端打开右侧说明和 {{source-code}}。虚线外框表示其他 {{owner}}，进入后可返回原处。' + (state.view === 'overview' ? '总览显示选中节点的关系。' : '内部图显示当前过滤下的所有关系，粗线突出选中节点的关系。') + '右侧清单解释选中节点的关系。';
    workspace.innerHTML = `${breadcrumbs()}
      <div class="section-heading">
        <div><p class="eyebrow">01 / ${rich(state.view === 'overview' ? '{{ownership}} 总览' : '{{owner}} 内部图')}</p>
        <h2 tabindex="-1" data-graph-heading>${rich(current.title)}</h2></div><p>${rich(current.summary)}</p>
      </div>
      ${relationControls()}
      <div class="map-layout"><div class="map-board">
        <div class="board-label"><span>${state.view === 'overview' ? '模块入口' : '内部结构'}</span><span>${current.nodes.length} 个节点 / ${groupCount} 个分组</span></div>
        ${mapMarkup()}<p class="map-caption">${rich(caption)}</p>
      </div>${inspectorMarkup(node)}</div>`;
    drawLines();
  }
  function stepperMarkup(steps, index, context) {
    const step = steps[index];
    return `<div class="walk-layout"><aside class="step-index" aria-label="步骤导航"><p class="eyebrow">${context === 'request' ? '请求路径' : '结果路径'}</p><ol>${steps.map((item, itemIndex) => `<li><button type="button" data-step="${itemIndex}" ${index === itemIndex ? 'aria-current="step"' : ''}><span class="step-number">${String(itemIndex + 1).padStart(2, '0')}</span><span>${rich(item.title)}</span>${itemIndex < index ? '<span class="completed" aria-label="已浏览">✓</span>' : ''}</button></li>`).join('')}</ol></aside><article class="step-content"><div class="step-control"><span class="step-progress">第 ${index + 1} 步 / 共 ${steps.length} 步</span><div><button type="button" class="text-button" data-replay ${index === 0 ? 'disabled' : ''}>↺ 重置</button><button type="button" class="square-button" data-prev ${index === 0 ? 'disabled' : ''} aria-label="上一步">←</button><button type="button" class="square-button" data-next ${index === steps.length - 1 ? 'disabled' : ''} aria-label="下一步">→</button></div></div><div class="step-announcement" aria-live="polite" aria-atomic="true"><p class="eyebrow">执行方 / ${rich(step.actor)}</p><h2>${rich(step.title)}</h2></div><p class="step-description">${rich(step.description)}</p><div class="fact-grid"><section><h3><span aria-hidden="true">▣</span> {{durable}} facts</h3><p>${rich(step.durable)}</p></section><section><h3><span aria-hidden="true">◉</span> 客户端可见内容</h3><p>${rich(step.visible)}</p></section></div><section class="active-responsibilities"><h3>此步骤涉及的 {{responsibility}}</h3>${nodeChips(step.active)}<p class="source-help">下方会突出显示相关 {{responsibility}}。选择一项 {{responsibility}} 可查看其架构。</p>${mapMarkup(step.active, true)}</section>${sourceDetails(step.evidence)}<div class="bottom-step-control"><button type="button" class="secondary-button" data-prev ${index === 0 ? 'disabled' : ''}>← 上一步</button>${index < steps.length - 1 ? '<button type="button" class="primary-button" data-next>下一步 →</button>' : '<span class="path-complete">路径结束 <span aria-hidden="true">✓</span></span>'}</div></article></div>`;
  }
  function renderRequest() {
    workspace.innerHTML = `<div class="section-heading"><div><p class="eyebrow">02 / 从意图到 {{observation}}</p><h2>追踪一次请求。</h2></div><p>沿着一条引导式执行路径，按自己的节奏前进，观察 {{responsibility}} 如何在系统中流转。</p></div>${stepperMarkup(data.request, state.request, 'request')}`;
  }
  function renderScenarios() {
    const scenario = data.scenarios[state.scenario];
    const choice = scenario.choices[state.choice];
    workspace.innerHTML = `<div class="section-heading"><div><p class="eyebrow">03 / {{boundary}} 上的决策</p><h2>遇到这些情况时……</h2></div><p>选择一种情境和结果。这些有{{source-code}} 依据的路径说明了架构的约束。</p></div><div class="scenario-tabs" role="group" aria-label="{{boundary}} 场景">${data.scenarios.map((item, index) => `<button type="button" data-scenario="${index}" aria-pressed="${index === state.scenario}"><span>${String(index + 1).padStart(2, '0')}</span>${rich(item.title)}</button>`).join('')}</div><section class="scenario-intro"><div><h2>${rich(scenario.title)}</h2><p>${rich(scenario.intro)}</p></div><fieldset><legend>选择一种结果</legend>${scenario.choices.map((item, index) => `<label class="choice ${state.choice === index ? 'chosen' : ''}"><input type="radio" name="outcome" data-choice="${index}" value="${index}" ${state.choice === index ? 'checked' : ''}><span>${rich(item.label)}</span></label>`).join('')}</fieldset></section>${stepperMarkup(choice.steps, state.step, 'scenario')}`;
  }
  function renderTopics() {
    const topic = data.topics[state.topic];
    workspace.innerHTML = `<div class="section-heading"><div><p class="eyebrow">04 / 深入一层</p><h2>理解系统如何协同运作。</h2></div><p>了解一项设计决策，追踪相关 {{responsibility}}，并查看对应的 {{source-code}} {{snapshot-source}}。</p></div><div class="topic-layout"><aside class="topic-nav" aria-label="深入专题">${data.topics.map((item, index) => `<button type="button" data-topic="${index}" ${index === state.topic ? 'aria-current="true"' : ''}><span>${String(index + 1).padStart(2, '0')}</span>${rich(item.title)}<span aria-hidden="true">↗</span></button>`).join('')}</aside><article class="topic-content"><p class="eyebrow">深入专题 / ${String(state.topic + 1).padStart(2, '0')}</p><h2>${rich(topic.title)}</h2><p class="lead">${rich(topic.summary)}</p><div class="topic-details">${topic.details.map((detail) => `<p>${rich(detail)}</p>`).join('')}</div><h3>相关 {{responsibility}}</h3>${nodeChips(topic.nodes)}${sourceDetails(topic.evidence)}</article></div>`;
  }
  function render() {
    document.querySelectorAll('[data-mode]').forEach((button) => {
      if (button.dataset.mode === state.mode) button.setAttribute('aria-current', 'page');
      else button.removeAttribute('aria-current');
    });
    hideTooltip();
    ({ map: renderMap, request: renderRequest, scenarios: renderScenarios, topics: renderTopics })[state.mode]();
    hydrateTerms();
    revealCurrentStep();
  }
  function revealCurrentStep() {
    const strip = workspace.querySelector('.step-index ol');
    const current = strip?.querySelector('[aria-current="step"]');
    if (!current || strip.scrollWidth <= strip.clientWidth) return;
    const stripBounds = strip.getBoundingClientRect();
    const currentBounds = current.getBoundingClientRect();
    if (currentBounds.right > stripBounds.right - 4) {
      strip.scrollLeft += currentBounds.right - stripBounds.right + 4;
    } else if (currentBounds.left < stripBounds.left + 4) {
      strip.scrollLeft += currentBounds.left - stripBounds.left - 4;
    }
  }
  function drawLines() {
    const map = workspace.querySelector('[data-map]:not(.compact)');
    if (!map) return;
    const svg = map.querySelector('svg');
    const group = svg.querySelector('[data-lines]');
    const bounds = map.getBoundingClientRect();
    svg.setAttribute('viewBox', `0 0 ${bounds.width} ${bounds.height}`);
    const relations = visibleRelations().sort((a, b) => Number(a.from === state.node || a.to === state.node) - Number(b.from === state.node || b.to === state.node));
    group.replaceChildren();
    relations.forEach((relation) => {
      const from = map.querySelector(`[data-node="${relation.from}"]`).getBoundingClientRect();
      const to = map.querySelector(`[data-node="${relation.to}"]`).getBoundingClientRect();
      const down = to.top >= from.top;
      const sameRow = Math.abs(from.top - to.top) < Math.min(from.height, to.height) / 2;
      const right = to.left >= from.left;
      const x1 = (sameRow ? (right ? from.right : from.left) : from.left + from.width / 2) - bounds.left;
      const y1 = (sameRow ? from.top + from.height / 2 : down ? from.bottom : from.top) - bounds.top;
      const x2 = (sameRow ? (right ? to.left : to.right) : to.left + to.width / 2) - bounds.left;
      const y2 = (sameRow ? to.top + to.height / 2 : down ? to.top : to.bottom) - bounds.top;
      let curve = sameRow ? `M${x1},${y1} C${(x1 + x2) / 2},${y1} ${(x1 + x2) / 2},${y2} ${x2},${y2}` : `M${x1},${y1} C${x1},${(y1 + y2) / 2} ${x2},${(y1 + y2) / 2} ${x2},${y2}`;
      if (state.view !== 'overview' && !sameRow) {
        // Use the space between columns or the outer gutters for longer local edges.
        const sameColumn = Math.abs(from.left - to.left) < Math.min(from.width, to.width) / 2;
        const leftColumn = from.left + from.width / 2 < bounds.left + bounds.width / 2;
        const startRight = sameColumn ? !leftColumn : right;
        const endRight = sameColumn ? !leftColumn : !right;
        const startX = (startRight ? from.right : from.left) - bounds.left;
        const endX = (endRight ? to.right : to.left) - bounds.left;
        const startY = from.top + from.height / 2 - bounds.top;
        const endY = to.top + to.height / 2 - bounds.top;
        const lane = sameColumn ? (leftColumn ? 1 : bounds.width - 1) : bounds.width / 2;
        curve = `M${startX},${startY} H${lane} V${endY} H${endX}`;
      }
      const line = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      line.setAttribute('d', curve);
      line.setAttribute('class', `map-line ${relation.kind}${state.view === 'overview' ? '' : relation.from === state.node || relation.to === state.node ? ' emphasized' : ' subdued'}`);
      line.setAttribute('marker-end', `url(#arrow-${relation.kind})`);
      group.append(line);
    });
  }
  const routeKey = () => state.mode === 'map' ? `map:${state.view}` : state.mode;
  function capture() { return { state: { ...state }, x: window.scrollX, y: window.scrollY, disclosures: [...workspace.querySelectorAll('details[open]')].map((item) => item.dataset.source) }; }
  function remember() { memories.set(routeKey(), capture()); }
  function restore(saved, focus = false) {
    Object.assign(state, saved.state); render();
    saved.disclosures.forEach((id) => { const detail = workspace.querySelector(`details[data-source="${id}"]`); if (detail) detail.open = true; });
    window.scrollTo(saved.x, saved.y);
    if (focus) workspace.querySelector('[data-graph-heading]')?.focus({ preventScroll: true });
  }
  function openView(id) {
    if (state.mode === 'map' && state.view === id) return;
    remember(); history.push(capture());
    const saved = memories.get(`map:${id}`);
    if (saved) { restore(saved, true); return; }
    state.mode = 'map'; state.view = id; state.node = graph().nodes[0].id; state.relation = 'all';
    render(); workspace.scrollIntoView({ block: 'start' });
    workspace.querySelector('[data-graph-heading]').focus({ preventScroll: true });
  }
  function navigateNode(id) { openView(data.architecture.entries[id]); }
  function selectNode(id) {
    state.node = id; render();
    workspace.querySelector(`.map-node[data-node="${id}"]`).focus({ preventScroll: true });
  }
  const tooltip = document.createElement('div');
  tooltip.id = 'term-tooltip'; tooltip.className = 'term-tooltip'; tooltip.setAttribute('role', 'tooltip'); tooltip.hidden = true;
  document.body.append(tooltip);
  let tooltipAnchor = null;
  let tooltipTimer;
  function hideTooltip() {
    clearTimeout(tooltipTimer);
    if (tooltipAnchor) tooltipAnchor.removeAttribute('aria-describedby');
    tooltipAnchor = null; tooltip.hidden = true;
  }
  function positionTooltip() {
    if (!tooltipAnchor || tooltip.hidden) return;
    const bounds = (tooltipAnchor.closest('button,summary,a,label') || tooltipAnchor).getBoundingClientRect();
    tooltip.style.maxHeight = 'calc(100vh - 24px)';
    const width = tooltip.offsetWidth; const height = tooltip.offsetHeight;
    const gap = 10; const margin = 12;
    let left = Math.max(margin, Math.min(bounds.left, window.innerWidth - width - margin));
    let top;
    if (bounds.bottom + gap + height <= window.innerHeight - margin) top = bounds.bottom + gap;
    else if (bounds.top - gap - height >= margin) top = bounds.top - gap - height;
    else if (bounds.right + gap + width <= window.innerWidth - margin) {
      left = bounds.right + gap; top = Math.max(margin, Math.min(bounds.top, window.innerHeight - height - margin));
    } else if (bounds.left - gap - width >= margin) {
      left = bounds.left - gap - width; top = Math.max(margin, Math.min(bounds.top, window.innerHeight - height - margin));
    } else {
      const below = window.innerHeight - bounds.bottom - gap - margin;
      const above = bounds.top - gap - margin;
      const available = Math.max(below, above, 40);
      tooltip.style.maxHeight = `${available}px`;
      top = below >= above ? bounds.bottom + gap : Math.max(margin, bounds.top - gap - tooltip.offsetHeight);
    }
    tooltip.style.left = `${left}px`; tooltip.style.top = `${top}px`;
  }
  function showTooltip(anchor, spans) {
    hideTooltip(); tooltipAnchor = anchor;
    tooltip.innerHTML = spans.map((span) => {
      const term = terms.get(span.dataset.term);
      return `<p><strong lang="en">${escape(term.label)}</strong><span>${rich(term.explanation)}</span></p>`;
    }).join('');
    // Explanations are prose, never nested tooltip triggers.
    tooltip.querySelectorAll('.term').forEach((span) => { span.replaceWith(document.createTextNode(span.textContent)); });
    tooltip.hidden = false; anchor.setAttribute('aria-describedby', tooltip.id); positionTooltip();
  }
  function hydrateTerms() {
    const walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT);
    const pending = [];
    while (walker.nextNode()) {
      const node = walker.currentNode;
      if (node.textContent.includes('{{') && !node.parentElement.closest('script,style,pre,code,[data-verbatim],.term-tooltip')) pending.push(node);
    }
    pending.forEach((node) => {
      const template = document.createElement('template'); template.innerHTML = rich(node.textContent); node.replaceWith(template.content);
    });
    document.querySelectorAll('[aria-label]').forEach((element) => {
      const label = element.getAttribute('aria-label');
      if (label.includes('{{')) element.setAttribute('aria-label', plain(label));
    });
    document.querySelectorAll('.term:not(.term-tooltip .term)').forEach((span) => {
      if (!span.closest('button,a,summary,label')) span.tabIndex = 0;
    });
  }
  const delayedHide = () => { clearTimeout(tooltipTimer); tooltipTimer = setTimeout(() => {
    if (tooltipAnchor && (tooltipAnchor.matches(':hover') || tooltip.matches(':hover') || tooltipAnchor === document.activeElement || tooltipAnchor.contains(document.activeElement))) return;
    hideTooltip();
  }, 140); };
  document.addEventListener('pointerover', (event) => {
    const span = event.target.closest('.term');
    if (span && !tooltip.contains(span)) showTooltip(span, [span]);
    else if (tooltip.contains(event.target)) clearTimeout(tooltipTimer);
  });
  document.addEventListener('pointerout', (event) => {
    if (event.target.closest('.term') || tooltip.contains(event.target)) {
      if (tooltip.contains(event.relatedTarget) || tooltipAnchor?.contains(event.relatedTarget)) return;
      delayedHide();
    }
  });
  document.addEventListener('focusin', (event) => {
    const anchor = event.target;
    const scope = anchor.matches('input') ? anchor.closest('label') : anchor;
    const spans = anchor.matches('.term') ? [anchor] : [...scope.querySelectorAll('.term')];
    if (spans.length) showTooltip(anchor, spans); else hideTooltip();
  });
  document.addEventListener('focusout', delayedHide);
  document.addEventListener('keydown', (event) => { if (event.key === 'Escape') hideTooltip(); });
  window.addEventListener('scroll', positionTooltip, { passive: true });
  window.addEventListener('resize', positionTooltip);
  document.addEventListener('click', (event) => {
    const button = event.target.closest('button');
    if (!button || button.disabled) return;
    if (button.dataset.mode) {
      if (state.mode === button.dataset.mode) return;
      remember(); history.push(capture());
      const saved = memories.get(button.dataset.mode === 'map' ? `map:${state.view}` : button.dataset.mode);
      if (saved) restore(saved); else { state.mode = button.dataset.mode; render(); workspace.scrollIntoView({ block: 'start' }); }
      return;
    }
    if (button.hasAttribute('data-back')) { remember(); const saved = history.pop(); if (saved) restore(saved, true); return; }
    if (button.dataset.view) { openView(button.dataset.view); return; }
    if (button.dataset.enter) { openView(button.dataset.enter); return; }
    if (button.dataset.inspect) { navigateNode(button.dataset.inspect); return; }
    if (button.dataset.select) { selectNode(button.dataset.select); return; }
    if (button.dataset.node) {
      if (state.mode !== 'map') { navigateNode(button.dataset.node); return; }
      const node = graph().nodes.find((item) => item.id === button.dataset.node);
      const target = targetOf(node);
      if (target) { state.node = node.id; openView(target); } else selectNode(node.id);
      return;
    }
    if (button.dataset.relation) {
      state.relation = button.dataset.relation; render();
      workspace.querySelector(`[data-relation="${state.relation}"]`).focus({ preventScroll: true });
      return;
    }
    if (button.dataset.scenario !== undefined) { state.scenario = Number(button.dataset.scenario); state.choice = 0; state.step = 0; render(); workspace.querySelector(`[data-scenario="${state.scenario}"]`).focus({ preventScroll: true }); return; }
    if (button.dataset.topic !== undefined) { state.topic = Number(button.dataset.topic); render(); workspace.querySelector(`[data-topic="${state.topic}"]`).focus({ preventScroll: true }); return; }
    if (!['request', 'scenarios'].includes(state.mode)) return;
    const indexKey = state.mode === 'request' ? 'request' : 'step';
    const steps = state.mode === 'request' ? data.request : data.scenarios[state.scenario].choices[state.choice].steps;
    let changed = false;
    if (button.dataset.step !== undefined) { state[indexKey] = Number(button.dataset.step); changed = true; }
    if (button.hasAttribute('data-prev')) { state[indexKey] = Math.max(0, state[indexKey] - 1); changed = true; }
    if (button.hasAttribute('data-next')) { state[indexKey] = Math.min(steps.length - 1, state[indexKey] + 1); changed = true; }
    if (button.hasAttribute('data-replay')) { state[indexKey] = 0; changed = true; }
    if (changed) {
      render();
      const heading = workspace.querySelector('.step-announcement h2');
      heading.tabIndex = -1;
      heading.focus({ preventScroll: true });
      heading.scrollIntoView({ block: 'nearest' });
    }
  });
  document.addEventListener('change', (event) => {
    if (event.target.name === 'outcome') {
      state.choice = Number(event.target.value); state.step = 0; render();
      workspace.querySelector(`input[name="outcome"][value="${state.choice}"]`).focus({ preventScroll: true });
    }
  });
  document.querySelector('.wordmark').addEventListener('click', (event) => {
    event.preventDefault(); openView('overview');
  });
  document.getElementById('intro').innerHTML = rich(data.intro);
  document.title = `${plain(data.title)} · rustX`;
  document.getElementById('baseline').innerHTML = `<span class="baseline-tag">{{source-code}} 基线</span><details class="baseline-details"><summary><code>${escape(data.baseline.commit.slice(0, 8))}</code> <span data-verbatim>${escape(data.baseline.branch)}</span><span aria-hidden="true">⌄</span></summary><div><code>${escape(data.baseline.commit)}</code><p lang="en" data-verbatim>${escape(data.baseline.subject)}</p><p>本导览介绍的是固定 {{snapshot-source}}，不会跟踪当前工作区，也不会执行请求。</p></div></details><span class="simulation-label">教学模拟</span>`;
  render();
  new ResizeObserver(() => {
    drawLines();
    revealCurrentStep();
  }).observe(workspace);
})();
</script>
</body>
</html>
