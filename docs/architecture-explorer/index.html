l registry of one attempt's capability set.\n///\n/// The registry is a correctness boundary: it validates every registration\n/// (duplicate ids, duplicate model-facing names, invalid identities,\n/// invalid JSON Schema, reserved runtime-property collisions, invalid\n/// policy combinations, and the fixed intrinsic policies of\n/// `execution`) and resolves model-issued calls unambiguously. There\n/// is no ID-first/name-fallback behavior: a canonical call whose id and name\n/// disagree is a contract violation.\n#[derive(Default)]\npub struct ToolRegistry {\n    entries: Vec\u003cToolRegistration\u003e,\n    by_id: HashMap\u003cToolId, usize\u003e,\n    by_name: HashMap\u003cString, usize\u003e,\n}\n\nimpl std::fmt::Debug for ToolRegistry {","url":"https://github.com/Caismis/rustX/blob/8cb41624eb2dc2ca87e4409961f42553ceb029cf/src/tools/executor.rs#L697-L735"},{"id":"map-context-contributor","path":"src/context/assembly.rs","start":328,"end":346,"label":"ContextContributor receives {{finite}} immutable input and proposes typed context","text":"\n/// The contributor API. Implementations receive only a finite immutable\n/// snapshot and return transient typed proposals.\npub trait ContextContributor: Send + Sync {\n    /// Whether acquisition may fail without failing the logical step.\n    fn requirement(\u0026self) -\u003e ContributionRequirement {\n        ContributionRequirement::Mandatory\n    }\n\n    /// Produce bounded proposals for one primary model step.\n    ///\n    /// # Errors\n    ///\n    /// Returns a context assembly error when the contributor cannot produce\n    /// a bounded proposal batch.\n    fn contribute\u003c'a\u003e(\n        \u0026'a self,\n        input: \u0026'a ContributorInputSnapshot,\n    ) -\u003e BoxFuture\u003c'a, Result\u003cVec\u003cContextProposal\u003e, ContextAssemblyError\u003e\u003e;","url":"https://github.com/Caismis/rustX/blob/8cb41624eb2dc2ca87e4409961f42553ceb029cf/src/context/assembly.rs#L328-L346"},{"id":"map-context-accepted","path":"src/context/assembly.rs","start":422,"end":433,"label":"AcceptedContext separates {{canonical}} user context and request-only system sections","text":"#[derive(Debug, Clone, PartialEq)]\npub struct AcceptedContext {\n    pub opportunities: ContributionOpportunities,\n    pub post_tool_batch_anchor: Option\u003ccrate::durable::TranscriptCursor\u003e,\n    /// Canonical User context facts awaiting core `MessageId` allocation.\n    pub user_messages: Vec\u003cAcceptedUserContext\u003e,\n    /// Request-time system sections awaiting effective-prompt rendering.\n    pub system_sections: Vec\u003cAcceptedSystemSection\u003e,\n    /// The identity/generation explanation of the accepted assembly.\n    pub generation: ContextGeneration,\n}\n","url":"https://github.com/Caismis/rustX/blob/8cb41624eb2dc2ca87e4409961f42553ceb029cf/src/context/assembly.rs#L422-L433"},{"id":"map-goal-driver","path":"src/goal.rs","start":609,"end":621,"label":"GoalRoundDriver forwards ordinary mailbox {{acceptance-inbound}} without its own task","text":"/// Synchronous coordinator participant, with no queue or task of its own.\npub(crate) struct GoalRoundDriver;\n\nimpl GoalRoundDriver {\n    pub(crate) fn request(\n        domain: \u0026GoalDomain,\n        mailbox: \u0026crate::runtime::inbound::ConversationInboundMailbox,\n        timestamp: chrono::DateTime\u003cchrono::Utc\u003e,\n    ) -\u003e Result\u003cbool, crate::runtime::inbound::MailboxError\u003e {\n        mailbox.accept_goal_round(domain, timestamp)\n    }\n}\n","url":"https://github.com/Caismis/rustX/blob/8cb41624eb2dc2ca87e4409961f42553ceb029cf/src/goal.rs#L609-L621"},{"id":"map-workflow-runtime","path":"src/runtime/workflow.rs","start":2233,"end":2250,"label":"WorkflowRuntime owns read model and reuses {{native}} SubagentRegistry","text":"\n/// The native Workflow orchestrator over the existing `SubagentRegistry`.\n#[derive(Clone)]\npub struct WorkflowRuntime {\n    read_model: read_model::WorkflowReadModel,\n    subagents: crate::runtime::subagent::SubagentRegistry,\n    /// The existing conversation Event Journal. Workflow lifecycle facts are\n    /// best-effort observability here; the journal never becomes the\n    /// `WorkflowRun` state authority.\n    event_store: Arc\u003cdyn ConversationStore\u003e,\n    next_run: Arc\u003cstd::sync::atomic::AtomicU64\u003e,\n    #[cfg(test)]\n    node_frontier: Arc\u003cstd::sync::Mutex\u003cOption\u003cexecution::NodeFrontierHook\u003e\u003e\u003e,\n    #[cfg(test)]\n    iteration_frontier: Arc\u003cstd::sync::Mutex\u003cOption\u003cexecution::IterationFrontierHook\u003e\u003e\u003e,\n    #[cfg(test)]\n    observations: tokio::sync::watch::Sender\u003cVec\u003cRuntimeEvent\u003e\u003e,\n}","url":"https://github.com/Caismis/rustX/blob/8cb41624eb2dc2ca87e4409961f42553ceb029cf/src/runtime/workflow.rs#L2233-L2250"},{"id":"map-tui-client","path":"tui/src/app-server/client.ts","start":2,"end":39,"label":"AppServerClient: correlation and uncertain outcomes","text":"/**\n * The one typed App Server client.\n *\n * ```text\n *   stdio JSONL ----\\\n *                    \u003e--- AppServerTransport ---\u003e AppServerClient ---\u003e Sessions\n *   WebSocket   ----/\n * ```\n *\n * Exactly one object owns every protocol-level client concern: `initialize` and\n * version negotiation, JSON-RPC id allocation, the pending-request map,\n * response correlation, notification dispatch by attachment target, and\n * terminal settlement. Both transports feed this same object, so there is no\n * \"local client\" and no \"remote client\" — there is one client and two ways for\n * its bytes to travel.\n *\n * # Correlation\n *\n * ```text\n * call(method, params) -\u003e id allocated here -\u003e transport.send\n *                                                    |\n * inbound message -\u003e has an id? --yes--\u003e settle that pending request\n *                            |\n *                           no --------\u003e route the notification by target\n * ```\n *\n * Requests may be pipelined and responses may complete out of order; the\n * JSON-RPC id is the only correlation. Repeating an id would not deduplicate a\n * mutation, so ids are allocated once, monotonically, and never reused.\n *\n * # Lost responses\n *\n * \u003e Losing a response does not prove that a side-effecting request was never\n * \u003e accepted.\n *\n * This client therefore **never replays a request**. When a transport dies with\n * requests in flight, each pending request settles exactly once, and a request\n * that could have changed server state settles as {@link UncertainOutcomeError}","url":"https://github.com/Caismis/rustX/blob/8cb41624eb2dc2ca87e4409961f42553ceb029cf/tui/src/app-server/client.ts#L2-L39"},{"id":"map-tui-session","path":"tui/src/app-server/session.ts","start":2,"end":39,"label":"Session: attach cut, {{projection}} and identity {{map-fencing}}","text":"/**\n * One attached Session: its authoritative projection and its typed operations.\n *\n * ```text\n * session/attach -\u003e target + authoritative snapshot + cursor + subscription\n *                -\u003e install projection\n *                -\u003e fold session/event notifications\n * ```\n *\n * Attach is one cut: the server drains pending observations, captures the\n * snapshot and cursor, admits the controller and registers its subscription\n * under a single projection lock. A client that read the snapshot and then\n * issued its own `session/subscribe` would be re-registering over a\n * registration it already has — and would be asking for exactly the gap that\n * single cut exists to prevent. `session/subscribe` therefore appears in one\n * place only: repairing after a resync, against the new snapshot's cursor.\n *\n * This owner sequences snapshot installation, subscription and resync repair\n * for exactly one Session. It owns no agent semantics: it starts nothing,\n * settles nothing, and interprets no model, tool or capability value. The\n * server is authoritative; semantic state here is a projection that one fresh\n * snapshot rebuilds completely. Local unanswered-request diagnostics are\n * separate: an observation cannot establish their terminal outcomes.\n * Ordinary events, including native read-domain\n * cuts at settlement, preserve safely joined history and local UI without rereads.\n *\n * # Identity and fencing\n *\n * An {@link AttachmentTarget} names four distinct domains at once: the Session,\n * the Conversation, the runtime incarnation, and this attachment. They are not\n * aliases of each other, and neither is the projection cursor or a JSON-RPC\n * request id. Every notification repeats the full target, and this object folds\n * an event only when all four match — so an event addressed to a previous\n * incarnation of the same Session cannot reach a replacement projection.\n *\n * Responses are fenced the same way, by epoch: an authoritative read issued\n * against one attachment can still be in flight when the attachment is replaced\n * or released, and installing its result afterwards would overwrite current","url":"https://github.com/Caismis/rustX/blob/8cb41624eb2dc2ca87e4409961f42553ceb029cf/tui/src/app-server/session.ts#L2-L39"},{"id":"map-web-client","path":"web-console/src/client/app-server.ts","start":1,"end":19,"label":"Web Console: shared generated protocol and {{projection}} {{fold}}","text":"import { SessionLifecycles } from './session-lifecycle/system';\nimport { emptyFacts, type Observation, type LifecycleFacts, type SessionLifecyclePort } from './session-lifecycle/port';\nimport { lifecycleAvailability, type LifecycleContext } from './session-lifecycle/machine';\nimport { AgentMeters } from './agent-meters';\nimport { UploadFailure, AttachmentIntakes } from './uploads';\nimport { foldRuntimeEvent } from '../../../protocol/app-server/projection';\nimport { FirstSubmissions } from '../app/new-conversation/first-submit';\nimport { SessionExportController } from \"./session-export\";\nimport { TRACE_LIMIT, TRACE_PAGE_SIZE, beginTraceDetail, completeTraceDetail, prependTrace, refreshTrace, replaceTrace, selectTrace, traceInterests, type TraceCache } from './trace';\nimport type {\n  TraceToolLocator, ConfigurationApplication, PendingInboundRef, PendingMutationOutcome, AttachmentTarget, GoalMutation, GoalRef, InteractionRef, InteractionResponse, MethodResult, Notification,\n  Request, Request1, Response, RuntimeClientCursor, RuntimeClientSnapshot,\n  SessionPersistentState, SessionSummary, ServerCapabilities, UserInputBlock, UploadReceipt, UploadedFile,\n  ConfigRepairReceipt, SourceTarget,\n} from '../../../protocol/app-server/v49';\nimport { transferUpload, uploadOperationId } from '../../../protocol/app-server/upload';\nimport { HISTORY_PAGE_SIZE, sameReadCut, extendTranscriptWindow, installTranscriptWindow, prependTranscript, refreshTranscript, replaceTranscript, turnKey, type TranscriptCache } from './transcript';\nimport type { ConversationTurn, ConversationTurnPage } from '../../../protocol/app-server/v49';\nimport { ProtocolLog, type WireContext } from './protocol-log';","url":"https://github.com/Caismis/rustX/blob/8cb41624eb2dc2ca87e4409961f42553ceb029cf/web-console/src/client/app-server.ts#L1-L19"},{"id":"map-app-host","path":"src/app_server/host.rs","start":44,"end":68,"label":"AppServerHost: manager, transport and {{bounded}} file operations","text":"#[derive(Debug)]\nstruct HostInner {\n    #[cfg(test)]\n    file_read_probe: Arc\u003csuper::product_host::ReadProbe\u003e,\n    product_host: Mutex\u003cOption\u003csuper::product_host::Authority\u003e\u003e,\n    delivery_access: Mutex\u003cOption\u003csuper::delivery_access::Grant\u003e\u003e,\n    revocations: Arc\u003csuper::delivery_access::Revocations\u003e,\n    authority_id: String,\n    manager: SessionRuntimeManager,\n    state: Mutex\u003cHostState\u003e,\n    requests: watch::Sender\u003cusize\u003e,\n    upload_operations: watch::Sender\u003cusize\u003e,\n    transport: Arc\u003cTransportResources\u003e,\n    archives: super::archive_download::ArchiveDownloads,\n    uploads: super::upload_transfer::UploadTransfers,\n    file_reads: Arc\u003ctokio::sync::Semaphore\u003e,\n    file_routes: Mutex\u003c\n        std::collections::HashMap\u003c\n            super::protocol::AttachmentTarget,\n            std::sync::Weak\u003csuper::connection::Route\u003e,\n        \u003e,\n    \u003e,\n}\n#[derive(Clone, Debug)]\npub struct AppServerHost(Arc\u003cHostInner\u003e);","url":"https://github.com/Caismis/rustX/blob/8cb41624eb2dc2ca87e4409961f42553ceb029cf/src/app_server/host.rs#L44-L68"},{"id":"map-projection-fold","path":"src/runtime_client/projection.rs","start":1,"end":35,"label":"RuntimeClientProjection: atomic {{fold}}, {{cursor}} and subscription cut","text":"//! The Runtime Client projection: the one linearization owner of externally\n//! visible Runtime Client state.\n//!\n//! [`RuntimeClientProjection`] owns:\n//!\n//! ```text\n//! current snapshot read model\n//! RuntimeClientCursor allocation\n//! published RuntimeClientEvent sequence\n//! bounded in-memory replay/resume state\n//! subscriber registration and delivery\n//! ```\n//!\n//! Every externally meaningful runtime transition follows one path:\n//!\n//! ```text\n//! authoritative runtime transition commits\n//!         |\n//!         v\n//! projection fold (update the snapshot read model)\n//!         |\n//!         +--\u003e allocate the next RuntimeClientCursor\n//!         +--\u003e publish the corresponding RuntimeClientEvent\n//!         +--\u003e deliver to every subscriber\n//! ```\n//!\n//! Fold, cursor allocation, and publication happen under one\n//! synchronization boundary (the Runtime Client host's projection state\n//! lock), so the snapshot/cursor invariant holds by synchronization, never\n//! by timing luck:\n//!\n//! \u003e The returned snapshot describes authoritative Runtime Client state at\n//! \u003e cursor C. A subscription/resume after C observes every subsequently\n//! \u003e published Runtime Client event in that stream, or fails explicitly\n//! \u003e with `resync_required`.","url":"https://github.com/Caismis/rustX/blob/8cb41624eb2dc2ca87e4409961f42553ceb029cf/src/runtime_client/projection.rs#L1-L35"},{"id":"map-projection-ring","path":"src/runtime_client/projection.rs","start":37,"end":66,"label":"One {{bounded}} {{replay-cursor}} ring and explicit resync","text":"//! # Projection replay cache and the one retained backlog\n//!\n//! Replay is a bounded in-memory ring (`cursor -\u003e RuntimeClientEvent`)\n//! with an explicit retention limit. That ring is the **sole** retained\n//! Runtime Client event backlog: a subscription is a consumed cursor into\n//! it, never a second queue.\n//!\n//! ```text\n//! publish  -\u003e allocate cursor -\u003e push into the bounded ring\n//!                             -\u003e evict beyond the retention limit\n//!                             -\u003e wake every subscriber (edge-triggered)\n//!\n//! consume  -\u003e subscriber reads the next retained entry after its cursor\n//!          -\u003e advances its own cursor\n//!          -\u003e falling behind retention yields resync_required\n//! ```\n//!\n//! Consequences, which Issue #38 transport backpressure depends on:\n//!\n//! - a slow consumer costs one `RuntimeClientCursor`, never buffered\n//!   events, so subscriber memory is O(1) and total retained memory is\n//!   bounded by `replay_limit`;\n//! - a consumer that falls behind retention can never silently skip\n//!   events while still looking cursor-contiguous — the next poll is the\n//!   explicit [`RuntimeClientError::ResyncRequired`] terminal result;\n//! - wakeups are edge-triggered notifications only and carry no payload,\n//!   so notification can never grow without bound and never blocks the\n//!   publisher.\n//!\n//! The ring is not durable persistence and is never a recovery input. Durable","url":"https://github.com/Caismis/rustX/blob/8cb41624eb2dc2ca87e4409961f42553ceb029cf/src/runtime_client/projection.rs#L37-L66"},{"id":"map-residency-flight","path":"src/local_runtime/session_runtime_manager.rs","start":1,"end":8,"label":"{{map-single-flight}} transition {{ownership}} survives dropped callers","text":"//! Process-local residency, separate from durable Session ownership and execution.\n//!\n//! One manager is allocated per `SessionController`; manager clones share its registry.\n//! The durable controller retains no live runtime or registry. The registry mutex\n//! protects only claim/publication transitions; no await or external work occurs\n//! under it. Every transition task owns a terminal guard and an allocation guard.\n//! Callers are watch receivers, never owners of the transition task. Dropping any\n//! caller (including the claimant) leaves the flight running to terminal settlement.","url":"https://github.com/Caismis/rustX/blob/8cb41624eb2dc2ca87e4409961f42553ceb029cf/src/local_runtime/session_runtime_manager.rs#L1-L8"},{"id":"map-residency-id","path":"src/local_runtime/session_runtime_manager.rs","start":26,"end":46,"label":"RuntimeIncarnationId and ResidencyState","text":"/// Process-local live composition identity. Never a durable or transport identity.\n#[derive(Clone, Copy, Debug, PartialEq, Eq, Hash, serde::Serialize, serde::Deserialize)]\n#[serde(transparent)]\n#[derive(schemars::JsonSchema)]\npub struct RuntimeIncarnationId(u64);\n\n// Identity only, never a global active Session or runtime state. A stale handle\n// cannot alias a later manager even if the durable controller is reopened in\n// this process after all its live allocations have been released.\nstatic NEXT_INCARNATION: AtomicU64 = AtomicU64::new(1);\n\n/// Residency only; execution and interaction state remain runtime-owned.\n#[derive(\n    Clone, Copy, Debug, PartialEq, Eq, serde::Serialize, serde::Deserialize, schemars::JsonSchema,\n)]\npub enum ResidencyState {\n    Unloaded,\n    Loading,\n    Loaded,\n    Unloading,\n}","url":"https://github.com/Caismis/rustX/blob/8cb41624eb2dc2ca87e4409961f42553ceb029cf/src/local_runtime/session_runtime_manager.rs#L26-L46"},{"id":"map-residency-retire","path":"src/local_runtime/session_runtime_manager.rs","start":1773,"end":1808,"label":"Unload retains writer {{allocation}} until proven retirement","text":"    /// Unload commits only after native shutdown proves quiescence. Failure\n    /// retains the old allocation/composition as Unloading; never a new writer.\n    /// # Errors\n    /// Shutdown failures are shared by all observers and do not commit unload.\n    /// # Panics\n    /// Panics if an internal residency mutex was poisoned.\n    pub async fn unload(\u0026self, id: \u0026ConversationId) -\u003e Result\u003c(), RuntimeManagerError\u003e {\n        self.retire(id).await.operation_result().map(|_| ())\n    }\n    async fn retire(\u0026self, id: \u0026ConversationId) -\u003e Outcome {\n        loop {\n            let flight = {\n                let mut registry = self.registry.0.lock().expect(\"registry mutex\");\n                match registry.entries.get(id) {\n                    None =\u003e return Outcome::WriterAbsent(Ok(())),\n                    Some(Entry::Loading(flight) | Entry::Unloading { flight, .. }) =\u003e {\n                        #[cfg(test)]\n                        if let Some(probe) = registry.probes.get(id) {\n                            probe.unloads_joined.send_modify(|n| *n += 1);\n                        }\n                        flight.clone()\n                    }\n                    Some(Entry::Loaded(runtime)) =\u003e {\n                        let runtime = runtime.clone();\n                        let flight = Flight::new();\n                        // Residency claim; native begin_drain owns the actual\n                        // inbound/shutdown winner, not this registry transition.\n                        registry.entries.insert(\n                            id.clone(),\n                            Entry::Unloading {\n                                _runtime: runtime.clone(),\n                                flight: flight.clone(),\n                            },\n                        );\n                        self.spawn_unload(id.clone(), runtime, flight.clone(), None);\n                        flight","url":"https://github.com/Caismis/rustX/blob/8cb41624eb2dc2ca87e4409961f42553ceb029cf/src/local_runtime/session_runtime_manager.rs#L1773-L1808"},{"id":"map-config-manager","path":"src/local_runtime/configuration.rs","start":64,"end":76,"label":"UserConfigManager rereads current {{source-config}} bindings","text":"/// Reusable source owner. Each resolution rereads current files; snapshots never\n/// borrow mutable manager state. The manager has no process launch directory.\n#[derive(Debug, Clone)]\npub struct UserConfigManager {\n    pub(super) sources: UserConfigSources,\n    runtime_root_origin: Origin,\n    /// Process-local automatic repair observations, shared by every clone.\n    repairs: repair::RepairLedger,\n    #[cfg(test)]\n    pub(crate) test_hooks: ConfigurationHooks,\n}\n\n#[cfg(test)]","url":"https://github.com/Caismis/rustX/blob/8cb41624eb2dc2ca87e4409961f42553ceb029cf/src/local_runtime/configuration.rs#L64-L76"},{"id":"map-config-input","path":"src/local_runtime/configuration.rs","start":110,"end":122,"label":"SessionConfigInput contains explicit intent","text":"\n/// Intentional inputs for one prospective Session. Omission remains omission.\n/// Paths are absolute; cwd is execution/configuration context, not a sandbox.\n#[derive(Clone)]\npub struct SessionConfigInput {\n    pub cwd: PathBuf,\n    pub model: Option\u003ccrate::model::session::SessionModelConfig\u003e,\n}\nimpl SessionConfigInput {\n    #[must_use]\n    pub fn new(cwd: PathBuf) -\u003e Self {\n        Self { cwd, model: None }\n    }","url":"https://github.com/Caismis/rustX/blob/8cb41624eb2dc2ca87e4409961f42553ceb029cf/src/local_runtime/configuration.rs#L110-L122"},{"id":"map-core-compose","path":"src/local_runtime/composition.rs","start":1012,"end":1043,"label":"LocalConversationCore {{composition}} of an inactive {{map-semantic}} runtime","text":"pub struct LocalConversationCore {\n    runtime: ConversationRuntime,\n    tool_runtime: ConversationToolRuntime,\n    capability: CapabilityCoordinator,\n    workflow_output: Option\u003cArc\u003cWorkflowOutputLatch\u003e\u003e,\n}\n\nimpl std::fmt::Debug for LocalConversationCore {\n    fn fmt(\u0026self, f: \u0026mut std::fmt::Formatter\u003c'_\u003e) -\u003e std::fmt::Result {\n        f.debug_struct(\"LocalConversationCore\")\n            .field(\"conversation_id\", self.tool_runtime.conversation_id())\n            .finish_non_exhaustive()\n    }\n}\n\nimpl LocalConversationCore {\n    /// Composes the shared semantic runtime from validated resolved launch inputs.\n    ///\n    /// The runtime is left **inactive**: the caller must finish through\n    /// [`LocalConversationCore::into_interactive`],\n    /// [`LocalConversationCore::into_subagent_child_with_route`], or\n    /// [`LocalConversationCore::into_headless`] (or, for low-level\n    /// composition callers, activate the runtime explicitly). Prefer the\n    /// final composition paths of\n    /// [`LocalConversationRuntime`]/[`HeadlessConversationRuntime`], which\n    /// return already-active handles.\n    ///\n    /// # Errors\n    ///\n    /// Returns the first composition failure. Every failure happens before\n    /// any protocol output exists.\n    /// # Panics","url":"https://github.com/Caismis/rustX/blob/8cb41624eb2dc2ca87e4409961f42553ceb029cf/src/local_runtime/composition.rs#L1012-L1043"},{"id":"map-capability-commit","path":"src/capabilities/mod.rs","start":3,"end":34,"label":"CapabilityCoordinator: attempt leases serialize active {{map-capability-revision}} changes","text":"//! This layer owns the operational capability contract that M6 needs:\n//!\n//! - the immutable active [`CapabilitySnapshot`] (`snapshot` module);\n//! - the RAII-style attempt capability lease ([`AttemptCapabilityLease`]);\n//! - candidate preparation and the quiescent atomic commit boundary\n//!   ([`CapabilityCoordinator`]);\n//! - the exact M6 quiescence linearization point.\n//!\n//! # Ownership\n//!\n//! The layer depends on the runtime identity types, the Skill plane\n//! (`crate::skills`), and the Tool plane (`crate::tools`); lower-level\n//! runtime identity modules never depend upward on Skills.\n//!\n//! # M6 quiescence\n//!\n//! A capability activation/commit is legal only when there are zero active\n//! [`AttemptCapabilityLease`] leases for that conversation.\n//! Conversation-owned detached background executions do not count as\n//! active attempt leases. Attempt lease acquisition and candidate\n//! capability commit are serialized through the same synchronization\n//! boundary (the coordinator state mutex):\n//!\n//! - attempt acquisition wins first → commit observes busy and cannot\n//!   activate a new revision;\n//! - commit wins first → the next attempt snapshots the new revision.\n//!\n//! There is no unchecked window between the deciding quiescence\n//! observation and the active-snapshot swap, and no sleep-based\n//! coordination. A candidate may be prepared independently; only its\n//! activation respects the commit boundary. If candidate preparation or\n//! commit fails, the current active revision remains authoritative, and a","url":"https://github.com/Caismis/rustX/blob/8cb41624eb2dc2ca87e4409961f42553ceb029cf/src/capabilities/mod.rs#L3-L34"},{"id":"map-agent-kernel","path":"src/agent/mod.rs","start":1,"end":25,"label":"AgentExecution, ExecutionStateMachine and typed lifecycle seams","text":"//! Agent kernel: attempts, turns, execution state machines, and loop semantics.\n//!\n//! M3 implements the deterministic agent execution loop on top of the\n//! canonical runtime contracts:\n//!\n//! - [`AgentExecution`] executes one attempt: model request → provider-independent\n//!   `ModelStreamItem` stream → canonical-event assembly → optional tool execution →\n//!   continuation → one terminal settlement candidate, normally committed as\n//!   exactly one terminal `RuntimeEvent`.\n//! - [`ExecutionStateMachine`] makes the attempt lifecycle explicit\n//!   (`Idle → RunningModel → WaitingForTool → RunningModel → Completed`,\n//!   with failure/cancellation settling from any active state).\n//! - [`AgentCancellation`] is the attempt-level cancellation trigger; every\n//!   model invocation observes a child signal through the existing adapter\n//!   cancellation mechanism.\n//! - [`AttemptLifecycle`] carries the three typed phase-specific ownership\n//!   seams of Issues #56/#64 — [`PreStepPolicy`], [`PreToolPolicy`], and\n//!   [`ToolResultObserver`] — as one required immutable per-attempt\n//!   configuration. The loop remains the\n//!   lifecycle owner; neither seam receives canonical, tool-identity,\n//!   cancellation, or terminal authority, and neither decides the semantic\n//!   ownership of the context it proposes.\n//!\n//! The kernel operates on canonical conversation contracts plus the narrow\n//! provider-neutral request-only input contract: it never references a","url":"https://github.com/Caismis/rustX/blob/8cb41624eb2dc2ca87e4409961f42553ceb029cf/src/agent/mod.rs#L1-L25"},{"id":"map-gate-structure","path":"src/agent/cancellation.rs","start":50,"end":72,"label":"ModelTurnStartGate serializes cancellation and {{durable}} commit","text":"}\n\n/// The per-attempt model-turn start gate (Issue #12, M9b).\n///\n/// One mutex serializes the only two competing transitions of the\n/// cancellation-vs-start race:\n///\n/// - [`AgentCancellation::cancel`] transitions the signal to cancelled while\n///   holding the gate;\n/// - [`AgentCancellation::arbitrate_model_turn_start`] checks the signal and\n///   runs the durable start commit while holding the gate.\n///\n/// Whoever enters the gate first wins, deterministically: a cancellation\n/// that enters first is observed by every later arbitration; a start commit\n/// that entered first has already decided durability before the cancellation\n/// can proceed, and the cancellation is then necessarily post-start. The\n/// gate is a leaf in the runtime lock graph: the commit closure nests only\n/// the store's own lock inside it, and nothing ever acquires this gate while\n/// holding the store or coordinator locks except the cancellation path\n/// (coordinator → gate), so no lock cycle exists.\n#[derive(Debug, Default)]\nstruct ModelTurnStartGate {\n    critical: Mutex\u003c()\u003e,","url":"https://github.com/Caismis/rustX/blob/8cb41624eb2dc2ca87e4409961f42553ceb029cf/src/agent/cancellation.rs#L50-L72"},{"id":"map-start-transaction","path":"src/durable/inbox.rs","start":2002,"end":2040,"label":"commit_model_turn_start: one {{map-semantic}} transaction and {{receipt}}","text":"\n    /// Commits one model-turn start atomically (Issue #12, M9b): the\n    /// request-scoped canonical context messages (Ledger append + Surface\n    /// advance), the immutable Request Snapshot, and the exact\n    /// `ModelRequestStarted` evidence and, when the prepared request carries\n    /// Agent Status, the exact canonical status message, emission facts, and\n    /// latest-emission projection in **one** transaction.\n    ///\n    /// This is the one durable request-start transition of every actual\n    /// primary model request — the first turn, every tool→model\n    /// continuation, every recovered continuation, every transient retry, and\n    /// every overflow retry.\n    /// A successful commit is the durable fact that the model request\n    /// started; a failure commits none of the inputs. When the snapshot names\n    /// the pending unresolved-output source for the initial request of its\n    /// logical step, this same transaction freezes the exact request-only\n    /// representation and anchor and clears the pending pointer. Cancellation\n    /// before this commit therefore leaves the pointer untouched; retries do\n    /// not re-read or consume it. The Agent Loop\n    /// arbitrates cancellation against exactly this commit, so a\n    /// `RequestSnapshot` is always evidence of an actually started model\n    /// request and request-scoped context never becomes canonical without\n    /// its request starting.\n    ///\n    /// The store validates structure and durability only; it owns no\n    /// cancellation policy. A fresh commit returns a typed receipt containing\n    /// every newly committed start-owned event in Event Journal sequence\n    /// order. An exact retry returns the same events with an\n    /// [`ModelTurnStartCommitDisposition::IdempotentReplay`] disposition, so a\n    /// live observer can avoid replaying historical facts. A conflicting\n    /// retry is rejected.\n    fn commit_model_turn_start(\n        \u0026self,\n        context: \u0026[MessageBlock],\n        snapshot: \u0026RequestSnapshot,\n        timestamp: DateTime\u003cUtc\u003e,\n    ) -\u003e Result\u003cModelTurnStartCommit, ConversationStoreError\u003e;\n\n    /// Reads the one pending unresolved-output source, when one exists. The","url":"https://github.com/Caismis/rustX/blob/8cb41624eb2dc2ca87e4409961f42553ceb029cf/src/durable/inbox.rs#L2002-L2040"},{"id":"map-start-reconstruct","path":"src/agent/execution.rs","start":3080,"end":3119,"label":"Reconstruct {{durable}} request and reject mismatch before {{dispatch}}","text":"        }\n        // The receipt is the only live publication source for the start-owned\n        // Event Journal facts. Publish only a fresh durable transition; an\n        // idempotent store verification returns the historical receipt but\n        // must not replay those facts to a live observer.\n        publish_model_turn_start_events(self.observer, \u0026self.request.attempt_id, \u0026start_commit);\n        self.last_request_fingerprint = Some(prepared.fingerprint);\n        self.last_request_identity = Some(prepared.request_identity);\n        self.last_request_anchor = Some(prepared.anchor.clone());\n        self.last_request_estimated_input = Some(prepared.estimated_input);\n        self.last_request_id = Some(prepared.snapshot.request_id.clone());\n        let reconstructed = self\n            .store\n            .reconstruct_model_request(\u0026prepared.snapshot.request_id)\n            .map_err(|error| {\n                self.durable_failure_kind = Some(DurableFailureKind::RequestStart);\n                self.durable_failure = Some(format!(\n                    \"durable request reconstruction failed after start: {error}\"\n                ));\n                Terminal::Failed {\n                    failure: AttemptFailure::Runtime {\n                        error: RuntimeError::DurableStore {\n                            message: format!(\n                                \"durable request reconstruction failed after start: {error}\"\n                            ),\n                        },\n                    },\n                }\n            })?;\n        if reconstructed != prepared.request {\n            self.durable_failure_kind = Some(DurableFailureKind::RequestStart);\n            self.durable_failure = Some(\n                \"durable request reconstruction differs from the live provider-neutral request\"\n                    .to_owned(),\n            );\n            return Err(Terminal::Failed {\n                failure: AttemptFailure::Runtime {\n                    error: RuntimeError::DurableStore {\n                        message:\n                            \"durable request reconstruction differs from the live provider-neutral request\"","url":"https://github.com/Caismis/rustX/blob/8cb41624eb2dc2ca87e4409961f42553ceb029cf/src/agent/execution.rs#L3080-L3119"},{"id":"map-checkpoint-types","path":"src/context/checkpoint.rs","start":76,"end":106,"label":"CheckpointCandidate: Original/Derived content and historical {{map-read-cut}}","text":"\n#[derive(Debug, Clone, PartialEq, Serialize, Deserialize)]\n#[serde(tag = \"type\", rename_all = \"snake_case\", deny_unknown_fields)]\npub enum CheckpointMessage {\n    Original(CanonicalMessageRef),\n    Derived(Box\u003cDerivedModelMessage\u003e),\n}\n\n/// Tool associations are algorithm-authored coordinates validated against typed source facts.\n#[derive(Debug, Clone, PartialEq, Serialize, Deserialize)]\n#[serde(deny_unknown_fields)]\npub struct CheckpointItem {\n    pub message: CheckpointMessage,\n    pub call_sources: Vec\u003cProjectedCallSource\u003e,\n    /// Required for Derived `ToolResults`. Originals may explicitly disambiguate repeated copies.\n    pub result_call: Option\u003cCheckpointCallCoordinate\u003e,\n}\n\n/// Complete historical inclusion/exclusion decision. No current execution state is stored here.\n#[derive(Debug, Clone, PartialEq, Serialize, Deserialize)]\n#[serde(deny_unknown_fields)]\npub struct CheckpointCandidate {\n    pub checkpoint_id: CheckpointId,\n    pub expected_head: Option\u003cCheckpointId\u003e,\n    pub read_cut: ResourceReadCut,\n    pub base_frontier: LedgerFrontier,\n    pub items: Vec\u003cCheckpointItem\u003e,\n    /// Trusted cumulative file facts, validated from canonical sources and earlier checkpoints.\n    pub summary_metadata: Option\u003ccrate::message::types::CompactionSummaryMetadata\u003e,\n}\n","url":"https://github.com/Caismis/rustX/blob/8cb41624eb2dc2ca87e4409961f42553ceb029cf/src/context/checkpoint.rs#L76-L106"},{"id":"map-checkpoint-compiler","path":"src/context/checkpoint.rs","start":181,"end":218,"label":"compile_checkpoint verifies immutable dependencies and {{provenance-derived}}","text":"/// Detached integrity header with an optional body. Provenance-only reads do\n/// not hydrate retired facts; visible Originals and native Tool/reasoning\n/// validation explicitly require their immutable bodies.\n#[derive(Debug, Clone, serde::Serialize)]\npub struct CanonicalDependency {\n    pub frontier: LedgerFrontier,\n    pub reference: CanonicalMessageRef,\n    pub body: Option\u003cMessageBlock\u003e,\n}\n\n/// Resolve immutable dependencies and compile all Original/Derived pairings.\n/// # Errors\n/// Rejects missing dependencies, forged provenance, changed opaque reasoning,\n/// orphan/ambiguous results, split batches and invalid projected protocol order.\npub fn compile_checkpoint(\n    candidate: \u0026CheckpointCandidate,\n    mut resolve: impl FnMut(\u0026CanonicalMessageRef, bool) -\u003e Result\u003cCanonicalDependency, String\u003e,\n) -\u003e Result\u003cCompiledCheckpoint, String\u003e {\n    candidate.validate_budget()?;\n    let mut originals = BTreeMap::new();\n    let mut source_budget = ByteBudget(16 * 1024 * 1024);\n    let mut messages = Vec::with_capacity(candidate.items.len());\n    let mut output_budget = ByteBudget(16 * 1024 * 1024);\n    for item in \u0026candidate.items {\n        let message = match \u0026item.message {\n            CheckpointMessage::Original(reference) =\u003e ModelInputMessage::Canonical(original(\n                candidate,\n                reference,\n                \u0026mut resolve,\n                \u0026mut originals,\n                \u0026mut source_budget,\n            )?),\n            CheckpointMessage::Derived(derived) =\u003e {\n                if derived.sources.is_empty() \u0026\u0026 derived.checkpoint_sources.is_empty() {\n                    return Err(\"historical Derived message requires immutable provenance\".into());\n                }\n                if derived.checkpoint_sources.iter().any(|source| {\n                    source.conversation_id != candidate.read_cut.conversation_id","url":"https://github.com/Caismis/rustX/blob/8cb41624eb2dc2ca87e4409961f42553ceb029cf/src/context/checkpoint.rs#L181-L218"},{"id":"map-activation","path":"src/context/checkpoint.rs","start":551,"end":568,"label":"ProjectionActivation: {{map-activation}} order and origin","text":"\n/// Immutable source activation. Destination installation is a different coordinate.\n#[derive(Debug, Clone, PartialEq, Eq, Serialize, Deserialize, schemars::JsonSchema)]\npub struct OriginActivation {\n    pub conversation_id: ConversationId,\n    pub activation: ProjectionActivationId,\n    pub completed_journal: super::resources::JournalFrontier,\n}\n\n#[derive(Debug, Clone, PartialEq, Serialize, Deserialize)]\npub struct ProjectionActivation {\n    pub activation: ProjectionActivationId,\n    pub ledger: LedgerFrontier,\n    pub checkpoint_id: CheckpointId,\n    pub origin: OriginActivation,\n    /// None for a local activation; inherited mappings retain source order separately.\n    pub destination_installation: Option\u003ccrate::runtime::identity::LineageInstallationId\u003e,\n}","url":"https://github.com/Caismis/rustX/blob/8cb41624eb2dc2ca87e4409961f42553ceb029cf/src/context/checkpoint.rs#L551-L568"},{"id":"map-read-cut","path":"src/context/resources.rs","start":44,"end":65,"label":"ResourceReadCut and {{bounded}} resource reads","text":"/// One finite read authority. Pending inbound is not a compaction dependency.\n#[derive(Debug, Clone, PartialEq, Eq, Serialize, Deserialize)]\n#[serde(deny_unknown_fields)]\npub struct ResourceReadCut {\n    pub conversation_id: ConversationId,\n    pub ledger: LedgerFrontier,\n    pub journal: JournalFrontier,\n    pub transcript: TranscriptCursor,\n    pub projection_activation: super::checkpoint::ProjectionActivationId,\n}\n\n/// Hard logical materialization bounds, including the sum of all pages in an operation.\n#[derive(Debug, Clone, Copy)]\npub struct ResourceLimits {\n    pub page_items: usize,\n    pub record_bytes: usize,\n    pub page_bytes: usize,\n    pub total_items: usize,\n    pub total_bytes: usize,\n}\n\nimpl Default for ResourceLimits {","url":"https://github.com/Caismis/rustX/blob/8cb41624eb2dc2ca87e4409961f42553ceb029cf/src/context/resources.rs#L44-L65"},{"id":"map-compaction-grant","path":"src/runtime/cancellation.rs","start":72,"end":104,"label":"CompactionCommitGrant: authorization distinct from request start","text":"    /// Linearizes cancellation against checkpoint authorization. Once granted,\n    /// cancellation may stop later requests but cannot undo the authorized commit.\n    #[must_use]\n    /// # Panics\n    /// A poisoned runtime arbitration mutex indicates an internal invariant violation.\n    pub fn authorize_compaction_commit(\n        \u0026self,\n        operation_id: crate::runtime::identity::CompactionOperationId,\n    ) -\u003e Option\u003cCompactionCommitGrant\u003e {\n        let _gate = self.commit_gate.lock().expect(\"cancellation commit gate\");\n        (!self.token.is_cancelled()).then_some(CompactionCommitGrant { operation_id })\n    }\n\n    /// Whether cancellation has been requested.\n    #[must_use]\n    pub fn is_cancelled(\u0026self) -\u003e bool {\n        self.token.is_cancelled()\n    }\n\n    /// A future that resolves when cancellation is requested.\n    pub async fn cancelled(\u0026self) {\n        self.token.cancelled().await;\n    }\n}\n\n/// A one-operation authorization from the cancellation owner; store code cannot manufacture it.\n#[derive(Debug, Clone, PartialEq, Eq)]\npub struct CompactionCommitGrant {\n    operation_id: crate::runtime::identity::CompactionOperationId,\n}\nimpl CompactionCommitGrant {\n    pub(crate) fn operation_id(\u0026self) -\u003e \u0026crate::runtime::identity::CompactionOperationId {\n        \u0026self.operation_id","url":"https://github.com/Caismis/rustX/blob/8cb41624eb2dc2ca87e4409961f42553ceb029cf/src/runtime/cancellation.rs#L72-L104"},{"id":"map-compaction-progress","path":"src/context/compaction.rs","start":365,"end":400,"label":"Historical progress check, {{map-grant}} and ProjectionCommitInput","text":"    }\n    // Progress belongs to historical selection alone. Core-owned staged Context,\n    // carryover, prompt/tool overhead and provider observations cannot certify a\n    // growing historical projection as a successful compaction.\n    let history_before = engine.estimate_model_input(\u0026projection.messages, \"\", \u0026[]);\n    let history_after = engine.estimate_model_input(\u0026after_projection.messages, \"\", \u0026[]);\n    if history_after \u003e= history_before {\n        return Err(ContextError::new(\n            ContextErrorKind::NoProgress,\n            \"summary does not decrease historical input\",\n        )\n        .into());\n    }\n    let grant = cancellation\n        .authorize_compaction_commit(attribution.operation_id.clone())\n        .ok_or_else(|| cancelled(\"compaction cancelled before commit authorization\"))?;\n    let fingerprint = candidate.fingerprint();\n    let owner_for_install = owner.clone();\n    let input = crate::durable::projection::ProjectionCommitInput {\n        grant,\n        operation_id: attribution.operation_id.clone(),\n        candidate,\n        owner,\n        tokens_before: projection.estimated_input,\n        estimated_tokens_after: after_projection.estimated_input.input_tokens,\n        occupancy: Some(crate::context::occupancy::estimate(\n            after,\n            engine.config().context_window_tokens,\n            \u0026context.primary_model,\n            effective_system_prompt,\n            tools,\n        )),\n        turn_id: attribution.turn_id,\n        timestamp: Utc::now(),\n    };\n    let receipt = match store.commit_projection(input) {","url":"https://github.com/Caismis/rustX/blob/8cb41624eb2dc2ca87e4409961f42553ceb029cf/src/context/compaction.rs#L365-L400"},{"id":"map-projection-receipt","path":"src/durable/projection.rs","start":17,"end":48,"label":"ProjectionCheckpoint and ProjectionCommitReceipt","text":"#[derive(Debug, Clone, PartialEq, Serialize, Deserialize)]\npub struct ProjectionCheckpoint {\n    pub candidate: CheckpointCandidate,\n    pub fingerprint: String,\n    pub activation: ProjectionActivation,\n    pub occupancy: Option\u003cContextOccupancy\u003e,\n}\n\n/// One bounded historical page selected under a single native read snapshot.\npub struct ProjectionTimelinePage {\n    pub records: Vec\u003cProjectionCheckpoint\u003e,\n    pub next_activation: Option\u003ccrate::context::checkpoint::ProjectionActivationId\u003e,\n}\n\n#[derive(Debug, Clone, PartialEq, Serialize, Deserialize)]\npub struct ProjectionCommitReceipt {\n    pub operation_id: CompactionOperationId,\n    pub candidate_fingerprint: String,\n    pub checkpoint: ProjectionCheckpoint,\n    pub completed: RuntimeEventEnvelope,\n}\n\n#[derive(Debug, Clone, PartialEq)]\npub struct ProjectionCommitInput {\n    pub grant: crate::runtime::cancellation::CompactionCommitGrant,\n    pub operation_id: CompactionOperationId,\n    pub candidate: CheckpointCandidate,\n    pub owner: ProjectionOwner,\n    pub tokens_before: TokenMeasurement,\n    pub estimated_tokens_after: u64,\n    pub occupancy: Option\u003cContextOccupancy\u003e,\n    pub turn_id: Option\u003cTurnId\u003e,","url":"https://github.com/Caismis/rustX/blob/8cb41624eb2dc2ca87e4409961f42553ceb029cf/src/durable/projection.rs#L17-L48"},{"id":"map-context-engine","path":"src/context/engine.rs","start":1,"end":9,"label":"ContextEngine compiles {{bounded}} history; provider translation stays outside","text":"//! Deterministic compilation, token accounting and compaction planning.\n//!\n//! The engine consumes bounded typed historical input: immutable Original\n//! references and identity-free Derived messages selected by the durable\n//! Projection Head, followed by eligible canonical Tail strictly after its base.\n//! It owns structural validation, retention, token pressure and fit/progress\n//! checks. The durable store owns checkpoint/head/receipt/completion atomicity;\n//! the Agent Loop owns current core input, cancellation and actual request starts.\n//! Provider adapters alone own native wire translation and continuation rules.","url":"https://github.com/Caismis/rustX/blob/8cb41624eb2dc2ca87e4409961f42553ceb029cf/src/context/engine.rs#L1-L9"},{"id":"map-context-projection","path":"src/context/projection.rs","start":1,"end":25,"label":"ContextProjection: typed messages and exact effective prompt","text":"//! Finite typed historical model input compiled from durable checkpoints and Tail.\n//!\n//! The projection contains ordered Original/Derived messages and the exact\n//! request-time Effective System Prompt. It owns no contributor, provenance,\n//! admission, or provider semantics; those are settled before this boundary.\n\nuse serde::{Deserialize, Serialize};\n\nuse crate::conversation::SurfaceRevision;\nuse crate::model::ModelInputMessage;\nuse crate::runtime::types::TokenMeasurement;\n\n/// The measured typed model input at one canonical append frontier.\n#[derive(Debug, Clone, PartialEq, Serialize, Deserialize)]\npub struct ContextProjection {\n    /// Canonical append frontier used to identify this measured input.\n    pub surface_revision: SurfaceRevision,\n    /// Ordered complete typed messages selected by checkpoint compilation.\n    pub messages: Vec\u003cModelInputMessage\u003e,\n    /// The exact rustX-owned Effective System Prompt for this request.\n    #[serde(default)]\n    pub effective_system_prompt: String,\n    /// The measured or estimated input for the full provider-neutral request.\n    pub estimated_input: TokenMeasurement,\n}","url":"https://github.com/Caismis/rustX/blob/8cb41624eb2dc2ca87e4409961f42553ceb029cf/src/context/projection.rs#L1-L25"},{"id":"map-invocation-owner","path":"src/tools/invocation.rs","start":1,"end":29,"label":"Caller-neutral invocation cannot commit history or advance Workflow","text":"//! Caller-independent foreground execution and physical settlement authority.\n//!\n//! Callers own admission, identity, and publication. This owner consumes exactly\n//! one executor handle and returns execution truth; it cannot commit history or\n//! advance a Workflow graph.\n\nuse crate::runtime::MonotonicClock;\nuse crate::tools::deadline::{\n    TOOL_SETTLEMENT_CONTROL_GUARD, ToolCancellationCause, ToolDeadlineKind,\n    ToolExecutionDeadlinePolicy, ToolProgressCapability, ToolSettlementCertainty, deadline_after,\n};\nuse crate::tools::executor::{\n    ProgressReporter, ToolExecutionContext, ToolExecutor, ToolSettlement,\n};\nuse crate::tools::types::{\n    ToolCancellationPhase, ToolExecutionResult, ToolExecutionStatus, ToolInvocation, ToolProgress,\n};\n\n/// Attempt-frozen native invocation resources. They confer neither canonical\n/// history mutation nor model-call authority on a fixed-program caller.\n#[derive(Clone)]\npub(crate) struct NativeInvocationServices {\n    pub lifecycle: crate::agent::AttemptLifecycle,\n    pub runtime: crate::tools::runtime::ConversationToolRuntime,\n    pub clock: std::sync::Arc\u003cdyn MonotonicClock\u003e,\n    pub leaf_policy: ToolExecutionDeadlinePolicy,\n    pub turn: u32,\n    pub scheduling: std::sync::Arc\u003ctokio::sync::RwLock\u003c()\u003e\u003e,\n    pub descendants: NativeChildScope,","url":"https://github.com/Caismis/rustX/blob/8cb41624eb2dc2ca87e4409961f42553ceb029cf/src/tools/invocation.rs#L1-L29"},{"id":"map-invocation-approval","path":"src/tools/invocation.rs","start":64,"end":92,"label":"authorize evaluates policy over immutable prepared facts","text":"\n/// One permission gate over immutable, already prepared invocation facts.\n/// The interaction response has no replacement argument or selector channel.\npub(crate) async fn authorize(\n    lifecycle: \u0026crate::agent::lifecycle::AttemptLifecycle,\n    view: \u0026crate::agent::lifecycle::PreToolView\u003c'_\u003e,\n    cancellation: \u0026crate::runtime::cancellation::ExecutionCancellation,\n) -\u003e Result\u003cOption\u003cToolExecutionResult\u003e, crate::runtime::interaction::InteractionFailure\u003e {\n    use crate::agent::lifecycle::PreToolDecision;\n    use crate::runtime::interaction::{ApprovalDecision, InteractionOutcome, InteractionResponse};\n    let cancelled = || terminal(cancellation.native_status(ToolCancellationPhase::BeforeStart));\n    if cancellation.is_cancelled() {\n        return Ok(Some(cancelled()));\n    }\n    let policy = lifecycle.pre_tool_policy();\n    let raw = tokio::select! {\n        biased;\n        () = cancellation.cancelled() =\u003e return Ok(Some(cancelled())),\n        decision = policy.evaluate(view) =\u003e decision,\n    };\n    if cancellation.is_cancelled() {\n        return Ok(Some(cancelled()));\n    }\n    let decision = raw.unwrap_or_else(|error| PreToolDecision::Deny {\n        reason: format!(\"pre-tool policy failed closed: {}\", error.message),\n    });\n    let reason = match decision {\n        PreToolDecision::Allow =\u003e return Ok(None),\n        PreToolDecision::Deny { reason } =\u003e reason,","url":"https://github.com/Caismis/rustX/blob/8cb41624eb2dc2ca87e4409961f42553ceb029cf/src/tools/invocation.rs#L64-L92"},{"id":"map-invocation-run","path":"src/tools/invocation.rs","start":220,"end":257,"label":"ForegroundInvocation: {{frozen}} deadline policy and a two-plane handle","text":"    /// The caller has committed its start frontier. Construction and the first\n    /// operation poll still independently reject observable cancellation.\n    #[allow(clippy::too_many_lines)] // Keep the single arbitration/settlement state machine linear.\n    pub(crate) async fn execute(\n        \u0026self,\n        executor: \u0026dyn ToolExecutor,\n        invocation: ToolInvocation,\n        progress_capability: ToolProgressCapability,\n        context: ToolExecutionContext\u003c'_\u003e,\n    ) -\u003e (ToolExecutionResult, Vec\u003cInvocationFact\u003e) {\n        let descendants = context\n            .subagent_context()\n            .and_then(|context| context.native.as_ref())\n            .map(|services| services.descendants.clone());\n        let started = self.clock.now_millis();\n        let policy = self.registration.resolve(self.policy);\n        let hard_deadline = policy.hard_deadline_millis(started);\n        #[cfg(test)]\n        if let Some(armed) = self.deadline_armed {\n            armed(hard_deadline);\n        }\n        let idle = policy.effective_idle_liveness(progress_capability);\n        let (sender, mut receiver) = tokio::sync::watch::channel(started);\n        let progress = Progress {\n            downstream: context.progress,\n            clock: self.clock,\n            liveness: idle.map(|_| sender),\n        };\n        let ancestor = context.cancellation.clone();\n        let (trigger, cancellation) = ancestor.child_execution();\n        let context = context.reborrow(cancellation, \u0026progress);\n        let handle = crate::tools::executor::start_tool_execution(executor, invocation, context);\n        let completion = handle.completion;\n        let settlement = handle.settlement;\n        tokio::pin!(completion);\n        tokio::pin!(settlement);\n        let idle_wait = async {\n            let Some(idle) = idle else {","url":"https://github.com/Caismis/rustX/blob/8cb41624eb2dc2ca87e4409961f42553ceb029cf/src/tools/invocation.rs#L220-L257"},{"id":"map-invocation-winner","path":"src/tools/invocation.rs","start":276,"end":315,"label":"ForegroundInvocation chooses completion, cancellation or deadline","text":"        // Sole terminal winner: cancellation, hard, idle, physical completion.\n        // The pinned settlement plane retains operation ownership after select.\n        let winner = tokio::select! {\n            biased;\n            () = ancestor.cancelled() =\u003e {\n                let reason = ancestor.native_cause();\n                #[cfg(test)]\n                if let Some(hook) = self.cancellation_won { hook(); }\n                Winner::Cancellation(reason)\n            },\n            () = self.clock.wait_until_millis(hard_deadline) =\u003e Winner::Deadline(ToolDeadlineKind::Hard),\n            () = idle_wait =\u003e {\n                // Biased polling is not an atomic clock cut: time can advance\n                // after the hard future returned Pending, before idle is polled.\n                // Commit deadline priority from one current logical-clock read.\n                let kind = if self.clock.now_millis() \u003e= hard_deadline {\n                    ToolDeadlineKind::Hard\n                } else {\n                    ToolDeadlineKind::Idle\n                };\n                Winner::Deadline(kind)\n            },\n            result = completion.as_mut() =\u003e {\n                #[cfg(test)]\n                if let Some(hook) = self.completion_won { hook(); }\n                Winner::Physical(result)\n            },\n        };\n        let mut facts = Vec::new();\n        let cause = match winner {\n            Winner::Physical(mut result) =\u003e {\n                if let ToolExecutionStatus::Cancelled { phase, .. } = \u0026mut result.status {\n                    *phase = ToolCancellationPhase::DuringExecution;\n                }\n                return (result, facts);\n            }\n            Winner::Cancellation(cause) =\u003e cause,\n            Winner::Deadline(kind) =\u003e {\n                facts.push(InvocationFact::Deadline { kind });\n                ToolCancellationCause::Deadline(kind)","url":"https://github.com/Caismis/rustX/blob/8cb41624eb2dc2ca87e4409961f42553ceb029cf/src/tools/invocation.rs#L276-L315"},{"id":"map-invocation-settlement","path":"src/tools/invocation.rs","start":337,"end":377,"label":"Only {{settlement}} plane is awaited after cancellation wins","text":"                        .await;\n                }\n            }\n        };\n        let evidence = tokio::select! {\n            biased;\n            evidence = settlement.as_mut() =\u003e Some(evidence),\n            () = guard_wait =\u003e None,\n        };\n        let result = match evidence {\n            Some(ToolSettlement::Confirmed(mut result)) =\u003e {\n                facts.push(InvocationFact::SettlementObserved {\n                    certainty: ToolSettlementCertainty::Confirmed,\n                });\n                if matches!(result.status, ToolExecutionStatus::Cancelled { .. }) {\n                    result.status = match cause {\n                        ToolCancellationCause::Attempt(reason) =\u003e ToolExecutionStatus::Cancelled {\n                            reason,\n                            phase: ToolCancellationPhase::DuringExecution,\n                        },\n                        ToolCancellationCause::Deadline(_) =\u003e ToolExecutionStatus::TimedOut,\n                    };\n                }\n                result\n            }\n            Some(ToolSettlement::Unconfirmed { detail }) =\u003e {\n                facts.push(InvocationFact::SettlementObserved {\n                    certainty: ToolSettlementCertainty::Unconfirmed,\n                });\n                unknown(detail)\n            }\n            None =\u003e {\n                let reason = \"the executor's settlement control plane did not return within the guard window after the cancellation request; this is an executor settlement-contract violation, not proof about the physical operation\".to_owned();\n                facts.push(InvocationFact::SettlementControlFailed {\n                    reason: reason.clone(),\n                });\n                unknown(reason)\n            }\n        };\n        (result, facts)\n    }","url":"https://github.com/Caismis/rustX/blob/8cb41624eb2dc2ca87e4409961f42553ceb029cf/src/tools/invocation.rs#L337-L377"},{"id":"map-executor-handle","path":"src/tools/executor.rs","start":324,"end":341,"label":"ToolExecutor::start constructs a handle without {{dispatch-tool}}","text":"pub trait ToolExecutor: Send + Sync {\n    /// Constructs the handle of one caller-neutral native invocation.\n    ///\n    /// This method must not dispatch physical work. Dispatch and its cleanup\n    /// live inside the returned handle, so cancellation before the first\n    /// operation poll can prove that the invocation never had an effect.\n    ///\n    /// The returned [`ToolExecutionHandle`] splits the execution into its\n    /// physical completion plane and its independent cancellation/settlement\n    /// control plane; both are owned by the executor: implementations clone\n    /// or capture the data they need and never borrow past the call.\n    fn start\u003c'a\u003e(\n        \u0026'a self,\n        invocation: ToolInvocation,\n        context: ToolExecutionContext\u003c'a\u003e,\n    ) -\u003e ToolExecutionHandle\u003c'a\u003e;\n\n    /// Whether this executor can emit meaningful progress evidence for one","url":"https://github.com/Caismis/rustX/blob/8cb41624eb2dc2ca87e4409961f42553ceb029cf/src/tools/executor.rs#L324-L341"},{"id":"map-executor-settlement","path":"src/tools/executor.rs","start":356,"end":385,"label":"ToolSettlement distinguishes {{map-physical-terminal}} proof and remote uncertainty","text":"///\n/// The settlement plane is the executor's own authority over what physical\n/// cancellation achieved: it resolves only after the executor observed the\n/// cancellation request delivered through its context's\n/// [`ExecutionCancellation`] and ran its physical cancellation path to its\n/// end. It never means \"the owning lifecycle stopped waiting\" — that is the\n/// lifecycle's guard against a broken executor, and it is never settlement\n/// evidence.\npub enum ToolSettlement {\n    /// The executor proved its physical operation terminal; the carried\n    /// result is that proven terminal outcome (for example Bash's killed and\n    /// reaped process tree reported as `Cancelled`).\n    Confirmed(ToolExecutionResult),\n    /// Cancellation was physically propagated and the executor's local rustX\n    /// execution ownership reached its terminal cleanup boundary: no\n    /// rustX-owned Tokio task, subprocess, unreaped child process, worker\n    /// task, or other executor-owned local physical activity capable of\n    /// running remains. Only an external effect beyond rustX's ownership\n    /// domain — a dispatched remote MCP call, a remote HTTP operation, the\n    /// state of an external service — may still be uncertain. Never means\n    /// \"we stopped waiting\": local execution ownership that is still alive\n    /// must keep the settlement plane pending until it is\n    /// reclaimed/joined/aborted.\n    Unconfirmed {\n        /// The executor's own description of the unprovable frontier.\n        detail: String,\n    },\n}\n\n/// One started tool execution: the physical completion plane plus the","url":"https://github.com/Caismis/rustX/blob/8cb41624eb2dc2ca87e4409961f42553ceb029cf/src/tools/executor.rs#L356-L385"},{"id":"map-tool-runtime","path":"src/tools/runtime.rs","start":1,"end":16,"label":"ConversationToolRuntime owns stable conversation resources","text":"//! The conversation-owned tool runtime bundle.\n//!\n//! One conversation owns one [`ConversationToolRuntime`]: the canonical\n//! workspace boundary, the artifact store, the explicit authorized tool\n//! environment, the conversation inbound mailbox, the authoritative\n//! background registry, and the conversation's task list. An `AgentExecution` receives a reference to the\n//! bundle and drains `tool_runtime.mailbox()`; detached background runners\n//! receive cloned handles. No process-global tool state exists.\n//!\n//! # Immutable resource binding\n//!\n//! Every background-runtime dependency (mailbox, clock, event sink,\n//! environment, workspace, artifact store) is bound at construction time\n//! through [`ConversationRuntimeConfig`]. After construction the\n//! conversation background registry identity is stable: configuration can\n//! never replace or reset the registry, so existing execution records can","url":"https://github.com/Caismis/rustX/blob/8cb41624eb2dc2ca87e4409961f42553ceb029cf/src/tools/runtime.rs#L1-L16"},{"id":"map-native-child","path":"src/runtime/subagent.rs","start":1,"end":22,"label":"SubagentRegistry identities, sealing and final report {{map-subagent-authority}}","text":"//! Durable native child Agents and finite activation supervision.\n//!\n//! SubagentRegistry owns each stable AgentId, child ConversationId, lineage,\n//! frozen admitted authority and frozen Session execution binding, plus zero or one current\n//! activation. SubagentId names a finite activation, not the durable Agent.\n//! Catalog/resolver freeze creation authority; later send_message calls reuse it.\n//!\n//! Active message admission and activation sealing use the same registry mutex.\n//! Child SealRequested closes admission before the driver grants local sealing;\n//! previously admitted envelopes drain in FIFO order. Inactive message admission\n//! reserves one next activation. Stopping rejects transiently; unavailable\n//! settlement or publication authority requires explicit proof or repair.\n//!\n//! Drivers alone own process handles, cancellation escalation, reap and nested\n//! containment. Committed terminal publication with proven physical settlement\n//! leaves the Agent inactive and resumable. Recovery owns later durable proof\n//! without reopening the old activation. Workflow-owned finite children share\n//! supervision primitives without becoming native durable Agents.\n//!\n//! Canonical child history owns content. Each final report enters parent canonical\n//! inbound exactly once for its activation, adjacent to runtime-authored Agent\n//! and activation correlation. The Event Journal owns execution/admission facts;","url":"https://github.com/Caismis/rustX/blob/8cb41624eb2dc2ca87e4409961f42553ceb029cf/src/runtime/subagent.rs#L1-L22"},{"id":"map-child-process","path":"src/runtime/subagent/process.rs","start":1,"end":29,"label":"One process driver owns spawn, cancellation escalation and reap","text":"//! The sole low-level process owner of one subagent child (Issue #60).\n//!\n//! This module owns the **physical** boundary of a child rustX runtime:\n//!\n//! ```text\n//! spawn            (own process group, inherited control channel on fd 0,\n//!                   inherited disposable observation channel on fd 1)\n//! control channel  (bounded framed IPC; also the parent-liveness authority)\n//! observation      (Activity frames only, child-\u003eparent; its stall or loss\n//! channel          is diagnostics-only and never evidences lifecycle)\n//! start gate       (the child performs no semantic work before Delegate)\n//! escalation       (Cancel frame -\u003e SIGTERM group -\u003e SIGKILL group)\n//! wait/reap        (the direct child is reaped exactly here)\n//! ```\n//!\n//! The logical [`SubagentRegistry`](super::registry) never holds an OS\n//! process handle: it stages a [`StagedChild`], and the one ownership\n//! commit moves the handle into the registry-owned driver task. No second\n//! kill/reap authority exists anywhere.\n//!\n//! # Platform semantics\n//!\n//! The child is a **direct child** of the runtime process on both Linux and\n//! macOS, spawned into its own process group so escalation can signal the\n//! whole group. Parent-lifetime containment does not depend on a platform\n//! primitive: the control channel endpoint is inherited by the child as its\n//! fd 0, and every other copy of the parent's endpoint is `CLOEXEC` by\n//! construction (Rust socket creation), so a hard parent death — including\n//! `SIGKILL` — closes the channel and the child observes EOF. A child that","url":"https://github.com/Caismis/rustX/blob/8cb41624eb2dc2ca87e4409961f42553ceb029cf/src/runtime/subagent/process.rs#L1-L29"},{"id":"map-workflow-tool","path":"src/runtime/workflow/tool.rs","start":31,"end":72,"label":"Workflow Tool node uses ToolInvocationId::Workflow and {{native}} {{preflight}}","text":"\nimpl WorkflowRuntime {\n    /// One exact admitted registration through the standard native\n    /// invocation path and the invoking Session's execution binding.\n    /// External Tools keep their own admitted materialization contract.\n    #[allow(clippy::too_many_lines)]\n    pub(super) async fn invoke_tool(\n        \u0026self,\n        run: \u0026WorkflowRun,\n        context: \u0026AttemptSubagentContext,\n        node: \u0026WorkflowNodeInstance,\n        selector: \u0026ExactToolSelector,\n        arguments: Value,\n        cancellation: \u0026crate::runtime::cancellation::ExecutionCancellation,\n    ) -\u003e Result\u003cToolExecutionResult, WorkflowRunError\u003e {\n        let services = context.native.as_ref().ok_or_else(|| {\n            WorkflowRunError::InvocationAuthority(\n                \"attempt has no native invocation services\".into(),\n            )\n        })?;\n        let definition = run.tools.get(selector).ok_or_else(|| {\n            WorkflowRunError::CapabilityNotAdmitted(\n                \"capability was not admitted to this Workflow\".into(),\n            )\n        })?;\n        let registration = context\n            .resources()\n            .capability()\n            .available_tools()\n            .registration(definition)\n            .map_err(WorkflowRunError::IdentityChanged)?;\n        let id = ToolInvocationId::Workflow {\n            node: Box::new(node.clone()),\n        };\n        self.read_model.node(node, |view| {\n            view.invocation = Some(id.clone());\n            view.tool_id = Some(definition.id.clone());\n        });\n        let prepared = match registration\n            .prepare_fixed(id.clone(), definition, \u0026arguments)\n            .map_err(WorkflowRunError::IdentityChanged)?\n        {","url":"https://github.com/Caismis/rustX/blob/8cb41624eb2dc2ca87e4409961f42553ceb029cf/src/runtime/workflow/tool.rs#L31-L72"},{"id":"map-workflow-bound","path":"src/runtime/workflow/execution.rs","start":30,"end":67,"label":"Workflow recursively validates {{finite}} expansion bounds","text":"\n/// Deliberate worst-case expansion, including iteration admission steps. Each\n/// recursion is checked before multiplication, so overflow is not a bound.\npub(super) fn static_execution_bound(\n    block: \u0026WorkflowBlockProgram,\n) -\u003e Result\u003c(usize, usize), super::WorkflowCompileError\u003e {\n    let mut steps = block.nodes.len();\n    let mut agents = 0;\n    for node in block.nodes.values() {\n        match node {\n            WorkflowNodeProgram::Agent(_) =\u003e agents += 1,\n            WorkflowNodeProgram::Parallel { branches, .. } =\u003e {\n                for branch in branches.values() {\n                    let (child_steps, child_agents) = static_execution_bound(\u0026branch.block)?;\n                    steps += child_steps;\n                    agents += child_agents;\n                }\n            }\n            WorkflowNodeProgram::Loop {\n                body,\n                max_iterations,\n                ..\n            } =\u003e {\n                let (child_steps, child_agents) = static_execution_bound(body)?;\n                steps += (child_steps + 1) * *max_iterations as usize;\n                agents += child_agents * *max_iterations as usize;\n            }\n            _ =\u003e {}\n        }\n        if steps \u003e MAX_WORKFLOW_STEPS || agents \u003e MAX_WORKFLOW_AGENTS {\n            return Err(super::WorkflowCompileError::InvalidField(\n                \"aggregate expanded execution bound exceeded\".into(),\n            ));\n        }\n    }\n    Ok((steps, agents))\n}\n","url":"https://github.com/Caismis/rustX/blob/8cb41624eb2dc2ca87e4409961f42553ceb029cf/src/runtime/workflow/execution.rs#L30-L67"},{"id":"map-goal-state","path":"src/goal.rs","start":1,"end":8,"label":"GoalPhase::Active authorizes eligible autonomous {{admission-goal}}","text":"//! Revisioned Goal authority. History and events are observations, never state.\n//!\n//! `GoalPhase` is the one product-visible Goal lifecycle authority (Issue\n//! #351). `GoalPhase::Active` **is** durable authorization to continue: the\n//! owning `ConversationRuntime` may admit an autonomous round whenever it\n//! reaches an eligible safe idle boundary. There is no second, process-local\n//! activation state, so no reader can observe an Active Goal that is\n//! silently inert.","url":"https://github.com/Caismis/rustX/blob/8cb41624eb2dc2ca87e4409961f42553ceb029cf/src/goal.rs#L1-L8"},{"id":"map-goal-types","path":"src/goal.rs","start":24,"end":72,"label":"GoalRef, GoalPhase and {{durable}} GoalSnapshot","text":"/// Exact observation required by every mutation of an existing Goal.\n#[derive(Debug, Clone, PartialEq, Eq, Serialize, Deserialize, schemars::JsonSchema)]\n#[serde(deny_unknown_fields)]\npub struct GoalRef {\n    pub id: String,\n    pub revision: u64,\n}\n\n/// The single durable Goal lifecycle authority.\n///\n/// - `Active`: continuation is authorized when runtime admission is eligible.\n/// - `Paused` / `Blocked`: continuation is not authorized.\n/// - `Complete`: terminal.\n#[derive(Debug, Clone, Copy, PartialEq, Eq, Serialize, Deserialize)]\n#[serde(rename_all = \"snake_case\")]\n#[derive(schemars::JsonSchema)]\npub enum GoalPhase {\n    Active,\n    Paused,\n    Blocked,\n    Complete,\n}\n\n/// Trusted origin supplied by runtime, never by model arguments.\n#[derive(Debug, Clone, PartialEq, Eq, Serialize, Deserialize)]\n#[serde(tag = \"kind\", rename_all = \"snake_case\", deny_unknown_fields)]\n#[derive(schemars::JsonSchema)]\npub enum GoalOrigin {\n    HumanAttempt {\n        message_id: MessageId,\n        attempt_id: AttemptId,\n    },\n    RuntimeControl,\n}\n\n/// Authoritative bounded durable record.\n#[derive(Debug, Clone, PartialEq, Eq, Serialize, Deserialize)]\n#[serde(deny_unknown_fields)]\n#[derive(schemars::JsonSchema)]\npub struct GoalSnapshot {\n    pub reference: GoalRef,\n    pub objective: String,\n    pub phase: GoalPhase,\n    pub blocked_reason: Option\u003cString\u003e,\n    pub autonomous_round_budget: u32,\n    pub autonomous_rounds_consumed: u32,\n    pub origin: GoalOrigin,\n    pub last_round_message_id: Option\u003cMessageId\u003e,\n}","url":"https://github.com/Caismis/rustX/blob/8cb41624eb2dc2ca87e4409961f42553ceb029cf/src/goal.rs#L24-L72"},{"id":"map-extensions-bind","path":"src/extensions.rs","start":28,"end":65,"label":"NativeContextComposition registers Agent Status through ContextAssembly","text":"    }\n\n    pub(crate) fn bind(\n        \u0026mut self,\n        assembly: \u0026mut crate::context::ContextAssembly,\n        composition: Option\u003c\u0026NativeAgentExtensions\u003e,\n        runtime: \u0026crate::tools::runtime::ConversationToolRuntime,\n        lifecycle: crate::agent::lifecycle::AttemptLifecycle,\n    ) -\u003e Result\u003ccrate::agent::lifecycle::AttemptLifecycle, crate::context::ContextAssemblyError\u003e\n    {\n        if let Some(composition) = composition {\n            composition.register_domain_context(assembly, runtime)?;\n        }\n        if let Some(engine) = self.status.take() {\n            let background = runtime.background().clone();\n            let todos = composition\n                .filter(|c| c.todo().is_some())\n                .and_then(|_| runtime.todos())\n                .cloned();\n            assembly.register_native(\n                crate::runtime::identity::NativeContextContributor::AgentStatus,\n                Arc::new(crate::context::status::StatusContextContributor {\n                    engine: std::sync::Mutex::new(engine),\n                    background: Arc::new(move || background.active_snapshot()),\n                    todo: Arc::new(move || {\n                        todos\n                            .as_ref()\n                            .map(|todos| todos.committed().status_presentation())\n                    }),\n                    reminders: Arc::new(ContributionReminderReader(runtime.durable_store())),\n                }),\n            )?;\n        }\n        #[cfg(test)]\n        let lifecycle = composition\n            .into_iter()\n            .flat_map(|c| \u0026c.test_contributors)\n            .filter(|probe| probe.observe_tools)","url":"https://github.com/Caismis/rustX/blob/8cb41624eb2dc2ca87e4409961f42553ceb029cf/src/extensions.rs#L28-L65"},{"id":"map-publication-proposals","path":"src/publication/mod.rs","start":80,"end":93,"label":"{{publication}} Tool proposals confer no execution {{map-agent-authority}}","text":"//! `MessageId`. See [`carryover`] for the shared selector and renderer.\n//!\n//! # Tool proposals are not executions\n//!\n//! Tool-call frames are **model proposals**, never Tool Plane execution\n//! facts. The vocabulary names them so\n//! ([`PublicationPayload::ProposedToolCallStarted`] and siblings), and the\n//! durable store enforces the hard invariant that no proposal belonging to an\n//! Incomplete or Unaccepted publication may have a dependent\n//! `ToolExecutionStarted`, `ToolResult`, or side-effect authorization.\n//! The store also owns the proposal staging state machine: Started freezes the\n//! stream-local block/tool/name identity, arguments require Started, and\n//! Completion advances it exactly once to Completed.\n","url":"https://github.com/Caismis/rustX/blob/8cb41624eb2dc2ca87e4409961f42553ceb029cf/src/publication/mod.rs#L80-L93"},{"id":"map-conversation-hot","path":"src/conversation/mod.rs","start":1,"end":11,"label":"{{canonical}} {{map-ledger}}, historical {{projection-context}} and hot state {{ownership}}","text":"//! Immutable canonical conversation facts and their bounded hot working set.\n//!\n//! The Message Ledger owns committed messages. Surface bookkeeping records only\n//! ordinary canonical appends; it does not select compacted model history.\n//! Durable typed Projection Checkpoints and their activation timeline own\n//! historical inclusion and ordering. The Context Engine compiles a checkpoint\n//! plus eligible Tail, while the Agent Loop adds and freezes current core input.\n//!\n//! There is one mutable hot `ConversationState`: the coordinator owns it between\n//! attempts and `AgentExecution` owns it while running. It caches retained Original\n//! facts, never gives Derived projected content a canonical `M
