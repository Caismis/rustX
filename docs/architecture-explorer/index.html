utor that started before cancellation happened\n    /// still observes the absorbing first-winner cause (for example\n    /// `RuntimeShutdown` when runtime drain won the race). No cause is copied\n    /// into the execution context.\n    #[must_use]\n    pub fn execution_cancellation(\u0026self) -\u003e ExecutionCancellation {\n        ExecutionCancellation::new(self.signal.clone(), Arc::new(self.clone()))","url":"https://github.com/Caismis/rustX/blob/8cb41624eb2dc2ca87e4409961f42553ceb029cf/src/agent/cancellation.rs#L230-L255"},{"id":"model-contract","path":"src/model/adapter/traits.rs","start":49,"end":70,"label":"ModelAdapter 每次 stream 调用只执行一个请求","text":"/// One provider model protocol execution adapter.\n///\n/// Implementations must guarantee:\n///\n/// - one `stream` invocation performs exactly one provider request attempt\n///   (no hidden retry, no reconnect, no failover);\n/// - at most one canonical terminal event per stream (`Completed` or `Failed`);\n/// - no stream items after a terminal event;\n/// - cancellation propagates by terminating with `Failed(Cancelled)` and\n///   dropping the underlying provider stream;\n/// - a request rejected before provider execution produces a terminal\n///   `Failed` without `Started` and without any provider request.\npub trait ModelAdapter: Send + Sync {\n    /// The protocol this adapter speaks.\n    fn protocol(\u0026self) -\u003e ModelProtocol;\n\n    /// Executes one canonical model request as one provider-independent stream.\n    ///\n    /// The returned stream is the only channel of information about the\n    /// invocation; the adapter retains no hidden state afterwards.\n    fn stream(\u0026self, request: ModelRequest, cancellation: CancellationSignal) -\u003e ModelStream;\n}","url":"https://github.com/Caismis/rustX/blob/8cb41624eb2dc2ca87e4409961f42553ceb029cf/src/model/adapter/traits.rs#L49-L70"},{"id":"model-dispatch","path":"src/agent/execution.rs","start":3717,"end":3744,"label":"适配器分发接收 Attempt 子信号","text":"        let dispatch_frontier_ms = self.monotonic_clock.now_millis();\n        let deadline = ModelRequestDeadline::new(self.model_timeout_policy, dispatch_frontier_ms);\n        // Generation timing evidence shares the deadline's and the guard's\n        // exact request-local lifetime and origin. Installing it here — after\n        // durable reconstruction verification, before the adapter stream\n        // exists — means time to first output measures generation rather than\n        // request preparation, and a retry cannot inherit the spans of the\n        // generation it replaces.\n        self.generation_timing = Some(GenerationTiming::started_at(\n            dispatch_frontier_ms,\n            request_start_ms,\n        ));\n        // The generation guard is request-local execution state exactly like\n        // the deadline: one physical generation, one guard, derived from the\n        // attempt's own frozen resolved output budget. It is created here,\n        // at the same dispatch frontier, so a retry can never inherit the\n        // accounting or the repetition window of the generation it replaces.\n        let guard = GenerationGuard::new(self.generation_policy);\n        let stream = self\n            .request\n            .model\n            .primary()\n            .adapter()\n            .stream(request, self.cancellation.model_cancellation());\n        let mut assembler = ModelEventAssembler::new();\n        let terminal = match self\n            .consume_model_stream(\u0026mut assembler, \u0026message_id, stream, deadline, guard)\n            .await","url":"https://github.com/Caismis/rustX/blob/8cb41624eb2dc2ca87e4409961f42553ceb029cf/src/agent/execution.rs#L3717-L3744"},{"id":"publication-contract","path":"src/publication/mod.rs","start":1,"end":38,"label":"Publication 先 commit 再发布；P、U、C 各不相同","text":"//! The durable user-facing publication plane (Issue #108, FND-03).\n//!\n//! Publication is a **separate durable plane** from provider outcome and from\n//! canonical conversation acceptance. It exists to hold exactly one\n//! user-facing contract:\n//!\n//! \u003e No semantic output is released to a user-facing Runtime Client before\n//! \u003e rustX has durably committed that publication.\n//!\n//! # Three linearization points\n//!\n//! Any request that emits user-facing model output has three distinct commit\n//! points, owned by three distinct planes:\n//!\n//! ```text\n//! P — Provider outcome        ModelRequestCompleted durable   (Event Journal)\n//! U — Publication outcome     final frame + terminal marker   (publication plane)\n//! C — Conversation acceptance canonical Assistant durable     (Message Ledger)\n//! ```\n//!\n//! The required commit ordering is `P \u003c U \u003c C`, and the durable store — not\n//! only Agent Loop control flow — enforces the implication `C =\u003e U =\u003e P`.\n//! P and U are deliberately never combined into one transaction: \"the\n//! provider finished\" and \"rustX committed this output for release\" are\n//! different facts, and a crash between them must stay distinguishable.\n//!\n//! # Pipeline\n//!\n//! Provider chunk size is not the publication unit:\n//!\n//! ```text\n//! Provider ModelEvent delta\n//!   -\u003e in-memory assembler          (canonical message assembly)\n//!   -\u003e bounded publication coalescer(bytes / oldest-deadline latency / structure / terminal)\n//!   -\u003e typed publication frame\n//!   -\u003e durable publication staging\n//!   -\u003e user-facing release\n//! ```","url":"https://github.com/Caismis/rustX/blob/8cb41624eb2dc2ca87e4409961f42553ceb029cf/src/publication/mod.rs#L1-L38"},{"id":"publication-outcomes","path":"src/publication/mod.rs","start":47,"end":76,"label":"Canonical、未接受与不完整 Publication；没有感知 ACK","text":"//! # Three mutually exclusive settlements\n//!\n//! One publication stream settles exactly once:\n//!\n//! ```text\n//! Canonical                 U reached, C reached — the Ledger is the authority\n//! UnacceptedPublicationAudit U reached, C never  — complete output, never accepted\n//! IncompletePublicationAudit U never reached     — publication has no durable terminal\n//! ```\n//!\n//! Incomplete is defined on the **publication** boundary, never on the\n//! provider boundary:\n//!\n//! \u003e Incomplete Publication means user-facing publication did not reach its\n//! \u003e own durable terminal boundary. It does not imply that the provider\n//! \u003e necessarily failed to reach transport termination.\n//!\n//! So a stream whose `ModelRequestCompleted` is durable but whose U never\n//! committed is Incomplete, and a structural `assembler.finish()` rejection\n//! after frames were already released is Incomplete (no P exists at all).\n//!\n//! # Audit semantics\n//!\n//! A [`PublicationAudit`] records the semantic output rustX durably committed\n//! **for release**. It is an upper bound on what may have been displayed and\n//! never proof of perception; rustX adds no Runtime Client ACK protocol.\n//!\n//! An audit never becomes canonical Assistant content, acquires Message\n//! Ledger or Surface identity, enters lineage meaning, or becomes a generic\n//! part of future model context. The sole narrow exception is a bounded,","url":"https://github.com/Caismis/rustX/blob/8cb41624eb2dc2ca87e4409961f42553ceb029cf/src/publication/mod.rs#L47-L76"},{"id":"publication-flush","path":"src/agent/execution.rs","start":5568,"end":5588,"label":"源码实现在发布帧之前先暂存","text":"    /// Stages the buffered publication payload durably and only then releases\n    /// it.\n    ///\n    /// The order is the whole point: nothing reaches a user-facing Runtime\n    /// Client before its staging transaction committed.\n    fn flush_publication(\u0026mut self) {\n        let Some(publication) = self.publication.as_mut() else {\n            return;\n        };\n        let frames = publication.coalescer.take_frames();\n        if frames.is_empty() {\n            return;\n        }\n        if let Err(error) = self.store.stage_publication_frames(\u0026frames) {\n            self.record_publication_failure(\u0026format!(\n                \"publication frames could not be staged before release: {error}\"\n            ));\n            return;\n        }\n        self.release_publication(\u0026frames);\n    }","url":"https://github.com/Caismis/rustX/blob/8cb41624eb2dc2ca87e4409961f42553ceb029cf/src/agent/execution.rs#L5568-L5588"},{"id":"publication-terminal","path":"src/agent/execution.rs","start":5590,"end":5616,"label":"源码实现在最终发布前先 commit U","text":"    /// Commits **U** — the final publication frame and the publication\n    /// terminal marker in one transaction — and only then releases the final\n    /// buffered payload.\n    ///\n    /// P must already be durable; the durable store enforces that. When no\n    /// visible payload remains, a terminal-only frame still commits and no\n    /// visible text is delayed.\n    fn commit_publication_terminal(\u0026mut self) -\u003e Result\u003c(), RuntimeError\u003e {\n        let Some(publication) = self.publication.as_mut() else {\n            return Ok(());\n        };\n        if publication.terminal_committed {\n            return Ok(());\n        }\n        let stream_id = publication.start.stream_id.clone();\n        let frames = publication.coalescer.take_terminal_frames();\n        if let Err(error) = self.store.commit_publication_terminal(\u0026stream_id, \u0026frames) {\n            let message =\n                format!(\"the publication terminal could not be committed durably: {error}\");\n            self.record_publication_failure(\u0026message);\n            return Err(RuntimeError::DurableStore { message });\n        }\n        if let Some(publication) = self.publication.as_mut() {\n            publication.terminal_committed = true;\n        }\n        self.release_publication(\u0026frames);\n        Ok(())","url":"https://github.com/Caismis/rustX/blob/8cb41624eb2dc2ca87e4409961f42553ceb029cf/src/agent/execution.rs#L5590-L5616"},{"id":"assistant-commit","path":"src/agent/execution.rs","start":5352,"end":5387,"label":"canonical Assistant 接受通过 Publication 权威来源 commit","text":"    fn commit_assistant_message(\n        \u0026mut self,\n        message_id: \u0026MessageId,\n        content: \u0026[crate::message::types::AssistantContentBlock],\n    ) -\u003e Result\u003c(), CanonicalCommitError\u003e {\n        let block = MessageBlock::Assistant(AssistantMessageBlock {\n            id: message_id.clone(),\n            content: content.to_vec(),\n        });\n        let Some(publication) = self.publication.as_ref() else {\n            return Err(CanonicalCommitError::Durable(\n                crate::durable::ConversationStoreError::PublicationViolation(format!(\n                    \"Assistant message {message_id} has no open publication stream\"\n                )),\n            ));\n        };\n        let stream_id = publication.start.stream_id.clone();\n        let prepared = self.conversation.prepare_commit(\u0026block)?;\n        let event = Self::canonical_event(\u0026block).expect(\"an Assistant commit has its event\");\n        let (persisted, transcript_cursor) = self\n            .store\n            .commit_canonical_publication(\n                \u0026stream_id,\n                prepared.message(),\n                self.event_envelope(event),\n            )\n            .map_err(CanonicalCommitError::Durable)?;\n        // The stream settled canonically: the Ledger is the long-term\n        // authority and no audit may ever be created for it.\n        self.publication = None;\n        self.conversation.install_prepared(prepared);\n        if let Some(observer) = self.observer {\n            observer.observe_committed(\u0026self.request.attempt_id, \u0026block, Some(transcript_cursor));\n        }\n        self.record_persisted_event(persisted);\n        Ok(())","url":"https://github.com/Caismis/rustX/blob/8cb41624eb2dc2ca87e4409961f42553ceb029cf/src/agent/execution.rs#L5352-L5387"},{"id":"tool-contract","path":"src/tools/mod.rs","start":1,"end":14,"label":"原生 Tool、MCP 与 Python 使用共享 Tool Plane","text":"//! Canonical tool registry and executor contracts for native and MCP tools.\n//!\n//! The tool plane owns the canonical [`ToolDefinition`] contract, the\n//! validating [`ToolRegistry`], the [`ToolExecutor`] boundary, the JSON\n//! Schema validation and the model-facing schema compiler, the workspace\n//! boundary, the managed tool-output store, the artifact store, the explicit\n//! tool environment, the conversation-owned background registry, and the\n//! conversation-owned task list. Native and MCP executor implementations\n//! share exactly this contract; managed Python tool packages compile into\n//! the MCP runtime (`python` module, Issue #174).\n//! Native Read/Write/Edit/Grep/Glob use the workspace root as their cwd and\n//! accept ordinary absolute host paths. The locator remains the runtime's\n//! read-only resolver for advertised managed-output paths; `ManagedToolOutput`\n//! owns the separate model-mutation guard.","url":"https://github.com/Caismis/rustX/blob/8cb41624eb2dc2ca87e4409961f42553ceb029cf/src/tools/mod.rs#L1-L14"},{"id":"tool-acceptance","path":"docs/tool-lifecycle.md","start":56,"end":96,"label":"预检、canonical 接受、物理执行与原子批次","text":"## Acceptance, execution, and commit\n\n```text\nmodel proposal\n  -\u003e structural validation of identity, correlation, JSON, and finish reason\n  -\u003e prepare preflight (retain business/schema rejection as a result slot)\n  -\u003e canonical Assistant message commit: ToolCall acceptance\n  -\u003e policy / approval decisions and scheduling\n  -\u003e executor-start fact (CallSlot.executor_started)\n  -\u003e handle construction (no physical dispatch)\n  -\u003e first operation poll / executor-specific effect frontier\n  -\u003e normal completion OR cancellation/deadline intent\n  -\u003e executor physical settlement and outcome evidence\n  -\u003e generic terminal selection\n  -\u003e atomic canonical ToolResult batch commit\n  -\u003e recovery reads committed canonical truth\n```\n\nPreflight is computed before Assistant commit to reject structural identity\nerrors without admitting an untrustworthy call. Business/schema rejection is\nretained until that commit, then occupies exactly one accepted CallSlot.\nPolicy denial is `Denied`. Ordinary business failure is `Failed`. Neither is an\nAttempt failure. Broken interaction routes and durable-store failures retain\ntheir runtime-authority failure semantics.\n\nThe executor-start fact is a conservative recovery frontier, recorded before\nphysical work can begin. It is distinct from the physical effect frontier.\nHandle construction must only capture resources; dispatch belongs inside the\nhandle. The generic entry and the cooperative handle check cancellation before\nconstruction and before the first operation poll. Thus cancellation can close\nadmission without accidentally starting a synchronous mutation when settlement\nfirst polls an otherwise-unstarted future. The owning lifecycle selects the\ncanonical cancellation phase from its logical start frontier.\n\nThe Agent Loop owns canonical call slots, sibling ordering and\n`commit_tool_result_batch`; the shared native driver owns the resolved frozen\nforeground policy and invocation cancellation arbitration. The batch commit appends\nall sibling ToolMessages and their canonical facts atomically. The conversation\nstructural authority rejects duplicate ToolCall and ToolResult identities.\nPhysical completion order never changes canonical model-call order. Cancellation\nfills every unstarted slot and drains every started sibling before the batch","url":"https://github.com/Caismis/rustX/blob/8cb41624eb2dc2ca87e4409961f42553ceb029cf/docs/tool-lifecycle.md#L56-L96"},{"id":"tool-evidence","path":"docs/tool-lifecycle.md","start":99,"end":129,"label":"类型化结果确定性与物理 settlement","text":"## Physical evidence and terminal meaning\n\nExecutors own physical execution, effect-frontier knowledge, progress, physical\ncancellation, and settlement evidence. Canonical history owns committed truth.\nThe Event Journal records facts; it is not another outcome authority. Providers\nconsume `ToolExecutionResult::model_facing_projection`, which derives bounded\nfeedback from typed status, never error substrings.\n\n| Status | Evidence required |\n| --- | --- |\n| Success | Known successful completion |\n| Failed | Known invocation/execution failure |\n| Denied | Policy or approval refusal |\n| Cancelled | Never started, or confirmed physical cancellation |\n| TimedOut | Deadline intent plus confirmed physical cancellation/terminality |\n| OutcomeUnknown | Started effect whose final outcome cannot be established |\n\nA request to cancel is not evidence that the operation stopped. The foreground\narbitration order remains cancellation, hard deadline, idle deadline, completion.\nOnce intent wins, the owner drives only `ToolExecutionHandle::settlement`.\n`Confirmed(result)` retains known success/failure/denial even when cancellation\nwas requested. Confirmed cancellation becomes `Cancelled` with the owning cause,\nor `TimedOut` when the generic deadline won. `Unconfirmed` becomes\n`OutcomeUnknown` only after local ownership is reclaimed; uncertainty concerns\nan external effect, not a still-running rustX worker.\n\nThe foreground settlement guard remains a typed control-plane failure, separate\nfrom executor-returned unconfirmed evidence. It never proves physical\ntermination. Executors must retain all local cleanup within their ownership\ncontract. No automatic retry, ambiguous replay, or foreground-to-background\nswitch is introduced.","url":"https://github.com/Caismis/rustX/blob/8cb41624eb2dc2ca87e4409961f42553ceb029cf/docs/tool-lifecycle.md#L99-L129"},{"id":"tool-adapters","path":"docs/tool-lifecycle.md","start":131,"end":149,"label":"进程归属与远程 MCP 不确定性","text":"The cooperative handle consumes its operation on completion, so a repeated poll\ncannot execute it or produce another terminal winner. Invocation panics are\ncontained inside that ownership slot, avoiding poisoning the slot mutex and\nunwinding accepted siblings. Construction panics are pre-dispatch `Failed`;\noperation panics are conservatively `OutcomeUnknown`, never proof of rollback.\nThe operation future is consumed before evidence is returned. This boundary\ndoes not make unmanaged child tasks or processes permissible: executors still\nown their cleanup, and runtime/durable authority failures are not business\nfailures to hide. Panic payload text is not exposed to the model.\n\nBash retains its process-group supervision, termination ladder, and wait/reap\nproof. Output readers and the combined writer are all joined even if one reader\nfails, panics, or is aborted. A capture timeout aborts then joins the remaining\nworkers before publishing output or terminality. Read's blocking document\nworker is joined even after cancellation; its JoinError is a typed failure.\nMCP terminates local outbound/HTTP ownership and consumes its release proof\nbefore reporting remote uncertainty. A remote `isError` is known failure;\npost-dispatch transport loss without a correlated result is unknown outcome.\nPython packages are managed MCP servers and use that same boundary.","url":"https://github.com/Caismis/rustX/blob/8cb41624eb2dc2ca87e4409961f42553ceb029cf/docs/tool-lifecycle.md#L131-L149"},{"id":"tool-batch","path":"src/agent/execution.rs","start":5390,"end":5432,"label":"源码实现原子追加整个 Tool 批次","text":"    /// Commits one complete `ToolResult` batch atomically.\n    ///\n    /// The whole batch prepares (validates) first, then appends to the\n    /// durable Message Ledger in **one** transaction, and only then installs\n    /// each member in memory. A durable failure of any member appends and\n    /// installs none of them, so a partial tool-result group can never become\n    /// canonical — the prior review's tool-batch atomicity requirement.\n    ///\n    /// Returns the durable transcript position the batch settled at: the\n    /// highest cursor the atomic append allocated, or `None` when the batch\n    /// committed no visible transcript item. That position is the batch's\n    /// own, read from its receipts under the commit that allocated them, and\n    /// it is the placement fact of any `PostToolBatch` status opportunity\n    /// this batch establishes — produced here rather than sampled later from\n    /// a moving frontier.\n    fn commit_tool_result_batch(\n        \u0026mut self,\n        blocks: \u0026[MessageBlock],\n    ) -\u003e Result\u003cOption\u003cTranscriptCursor\u003e, CanonicalCommitError\u003e {\n        let mut prepared = Vec::with_capacity(blocks.len());\n        for block in blocks {\n            prepared.push(self.conversation.prepare_commit(block)?);\n        }\n        let events = blocks\n            .iter()\n            .map(|block| {\n                Self::canonical_event(block).ok_or_else(|| {\n                    CanonicalCommitError::Durable(\n                        crate::durable::inbox::ConversationStoreError::InvalidReference(\n                            \"a ToolResult batch contains a non-tool message\".to_owned(),\n                        ),\n                    )\n                })\n            })\n            .collect::\u003cResult\u003cVec\u003c_\u003e, _\u003e\u003e()?;\n        let envelopes = events\n            .into_iter()\n            .map(|event| self.event_envelope(event))\n            .collect::\u003cVec\u003c_\u003e\u003e();\n        let (persisted_events, receipts) = self\n            .store\n            .append_canonical_batch_with_events(blocks, \u0026envelopes)\n            .map_err(CanonicalCommitError::Durable)?;","url":"https://github.com/Caismis/rustX/blob/8cb41624eb2dc2ca87e4409961f42553ceb029cf/src/agent/execution.rs#L5390-L5432"},{"id":"tool-recovery","path":"docs/tool-lifecycle.md","start":238,"end":247,"label":"恢复绝不重放结果不明的副作用，也不替换已 commit 结果","text":"## Recovery\n\nRecovery repairs only calls without a committed result. An existing canonical\nresult is authoritative and absorbing. Durable known-outcome evidence can fill\na missing result; start evidence without a trustworthy terminal outcome yields\n`OutcomeUnknown`; no start evidence yields before-start cancellation. Repair\ncommits atomically and is idempotent. Detached ownership recovery publishes the\nmissing terminal notification without changing the original dispatch receipt.\nNeither Tool recovery nor MCP connection restoration replays ambiguous effects.\nA new MCP generation serves future calls only.","url":"https://github.com/Caismis/rustX/blob/8cb41624eb2dc2ca87e4409961f42553ceb029cf/docs/tool-lifecycle.md#L238-L247"},{"id":"continuation","path":"docs/agent-loop.md","start":531,"end":553,"label":"已接受的 continuation 与不可变的冻结输入版本","text":"## 4. Continuation\n\nContinuation is canonical conversation state: the loop retains the immutable\nMessage Ledger plus the current Conversation Surface and appends each\ncompleted Assistant message and tool result. The next model request carries the opaque\n`ProviderContinuationState` boundary state reported by the previous turn\n(the state of the greatest-block-index reasoning block, propagated\nverbatim). Protocols without reconstructable state simply carry `None` —\nnothing is fabricated, and a model that cannot continue without state\nfails explicitly.\n\nEvery actual model request freezes the active typed historical checkpoint,\neligible Tail strictly after its base through the pre-start cut, core-owned\nFresh Inbound/Context/carryover, exact semantic media transformations, invocation\nand Effective System Prompt in a RequestSnapshot. Ordinary retries reuse the\nlatest immutable semantic generation input. Authorized correction or compaction\nadvances that version; later transient retries cannot revert it.\n\nSuccessful default Summary compaction clears the active primary continuation\nunconditionally and compiles the complete new history projection. Continuation\notherwise refers only to actual accepted Assistant output of the previous\nrequest. Canonical execution facts and historical projection content remain\nindependent authorities.","url":"https://github.com/Caismis/rustX/blob/8cb41624eb2dc2ca87e4409961f42553ceb029cf/docs/agent-loop.md#L531-L553"},{"id":"attempt-terminal","path":"docs/agent-loop.md","start":1498,"end":1509,"label":"唯一终态 settlement 候选；追加失败保持显式","text":"## 6. Terminal state guarantee\n\nNormally exactly one terminal `RuntimeEvent` settles an attempt:\n`AttemptCompleted`, `AttemptCancelled`, or `AttemptFailed`. The terminal\nevent is the last recorded event when its durable append succeeds, the\nplatform outcome maps one-to-one from it\n(`AttemptOutcome::from_terminal_event`), and the loop structure makes later\nevents impossible. The execution state machine is settled immediately before\nthe terminal event append is attempted. A failed append leaves the machine\nterminal and the execution result with its settlement candidate, but no\nterminal Journal fact or observer event.\n","url":"https://github.com/Caismis/rustX/blob/8cb41624eb2dc2ca87e4409961f42553ceb029cf/docs/agent-loop.md#L1498-L1509"},{"id":"source-demand","path":"docs/source-activation.md","start":1,"end":27,"label":"发现不激活来源；选定的有限需求授权准备","text":"# External source demand\n\nMCP definitions in `.agents/mcp.toml` and Python packages in `.agents/tools` are\ninert. Discovery captures identities, definitions, provenance, revisions and bounded\ndiagnostics. It neither connects MCP nor prepares a Python environment.\n\nThe native lifecycle is:\n\n```text\ndefinition -\u003e selection -\u003e finite admitted demand -\u003e credential/source resolution\n           -\u003e connection or preparation -\u003e capability validation -\u003e exact exposure\n```\n\nRoot selects its own source Tools in `agent.tools.sources`. A server key addresses\nMCP; `python:\u003cpackage\u003e` addresses Managed Python. Each value is `\"all\"`, an exact\nTool array, or `[]`. Defining a source or allowlisting a named Agent does not admit\nthat Agent's source demand. The child uses its captured complete profile when it is\nactually admitted. Workflow demand follows its native admission semantics.\n\nThe existing source lifecycle owner performs materialization and settlement. Failed\nrequired preparation rejects admission or the entire reload candidate. No alternate\nconnection manager exists. Tool visibility remains profile-owned; execution,\nconcurrency, approval and deadlines remain global invocation-policy facts.\n\nOffline config inspection performs no external effects. Explicit diagnostic probes\nalso respect demand, and Python preparation requires `--prepare`. See the\n[full configuration reference](configuration.md#resources-and-admission).","url":"https://github.com/Caismis/rustX/blob/8cb41624eb2dc2ca87e4409961f42553ceb029cf/docs/source-activation.md#L1-L27"},{"id":"config-selection","path":"docs/configuration.md","start":296,"end":320,"label":"精确 Tool 选择与由 Rust 管理的封闭 Plugins","text":"Native Tools use an exact whitelist. An omitted whitelist grants none. MCP source\nidentities use their server names; Managed Python uses `python:\u003cpackage\u003e`.\nEach source selection is `\"all\"`, an exact Tool-name array, or `[]` for none.\nAn empty source map replaces no named source entries; set a particular source\nto `[]` to override its inherited selection. Agent and Workflow allowlists are\ncomplete arrays, default empty. Their dispatcher capabilities follow admission\nof those selections. Definition existence never selects a resource.\n\n`agents_md.inherit` defaults true and `files` defaults empty inside its winning\nobject. Files are resolved by the native resource owner, captured with the\ngeneration, and ordered as authored. Root has no child timeout field; it\nbelongs to named profiles.\n\n### Plugins\n\nPlugins are the closed Rust-owned `agent_status`, `todo`, and `goal` capabilities.\nAll default off. Enable one explicitly with `enabled = true`. Agent Status also\nhas `time` and `background` contributor objects. Time accepts its native timezone\nsetting. Replacing `agent_status` replaces its complete object, including both\ncontributors; a higher time setting never inherits the lower background setting.\n\nTodo and Goal's current state lives in their Conversation domains, outside\nconfiguration. Plugin composition controls capability availability. Named Agents\nown their own supported Plugin composition; the native child scope rejects\nRoot-only Goal pursuit. No dynamic plugin loading, hook API or marketplace exists.","url":"https://github.com/Caismis/rustX/blob/8cb41624eb2dc2ca87e4409961f42553ceb029cf/docs/configuration.md#L296-L320"},{"id":"resources","path":"docs/configuration.md","start":394,"end":419,"label":"完整资源遮蔽、Skills 与完整 Agent profile","text":"## Resources and admission\n\nFor every Skill, Agent, Workflow, Python package and MCP identity, the Workspace\ndefinition shadows the complete User definition. Shadow selection occurs before\nvalidation. An invalid Workspace duplicate never restores a valid User duplicate.\nUnused invalid resources yield bounded ordered diagnostics; selecting an invalid\nresource fails the typed resolution or admission operation. A malformed collection\nwhose identities cannot be read cannot expose lower definitions through fallback.\n\nSkills use standard Agent Skills packages at `skills/\u003cname\u003e/SKILL.md`. `skills`\nselection is prompt visibility, not a filesystem ACL. The system prompt provides\nthe resolved absolute User and Workspace Skill collection roots without listing\nevery absolute Skill path. Metadata supports progressive disclosure; bodies are\nread through ordinary model-independent Tool behavior. A child receives captured\npackage bytes and resolved roots; it does not rediscover current files.\n\nNamed Agents use complete TOML profiles at `agents/\u003cname\u003e.toml` with description,\ninstructions, optional model selection, Native/source Tools, Skills, Plugins,\nproject guidance and optional `timeout_ms`. There is no `worktree` table:\nevery Agent runs in the Session's shared workspace, and an authored `worktree`\ntable is refused (#462). See [`agent.schema.json`](../schemas/agent.schema.json).\nThere is no Root Tool or Plugin ceiling. Root's explicit `agent.agents` array\ncontrols whether delegation is allowed. Omitted child model means the invoking\nAttempt's already-frozen effective model, including deliberate Session selection.\nIt never rereads the current Root default. Child admission freezes the complete\nprofile and generation. Existing child-scope restrictions remain domain-owned.","url":"https://github.com/Caismis/rustX/blob/8cb41624eb2dc2ca87e4409961f42553ceb029cf/docs/configuration.md#L394-L419"},{"id":"python-mcp","path":"src/tools/python.rs","start":1,"end":19,"label":"Managed Python 编译到通用 MCP runtime","text":"//! Managed Python tool packages (Issue #174).\n//!\n//! A Python tool package is a workspace folder that compiles into the\n//! generic MCP runtime: it is **not** a second runtime protocol.\n//!\n//! ```text\n//! \u003cworkspace\u003e/.agents/tools/\u003cpackage\u003e/     one folder = one package\n//! ├── server.py                            the `FastMCP` server (entrypoint\n//! │                                        is fixed: server.py:mcp)\n//! ├── requirements.txt                     REQUIRED, even when empty\n//! └── *.py                                 supporting modules\n//! ```\n//!\n//! rustX discovers each package, freezes its bytes into a fingerprint,\n//! prepares an isolated uv environment in the runtime-private store, and\n//! synthesizes one [`McpServerBinding`] per package. From there everything\n//! — connect, `tools/list`, `tools/call`, epochs, availability, commit,\n//! leases, subagent crossing — is the generic MCP machinery of\n//! [`crate::tools::mcp`]; this module ends at the launch specification.","url":"https://github.com/Caismis/rustX/blob/8cb41624eb2dc2ca87e4409961f42553ceb029cf/src/tools/python.rs#L1-L19"},{"id":"skills-contract","path":"src/skills/mod.rs","start":24,"end":35,"label":"Skill 环境归属与普通 Tool 访问","text":"//! Candidate preparation callers wait on an `EnvironmentStore`-owned\n//! `(ecosystem, digest)` build task. Caller cancellation stops only that\n//! caller's wait; the physical materialization remains owned until its\n//! supervised subprocess hierarchy settles and publication returns.\n//!\n//! Skills remain workflow/instruction packages: they are not tools and not\n//! a parallel execution protocol. Skill bodies and supporting files are\n//! current filesystem resources reached through ordinary native tool\n//! semantics at their host paths; they do not create a second execution\n//! protocol or a second path namespace. The capability coordination layer\n//! (`crate::capabilities`) owns the immutable capability snapshot, attempt\n//! leases, and quiescent commit; it consumes this plane but never vice","url":"https://github.com/Caismis/rustX/blob/8cb41624eb2dc2ca87e4409961f42553ceb029cf/src/skills/mod.rs#L24-L35"},{"id":"agents-authority","path":"docs/jobs-and-agents.md","start":139,"end":153,"label":"冻结的持久 Agent 权限与有限 Workflow 子任务","text":"## Authority, history and replay\n\nThe resolved model, Tools, Skills, Plugins, resources, policies and workspace\nare frozen for the durable Agent at creation and reused by later activations.\nConfiguration reload or resource reconciliation and named-profile edits do not silently change it.\n`DurableAgentAuthority` contains resolved authority and inherited execution/\napproval policy only. `ActivationAdmission` separately owns task/context, terminal\ncontract and typed provenance. `CreationTool` and `MessageTool` identify their\nactual ToolCalls; `ClientControl` has no fabricated ToolCall. Finite Workflow\nchildren carry their real Workflow node origin. Activation admission supplies\nnew input and execution identity, not a new profile lookup. Workflow-owned finite AgentRuns remain governed by WorkflowRuntime and\nare not exposed as resumable native Agents.\n\nCanonical child conversation history is authoritative after commit. Each\nactivation's final report reaches the parent exactly once through canonical","url":"https://github.com/Caismis/rustX/blob/8cb41624eb2dc2ca87e4409961f42553ceb029cf/docs/jobs-and-agents.md#L139-L153"},{"id":"agents-workspace","path":"docs/jobs-and-agents.md","start":258,"end":269,"label":"Session 共享工作区与独立物理证明","text":"## Agent workspace binding\n\nEvery Agent runs in the Session's shared workspace (Issue #462). Admission\nfreezes that binding as one absolute path; every activation of the same Agent\nuses exactly it, sees the parent's uncommitted state, and leaves its effects in\nplace on success, failure or cancellation. There is no Agent worktree, copy,\nhandoff or disposal operation. Session deletion retains its existing ownership\nand physical containment checks and never touches the workspace.\n\nWorkflow checks logical terminal, committed publication/value, and physical proof\nseparately. A valid value with unproven containment fails as physical settlement\nuncertainty; committed publication is never described as an unpublished terminal.","url":"https://github.com/Caismis/rustX/blob/8cb41624eb2dc2ca87e4409961f42553ceb029cf/docs/jobs-and-agents.md#L258-L269"},{"id":"agent-controls","path":"docs/jobs-and-agents.md","start":101,"end":132,"label":"精确 activation 的中断、等待与输入接受","text":"Earlier activation answers, earlier guidance attempts, tool narration and provisional\nstream text cannot substitute. Reads use durable storage even before coordinator\nstate restoration. Workflow children retain their committed output-latch contract.\n\n`interrupt_agent` captures the reserved or current activation, requests cancellation\nthrough the admission signal or shared supervisor and waits for physical settlement.\nThe same mutex orders admission commit versus interruption; no control gap exists. The Agent then\nbecomes Inactive and can resume. It never deletes the durable Agent.\n\n`wait_agent` captures the current activation under the registry lock. It waits\nfor that activation to settle and release ownership; a later activation cannot\nretarget or prolong the wait. Inactive returns immediately with no activation\ntarget. During Admitting it captures the reserved generation and waits through\ncommit or physical rollback. A rolled-back reservation returns that activation ID\nwith no execution outcome; failed rollback returns a settlement error. A lost\nclient wait response must not be automatically retried, since a fresh operation\ncould capture a different activation. Physical settlement or canonical-publication\nabandonment returns an explicit settlement error, never successful wait/interrupt\ncompletion while the Agent remains Unavailable.\n\n`send_message` succeeds only after the child accepts input through canonical\ninbound. Active Guidance uses `GuidanceResult::Accepted`; resumed input uses\n`DelegateAccepted` on the activation's uniquely owned control channel. Neither\nownership commit nor writing either input frame proves acceptance. A positive pre-write\nloss is not-delivered; a child `Refused` response is explicit refusal. A lost acknowledgement\nreturns an explicit unknown-delivery error after settlement, never accepted;\ncallers must not blindly retry an ambiguous effect. Restart reconciles the old\nactivation without replaying Delegate, while the child's canonical inbox remains\nauthoritative. Parent Tool cancellation can stop preparation before commit; once\nactivation ownership commits the Agent owns settlement. Cancelling the waiting\nTool releases its waiter, not that owned activation or already accepted input.\n","url":"https://github.com/Caismis/rustX/blob/8cb41624eb2dc2ca87e4409961f42553ceb029cf/docs/jobs-and-agents.md#L101-L132"},{"id":"workflow-program","path":"docs/workflow-programs.md","start":15,"end":28,"label":"被选中的 Workflow 是执行固定作用域程序的一个 Tool","text":"The fixed Workflow architecture (#216–#223) extends the native Workflow foundation (#83). A selected\nWorkflow remains one foreground Tool. Canonical discovery reads\n`.agents/workflows/\u003cid\u003e.yaml`; settings expose it through\n`agent.workflows`. Agent nodes reference discovered named Profiles. Static admission\nfreezes all required capabilities before publication; a block never rediscovers them.\n\n## Authoring and lexical scope\n\nA definition contains `description`, `block`, and trusted `timeout_ms`\n(default 600000). There is no `workspace` key; authoring one is refused. Every block contains\n`input` and `output` JSON Schemas, `entry`, `nodes`, and `edges`. Parallel\nbranches contain an `input` value expression and another `block` of exactly\nthe same shape. There is no Block node, callable subworkflow, conversation,\nor independent job. The node vocabulary is Agent, Tool, Branch, Parallel, Review, Loop, Return.","url":"https://github.com/Caismis/rustX/blob/8cb41624eb2dc2ca87e4409961f42553ceb029cf/docs/workflow-programs.md#L15-L28"},{"id":"workflow-owner","path":"docs/workflow-programs.md","start":352,"end":384,"label":"WorkflowRuntime 负责作用域值、实例与确定性 join","text":"## Identity and lifecycle ownership\n\n`WorkflowProgram` contains one immutable root `WorkflowBlockProgram`.\nEvery compiled branch and Loop body holds a `WorkflowBlockProgram`.\n`WorkflowRuntime::execute_block` is the sole root/branch/body execution and\nlifecycle entry point; it owns private input/local-value lifetime and invokes\nthe same node dispatch for every scope. No one-Agent Parallel executor or\nlegacy grammar remains.\n\n`WorkflowDefinitionPath` contains the configured Workflow id and alternating\nowner-node/child keys: a Parallel branch key or the fixed Loop key `body`.\nA `WorkflowRunId` contains the conversation, native\nadmitted `AttemptId`, and a WorkflowRuntime-owned invocation ordinal.\nCloned runtimes share the ordinal allocator, including across configuration publication.\nRecovery creates a fresh native attempt identity rather than resuming a run.\n`WorkflowBlockInstance` combines\nthat run, the static path and structural invocation components.\n`WorkflowNodeInstance` adds the local node and visit ordinal (zero within an acyclic block).\nRoot starts with invocation path `[0]`; Parallel appends `0`; Loop appends its\none-based iteration. Nested scopes inherit the complete path: `[0,2,0,3]`\nidentifies inner iteration three inside a Parallel branch in outer iteration two.\nThe static paths disambiguate siblings. No static definition is cloned to\nobtain a new identity. Display diagnostics include invocation components too.\nNo identity uses prose, PID, provider\ntext or completion order. The outer `ToolCallId` appears on WorkflowStarted\nonly as model correlation. Registry terminal routing and node facts carry\nthe concrete instance; child ToolCall correlation is a bounded hash of it.\n\nParallel freezes its keyed branch set at node admission. Every ordinary\nbranch failure is collected while all branches continue to settle. Join\nresult insertion and failure aggregation use definition-key order. Branch\nreadiness does not select result keys or change count/data admission limits. Node progress,\nnative process staging, external capacity contention and event timestamps","url":"https://github.com/Caismis/rustX/blob/8cb41624eb2dc2ca87e4409961f42553ceb029cf/docs/workflow-programs.md#L352-L384"},{"id":"workflow-workspace","path":"docs/workflow-programs.md","start":651,"end":674,"label":"Workflow 失败或取消后，共享工作区副作用仍保留","text":"## Shared Session workspace (Issue #462)\n\nA Workflow owns no workspace resource. Every Workflow Agent and Tool runs in the\ninvoking Session's frozen execution binding, the same directory the invoking\nAgent uses. There is no Candidate, worktree, copy, freeze, validation borrow,\nhandoff or rollback, and no implicit Git discovery, allocation or preparation:\n\n- A Workflow Agent child's frozen spec carries the Session binding as its\n  working directory. Its frozen authority, invocation overrides and child-scope\n  restrictions are unchanged. It is a finite Workflow child: ordinary durable\n  Agent controls cannot resume it, and its result and recovery stay owned by its\n  exact Workflow node/visit rather than the parent mailbox.\n- Tools keep their admitted execution contract and working directory. A\n  Workflow invocation never rebinds an external Tool's materialization.\n- Native Bash checkers observe Agent writes in place. A failed check, a Review\n  rejected after a write, cancellation or Workflow failure leaves completed\n  effects in place. A successful Workflow does not complete a Goal, and its\n  results report observations rather than certifying current files.\n- Parallel branches take no lock beyond existing native scheduling. Concurrent\n  writers to the same files are the author's responsibility, exactly as for\n  concurrent Tools in an Agent turn.\n- A successful run returns exactly the declared output value. Failure and\n  cancellation return the native terminal status with no workspace settlement.\n","url":"https://github.com/Caismis/rustX/blob/8cb41624eb2dc2ca87e4409961f42553ceb029cf/docs/workflow-programs.md#L651-L674"},{"id":"goal-authority","path":"docs/goal-extension.md","start":3,"end":21,"label":"只有 GoalPhase 能授权自主继续","text":"## Lifecycle authority (Issue #351)\n\nDurable `GoalPhase` is the one product-visible Goal lifecycle authority. There\nis no process-local activation state and no `armed`/`disarmed` mode:\n\n```text\nActive   = continuation is authorized when runtime admission is eligible\nPaused   = continuation is not authorized\nBlocked  = continuation is not authorized\nComplete = terminal\n```\n\n\u003e **`GoalPhase::Active` is durable authorization to continue when runtime\n\u003e admission becomes eligible.**\n\nConcretely: if a composed Goal is durably `Active`, rustX is authorized to\ncontinue pursuing it whenever the owning `ConversationRuntime` reaches an\neligible safe idle admission boundary. Nothing else has to happen — there is no\narm, play or start operation after Create or Resume, and no state in which an","url":"https://github.com/Caismis/rustX/blob/8cb41624eb2dc2ca87e4409961f42553ceb029cf/docs/goal-extension.md#L3-L21"},{"id":"goal-runtime","path":"docs/goal-extension.md","start":42,"end":76,"label":"Goal 状态、runtime 可用性与原子轮次 admission 各不相同","text":"Two consequences are stated explicitly because they were previously conflated:\n\n\u003e **Runtime stopped is not Goal paused.** Drain and shutdown close runtime\n\u003e admission and supervise runtime-owned work. They never rewrite `Active` to\n\u003e `Paused`, and they never refund a committed round. Reopening that Session\n\u003e later resumes the Active Goal through ordinary admission.\n\n\u003e **Explicit interruption of an autonomous active Goal attempt durably pauses\n\u003e the Goal and requests cancellation of that attempt.** Both actions win their\n\u003e commit boundaries before the interrupt is reported successful.\n\nOwnership stays split:\n\n```text\nGoal phase            -\u003e GoalDomain (durable)\nruntime availability  -\u003e ConversationRuntime lifecycle\nadmission provenance  -\u003e ConversationRuntime, per attempt, never persisted\n```\n\nThe round linearization point is the SQLite commit that both inserts\nordinary Pending Inbound, updates Goal revision and consumed rounds, and records\nthe bounded Goal round-admission journal fact.\nThis extends the existing `accept_inbound_tx` transaction seam; neither local\nreservation nor later canonical adoption consumes an additional round.\n\nThe coordinator checks eligibility at its existing idle admission boundary.\nEligibility is: the Goal extension is composed in the current root profile, the\ndurable phase is `Active`, autonomous budget remains, and the runtime\ncoordination conditions below hold. There is no activation precondition.\nThe driver runs synchronously there, under the coordinator lock, and enters\nthe mailbox lifecycle commit guard. The Goal publication mutex covers the\nrevision observation and durable commit; it is commit/publication ordering\nonly and holds no lifecycle value. The transaction checks the current\nGoalRef and that Pending Inbound is empty before accepting anything. Human\nacceptance and this transaction are serialized by the existing durable","url":"https://github.com/Caismis/rustX/blob/8cb41624eb2dc2ca87e4409961f42553ceb029cf/docs/goal-extension.md#L42-L76"},{"id":"extensions-owner","path":"docs/architecture.md","start":104,"end":120,"label":"Goal 使用协调器与普通 Pending Inbound","text":"Goal joins the existing Runtime Client projection contract: the inactive bootstrap\ncut seeds its bounded view, and native authoritative observations update that copy\nand publish `goal_changed` through the single cursor/replay owner. Journal Written\nand RoundAdmitted facts commit atomically with Goal state and ordinary round\nacceptance; those two are the complete bounded fact vocabulary. Journal facts\nnever reconstruct Goal state. Durable `GoalPhase` is the one Goal lifecycle\nauthority, so no projected view can describe an Active Goal that is not actually\nauthorized to continue. See the [integration and drain\ncontracts](goal-extension.md#execution-facts-and-drain-ownership).\n\n\nGoal is the third closed Native Agent Extension. `GoalDomain` is the sole durable\nrevisioned state authority; its commands and context are adapters. The synchronous\n`GoalRoundDriver` participates in the existing coordinator worker and submits\nordinary typed Pending Inbound. It never owns model execution, canonical history,\nTool execution, request assembly, or a separate queue. See the exact transaction\nand lock contract in [Goal extension](goal-extension.md).","url":"https://github.com/Caismis/rustX/blob/8cb41624eb2dc2ca87e4409961f42553ceb029cf/docs/architecture.md#L104-L120"},{"id":"delivery-commit","path":"docs/file-delivery.md","start":26,"end":55,"label":"交付是已 commit 的类型化 Tool 元数据；Session 文件仍可变","text":"Write, Edit, Bash, Python, MCP-driven commands, or another process may produce the\nfile. Declaration reads metadata, not content; it creates, copies, publishes,\nexecutes, and mutates nothing in the filesystem. Oversized regular files may be\ndeclared but their content read fails explicitly. Cancelled, failed, denied,\ninterrupted, or malformed invocations cannot produce successful delivery cards.\nOrdinary writes and prose such as “I created report.md” do not declare delivery.\nTool-owned JSON property names and ambiguous basenames confer no authority.\n\nThe typed `ToolExecutionResult.deliveries` field is separate from `content` and\nmanaged `artifacts`. `AgentLoopExecution::commit_tool_result_batch` prepares normal\n`MessageBlock::Tool` blocks, then atomically calls\n`ConversationStore::append_canonical_batch_with_events`. The transcript renders\ncards only from successful committed Tool messages. Earlier execution-completion\nobservations do not authorize cards. Cards sit outside completed activity's\ncollapsed seat while keeping its native message/turn anchors.\n\n## Two closed identities\n\nManaged `FileReference` / `ArtifactId` refers to immutable Conversation-owned\nArtifactStore bytes and uses `artifact/read`. Existing allocation, spill,\ncapacity, and lineage materialization semantics remain unchanged.\n\nA `SessionFileReference` identifies an original Conversation, cwd device/inode\nidentity (lossless strings), normalized relative path, original basename,\ndescription, and inert MIME classification. It is a reference to a mutable file,\nnot a snapshot or an ArtifactId. File modification or regular leaf replacement\nbetween reads is visible on reopening. Deletion reports Missing; revocation\nreports Unauthorized; missing original Session/node/mapping or replacement of\nits root reports Unavailable. File-read bodies never enter delivery metadata,\ntranscript/event snapshots, or browser storage.","url":"https://github.com/Caismis/rustX/blob/8cb41624eb2dc2ca87e4409961f42553ceb029cf/docs/file-delivery.md#L26-L55"},{"id":"delivery-access","path":"docs/architecture.md","start":19,"end":39,"label":"传输授予的交付权限与精确 Publication 检查","text":"`app_server::delivery_access` is the one native owner of committed-delivery bytes\nand locations (#454). Two transport-authenticated callers enter it: the private\nProduct Host lane (`product_host`, which also supplies registered roots) and an\n`AppServerConnection` whose transport granted delivery access (`delivery/read`,\n`delivery/locate`). Transports mint the delivery authority; `connection`\nonly routes to its own attachments and registers each request as a\n`delivery_access::Operation` keyed by its exact request id, which\n`delivery/cancel` on the same connection can cancel. The response travels with its\n`Publication` through the bounded outbound queue. The transport writer decides it\nin the same synchronous step in which the transport accepts it (the stdio pipe's\nfirst bytes, or tungstenite's `start_send` under the WebSocket stream lock that\n`transport::websocket::Socket` shares with the reader), rechecking cancellation,\ndelivery authority and the attachment. Every revocation of delivery authority runs\nin the exclusive side of the host's `delivery_access::Revocations`, which\npublication holds shared, so revocations are ordered against publication. Clients consume the same typed committed\nfacts. The Web binds them to Harness-derived presentation over its PreviewWorkspace\nowners. The TUI's pure `tool-present` renderer and `/files` selector dispatch\nintents to its own client-local action owner (`delivery-files.ts`). Each\n`/files` overlay owns one abort scope that the app retires through `#closeOverlay`.\nEvery way the interaction ends goes through that path, so retiring it cancels the\nnative request and any uncommitted local effect.","url":"https://github.com/Caismis/rustX/blob/8cb41624eb2dc2ca87e4409961f42553ceb029cf/docs/architecture.md#L19-L39"},{"id":"connection-detach","path":"docs/app-server-protocol.md","start":255,"end":271,"label":"断开连接与显式关闭自有子进程不同","text":"externally managed server. The ordinary local TUI does not need a loopback\nWebSocket merely to consume the unified App Server protocol. This App Server stdio\nbinding and the remote WebSocket binding carry the same generated App Server DTOs.\n\n### Connection lifetime versus process ownership\n\nFor either transport, connection EOF/close releases that connection's external\nattachments. It does not fabricate turn cancellation, interaction settlement,\nSession unload/delete, or server shutdown. Explicit detach has the same separation.\n\nIn local self-hosted mode, `rustx-tui` owns\n`rustx app-server --listen stdio`. Normal TUI exit explicitly shuts down that child\nthrough the process lifecycle seam. This is owner-driven process shutdown,\nnot transport EOF semantically cancelling work. Persistent execution across TUI\nexit requires an externally managed App Server; WebSocket/existing-server TUI\ndisconnect never shuts down that process. SIGINT/SIGTERM enters the shared server\ndrain contract described below.","url":"https://github.com/Caismis/rustX/blob/8cb41624eb2dc2ca87e4409961f42553ceb029cf/docs/app-server-protocol.md#L255-L271"},{"id":"transport-security","path":"docs/app-server-protocol.md","start":317,"end":350,"label":"专用传输身份验证与交付访问权限","text":"WebSocket requires `--token-file`: 43–128 base64url characters, with at most one\ntrailing LF (129 file bytes maximum). Generate at least 32 random bytes; keep the\nfile user-private. For example:\n\n```sh\numask 077\npython3 -c 'import secrets; print(secrets.token_urlsafe(32))' \u003e /private/user/socket-token\n```\n\nA browser can supply the credential in its handshake without arbitrary headers:\n\n```js\nconst socket = new WebSocket(\"ws://127.0.0.1:8080/\", [\n  \"rustx.app-server.v49\",\n  `rustx-token.${dedicatedTransportToken}`,\n]);\n```\n\nThe server requires both offers on path `/` without a query, rejects failed admission\nwith HTTP 401, and selects only `rustx.app-server.v49` in its response. It never echoes\nthe credential. A client the operator trusts with committed-delivery bytes may also\noffer `rustx-delivery-access.\u003cseparate secret\u003e` (`--delivery-access-token-file`); a\nwrong or unconfigured value fails the whole handshake, and it never substitutes for\nthe transport token. Admission completes before constructing `AppServerConnection`, so\nunauthenticated clients cannot initialize or invoke any method. This is a dedicated\nsingle-user transport secret, never a provider key, MCP secret, or runtime credential.\nIt is captured at startup; rotation requires restarting the process.\n\nThe trusted host supplies this token to authorized clients. It owns secure token\ndelivery/storage, redaction of handshake headers in proxy logs, browser origin/CSP\npolicy, TLS termination (`wss://` externally), network access, OS identity/isolation,\nand process supervision. Use secure termination for non-loopback deployments. All\nadmitted clients act within the same user environment; rustX adds no accounts,\ntenancy, workspace ACLs, or authentication inside `initialize`.","url":"https://github.com/Caismis/rustX/blob/8cb41624eb2dc2ca87e4409961f42553ceb029cf/docs/app-server-protocol.md#L317-L350"},{"id":"trace-owner","path":"docs/architecture.md","start":6582,"end":6588,"label":"Trace 是只读 projection，绝不是恢复输入","text":"### Read-only Trace presentation\n\n[`runtime_client::trace::TraceProjection`](trace.md) joins bounded native facts for\nclient presentation. It owns no durable data and is never read by execution,\nsettlement, cancellation or recovery. Its dedicated Trace cursor and newest\nsnapshot window remain separate from canonical messages, transcript paging and\nlive observation cursors.","url":"https://github.com/Caismis/rustX/blob/8cb41624eb2dc2ca87e4409961f42553ceb029cf/docs/architecture.md#L6582-L6588"},{"id":"model-items","path":"src/model/adapter/traits.rs","start":18,"end":44,"label":"语义模型事件与仅用于执行的进度","text":"/// Ephemeral provider-derived progress that is not canonical model output.\n///\n/// Adapters use this only when provider activity cannot yet be represented by\n/// a [`ModelEvent`]. The runtime consumes it for request-local deadline\n/// semantics; it is never assembled, published, journaled, or persisted.\n#[derive(Debug, Clone, Copy, PartialEq, Eq)]\npub enum ModelStreamProgress {\n    /// The provider generated semantic model output that is not yet\n    /// attributable to a canonical event.\n    Generation,\n    /// The opened provider stream is alive without proving generation began.\n    Liveness,\n}\n\n/// One item produced by a provider-independent model stream.\n///\n/// `Event` carries canonical model facts consumed by the Agent Loop or\n/// summarizer. `Progress` is execution-only evidence from an adapter: it\n/// drives request deadlines but cannot enter canonical assembly or any\n/// durable/output plane.\n#[derive(Debug, Clone, PartialEq)]\npub enum ModelStreamItem {\n    /// A canonical normalized model event.\n    Event(ModelEvent),\n    /// Ephemeral provider-derived generation or liveness evidence.\n    Progress(ModelStreamProgress),\n}","url":"https://github.com/Caismis/rustX/blob/8cb41624eb2dc2ca87e4409961f42553ceb029cf/src/model/adapter/traits.rs#L18-L44"},{"id":"extensions-code","path":"src/extensions.rs","start":1,"end":12,"label":"封闭原生组合保留 Conversation 领域状态","text":"//! Closed Rust-owned Agent Plugins. User-facing configuration uses `plugins`.\n//!\n//! Root and named profiles each opt into Agent Status, Todo, and Goal. Omitted\n//! Plugins are off. Workspace replaces each Plugin identity as a whole object.\n//! Plugins compose through the existing Context Assembly, Tool Plane, and\n//! Conversation owners; there is no dynamic loader or third-party lifecycle API.\n//!\n//! A configuration generation freezes composition. Native preparation stages and publishes\n//! the complete next generation at a safe boundary. Admitted work keeps its old\n//! composition. Todo lists and Goal state remain Conversation domain state.\n//! Named Agents own independent composition; Root authorizes their names, not\n//! their Tool or Plugin dimensions. Child scope constraints remain native.","url":"https://github.com/Caismis/rustX/blob/8cb41624eb2dc2ca87e4409961f42553ceb029cf/src/extensions.rs#L1-L12"},{"id":"inward-contracts","path":"CONTRIBUTING.md","start":28,"end":41,"label":"依赖指向内部；禁止内核直接依赖外部组件","text":"## Architecture policy\n\nDependencies must point inward toward runtime-owned abstractions.\n\nDo not expose external SDK types through public runtime-core interfaces.\n\nDo not make the agent kernel depend directly on:\n\n- provider SDKs\n- MCP SDKs\n- databases\n- HTTP frameworks\n- process implementations\n- control-plane schemas","url":"https://github.com/Caismis/rustX/blob/8cb41624eb2dc2ca87e4409961f42553ceb029cf/CONTRIBUTING.md#L28-L41"},{"id":"model-protocols","path":"src/model/adapter/traits.rs","start":1,"end":7,"label":"三种协议实现与提供方无关的适配器","text":"//! The runtime-owned model adapter interface.\n//!\n//! All three M2 protocols (`OpenAI` Chat Completions, `OpenAI` Responses,\n//! and `Anthropic` Messages) implement exactly this interface. The interface is\n//! provider-independent in both directions: the input is a provider-neutral\n//! [`ModelRequest`], the output is a [`ModelStreamItem`] stream, and no\n//! provider SDK type appears in any signature.","url":"https://github.com/Caismis/rustX/blob/8cb41624eb2dc2ca87e4409961f42553ceb029cf/src/model/adapter/traits.rs#L1-L7"},{"id":"native-invocation","path":"docs/tool-lifecycle.md","start":1,"end":28,"label":"共享 ForegroundInvocation，以及观测与权限 gate 的区别","text":"# Canonical Tool lifecycle\n\nWF-02 separates canonical framing from native invocation. `ToolInvocation.id`\nis a caller-neutral `ToolInvocationId`: Agent correlation contains its accepted\n`ToolCallId`; Workflow correlation contains its concrete `WorkflowNodeInstance`.\nCapability `ToolOrigin` remains Builtin/MCP and is not caller identity.\n\nOne shared argument preparation helper performs normalization and native schema\nvalidation. The shared permission gate consumes those immutable prepared facts.\n`tools::invocation::ForegroundInvocation` owns the single foreground driver:\nstart protection, genuine progress, hard/idle arbitration, cancellation and\nphysical settlement-plane consumption. Callers publish their own execution facts;\nonly the Agent Loop owns canonical slots and atomic ordered ToolResult batches.\nWorkflow Tool nodes neither synthesize model calls nor append internal history.\n\nNative Prepared, Started, Progress, settlement and Completed Journal appends are\nbest-effort observations, not permission gates. When policy selects Ask, the\nInteractionCoordinator commits the exact preparation subject through durable\ninteraction authority before exposing a prompt. This transaction pins the concrete\ninvocation, tool identity and normalized-argument digest; it refuses replacement\nsubjects for the same invocation. Agent approval still verifies its canonical\nproposal. A failed approval audit commit fails closed before publication/start;\nan ordinary native observation failure cannot veto or relabel execution.\n\nEach native lifecycle owns an absorbing cancellation-cause view. Its winner is\nselected in cancellation, hard, idle, completion priority order. The winning\ncause is installed before the child signal is cancelled. Descendants read that\ntyped cause, falling through to their ancestor until their own lifecycle wins:","url":"https://github.com/Caismis/rustX/blob/8cb41624eb2dc2ca87e4409961f42553ceb029cf/docs/tool-lifecycle.md#L1-L28"}]}</script>
  <script>(() => {
  'use strict';
  const data = JSON.parse(document.getElementById('explorer-data').textContent);
  const workspace = document.getElementById('workspace');
  const nodes = new Map(data.nodes.map((node) => [node.id, node]));
  const evidence = new Map(data.evidence.map((item) => [item.id, item]));
  const layers = [...new Set(data.nodes.map((node) => node.layer))];
  const state = { mode: 'map', node: data.nodes[0].id, relation: 'all', request: 0, scenario: 0, choice: 0, step: 0, topic: 0 };
  const escape = (value) => String(value).replace(/[&<>"']/g, (character) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[character]);
  const list = (items) => `<ul class="plain-list">${items.map((item) => `<li>${escape(item)}</li>`).join('')}</ul>`;
  const badge = (kind) => `<span class="relation-kind ${kind}">${{ call: '运行时调用', data: '数据流', dependency: '代码依赖' }[kind]}</span>`;
  const sourceDetails = (ids) => `<section class="source-section" aria-label="源码依据"><h3>查看源码 <span class="count">${ids.length}</span></h3><p class="source-help">源码摘录已打包，可离线查看。GitHub 链接会打开固定基线。</p>${ids.map((id) => {
    const item = evidence.get(id);
    return `<details class="source"><summary><span>${escape(item.label)}</span><code>${escape(item.path)}:${item.start}–${item.end}</code></summary><div class="source-body"><div class="source-toolbar"><span>基线 ${escape(data.baseline.commit.slice(0, 8))}</span><a href="${escape(item.url)}" target="_blank" rel="noopener noreferrer">在 GitHub 查看 ↗</a></div><pre tabindex="0" lang="en" aria-label="${escape(item.path)}，第 ${item.start} 至 ${item.end} 行"><code>${item.text.split('\n').map((line, index) => `<span class="source-line"><span class="line-number" aria-hidden="true">${item.start + index}</span><span>${escape(line) || ' '}</span></span>`).join('')}</code></pre></div></details>`;
  }).join('')}</section>`;
  const nodeChips = (ids) => `<div class="node-chips">${ids.map((id) => `<button type="button" class="node-chip" data-inspect="${escape(id)}">${escape(nodes.get(id).label)} <span aria-hidden="true">↗</span></button>`).join('')}</div>`;
  function mapMarkup(active = [], compact = false) {
    const selectedRelations = data.relations.filter((relation) => (relation.from === state.node || relation.to === state.node) && (state.relation === 'all' || relation.kind === state.relation));
    const neighbors = new Set(selectedRelations.flatMap((relation) => [relation.from, relation.to]));
    return `<div class="architecture-map ${compact ? 'compact' : ''}" data-map><svg class="map-lines" aria-hidden="true"><defs><marker id="arrow-call" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 8 4 L 0 8 z"/></marker><marker id="arrow-data" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 8 4 L 0 8 z"/></marker><marker id="arrow-dependency" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 8 4 L 0 8 z"/></marker></defs><g data-lines></g></svg>${layers.map((layer, index) => `<section class="map-layer"><h3><span>${String(index + 1).padStart(2, '0')}</span>${escape(layer)}</h3><div class="layer-nodes">${data.nodes.filter((node) => node.layer === layer).map((node) => `<button type="button" data-node="${escape(node.id)}" class="map-node ${!compact && node.id === state.node ? 'selected' : ''} ${compact && active.includes(node.id) ? 'active' : ''} ${!compact && neighbors.has(node.id) && node.id !== state.node ? 'neighbor' : ''}" ${!compact ? `aria-pressed="${node.id === state.node}"` : `aria-label="查看 ${escape(node.label)}${active.includes(node.id) ? '，在此步骤中活跃' : ''}"`}><span class="node-name">${escape(node.label)}</span>${!compact ? `<span class="node-summary">${escape(node.summary)}</span>` : ''}${compact && active.includes(node.id) ? '<span class="active-dot" aria-hidden="true"></span>' : ''}</button>`).join('')}</div></section>`).join('')}</div>`;
  }
  function relationsMarkup(node) {
    const relations = data.relations.filter((relation) => (relation.from === node.id || relation.to === node.id) && (state.relation === 'all' || relation.kind === state.relation));
    return `<section class="relationships"><h3>关联职责</h3><p class="source-help">箭头表示关系方向。代码依赖不代表运行时调用。</p>${relations.length ? `<ul>${relations.map((relation) => `<li>${badge(relation.kind)}<span class="relation-endpoints"><button type="button" data-node="${escape(relation.from)}">${escape(nodes.get(relation.from).label)}</button><span aria-hidden="true">→</span><button type="button" data-node="${escape(relation.to)}">${escape(nodes.get(relation.to).label)}</button></span><p>${escape(relation.label)}</p></li>`).join('')}</ul>` : '<p>此职责没有这种类型的关联。</p>'}</section>`;
  }
  function renderMap() {
    const node = nodes.get(state.node);
    workspace.innerHTML = `<div class="section-heading"><div><p class="eyebrow">01 / 职责与关系</p><h2>按所有权理解架构。</h2></div><p>选择一项职责，查看它负责什么、边界在哪里，以及对应的源码依据。</p></div><div class="map-controls" role="group" aria-label="关系类型">${[['all', '所有关系'], ['call', '运行时调用'], ['data', '数据流'], ['dependency', '代码依赖']].map(([value, label]) => `<button type="button" class="filter ${value}" data-relation="${value}" aria-pressed="${state.relation === value}"><span aria-hidden="true"></span>${label}</button>`).join('')}</div><div class="map-layout"><div class="map-board"><div class="board-label"><span>职责地图</span><span>${data.nodes.length} 项职责 / ${layers.length} 个分组</span></div>${mapMarkup()}<p class="map-caption">选择节点以追踪关联。每张卡片代表一项架构职责，不一定对应独立进程。</p></div><aside class="inspector" aria-label="所选职责"><p class="eyebrow">${escape(node.layer)}</p><h2>${escape(node.label)}</h2><p class="lead">${escape(node.summary)}</p><h3>负责内容</h3>${list(node.owns)}<h3>职责边界</h3>${list(node.boundaries)}${relationsMarkup(node)}${sourceDetails(node.evidence)}</aside></div>`;
    drawLines();
  }
  function stepperMarkup(steps, index, context) {
    const step = steps[index];
    return `<div class="walk-layout"><aside class="step-index" aria-label="步骤导航"><p class="eyebrow">${context === 'request' ? '请求路径' : '结果路径'}</p><ol>${steps.map((item, itemIndex) => `<li><button type="button" data-step="${itemIndex}" ${index === itemIndex ? 'aria-current="step"' : ''}><span class="step-number">${String(itemIndex + 1).padStart(2, '0')}</span><span>${escape(item.title)}</span>${itemIndex < index ? '<span class="completed" aria-label="已浏览">✓</span>' : ''}</button></li>`).join('')}</ol></aside><article class="step-content"><div class="step-control"><span class="step-progress">第 ${index + 1} 步 / 共 ${steps.length} 步</span><div><button type="button" class="text-button" data-replay ${index === 0 ? 'disabled' : ''}>↺ 重置</button><button type="button" class="square-button" data-prev ${index === 0 ? 'disabled' : ''} aria-label="上一步">←</button><button type="button" class="square-button" data-next ${index === steps.length - 1 ? 'disabled' : ''} aria-label="下一步">→</button></div></div><div class="step-announcement" aria-live="polite" aria-atomic="true"><p class="eyebrow">执行方 / ${escape(step.actor)}</p><h2>${escape(step.title)}</h2></div><p class="step-description">${escape(step.description)}</p><div class="fact-grid"><section><h3><span aria-hidden="true">▣</span> 持久化事实</h3><p>${escape(step.durable)}</p></section><section><h3><span aria-hidden="true">◉</span> 客户端可见内容</h3><p>${escape(step.visible)}</p></section></div><section class="active-responsibilities"><h3>此步骤涉及的职责</h3>${nodeChips(step.active)}<p class="source-help">下方会突出显示相关职责。选择一项职责可查看其架构。</p>${mapMarkup(step.active, true)}</section>${sourceDetails(step.evidence)}<div class="bottom-step-control"><button type="button" class="secondary-button" data-prev ${index === 0 ? 'disabled' : ''}>← 上一步</button>${index < steps.length - 1 ? '<button type="button" class="primary-button" data-next>下一步 →</button>' : '<span class="path-complete">路径结束 <span aria-hidden="true">✓</span></span>'}</div></article></div>`;
  }
  function renderRequest() {
    workspace.innerHTML = `<div class="section-heading"><div><p class="eyebrow">02 / 从意图到观测</p><h2>追踪一次请求。</h2></div><p>沿着一条引导式执行路径，按自己的节奏前进，观察职责如何在系统中流转。</p></div>${stepperMarkup(data.request, state.request, 'request')}`;
  }
  function renderScenarios() {
    const scenario = data.scenarios[state.scenario];
    const choice = scenario.choices[state.choice];
    workspace.innerHTML = `<div class="section-heading"><div><p class="eyebrow">03 / 边界上的决策</p><h2>遇到这些情况时……</h2></div><p>选择一种情境和结果。这些有源码依据的路径说明了架构的约束。</p></div><div class="scenario-tabs" role="group" aria-label="边界场景">${data.scenarios.map((item, index) => `<button type="button" data-scenario="${index}" aria-pressed="${index === state.scenario}"><span>${String(index + 1).padStart(2, '0')}</span>${escape(item.title)}</button>`).join('')}</div><section class="scenario-intro"><div><h2>${escape(scenario.title)}</h2><p>${escape(scenario.intro)}</p></div><fieldset><legend>选择一种结果</legend>${scenario.choices.map((item, index) => `<label class="choice ${state.choice === index ? 'chosen' : ''}"><input type="radio" name="outcome" data-choice="${index}" value="${index}" ${state.choice === index ? 'checked' : ''}><span>${escape(item.label)}</span></label>`).join('')}</fieldset></section>${stepperMarkup(choice.steps, state.step, 'scenario')}`;
  }
  function renderTopics() {
    const topic = data.topics[state.topic];
    workspace.innerHTML = `<div class="section-heading"><div><p class="eyebrow">04 / 深入一层</p><h2>理解系统如何协同运作。</h2></div><p>了解一项设计决策，追踪相关职责，并查看对应的源码快照。</p></div><div class="topic-layout"><aside class="topic-nav" aria-label="深入专题">${data.topics.map((item, index) => `<button type="button" data-topic="${index}" ${index === state.topic ? 'aria-current="true"' : ''}><span>${String(index + 1).padStart(2, '0')}</span>${escape(item.title)}<span aria-hidden="true">↗</span></button>`).join('')}</aside><article class="topic-content"><p class="eyebrow">深入专题 / ${String(state.topic + 1).padStart(2, '0')}</p><h2>${escape(topic.title)}</h2><p class="lead">${escape(topic.summary)}</p><div class="topic-details">${topic.details.map((detail) => `<p>${escape(detail)}</p>`).join('')}</div><h3>相关职责</h3>${nodeChips(topic.nodes)}${sourceDetails(topic.evidence)}</article></div>`;
  }
  function render() {
    document.querySelectorAll('[data-mode]').forEach((button) => {
      if (button.dataset.mode === state.mode) button.setAttribute('aria-current', 'page');
      else button.removeAttribute('aria-current');
    });
    ({ map: renderMap, request: renderRequest, scenarios: renderScenarios, topics: renderTopics })[state.mode]();
    revealCurrentStep();
  }
  function revealCurrentStep() {
    const strip = workspace.querySelector('.step-index ol');
    const current = strip?.querySelector('[aria-current="step"]');
    if (!current || strip.scrollWidth <= strip.clientWidth) return;
    const stripBounds = strip.getBoundingClientRect();
    const currentBounds = current.getBoundingClientRect();
    if (currentBounds.right > stripBounds.right - 4) {
      strip.scrollLeft += currentBounds.right - stripBounds.right + 4;
    } else if (currentBounds.left < stripBounds.left + 4) {
      strip.scrollLeft += currentBounds.left - stripBounds.left - 4;
    }
  }
  function drawLines() {
    const map = workspace.querySelector('[data-map]:not(.compact)');
    if (!map) return;
    const svg = map.querySelector('svg');
    const group = svg.querySelector('[data-lines]');
    const bounds = map.getBoundingClientRect();
    svg.setAttribute('viewBox', `0 0 ${bounds.width} ${bounds.height}`);
    const relations = data.relations.filter((relation) => (relation.from === state.node || relation.to === state.node) && (state.relation === 'all' || relation.kind === state.relation));
    group.replaceChildren();
    relations.forEach((relation) => {
      const from = map.querySelector(`[data-node="${relation.from}"]`).getBoundingClientRect();
      const to = map.querySelector(`[data-node="${relation.to}"]`).getBoundingClientRect();
      const down = to.top >= from.top;
      const sameRow = Math.abs(from.top - to.top) < Math.min(from.height, to.height) / 2;
      const right = to.left >= from.left;
      const x1 = (sameRow ? (right ? from.right : from.left) : from.left + from.width / 2) - bounds.left;
      const y1 = (sameRow ? from.top + from.height / 2 : down ? from.bottom : from.top) - bounds.top;
      const x2 = (sameRow ? (right ? to.left : to.right) : to.left + to.width / 2) - bounds.left;
      const y2 = (sameRow ? to.top + to.height / 2 : down ? to.top : to.bottom) - bounds.top;
      const curve = sameRow ? `M${x1},${y1} C${(x1 + x2) / 2},${y1} ${(x1 + x2) / 2},${y2} ${x2},${y2}` : `M${x1},${y1} C${x1},${(y1 + y2) / 2} ${x2},${(y1 + y2) / 2} ${x2},${y2}`;
      const line = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      line.setAttribute('d', curve);
      line.setAttribute('class', `map-line ${relation.kind}`);
      line.setAttribute('marker-end', `url(#arrow-${relation.kind})`);
      group.append(line);
    });
  }
  function navigateNode(id) {
    state.node = id;
    state.mode = 'map';
    render();
    workspace.querySelector('.inspector').scrollIntoView({ block: 'nearest' });
    const heading = workspace.querySelector('.inspector h2');
    heading.tabIndex = -1;
    heading.focus({ preventScroll: true });
  }
  document.addEventListener('click', (event) => {
    const button = event.target.closest('button');
    if (!button || button.disabled) return;
    if (button.dataset.mode) { state.mode = button.dataset.mode; render(); return; }
    if (button.dataset.inspect) { navigateNode(button.dataset.inspect); return; }
    if (button.dataset.node) {
      if (state.mode !== 'map') { navigateNode(button.dataset.node); return; }
      state.node = button.dataset.node; render();
      if (window.matchMedia('(max-width: 850px)').matches) {
        const heading = workspace.querySelector('.inspector h2');
        heading.tabIndex = -1;
        heading.focus({ preventScroll: true });
        heading.scrollIntoView({ block: 'nearest' });
      } else {
        workspace.querySelector(`.map-node[data-node="${state.node}"]`).focus({ preventScroll: true });
      }
      return;
    }
    if (button.dataset.relation) {
      state.relation = button.dataset.relation; render();
      workspace.querySelector(`[data-relation="${state.relation}"]`).focus({ preventScroll: true });
      return;
    }
    if (button.dataset.scenario !== undefined) { state.scenario = Number(button.dataset.scenario); state.choice = 0; state.step = 0; render(); workspace.querySelector(`[data-scenario="${state.scenario}"]`).focus({ preventScroll: true }); return; }
    if (button.dataset.topic !== undefined) { state.topic = Number(button.dataset.topic); render(); workspace.querySelector(`[data-topic="${state.topic}"]`).focus({ preventScroll: true }); return; }
    const indexKey = state.mode === 'request' ? 'request' : 'step';
    const steps = state.mode === 'request' ? data.request : data.scenarios[state.scenario].choices[state.choice].steps;
    let changed = false;
    if (button.dataset.step !== undefined) { state[indexKey] = Number(button.dataset.step); changed = true; }
    if (button.hasAttribute('data-prev')) { state[indexKey] = Math.max(0, state[indexKey] - 1); changed = true; }
    if (button.hasAttribute('data-next')) { state[indexKey] = Math.min(steps.length - 1, state[indexKey] + 1); changed = true; }
    if (button.hasAttribute('data-replay')) { state[indexKey] = 0; changed = true; }
    if (changed) {
      render();
      const heading = workspace.querySelector('.step-announcement h2');
      heading.tabIndex = -1;
      heading.focus({ preventScroll: true });
      heading.scrollIntoView({ block: 'nearest' });
    }
  });
  document.addEventListener('change', (event) => {
    if (event.target.name === 'outcome') {
      state.choice = Number(event.target.value); state.step = 0; render();
      workspace.querySelector(`input[name="outcome"][value="${state.choice}"]`).focus({ preventScroll: true });
    }
  });
  document.querySelector('.wordmark').addEventListener('click', (event) => {
    event.preventDefault(); state.mode = 'map'; render(); window.scrollTo({ top: 0 });
  });
  document.getElementById('intro').textContent = data.intro;
  document.title = `${data.title} · rustX`;
  document.getElementById('baseline').innerHTML = `<span class="baseline-tag">源码基线</span><details class="baseline-details"><summary><code>${escape(data.baseline.commit.slice(0, 8))}</code> <span>${escape(data.baseline.branch)}</span><span aria-hidden="true">⌄</span></summary><div><code>${escape(data.baseline.commit)}</code><p lang="en">${escape(data.baseline.subject)}</p><p>本导览介绍的是固定快照，不会跟踪当前工作区，也不会执行请求。</p></div></details><span class="simulation-label">教学模拟</span>`;
  render();
  new ResizeObserver(() => {
    drawLines();
    revealCurrentStep();
  }).observe(workspace);
})();
</script>
</body>
</html>
