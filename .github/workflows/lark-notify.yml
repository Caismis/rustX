name: Lark notifications

on:
  workflow_dispatch:
  pull_request_target:
    types: [opened, ready_for_review, synchronize, closed]
  issues:
    types: [assigned]
  workflow_run:
    workflows: [CI, Workspace Host platform conformance, PR review signal]
    types: [completed]

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  notify:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.name == 'PR review signal' &&
       github.event.workflow_run.event == 'pull_request_review' &&
       github.event.workflow_run.conclusion == 'success') ||
      (github.event.workflow_run.name != 'PR review signal' &&
       (github.event.workflow_run.conclusion == 'failure' ||
        github.event.workflow_run.conclusion == 'timed_out'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Always use trusted default-branch code, never the PR head or merge ref.
      # Do not consume artifacts or caches produced by the triggering workflow.
      - name: Checkout notification code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Send signed notification
        env:
          LARK_WEBHOOK: ${{ secrets.LARK_WEBHOOK }}
          LARK_SIGN_SECRET: ${{ secrets.LARK_SIGN_SECRET }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/lark_notify.py
