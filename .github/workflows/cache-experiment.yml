# Isolated cache experiments for the CI performance PR (#570).
#
# Every lineage here is prefixed `exp-` so experiment entries can never be
# restored by a production lane (the production policy's seven lineages are
# untouched), and only pushes to this experiment branch publish — the same
# ownership contract as the production policy (untrusted pull_request code
# is never a cache writer).
#
# Three variants, each compiling exactly what rust-platform-core compiles
# (external boundary targets + the lib test target), so warm-cache numbers
# compare directly against that lane's measured timings:
#   exp-workspace-crates: rust-cache including first-party artifacts.
#   exp-sccache:          sccache on the GitHub Actions cache backend, with
#                         an actions/cache local-disk fallback.
#   exp-combo:            rust-cache dependency lineage + sccache layered on
#                         top (sccache covers what the target dir does not).
#
# A first push publishes the exp caches (cold numbers); the next push
# restores them (warm numbers). Restore/save times come from the cache step
# durations; compile times from /usr/bin/time -l; sccache hit rates from
# `sccache --show-stats`.
name: Cache experiment

on:
  workflow_dispatch:
  push:
    branches:
      - devin/1794960987-macos-ci-build-speed

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: "1"
  CARGO_PROFILE_TEST_DEBUG: "1"
  CARGO_BUILD_JOBS: "2"

jobs:
  exp-workspace-crates:
    name: Experiment A — rust-cache incl. workspace crates
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.100.0"
      - name: Install SQLite binding build dependency
        uses: ./.github/actions/libclang
      - name: Cache Rust artifacts including workspace crates
        id: rust-cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: exp-macos-ws
          cache-workspace-crates: true
          save-if: ${{ github.event_name == 'push' }}
      - name: Install Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
      - name: Sync the provider emulator environment
        working-directory: test-support/fake-provider
        run: uv sync --frozen
      - name: Compile the external boundary targets and stage executables
        run: >-
          /usr/bin/time -l python3 test-support/prepare_native_tests.py --
          cargo test --all-features --locked --no-run --timings
          --test durable
          --test process
          --test subagent
          --test tools
          --test conformance
          --test cfg3_catalog
          --test cfg3_managed_output
      - name: Compile the lib test target
        run: >-
          /usr/bin/time -l cargo test --all-features --locked --no-run --lib
      - name: Record experiment environment
        if: always()
        shell: bash
        run: |
          {
            echo '## exp-workspace-crates'
            echo "rust-cache cache-hit: ${{ steps.rust-cache.outputs.cache-hit }}"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Native Cargo timing reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: exp-ws-cargo-timings
          path: target/cargo-timings/*.html
          retention-days: 7
          if-no-files-found: warn

  exp-sccache:
    name: Experiment B — sccache (GHA backend + disk fallback)
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      CARGO_INCREMENTAL: "0"
      SCCACHE_CACHE_SIZE: 8G
    steps:
      - uses: actions/checkout@v7
      - name: Point sccache at the runner-temp disk store
        run: echo "SCCACHE_DIR=$RUNNER_TEMP/sccache" >> "$GITHUB_ENV"
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.100.0"
      - name: Install SQLite binding build dependency
        uses: ./.github/actions/libclang
      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.9
      - name: Local-disk sccache fallback
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/sccache
          key: exp-sccache-disk-${{ runner.os }}-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
      - name: Install Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
      - name: Sync the provider emulator environment
        working-directory: test-support/fake-provider
        run: uv sync --frozen
      - name: Compile the external boundary targets and stage executables
        run: >-
          /usr/bin/time -l python3 test-support/prepare_native_tests.py --
          cargo test --all-features --locked --no-run --timings
          --test durable
          --test process
          --test subagent
          --test tools
          --test conformance
          --test cfg3_catalog
          --test cfg3_managed_output
      - name: Compile the lib test target
        run: >-
          /usr/bin/time -l cargo test --all-features --locked --no-run --lib
      - name: sccache statistics and environment
        if: always()
        shell: bash
        run: |
          sccache --show-stats
          {
            echo '## exp-sccache'
            echo '```'
            sccache --show-stats
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Native Cargo timing reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: exp-sccache-cargo-timings
          path: target/cargo-timings/*.html
          retention-days: 7
          if-no-files-found: warn

  exp-combo:
    name: Experiment C — rust-cache deps + sccache layered
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.100.0"
      - name: Install SQLite binding build dependency
        uses: ./.github/actions/libclang
      - name: Cache Rust dependencies
        id: rust-cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: exp-macos-deps-sccache
          save-if: ${{ github.event_name == 'push' }}
      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.9
      - name: Install Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
      - name: Sync the provider emulator environment
        working-directory: test-support/fake-provider
        run: uv sync --frozen
      - name: Compile the external boundary targets and stage executables
        run: >-
          /usr/bin/time -l python3 test-support/prepare_native_tests.py --
          cargo test --all-features --locked --no-run --timings
          --test durable
          --test process
          --test subagent
          --test tools
          --test conformance
          --test cfg3_catalog
          --test cfg3_managed_output
      - name: Compile the lib test target
        run: >-
          /usr/bin/time -l cargo test --all-features --locked --no-run --lib
      - name: sccache statistics and environment
        if: always()
        shell: bash
        run: |
          sccache --show-stats
          {
            echo '## exp-combo'
            echo "rust-cache cache-hit: ${{ steps.rust-cache.outputs.cache-hit }}"
            echo '```'
            sccache --show-stats
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Native Cargo timing reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: exp-combo-cargo-timings
          path: target/cargo-timings/*.html
          retention-days: 7
          if-no-files-found: warn
