name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  # Static checks get their own job so formatting/lint failures report in
  # about two minutes instead of after a full test build.
  quality:
    name: Format, lint, and whitespace
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # The one Rust cache policy, applied identically to every Rust-bearing
      # lane. Five properties matter and all five are deliberate:
      #
      # 1. It runs *after* the toolchain step, so the resolved compiler is part
      #    of the cache identity. The key the action builds already covers the
      #    runner OS and architecture, the rustc version and host triple,
      #    `rust-toolchain.toml`, the Cargo manifests and lockfile, and the
      #    build-relevant CARGO/CC/CFLAGS/CXX/CMAKE/RUST* environment. Linux
      #    and macOS artifacts therefore can never share a lineage.
      #
      # 2. `shared-key` names one stable lineage per semantic lane, replacing
      #    the action's automatic job-id component with a readable name. Lanes
      #    deliberately do NOT share a key with each other: GitHub cache
      #    entries are immutable and these jobs start concurrently, so a single
      #    shared key would let whichever lane finishes first freeze its own
      #    (smallest) `target/` as the entry every other lane then restores and
      #    can never correct. Per-lane lineages mean each lane stops rebuilding
      #    its own unchanged dependency graph on every run, which is the actual
      #    optimization; cross-populating siblings within one cold run is not a
      #    goal.
      #
      # 3. Only the dependency graph is cached. The action excludes workspace
      #    crates by default and that default is kept, so no rustX artifact is
      #    ever restored from a cache — the crate and its test code are always
      #    compiled from the checked-out source in every run.
      #
      # 4. The cache is an optimization and never a semantic authority. A cold,
      #    evicted, or stale cache changes nothing about which tests are
      #    selected or what they prove; it only changes how much dependency
      #    compilation is repeated. A completely cold runner remains valid.
      #
      # 5. Every lane may *restore* a compatible cache, but only a trusted push
      #    to `main` *publishes* one — that is what `save-if` encodes. Pull
      #    requests are cache consumers, never cache publishers: a PR cannot
      #    spend the repository's shared cache budget (the seven lineages are
      #    ~7.1 GB of a 10 GB LRU pool) and untrusted fork execution can never
      #    become a writer of the state trusted runs later restore. The reuse
      #    path is `main` cache -> future run with a compatible key. This
      #    workflow's `push` trigger is already `main`-only; the condition
      #    stays explicit so the ownership contract is locally obvious.
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: quality
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Check whitespace
        run: git diff --check

  # Fast deterministic classes: source-module unit tests, the in-crate
  # scripted contract suites, and the pure contract targets. No cross-module
  # boundary conformance suite runs here: none needs a real process, a
  # provider, or a network beyond loopback fixture servers. (Unit tests of
  # boundary-owning modules still exercise their module's own primitive —
  # the bash tool's unit tests spawn bash, the uv backend's run uv — which
  # is what `--bins` is for: it builds the `bash-supervisor` binary those
  # unit tests exec.)
  #
  # Semantic class and compilation placement are different axes: the lib
  # test binary also contains the in-crate *boundary conformance* suites, so
  # they are excluded by their stable name prefix.
  rust-contracts:
    name: Deterministic contracts (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # One lineage per lane; see the policy note in the `quality` job.
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-contracts
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      # `cargo test --bins` builds the bin *test harnesses* but does not
      # place the binaries at `target/debug/`, where the bash tool's unit
      # tests look for `bash-supervisor` at runtime — so build them first.
      - name: Build the binaries the boundary-owning unit tests exec
        run: cargo build --bins

      # Source-module unit tests + the scripted contract suites (agent/,
      # context/, runtime_client/, capability/, interaction/, background/,
      # tools/). The in-crate boundary conformance suites are selected OUT by
      # their `boundary_suites::` prefix; they run in the boundary jobs.
      #
      # `--bins`/`--examples` execute zero tests today: none of the three
      # binaries and none of the three examples defines a `#[test]`, and
      # dropping both selectors was measured at ~41s of saved link time. They
      # are kept regardless. Cargo already owns test-target discovery, so a
      # test added to a bin or an example in future is picked up here
      # automatically — which is simpler than a second repository policy
      # saying those targets must stay test-free forever.
      - name: Run unit tests and the in-crate contract suites
        run: 'cargo test --lib --bins --examples --all-features -- --skip boundary_suites::'

      # contracts/: pure serialization/configuration fixture contracts.
      # provider/: adapter request serialization, stream parsing, error
      # normalization over the in-process FixtureServer. The provider
      # target also carries the #[ignore]d opt-in live smoke tests, which
      # never run here.
      - name: Run the pure contract targets
        run: cargo test --test contracts --test provider --all-features

  # Real boundaries: SQLite durability/recovery, the spawned rustx process
  # and stdio/IPC transport, the subagent child-process boundary, the tool
  # plane (shell, filesystem, executable discovery), and composed
  # provider-emulator conformance. The emulator is mandatory:
  # RUSTX_REQUIRE_PROVIDER_EMULATOR=1 turns a missing toolchain into a hard
  # failure instead of a silent skip.
  rust-boundaries:
    name: Boundary suites (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # One lineage per lane; see the policy note in the `quality` job.
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-boundaries
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Install Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Sync the provider emulator environment
        working-directory: test-support/fake-provider
        run: uv sync --frozen

      # The emulator's own pytest suite is platform-independent Python and
      # runs in this job only.
      - name: Run the provider-emulator tests
        working-directory: test-support/fake-provider
        run: uv run --frozen pytest

      # The in-crate boundary conformance suites (real process death, real
      # bash supervision, staged subagent children, real MCP stdio fixture
      # children), selected by their stable name prefix. `cargo build --bins`
      # comes first: the text_spill suite execs the `bash-supervisor` binary
      # by path and `cargo test --lib` does not build it.
      - name: Build the binaries the in-crate boundary suites exec
        run: cargo build --bins

      - name: Run the in-crate boundary suites
        run: 'cargo test --lib --all-features -- boundary_suites::'

      - name: Run the external boundary targets
        env:
          RUSTX_REQUIRE_PROVIDER_EMULATOR: "1"
        run: >-
          cargo test --all-features
          --test durable
          --test process
          --test subagent
          --test tools
          --test conformance
          --test cfg3_catalog
          --test cfg3_managed_output

  # Platform coverage is intentional, not duplicated by habit. macOS runs
  # exactly the classes where OS semantics matter:
  #
  # - from the lib test binary: the source-module unit tests plus the
  #   in-crate boundary conformance suites (`boundary_suites::` — real
  #   SIGKILL process death, bash supervision, staged subagent children,
  #   MCP stdio fixture children). The deterministic scripted contract
  #   suites are selected OUT by their `scripted_suites::` prefix: they are
  #   pure state-machine/planning/manual-clock contracts whose invariants
  #   carry no OS semantics, so rerunning them on macOS would be duplication
  #   without platform value.
  # - external targets: durable (SQLite/filesystem), process (spawned
  #   binary, stdio/IPC), subagent (child process/control socket), tools
  #   (shell, filesystem, executable discovery), conformance (external
  #   emulator process).
  #
  # The contracts and provider targets assert deterministic JSON/SSE
  # translation with no process or filesystem semantics, so they are
  # Linux-only.
  rust-platform-boundaries:
    name: Platform-sensitive boundaries (macOS)
    runs-on: macos-latest
    # Cold macOS compilation took 19 minutes at the reviewed Trace head;
    # the complete suites were still progressing when the old 25-minute job
    # deadline killed them. Keep test-level liveness guards and budget the
    # cold build plus all mandatory boundary targets.
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # One lineage per lane; see the policy note in the `quality` job. This is
      # the macOS lineage: it shares nothing with any Linux lane, because the
      # action's key carries the runner OS, architecture and host triple.
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-platform-boundaries
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      # The conformance target launches the provider emulator with `uv run`.
      - name: Install Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Sync the provider emulator environment
        working-directory: test-support/fake-provider
        run: uv sync --frozen

      # Lib test binary: source-module unit tests (including the bash/uv
      # boundary-owning modules, whose OS primitives are platform-sensitive)
      # + the in-crate boundary conformance suites; the deterministic
      # scripted contract suites are skipped by prefix. The explicit bin
      # build is required: `cargo test --bins` alone does not place
      # `bash-supervisor` at `target/debug/` where the tests look for it.
      - name: Build the binaries the boundary tests exec
        run: cargo build --bins

      # App Server scripted contracts live under the manager's cfg(test) module
      # to reach its private owner gates; their physical test class is still
      # deterministic and Linux-only, despite this different name prefix.
      #
      # `--bins` executes zero tests today and removing it was measured, but it
      # is retained so Cargo's normal target discovery picks up any future test
      # added to a binary. It is not a substitute for the explicit
      # `cargo build --bins` step above, which serves a different contract:
      # placing the real executables at `target/debug/` for tests to exec.
      - name: Run unit tests and the in-crate boundary suites
        run: 'cargo test --lib --bins --all-features -- --skip scripted_suites:: --skip local_runtime::session_runtime_manager::tests::'

      - name: Run the external boundary targets
        env:
          RUSTX_REQUIRE_PROVIDER_EMULATOR: "1"
        run: >-
          cargo test --all-features
          --test durable
          --test process
          --test subagent
          --test tools
          --test conformance
          --test cfg3_catalog
          --test cfg3_managed_output

  # The TUI is a separate job on purpose: the Rust suites must never depend on
  # Node being present.
  tui:
    name: TUI typecheck and tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The real-child integration suite drives the shared provider emulator,
      # so this job needs the same Python 3.12 + uv toolchain as the Rust one.
      - name: Install Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Sync the provider emulator environment
        working-directory: test-support/fake-provider
        run: uv sync --frozen

      # Node comes from nvm's LTS line, declared explicitly. The intent is
      # "rustX TUI runs on the supported Node LTS", not "whatever Node the
      # runner happens to preinstall".
      - name: Install the Node LTS through nvm
        # `set -u` is deliberately not used: nvm's shell functions reference
        # unset variables internally and abort under it.
        run: |
          set -eo pipefail
          export NVM_DIR="$HOME/.nvm"
          mkdir -p "$NVM_DIR"
          curl -fsSL https://raw.githubusercontent.com/nvm-sh/nvm/v0.40.4/install.sh | bash
          # shellcheck source=/dev/null
          . "$NVM_DIR/nvm.sh"
          nvm install --lts
          nvm use --lts
          corepack enable
          # Cache the exact pnpm from tui/package.json's `packageManager` so
          # the later steps resolve it without hitting the network.
          (cd tui && corepack install)
          node --version
          # Put the resolved LTS bin directory ahead of the runner's
          # preinstalled Node for every later step.
          dirname "$(command -v node)" >> "$GITHUB_PATH"

      # The pnpm steps run with `tui` as the working directory on purpose:
      # Corepack resolves `packageManager` from the manifest in the current
      # directory, and from the repository root it cannot see tui's.
      - name: Report the resolved toolchain
        working-directory: tui
        run: |
          node --version
          pnpm --version

      - name: Install dependencies
        working-directory: tui
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        working-directory: tui
        run: pnpm typecheck

      # One lineage per lane; see the policy note in the `quality` job. This
      # lane has no toolchain action of its own — it uses the runner's
      # preinstalled Rust, which the cache key still identifies by `rustc -vV`
      # — so the cache step sits immediately before the one cargo command.
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: tui
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      # The integration suite drives the real binary over the real stdio
      # transport, so it must exist before the tests run.
      - name: Build the rustx binary
        run: cargo build --bin rustx

      - name: Test
        working-directory: tui
        env:
          RUSTX_REQUIRE_PROVIDER_EMULATOR: "1"
        run: pnpm test

  app-server-protocol:
    name: App Server generated protocol
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # One lineage per lane; see the policy note in the `quality` job. This
      # lane is Rust-bearing despite its Node surface: `pnpm check` shells out
      # to `cargo run --example generate_app_server_protocol`.
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: app-server-protocol
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install pinned protocol toolchain
        working-directory: protocol/app-server
        run: |
          corepack enable
          corepack install
          pnpm install --frozen-lockfile
      - name: Check schema and TypeScript drift
        working-directory: protocol/app-server
        run: pnpm check
      - name: Typecheck Rust fixtures and reference intersections
        working-directory: protocol/app-server
        run: pnpm typecheck

  web-console:
    name: Full Web conformance
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install pinned browser toolchain
        working-directory: web-console
        run: |
          corepack enable
          corepack install
          pnpm install --frozen-lockfile
      # Browser acceptance also connects the actual remote TUI client to the
      # same server. Install its existing dependencies, never a private client.
      - name: Install the TUI client used by shared-server browser acceptance
        working-directory: tui
        run: pnpm install --frozen-lockfile
      - name: Install and check development launchers
        working-directory: dev
        run: |
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm test
      - name: Typecheck
        working-directory: web-console
        run: pnpm typecheck
      - name: Deterministic native client and presentation tests
        working-directory: web-console
        run: pnpm test
      - name: Source provenance and dependency notices
        working-directory: web-console
        run: pnpm check:provenance
      - name: Production build from checked-in source
        working-directory: web-console
        run: pnpm build
      # These tools serve only the browser integration fixture. Rust-only jobs
      # above remain independent of Node and of this frontend package.
      - uses: dtolnay/rust-toolchain@stable
      # One lineage per lane; see the policy note in the `quality` job.
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: web-console
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - name: Prepare the existing provider emulator
        working-directory: test-support/fake-provider
        run: uv sync --frozen
      - name: Build the real App Server and native Tool supervisors
        run: cargo build --bins
      # browser-tests.sh supplies Chromium, fonts and rasterization libraries in
      # one digest-pinned Playwright container, also used for reference updates.
      # No host browser/font install or browser cache can change the rendering.
      - name: Full product browser acceptance against the real App Server and Product Host
        working-directory: web-console
        run: pnpm test:e2e
      - name: Browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-console-browser-evidence
          path: web-console/test-results/
          if-no-files-found: ignore
