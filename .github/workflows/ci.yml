name: CI

# Two verification profiles (tests/README.md, "Verification profiles"):
#
# - FAST: every pull request push. The always-on checks plus the suites of
#   the surfaces the change touches.
# - FULL: every job, complete. Runs on main, nightly, on manual dispatch, and
#   on a pull request carrying the `full-verification` label, for its
#   current and every later head.
#
# The `plan` job (.github/scripts/verification.py) owns job selection: every
# gated job runs only when `run[<its id>]` is true. `verification` ("Merge
# verification") is the one verdict to require for merge: it fails unless
# every selected job succeeded, a high-risk change was verified by FULL, and
# the verified head is still the pull request's head.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches:
      - main
  schedule:
    - cron: "17 19 * * *"
  workflow_dispatch:

permissions:
  contents: read

# Artifacts are built once and consumed by other jobs, so every Node setup
# must use the same exact patch even when runners cache different releases.
# Linux jobs share Ubuntu 26.04 so native artifacts, consumers, and the installed
# AppArmor document-sandbox profile stay aligned; the latest alias must not roll it.
env:
  NODE_VERSION: "24.22.0"

# A newer run for the same pull request (a push, or a label) supersedes its
# unfinished predecessor. main, scheduled and dispatched runs each form their
# own group and are never cancelled; another pull request never shares one.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    name: Verification plan
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
      run: ${{ steps.plan.outputs.run }}
      steps: ${{ steps.plan.outputs.steps }}
      browser: ${{ steps.plan.outputs.browser }}
    steps:
      - uses: actions/checkout@v7
      - name: Classify the change and select the profile's jobs
        id: plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/verification.py plan

  notifications:
    name: Notification metadata and signing
    runs-on: ubuntu-26.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v7
      - name: Test notification filters, signing, and secret isolation
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v

  # Static checks get their own job so formatting/lint failures report in
  # about two minutes instead of after a full test build.
  quality:
    name: Format and lint
    needs: plan
    if: fromJSON(needs.plan.outputs.run)['quality']
    runs-on: ubuntu-26.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.100.0"
          components: rustfmt, clippy

      - name: Install SQLite binding build dependency
        uses: ./.github/actions/libclang
      # The one Rust cache policy, applied identically to every Rust-bearing
      # lane. Five properties matter and all five are deliberate:
      #
      # 1. It runs *after* the toolchain step, so the resolved compiler is part
      #    of the cache identity. The key the action builds already covers the
      #    runner OS and architecture, the rustc version and host triple,
      #    `rust-toolchain.toml`, the Cargo manifests and lockfile, and the
      #    build-relevant CARGO/CC/CFLAGS/CXX/CMAKE/RUST* environment.
      #
      # 2. `shared-key` names one stable lineage per semantic lane, replacing
      #    the action's automatic job-id component with a readable name. Lanes
      #    that can start concurrently deliberately do NOT share a key with
      #    each other: GitHub cache entries are immutable, so a single shared
      #    key would let whichever lane finishes first freeze its own
      #    (smallest) `target/` as the entry every other lane then restores and
      #    can never correct. Per-lane lineages mean each lane stops rebuilding
      #    its own unchanged dependency graph on every run, which is the actual
      #    optimization; cross-populating siblings within one cold run is not a
      #    goal. The one sanctioned exception is `rust-platform-macos`, shared
      #    by `rust-platform-core` (FAST-only) and `rust-platform-boundaries`
      #    (FULL-only): the two never run in the same profile, compile the same
      #    dependency graph under identical settings, and the sharing halves
      #    the macOS cache budget.
      #
      # 3. Only the dependency graph is cached. The action excludes workspace
      #    crates by default and that default is kept, so no rustX artifact is
      #    ever restored from a cache — the crate and its test code are always
      #    compiled from the checked-out source in every run.
      #
      # 4. The cache is an optimization and never a semantic authority. A cold,
      #    evicted, or stale cache changes nothing about which tests are
      #    selected or what they prove; it only changes how much dependency
      #    compilation is repeated. A completely cold runner remains valid.
      #
      # 5. Publishing has two scopes. A `main` push publishes the shared
      #    lineage every run may restore (this workflow's `push` trigger is
      #    `main`-only). A pull_request run may additionally publish into the
      #    PR's own cache scope — writes on the merge ref are visible only to
      #    later runs of that same PR and can never reach `main`, so PR saves
      #    add entries without polluting the trusted lineage. They do still
      #    draw on the repository's shared ~10 GB cache pool, so scope
      #    isolation ≠ capacity isolation: each PR adds ~1 GB per lane entry.
      #    Fork execution keeps its own scope and can never become a writer
      #    of what `main` runs restore. The macOS lineages
      #    (`rust-platform-macos`, `desktop-host`) are published by `main`'s
      #    FULL runs once this lands; `rust-platform-core` is a FAST-only lane
      #    and `main` only runs FULL, so it restores the same unified
      #    `rust-platform-macos` entry that `rust-platform-boundaries`
      #    publishes. Until then PR-scope saves keep those lanes self-warming.
      #    A PR's first run stays cold unless a compatible main/base cache
      #    exists — its own saves warm only that PR's later runs.
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: quality
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Test current and historical benchmark controllers and summaries
        run: python3 -m unittest discover -s benchmarks/runtime -p 'test_*.py' -v

      - name: Install pinned Node for benchmark contract tests
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Test benchmark request comparison and normalization contracts
        run: node --test benchmarks/runtime/compare-http.test.mjs benchmarks/runtime/pi-oracle.test.mjs

      - name: Test native test preparation and artifact staging
        run: python3 -m unittest discover -s test-support -p 'test_*.py' -v

      - name: Run Clippy (default features)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run Clippy (all features)
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Check rustdoc warnings
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --workspace --no-deps --all-features --locked

  # FAST Rust feedback for a pull request push that touches Rust: one
  # compilation of the library test harness and the `process` target (which
  # also places the real executables at target/debug/), the FAST selection of
  # unit and contract modules without the capacity suite (`::scale::`), and
  # the real process, stdio and WebSocket App Server workflows. FULL replaces
  # this job with the complete rust-contracts and rust-boundaries lanes; the
  # lane check proves every test this job omits is executed there.
  rust-fast:
    name: Fast Rust contracts and real-process workflows (Linux)
    needs: plan
    if: fromJSON(needs.plan.outputs.run)['rust-fast']
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      VERIFICATION_PROFILE: fast
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.100.0"

      - name: Install SQLite binding build dependency
        uses: ./.github/actions/libclang
      # The rust-boundaries lineage: the same all-feature library, test
      # harness and integration-target dependency graph.
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-boundaries
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Install Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3

      - name: Sync the provider emulator environment
        working-directory: test-support/fake-provider
        run: uv sync --frozen

      - name: Compile the FAST harnesses and stage the real executables
        run: python3 test-support/prepare_native_tests.py -- cargo test --all-features --locked --no-run --lib --test process

      # Every unit and deterministic contract module except the in-crate
      # boundary suites (rust-boundaries), the capacity suite, and four heavy
      # contract groups, which run below when the change touches them.
      - name: Run the FAST unit and contract core
        env:
          RUSTX_REQUIRE_PROVIDER_EMULATOR: "1"
        run: 'cargo test --lib --all-features --locked -- --skip boundary_suites:: --skip ::scale:: --skip local_runtime::session_runtime_manager::tests:: --skip local_runtime::session:: --skip runtime_client::response::'

      - name: Run the App Server and Session contracts (App Server or local runtime changes)
        if: fromJSON(needs.plan.outputs.steps)['rust-fast:app-server']
        env:
          RUSTX_REQUIRE_PROVIDER_EMULATOR: "1"
        run: 'cargo test --lib --all-features --locked -- local_runtime::session_runtime_manager::tests:: local_runtime::session:: --skip ::scale::'

      - name: Run the runtime client response contracts (runtime client changes)
        if: fromJSON(needs.plan.outputs.steps)['rust-fast:runtime-client']
        run: 'cargo test --lib --all-features --locked -- runtime_client::response:: --skip ::scale::'

      - name: Run the real-process App Server and CLI workflows
        env:
          RUSTX_REQUIRE_PROVIDER_EMULATOR: "1"
        run: cargo test --all-features --locked --test process


      # Unit tests of the extracted workspace crates (rustx-*), including
      # rustx-durable's SQLite store contracts, run here unconditionally so a
      # crates/** change cannot slip past FAST; only the `::scale::` capacity
      # module is excluded. check_test_lanes enumerates each member's lib
      # tests and fails closed when a new member is left unselected, when the
      # skip matches nothing, or when a member `::scale::` test is selected.
      - name: Run extracted workspace crate tests
        run: 'cargo test --workspace --exclude rustx --lib --all-features --locked -- --skip ::scale::'

      - name: Check test lane coverage
        run: cargo run --profile test --all-features --locked --example check_test_lanes -- --job rust-fast

  # FAST documentation contracts: a low-risk documentation change merges on
  # FAST, but the `contracts` target reads the top-level, docs/, Web and TUI
  # Markdown (tests/contracts/documentation.rs, runtime_examples.rs). This
  # lane runs that target alone so such a change cannot merge unchecked. FULL
  # runs the same target in rust-contracts and does not select this job.
  documentation-contracts:
    name: Documentation contracts (Linux)
    needs: plan
    if: fromJSON(needs.plan.outputs.run)['documentation-contracts']
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      VERIFICATION_PROFILE: fast
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.100.0"

      - name: Install SQLite binding build dependency
        uses: ./.github/actions/libclang
      # A consumer of the rust-contracts lineage (the same dependency graph):
      # this lane never publishes a cache of its own, so it adds no lineage to
      # the shared cache budget; see the policy note in the `quality` job.
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-contracts
          save-if: false

      - name: Run the documentation and runtime-example contracts
        run: cargo test --test contracts --all-features --locked

  # Fast deterministic classes: source-module unit tests, the in-crate
  # scripted contract suites, and the pure contract targets. No cross-module
  # boundary conformance suite runs here: none needs a real process, a
  # provider, or a network beyond loopback fixture servers. (Unit tests of
  # boundary-owning modules still exercise their module's own primitive —
  # the bash tool's unit tests spawn bash, the uv backend's run uv — which
  # is what `--bins` is for: it builds the `bash-supervisor` binary those
  # unit tests exec.)
  #
  # Semantic class and compilation placement are different axes: the lib
  # test binary also contains the in-crate *boundary conformance* suites, so
  # they are excluded by their stable name prefix.
  rust-contracts:
    name: Deterministic contracts (Linux)
    needs: plan
    if: fromJSON(needs.plan.outputs.run)['rust-contracts']
    runs-on: ubuntu-26.04
    # Preparation and the two native builds consumed about 11 minutes in
    # run 38883956631. After Plan-default tool fixtures were moved to Full
    # Access (and tool-start waits shortened to 15s), the contracts step is
    # back in the 20–35m band on tip; restore the pre-hang 90m ceiling.
    timeout-minutes: 90

    env:
      VERIFICATION_PROFILE: full
      # Phase-2 experiment: the hosted runner has 4 vCPU; compile-phase
      # parallelism previously serialized at 1. libtest concurrency,
      # targets, assertions, and the 90-minute ceiling stay unchanged.
      CARGO_BUILD_JOBS: "4"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.100.0"

      - name: Install SQLite binding build dependency
        uses: ./.github/actions/libclang
      # One lineage per lane; see the policy note in the `quality` job.
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-contracts
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      # Compile the contracts lane's targets once with `--all-features` and stage
      # the emitted package binaries beside every emitted test harness executable.
      # Including `--test contracts --test provider` builds those binaries against
      # the same ordinary library unit without a second default-feature build.
      - name: Record compiler budget
        run: |
          echo "CARGO_BUILD_JOBS=${CARGO_BUILD_JOBS}"
          nproc
          awk '/MemAvailable|MemTotal/ {print}' /proc/meminfo
      - name: Compile the contracts harnesses and stage the real executables
        env:
          RUSTX_PREPARED_JSON_OUT: ${{ runner.temp }}/contracts-artifacts.json
        run: python3 test-support/prepare_native_tests.py -- cargo test --all-features --locked --no-run --lib --bins --examples --test contracts --test provider

      # Build-once/test-many: the compiled harnesses plus the staged real
      # executables are packed with their repo-relative layout (the tests'
      # compile-time CARGO_BIN_EXE_* paths still resolve on a shard runner),
      # inventoried by libtest discovery under this lane's own filters, and
      # split across the shard jobs by duration weight. rust-contracts-shard
      # executes the assigned tests; rust-contracts-report proves every
      # inventoried test ran exactly once.
      - name: Bind the prepared artifacts to this checkout
        run: python3 test-support/rust_test_shards.py manifest --features all-features --profile test --out "$RUNNER_TEMP/contracts-manifest/manifest.json"
      - name: Pack the harnesses and staged executables
        run: python3 test-support/rust_test_shards.py pack --target-dir target/debug --cargo-json "$RUNNER_TEMP/contracts-artifacts.json" --out "$RUNNER_TEMP/contracts-prepared"
      - name: Discover the contracts inventory and assign the shards
        run: python3 test-support/rust_test_shards.py inventory --manifest "$RUNNER_TEMP/contracts-manifest/manifest.json" --prepared "$RUNNER_TEMP/contracts-prepared" --spec test-support/rust-lanes/contracts.json --shards 3 --weights test-support/rust-shard-weights.json --out "$RUNNER_TEMP/contracts-inventory"
      - name: Package the prepared artifacts
        run: tar -C "$RUNNER_TEMP/contracts-prepared" -cf - . | zstd -T0 -1 -o "$RUNNER_TEMP/contracts-prepared.tar.zst"
      - uses: actions/upload-artifact@v7
        with:
          name: rust-contracts-prepared
          path: ${{ runner.temp }}/contracts-prepared.tar.zst
          compression-level: 0
          retention-days: 3
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: rust-contracts-inventory
          path: |
            ${{ runner.temp }}/contracts-inventory/
            ${{ runner.temp }}/contracts-manifest/
          retention-days: 14
          if-no-files-found: error

      # Cargo/libtest discovery of this lane's targets against every Linux
      # step that selects them: an unassigned target, a stale filter or
      # --skip, or a Linux test no lane executes fails here. The checker is
      # an `--examples` target, so it is already compiled by the prepare
      # step above and this run completes in seconds. It scans ci.yml
      # statically; its own placement in this job is irrelevant.
      - name: Check test lane coverage
        run: cargo run --profile test --all-features --locked --example check_test_lanes -- --job rust-contracts --job rust-contracts-shard --job rust-contracts-post

      # The tests these steps used to run in this job now execute on the
      # rust-contracts-shard runners against the packed artifact above; the
      # shard reports prove the same coverage this lane asserted before.
      # Source-module unit tests + the scripted contract suites
      # (`scripted_suites::`) + the App Server scripted contracts compiled
      # under the session runtime manager's private test module
      # (`local_runtime::session_runtime_manager::tests::`). The in-crate
      # boundary conformance suites are selected OUT by their
      # `boundary_suites::` prefix; they run in the boundary jobs.
      #
      # `--examples` runs the `session_list_benchmark` workload-checker tests;
      # `--bins` executes zero tests today, since no binary defines a
      # `#[test]`. Both selectors are kept: Cargo already owns test-target
      # discovery, so a test added to a bin or an example is picked up here
      # automatically — which is simpler than a second repository policy
      # saying those targets must stay test-free forever.

      # contracts/: pure serialization/configuration fixture contracts.
      # provider/: adapter request serialization, stream parsing, error
      # normalization over the in-process FixtureServer. The provider
      # target also carries the #[ignore]d opt-in live smoke tests, which
      # never run here.

  # The contracts lane's non-artifact tail — doctests, extracted member
  # unit tests, and the lane coverage check — runs in parallel with the
  # shards instead of delaying their start. It rebuilds on its own runner;
  # the shards are the critical path.
  rust-contracts-post:
    name: Deterministic contracts (doctests + members)
    needs: plan
    if: fromJSON(needs.plan.outputs.run)['rust-contracts-post']
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    env:
      VERIFICATION_PROFILE: full
      CARGO_BUILD_JOBS: "4"
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.100.0"
      - name: Install SQLite binding build dependency
        uses: ./.github/actions/libclang
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-contracts
          # This job runs in parallel with rust-contracts, which owns the
          # lineage's publication; saving here too would race the same key.
          save-if: false

      # Doctests (both positive API counterparts and `compile_fail` encapsulation
      # proofs) are not executed by `--all-targets`; execute them explicitly
      # here against the compiled `--all-features` library.
      - name: Run doctests
        # --workspace so doctests that moved into the extracted rustx-*
        # crates keep executing; the lane checker forwards it the same way.
        run: cargo test --doc --workspace --all-features --locked

      # Unit tests of the extracted workspace crates (rustx-*): the lanes
      # select only the root package, so run every member except rustx once.
      # check_test_lanes fails closed when a new member is left unselected.
      - name: Run extracted workspace crate tests
        run: cargo test --workspace --exclude rustx --lib --all-features --locked

  # Real boundaries: SQLite durability/recovery, the spawned rustx process
  # and stdio/IPC transport, the subagent child-process boundary, the tool
  # plane (shell, filesystem, executable discovery), and composed
  # provider-emulator conformance. The uv toolchain is mandatory for every
  # step that runs a uv-dependent boundary (the emulator and the managed
  # FastMCP children): RUSTX_REQUIRE_PROVIDER_EMULATOR=1 turns a missing
  # toolchain into a hard failure instead of a silent skip.
  # Three shard runners, each executing its assigned slice of the packed
  # contracts inventory by exact test name. All shards always finish so one
  # failure never hides the others; rust-contracts-report owns the verdict.
  rust-contracts-shard:
    name: Deterministic contracts (shard ${{ matrix.shard }}/3)
    needs: [plan, rust-contracts]
    if: fromJSON(needs.plan.outputs.run)['rust-contracts-shard']
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    env:
      VERIFICATION_PROFILE: full
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Prepare the provider emulator used by contract tests
        working-directory: test-support/fake-provider
        run: uv sync --frozen
      - uses: actions/download-artifact@v8
        with:
          name: rust-contracts-prepared
          path: ${{ runner.temp }}
      - uses: actions/download-artifact@v8
        with:
          name: rust-contracts-inventory
          path: ${{ runner.temp }}/inventory
      - name: Restore the packed artifacts at their compile-time paths
        run: tar -C . -xf "$RUNNER_TEMP/contracts-prepared.tar.zst"
      - name: Execute shard ${{ matrix.shard }}
        env:
          RUSTX_REQUIRE_PROVIDER_EMULATOR: "1"
        run: python3 test-support/rust_test_shards.py run --manifest "$RUNNER_TEMP/inventory/contracts-manifest/manifest.json" --prepared . --inventory "$RUNNER_TEMP/inventory/contracts-inventory/inventory.json" --spec test-support/rust-lanes/contracts.json --features all-features --profile test --root . --shard ${{ matrix.shard }} --report shard-report/report.json
      - name: Shard report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rust-contracts-shard-${{ matrix.shard }}
          path: shard-report/
          if-no-files-found: ignore

  # The one contracts verdict: every inventoried test ran exactly once and
  # every selected shard succeeded.
  rust-contracts-report:
    name: Deterministic contracts coverage
    needs: [plan, rust-contracts, rust-contracts-shard]
    if: ${{ !cancelled() && fromJSON(needs.plan.outputs.run)['rust-contracts-report'] }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: rust-contracts-inventory
          path: ${{ runner.temp }}/inventory
      - uses: actions/download-artifact@v8
        with:
          pattern: rust-contracts-shard-*
          path: ${{ runner.temp }}/runs
      - name: Verify complete coverage across shards
        run: python3 test-support/rust_test_shards.py verify --inventory "$RUNNER_TEMP/inventory/contracts-inventory/inventory.json" --runs "$RUNNER_TEMP/runs"
      - name: All selected shards succeeded
        run: test "${{ needs.rust-contracts-shard.result }}" = success

  rust-boundaries:
    name: Boundary suites (Linux)
    needs: plan
    if: fromJSON(needs.plan.outputs.run)['rust-boundaries']
    runs-on: ubuntu-26.04
    # Cold libclang setup and both native builds exhausted 25 minutes in
    # runs 39798438811 and 39811600857. Match rust-contracts at the restored
    # pre-hang 90m ceiling once Plan Ask stalls were removed from fixtures.
    timeout-minutes: 90

    env:
      VERIFICATION_PROFILE: full
      # Same Phase-2 compiler-parallelism experiment as rust-contracts.
      # Targets, assertions, libtest concurrency, and the 90-minute ceiling stay.
      CARGO_BUILD_JOBS: "4"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.100.0"

      - name: Install SQLite binding build dependency
        uses: ./.github/actions/libclang
      # One lineage per lane; see the policy note in the `quality` job.
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-boundaries
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Install Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3

      - name: Sync the provider emulator environment
        working-directory: test-support/fake-provider
        run: uv sync --frozen

      # The emulator's own pytest suite is platform-independent Python and
      # runs in this job only.
      - name: Run the provider-emulator tests
        working-directory: test-support/fake-provider
        run: uv run --frozen pytest

      # Prepare and stage the emitted package binaries beside the `--test`
      # and `--lib` test harnesses before executing either boundary step.
      - name: Record compiler budget
        run: |
          echo "CARGO_BUILD_JOBS=${CARGO_BUILD_JOBS}"
          nproc
          awk '/MemAvailable|MemTotal/ {print}' /proc/meminfo
      - name: Compile the boundary harnesses and stage the real executables
        env:
          RUSTX_PREPARED_JSON_OUT: ${{ runner.temp }}/boundaries-artifacts.json
        run: >-
          python3 test-support/prepare_native_tests.py --
          cargo test --all-features --locked --no-run
          --lib
          --test durable
          --test process
          --test subagent
          --test tools
          --test conformance
          --test cfg3_catalog
          --test cfg3_managed_output

      # Build-once/test-many, mirroring rust-contracts: pack the compiled
      # harnesses plus the staged real executables, inventory them under
      # this lane's own filters, split across shard runners by duration
      # weight, and prove in rust-boundaries-report that every inventoried
      # test ran exactly once. The two executing steps this lane used to
      # carry now run on the rust-boundaries-shard runners.
      - name: Bind the prepared artifacts to this checkout
        run: python3 test-support/rust_test_shards.py manifest --features all-features --profile test --out "$RUNNER_TEMP/boundaries-manifest/manifest.json"
      - name: Pack the harnesses and staged executables
        run: python3 test-support/rust_test_shards.py pack --target-dir target/debug --cargo-json "$RUNNER_TEMP/boundaries-artifacts.json" --out "$RUNNER_TEMP/boundaries-prepared"
      - name: Discover the boundaries inventory and assign the shards
        run: python3 test-support/rust_test_shards.py inventory --manifest "$RUNNER_TEMP/boundaries-manifest/manifest.json" --prepared "$RUNNER_TEMP/boundaries-prepared" --spec test-support/rust-lanes/boundaries.json --shards 3 --weights test-support/rust-shard-weights.json --out "$RUNNER_TEMP/boundaries-inventory"
      - name: Package the prepared artifacts
        run: tar -C "$RUNNER_TEMP/boundaries-prepared" -cf - . | zstd -T0 -1 -o "$RUNNER_TEMP/boundaries-prepared.tar.zst"
      - uses: actions/upload-artifact@v7
        with:
          name: rust-boundaries-prepared
          path: ${{ runner.temp }}/boundaries-prepared.tar.zst
          compression-level: 0
          retention-days: 3
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: rust-boundaries-inventory
          path: |
            ${{ runner.temp }}/boundaries-inventory/
            ${{ runner.temp }}/boundaries-manifest/
          retention-days: 14
          if-no-files-found: error

      # Extracted workspace crate unit tests run once, in rust-contracts:
      # executing them here too was a measured six-to-seven-minute duplicate
      # with no additional coverage.
      # See the same step in `rust-contracts`; this lane's targets are the
      # lib test harness and the external boundary targets. With
      # --all-features the checker links the library unit the external
      # targets already compiled (dev-dependency features included); without
      # it Cargo builds one more complete rustX library just for the checker.
      - name: Check test lane coverage
        run: cargo run --profile test --all-features --locked --example check_test_lanes -- --job rust-boundaries --job rust-boundaries-shard

  # Three shard runners, each executing its assigned slice of the packed
  # boundaries inventory by exact test name. All shards always finish so
  # one failure never hides the others; rust-boundaries-report owns the
  # verdict.
  rust-boundaries-shard:
    name: Boundary suites (shard ${{ matrix.shard }}/3)
    needs: [plan, rust-boundaries]
    if: fromJSON(needs.plan.outputs.run)['rust-boundaries-shard']
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    env:
      VERIFICATION_PROFILE: full
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Prepare the provider emulator used by boundary tests
        working-directory: test-support/fake-provider
        run: uv sync --frozen
      - uses: actions/download-artifact@v8
        with:
          name: rust-boundaries-prepared
          path: ${{ runner.temp }}
      - uses: actions/download-artifact@v8
        with:
          name: rust-boundaries-inventory
          path: ${{ runner.temp }}/inventory
      - name: Restore the packed artifacts at their compile-time paths
        run: tar -C . -xf "$RUNNER_TEMP/boundaries-prepared.tar.zst"
      - name: Execute shard ${{ matrix.shard }}
        env:
          RUSTX_REQUIRE_PROVIDER_EMULATOR: "1"
        run: python3 test-support/rust_test_shards.py run --manifest "$RUNNER_TEMP/inventory/boundaries-manifest/manifest.json" --prepared . --inventory "$RUNNER_TEMP/inventory/boundaries-inventory/inventory.json" --spec test-support/rust-lanes/boundaries.json --features all-features --profile test --root . --shard ${{ matrix.shard }} --report shard-report/report.json
      - name: Shard report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rust-boundaries-shard-${{ matrix.shard }}
          path: shard-report/
          if-no-files-found: ignore

  # The one boundaries verdict: every inventoried test ran exactly once and
  # every selected shard succeeded.
  rust-boundaries-report:
    name: Boundary suites coverage
    needs: [plan, rust-boundaries, rust-boundaries-shard]
    if: ${{ !cancelled() && fromJSON(needs.plan.outputs.run)['rust-boundaries-report'] }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: rust-boundaries-inventory
          path: ${{ runner.temp }}/inventory
      - uses: actions/download-artifact@v8
        with:
          pattern: rust-boundaries-shard-*
          path: ${{ runner.temp }}/runs
      - name: Verify complete coverage across shards
        run: python3 test-support/rust_test_shards.py verify --inventory "$RUNNER_TEMP/inventory/boundaries-inventory/inventory.json" --runs "$RUNNER_TEMP/runs"
      - name: All selected shards succeeded
        run: test "${{ needs.rust-boundaries-shard.result }}" = success

  # Rust platform coverage is intentional, not duplicated by habit. macOS
  # runs only platform-sensitive classes, natively; desktop-macos separately
  # executes Node boundaries.
  #
  # - rust-platform-core (FAST): the seven external targets —
  #   durable (SQLite/filesystem), process (spawned binary, signals,
  #   stdio/WebSocket), subagent (child process/control socket), tools
  #   (shell, PTY, filesystem, executable discovery), conformance (external
  #   emulator process), cfg3_catalog (configuration source files and the
  #   native writer lock race) and cfg3_managed_output (managed Tool output
  #   storage). They link the ordinary rustX library, so core never compiles
  #   the library test harness, the lane's dominant compilation (about 12
  #   of its 24 compile minutes in run 39015122730).
  # - rust-platform-boundaries (FULL): the same seven external targets, plus,
  #   from the lib test binary, the source-module unit tests and the in-crate
  #   boundary conformance suites (`boundary_suites::` — real SIGKILL process
  #   death, bash supervision, staged subagent children, MCP stdio fixture
  #   children), in one job. Running the lib half on a second runner in
  #   parallel was measured and rejected: with both caches cold (run
  #   39035924891) it shortened FULL by about one minute (39.0 vs 40.1 min)
  #   for about 17 more macOS runner-minutes, because that runner compiles
  #   the dependencies and the ordinary library again. The deterministic scripted contract
  #   suites are `cfg(target_os = "linux")`: they are pure state-machine/
  #   planning/manual-clock contracts whose invariants carry no OS semantics,
  #   so compiling and rerunning them on macOS would be duplication without
  #   platform value.
  #
  # The contracts and provider targets assert deterministic JSON/SSE
  # translation with no process or filesystem semantics, so they are
  # Linux-only.
  rust-platform-core:
    name: Platform-sensitive external boundaries (macOS core)
    needs: plan
    if: fromJSON(needs.plan.outputs.run)['rust-platform-core']
    runs-on: macos-15
    timeout-minutes: 45
    env:
      VERIFICATION_PROFILE: fast
      # Job-local build metadata only: assertions, overflow checks, unwind,
      # optimization and release profiles retain their Cargo defaults.
      # rust-cache hashes the CARGO prefix, including these settings.
      CARGO_PROFILE_DEV_DEBUG: "1"
      CARGO_PROFILE_TEST_DEBUG: "1"
      # One rustX compilation peaks near 3.5 GB RSS on this runner
      # (/usr/bin/time -l). -j2 lets rustc run two codegen workers inside the
      # monolithic lib and lib-test units and overlaps one smaller unit
      # alongside; the two all-feature library variants still never overlap
      # because the compile steps keep them in separate cargo invocations, so
      # the worst pairing stays under the 7 GB runner. The per-step
      # /usr/bin/time RSS output and the cargo-timings artifact validate it.
      # libtest keeps its existing concurrency, assertions, selectors and
      # deadlines.
      CARGO_BUILD_JOBS: "2"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.100.0"

      - name: Install SQLite binding build dependency
        uses: ./.github/actions/libclang
      # The cache key's environment hash covers every rustup toolchain the
      # image happens to preinstall, so image revisions silently change the
      # key. Keep only the pinned toolchain; idempotent and empty-set safe.
      - name: Normalize preinstalled rustup toolchains
        shell: bash
        run: |
          while read -r line; do
            tc="${line%% *}"
            case "$tc" in
              1.100.0-*) ;;
              *) rustup toolchain uninstall "$tc" || true ;;
            esac
          done < <(rustup toolchain list)
          rustc --version --verbose
      # rust-platform-core and rust-platform-boundaries compile the same
      # dependency graph under identical toolchain, features and profile
      # settings, so both lanes share the single `rust-platform-macos`
      # lineage; see the policy note in the `quality` job. The macOS lineage
      # shares nothing with any Linux lane: the action's key carries the
      # runner OS, architecture and host triple.
      - name: Cache Rust dependencies
        id: rust-cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-platform-macos
          save-if: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}

      - name: Record native build environment
        shell: bash
        run: |
          {
            echo '## macOS native build measurement'
            sw_vers
            uname -m
            echo "Logical CPUs: $(sysctl -n hw.logicalcpu)"
            echo "Memory bytes: $(sysctl -n hw.memsize)"
            rustc -vV
            cargo -V
            echo "Rust cache exact hit: ${{ steps.rust-cache.outputs.cache-hit }}"
            echo "CARGO_INCREMENTAL=$CARGO_INCREMENTAL"
            echo "CARGO_PROFILE_DEV_DEBUG=$CARGO_PROFILE_DEV_DEBUG"
            echo "CARGO_PROFILE_TEST_DEBUG=$CARGO_PROFILE_TEST_DEBUG"
            echo "CARGO_BUILD_JOBS=$CARGO_BUILD_JOBS"
          } >> "$GITHUB_STEP_SUMMARY"

      # The conformance target and the in-crate boundary suites launch the
      # provider emulator with `uv run`.
      - name: Install Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3

      - name: Sync the provider emulator environment
        working-directory: test-support/fake-provider
        run: uv sync --frozen

      # Compiling the external targets also builds every real executable
      # against the same all-feature library; staging places them beside each
      # emitted test harness executable.
      - name: Compile the external boundary targets and stage the real executables
        run: >-
          /usr/bin/time -l python3 test-support/prepare_native_tests.py --
          cargo test --all-features --locked --no-run --timings
          --test durable
          --test process
          --test subagent
          --test tools
          --test conformance
          --test cfg3_catalog
          --test cfg3_managed_output

      - name: Run the external boundary targets
        env:
          RUSTX_REQUIRE_PROVIDER_EMULATOR: "1"
        run: >-
          /usr/bin/time -l cargo test --all-features --locked
          --test durable
          --test process
          --test subagent
          --test tools
          --test conformance
          --test cfg3_catalog
          --test cfg3_managed_output

      # Native macOS discovery: every required external target (see
      # REQUIREMENTS in the checker) must execute here.

      # Unit tests of the extracted workspace crates (rustx-*): the lanes
      # select only the root package, so run every member except rustx once.
      # check_test_lanes fails closed when a new member is left unselected.
      - name: Run extracted workspace crate tests
        run: 'cargo test --workspace --exclude rustx --lib --all-features --locked -- --skip ::scale::'

      - name: Check test lane coverage
        run: cargo run --profile test --all-features --locked --example check_test_lanes -- --job rust-platform-core

      - name: Native Cargo timing reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: macos-core-cargo-timings
          path: target/cargo-timings/*.html
          retention-days: 7
          if-no-files-found: warn

  rust-platform-boundaries:
    name: Platform-sensitive boundaries (macOS full)
    needs: plan
    if: fromJSON(needs.plan.outputs.run)['rust-platform-boundaries']
    runs-on: macos-15
    # Run 43460497372 spent 80m building; 100m cut off the test/coverage tail.
    # Allow the full execution/coverage tail plus runner variance; see
    # docs/issue-480/ci-budget.md. Individual test deadlines stay unchanged.
    timeout-minutes: 150
    env:
      VERIFICATION_PROFILE: full
      # Job-local build metadata only: assertions, overflow checks, unwind,
      # optimization and release profiles retain their Cargo defaults.
      # rust-cache hashes the CARGO prefix, including these settings.
      CARGO_PROFILE_DEV_DEBUG: "1"
      CARGO_PROFILE_TEST_DEBUG: "1"
      # One rustX compilation peaks near 3.5 GB RSS on this runner
      # (/usr/bin/time -l). -j2 lets rustc run two codegen workers inside the
      # monolithic lib and lib-test units and overlaps one smaller unit
      # alongside; the two all-feature library variants still never overlap
      # because the compile steps keep them in separate cargo invocations, so
      # the worst pairing stays under the 7 GB runner. The per-step
      # /usr/bin/time RSS output and the cargo-timings artifact validate it.
      # libtest keeps its existing concurrency, assertions, selectors and
      # deadlines.
      CARGO_BUILD_JOBS: "2"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.100.0"

      - name: Install SQLite binding build dependency
        uses: ./.github/actions/libclang
      # Same key-stability normalization as rust-platform-core: drop every
      # preinstalled rustup toolchain except the pinned one so the runner
      # image's toolchain set cannot perturb the cache key's env hash.
      - name: Normalize preinstalled rustup toolchains
        shell: bash
        run: |
          while read -r line; do
            tc="${line%% *}"
            case "$tc" in
              1.100.0-*) ;;
              *) rustup toolchain uninstall "$tc" || true ;;
            esac
          done < <(rustup toolchain list)
          rustc --version --verbose
      # rust-platform-core and rust-platform-boundaries compile the same
      # dependency graph under identical toolchain, features and profile
      # settings, so both lanes share the single `rust-platform-macos`
      # lineage; see the policy note in the `quality` job. The macOS lineage
      # shares nothing with any Linux lane: the action's key carries the
      # runner OS, architecture and host triple.
      - name: Cache Rust dependencies
        id: rust-cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-platform-macos
          save-if: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}

      - name: Record native build environment
        shell: bash
        run: |
          {
            echo '## macOS native build measurement'
            sw_vers
            uname -m
            echo "Logical CPUs: $(sysctl -n hw.logicalcpu)"
            echo "Memory bytes: $(sysctl -n hw.memsize)"
            rustc -vV
            cargo -V
            echo "Rust cache exact hit: ${{ steps.rust-cache.outputs.cache-hit }}"
            echo "CARGO_INCREMENTAL=$CARGO_INCREMENTAL"
            echo "CARGO_PROFILE_DEV_DEBUG=$CARGO_PROFILE_DEV_DEBUG"
            echo "CARGO_PROFILE_TEST_DEBUG=$CARGO_PROFILE_TEST_DEBUG"
            echo "CARGO_BUILD_JOBS=$CARGO_BUILD_JOBS"
          } >> "$GITHUB_STEP_SUMMARY"

      # The conformance target and the in-crate boundary suites launch the
      # provider emulator with `uv run`.
      - name: Install Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3

      - name: Sync the provider emulator environment
        working-directory: test-support/fake-provider
        run: uv sync --frozen

      # Compiling the external targets first also builds every real executable
      # against the same all-feature library; staging places them beside each
      # emitted integration test harness executable.
      - name: Compile the external boundary targets and stage the real executables
        run: >-
          /usr/bin/time -l python3 test-support/prepare_native_tests.py --
          cargo test --all-features --locked --no-run --timings
          --test durable
          --test process
          --test subagent
          --test tools
          --test conformance
          --test cfg3_catalog
          --test cfg3_managed_output

      # App Server scripted contracts live under the manager's cfg(test) module
      # to reach its private owner gates; their physical test class is still
      # deterministic and Linux-only, despite this different name prefix.
      #
      # `--bins` executes zero tests today and removing it was measured, but it
      # is retained so Cargo's normal target discovery picks up any future test
      # added to a binary. `--test durable` is already fresh from the step
      # above and re-emits the package binary records without recompiling the
      # ordinary library so they stage beside the lib/bin test harnesses too.
      - name: Compile unit and in-crate boundary test harnesses and stage the real executables
        run: /usr/bin/time -l python3 test-support/prepare_native_tests.py -- cargo test --lib --bins --test durable --all-features --locked --no-run --timings

      # macOS runners start with a 256-descriptor soft limit while the lib
      # test binary drives ~4400 unit tests concurrently, each holding
      # tempdirs, watchers and collection locks; the exhaustion surfaces as
      # transient `Io` failures. `ulimit` must run inside the step's shell, so
      # export BASH_ENV via GITHUB_ENV: the runner does not set BASH_ENV
      # itself, but every later bash step sources the file it names, which
      # also keeps the cargo test steps single-line as the lane checker
      # requires.
      - name: Raise the file-descriptor ceiling for test steps
        run: |
          printf 'ulimit -n 10240 || ulimit -n 4096 || true\n' > "$RUNNER_TEMP/raise-fd-limit.sh"
          echo "BASH_ENV=$RUNNER_TEMP/raise-fd-limit.sh" >> "$GITHUB_ENV"

      - name: Run unit tests and the in-crate boundary suites
        env:
          RUSTX_REQUIRE_PROVIDER_EMULATOR: "1"
        # The scripted contract suites are `cfg(target_os = "linux")` and are
        # not compiled on macOS, so no `scripted_suites::` skip belongs here:
        # a skip that excludes nothing fails the lane checker.
        run: '/usr/bin/time -l cargo test --lib --bins --all-features --locked -- --skip local_runtime::session_runtime_manager::tests::'

      - name: Run the external boundary targets
        env:
          RUSTX_REQUIRE_PROVIDER_EMULATOR: "1"
        run: >-
          /usr/bin/time -l cargo test --all-features --locked
          --test durable
          --test process
          --test subagent
          --test tools
          --test conformance
          --test cfg3_catalog
          --test cfg3_managed_output

      # Unit tests of the extracted workspace crates (rustx-*): the lanes
      # select only the root package, so run every member except rustx once.
      # check_test_lanes fails closed when a new member is left unselected.
      # Kept in this job on purpose: macos-15 concurrency is limited to two
      # slots on the free tier, and a separate member job was measured to
      # delay this lane's start by ~40 minutes (run 45555289930).
      - name: Run extracted workspace crate tests
        run: cargo test --workspace --exclude rustx --lib --all-features --locked


      # Native macOS discovery: both --skip selectors must still exclude
      # tests, and `boundary_suites::` and every external target (see
      # REQUIREMENTS in the checker) must execute here entirely.
      - name: Check test lane coverage
        run: cargo run --profile test --all-features --locked --example check_test_lanes -- --job rust-platform-boundaries

      - name: Native Cargo timing reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: macos-cargo-timings
          path: target/cargo-timings/*.html
          retention-days: 7
          if-no-files-found: warn

  # The TUI is a separate job on purpose: the Rust suites must never depend on
  # Node being present.
  tui:
    name: TUI typecheck and tests
    needs: plan
    if: fromJSON(needs.plan.outputs.run)['tui']
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.100.0"

      - name: Install SQLite binding build dependency
        uses: ./.github/actions/libclang
      # The real-child integration suite drives the shared provider emulator,
      # so this job needs the same Python 3.12 + uv toolchain as the Rust one.
      - name: Install Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3

      - name: Sync the provider emulator environment
        working-directory: test-support/fake-provider
        run: uv sync --frozen

      # Node comes from nvm's LTS line, declared explicitly. The intent is
      # "rustX TUI runs on the supported Node LTS", not "whatever Node the
      # runner happens to preinstall".
      - name: Install the Node LTS through nvm
        # `set -u` is deliberately not used: nvm's shell functions reference
        # unset variables internally and abort under it.
        run: |
          set -eo pipefail
          export NVM_DIR="$HOME/.nvm"
          mkdir -p "$NVM_DIR"
          curl -fsSL https://raw.githubusercontent.com/nvm-sh/nvm/v0.40.4/install.sh | bash
          # shellcheck source=/dev/null
          . "$NVM_DIR/nvm.sh"
          nvm install --lts
          nvm use --lts
          corepack enable
          # Cache the exact pnpm from tui/package.json's `packageManager` so
          # the later steps resolve it without hitting the network.
          (cd tui && corepack install)
          node --version
          # Put the resolved LTS bin directory ahead of the runner's
          # preinstalled Node for every later step.
          dirname "$(command -v node)" >> "$GITHUB_PATH"

      # The pnpm steps run with `tui` as the working directory on purpose:
      # Corepack resolves `packageManager` from the manifest in the current
      # directory, and from the repository root it cannot see tui's.
      - name: Report the resolved toolchain
        working-directory: tui
        run: |
          node --version
          pnpm --version

      - name: Install dependencies
        working-directory: tui
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        working-directory: tui
        run: pnpm typecheck

      # One lineage per lane; see the policy note in the `quality` job. This
      # pinned toolchain is installed before this cache step, just as in every
      # other Cargo-bearing lane; the resolved compiler remains part of its key.
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: tui
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      # Real stdio integration also launches MCP through the sibling
      # interactive-supervisor, so build the executable set before testing.
      - name: Build the real integration binaries
        run: cargo build --bins --locked

      - name: Test
        working-directory: tui
        env:
          RUSTX_REQUIRE_PROVIDER_EMULATOR: "1"
        run: pnpm test

  app-server-protocol:
    name: App Server generated protocol
    needs: plan
    if: fromJSON(needs.plan.outputs.run)['app-server-protocol']
    runs-on: ubuntu-26.04
    # FULL #1477 spent 11m03s downloading libclang, leaving too little of the
    # prior 15m budget for the native generator and both protocol checks.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.100.0"
      - name: Install SQLite binding build dependency
        uses: ./.github/actions/libclang
      # One lineage per lane; see the policy note in the `quality` job. This
      # lane is Rust-bearing despite its Node surface: `pnpm check` shells out
      # to `cargo run --example generate_app_server_protocol`.
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: app-server-protocol
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install pinned protocol toolchain
        working-directory: protocol/app-server
        run: |
          corepack enable
          corepack install
          pnpm install --frozen-lockfile
      - name: Check schema and TypeScript drift
        working-directory: protocol/app-server
        run: pnpm check
      - name: Typecheck Rust fixtures and reference intersections
        working-directory: protocol/app-server
        run: pnpm typecheck

  desktop-macos:
    name: Desktop adapter and Host (macOS Node)
    needs: plan
    if: fromJSON(needs.plan.outputs.run)['desktop-macos']
    runs-on: macos-15
    timeout-minutes: 35
    env:
      # Dependency debuginfo is off workspace-wide; strip it for the
      # workspace crates here too — this job links test-free binaries whose
      # DWARF is never consumed.
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.100.0"
      - name: Install SQLite binding build dependency
        uses: ./.github/actions/libclang
      # Same key-stability normalization as rust-platform-core: drop every
      # preinstalled rustup toolchain except the pinned one so the runner
      # image's toolchain set cannot perturb the cache key's env hash.
      - name: Normalize preinstalled rustup toolchains
        shell: bash
        run: |
          while read -r line; do
            tc="${line%% *}"
            case "$tc" in
              1.100.0-*) ;;
              *) rustup toolchain uninstall "$tc" || true ;;
            esac
          done < <(rustup toolchain list)
          rustc --version --verbose
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: desktop-host
          save-if: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
      # The supervisor already compiles the rustx library; the real App Server
      # binary for the TUI Save integration suite adds only its own link.
      - name: Build native PTY ownership supervisor and the App Server
        run: cargo build --bins --locked
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install pinned Node dependencies
        run: |
          corepack enable
          (cd web-console && corepack install && pnpm install --frozen-lockfile)
          (cd tui && pnpm install --frozen-lockfile)
      # The TUI Save integration suite drives the shared provider emulator.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Prepare the existing provider emulator
        working-directory: test-support/fake-provider
        run: uv sync --frozen
      # Real macOS Node/filesystem/process execution, including a harmless Node
      # child through launchDesktop. Fakes cover GUI argv and unavailable sessions;
      # this is not Finder/Terminal GUI smoke and does not duplicate browser E2E.
      - name: Desktop adapter and Host boundaries
        working-directory: web-console
        run: >-
          pnpm exec vitest run
          test/desktop-host.test.ts
          test/document-archive.test.ts
          test/document-integration.test.ts
          test/workbench-host.test.ts
          test/terminal-lifecycle.test.ts
          test/terminal-process.test.ts
          test/office-macos-lifecycle.test.ts
          test/office-macos.test.ts
      - name: macOS sandbox diagnostics on failure
        if: failure()
        run: sudo log show --last 3m --style compact --predicate 'process == "sandboxd" OR eventMessage CONTAINS "deny"' | tail -150
      # Client-local Save on the macOS filesystem: exclusive create, hard-link
      # publication, link-count cleanup and every ownership interleaving, 0600
      # creation under an inherited native ACL (macOS only), then byte-exact
      # Save from a real stdio child and a real WebSocket server.
      - name: TUI client-local Save (macOS filesystem, stdio and WebSocket)
        working-directory: tui
        env:
          RUSTX_REQUIRE_PROVIDER_EMULATOR: "1"
        run: node --test test/deliveries.test.ts test/delivery-integration.test.ts

  browser-prepare:
    name: Browser inputs (build once)
    needs: plan
    if: fromJSON(needs.plan.outputs.run)['browser-prepare']
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install pinned browser toolchain
        working-directory: web-console
        run: |
          corepack enable
          corepack install
          pnpm install --frozen-lockfile
      # The Web build and the Playwright inventory load the shared TUI
      # protocol decoder, so the TUI's own dependencies must be present.
      - name: Install the TUI protocol decoder dependencies
        working-directory: tui
        run: pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.100.0"
      - name: Install SQLite binding build dependency
        uses: ./.github/actions/libclang
      # One lineage per lane; see the policy note in the `quality` job.
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: web-console
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Build the real App Server, native Tool supervisors, Artifact fixture and production Web bundle
        working-directory: web-console
        run: node scripts/browser-artifact.ts pack "$RUNNER_TEMP/browser-prepared"
      # Playwright's own discovery of the checked-out suite, bound to these
      # inputs, narrowed to the plan's selection: FULL is every discovered
      # test in three shards; FAST is the @smoke tests, every test of a changed
      # spec and, for a presentation change, the presentation contracts
      # (screenshot-reference specs and @presentation tests).
      # Files go to shards by measured cost (test/e2e/shard-weights.json), as
      # each shard's Playwright --test-list. The coverage gate compares every
      # shard's run against this inventory.
      - name: Discover the browser test inventory and assign the shards
        working-directory: web-console
        env:
          BROWSER_SELECTION: ${{ needs.plan.outputs.browser }}
        run: |
          mkdir "$RUNNER_TEMP/browser-inventory"
          node scripts/browser-shards.ts inventory "$RUNNER_TEMP/browser-prepared/browser-prepared.json" "$RUNNER_TEMP/browser-inventory"
      - name: Package the prepared inputs
        run: tar -C "$RUNNER_TEMP/browser-prepared" -cf - . | zstd -T0 -1 -o "$RUNNER_TEMP/browser-prepared.tar.zst"
      - uses: actions/upload-artifact@v7
        with:
          name: browser-prepared
          path: ${{ runner.temp }}/browser-prepared.tar.zst
          compression-level: 0
          retention-days: 3
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: browser-inventory
          path: ${{ runner.temp }}/browser-inventory/
          retention-days: 14
          if-no-files-found: error

  web-client:
    name: Web client, Host and launcher tests
    needs: [plan, browser-prepare]
    if: fromJSON(needs.plan.outputs.run)['web-client']
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install pinned Web dependencies
        working-directory: web-console
        run: |
          corepack enable
          corepack install
          pnpm install --frozen-lockfile
      - name: Install the TUI protocol decoder dependencies
        working-directory: tui
        run: pnpm install --frozen-lockfile
      - name: Install and check development launchers
        working-directory: dev
        run: |
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm test
      - uses: ./.github/actions/document-runtime
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Prepare the existing provider emulator
        working-directory: test-support/fake-provider
        run: uv sync --frozen
      # Native client tests exec the real App Server and PTY supervisor.
      - uses: ./.github/actions/browser-inputs
      - name: Typecheck
        working-directory: web-console
        run: pnpm typecheck
      - name: Deterministic native client and presentation tests
        working-directory: web-console
        # The fresh install already built the native Node addons.
        run: pnpm exec vitest run
      - name: Product UI translation ownership
        working-directory: web-console
        run: pnpm check:i18n
      - name: Source provenance and dependency notices
        working-directory: web-console
        run: pnpm check:provenance

  # Two runners, one Playwright worker each, each running whole spec files
  # from its assigned list. Each shard runs against the prepared inputs only after
  # browser-tests.sh re-verifies them, re-checks the installed production
  # bundle's provenance, and drives Chromium in the digest-pinned Playwright
  # container (fonts and rasterization included), exactly as `pnpm test:e2e`.
  browser-shard:
    name: Browser acceptance (shard ${{ matrix.shard }}/${{ strategy.job-total }})
    needs: [plan, browser-prepare]
    if: fromJSON(needs.plan.outputs.run)['browser-shard']
    runs-on: ubuntu-26.04
    # Tip 85eed5f80 shard 2 finished 384 tests in ~40m then cancelled at the
    # prior 45m ceiling during report/artifact packing. Keep per-test
    # deadlines unchanged; budget post-suite upload under FULL permission CI.
    timeout-minutes: 60
    strategy:
      # All selected shards always finish, so one failure never hides the others.
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.browser).shards }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install pinned browser toolchain
        working-directory: web-console
        run: |
          corepack enable
          corepack install
          pnpm install --frozen-lockfile
      # Browser acceptance also connects the actual remote TUI client to the
      # same server, and drives the development launchers.
      - name: Install the TUI client and development launchers used by browser acceptance
        run: |
          (cd tui && pnpm install --frozen-lockfile)
          (cd dev && pnpm install --frozen-lockfile)
      - uses: ./.github/actions/document-runtime
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Prepare the existing provider emulator
        working-directory: test-support/fake-provider
        run: uv sync --frozen
      - uses: ./.github/actions/browser-inputs
      - uses: actions/download-artifact@v8
        with:
          name: browser-inventory
          path: ${{ runner.temp }}/inventory
      - name: Record the shard's identity
        working-directory: web-console
        run: |
          mkdir -p shard-report
          node scripts/browser-shards.ts identity ${{ matrix.shard }}/${{ strategy.job-total }} shard-report/identity.json
      - name: Provenance of the installed production bundle
        working-directory: web-console
        run: node scripts/provenance.ts --artifact
      - name: Browser acceptance against the real App Server and Product Host
        working-directory: web-console
        env:
          RUSTX_BROWSER_PREPARED: "1"
          PLAYWRIGHT_BLOB_OUTPUT_NAME: report-${{ matrix.shard }}.zip
        run: bash scripts/browser-tests.sh --test-list "$RUNNER_TEMP/inventory/shard-${{ matrix.shard }}.txt"
      - name: Shard report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-shard-${{ matrix.shard }}
          path: |
            web-console/shard-report/
            web-console/blob-report/
          if-no-files-found: ignore
      - name: Browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-evidence-shard-${{ matrix.shard }}
          path: web-console/test-results/
          if-no-files-found: ignore

  # The one browser verdict. It runs whenever preparation succeeded, so a
  # failed or cancelled shard still yields the merged report, and passes only
  # if all selected shards succeeded and every discovered test ran exactly once.
  browser-report:
    name: Browser acceptance coverage
    needs: [plan, browser-prepare, browser-shard]
    if: ${{ !cancelled() && fromJSON(needs.plan.outputs.run)['browser-report'] }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      # Report aggregation uses locked development tools and existing artifacts.
      # The app's install hook builds native addons that this job never loads.
      - name: Install pinned report toolchain
        working-directory: web-console
        run: |
          corepack enable
          corepack install
          pnpm install --frozen-lockfile --dev --ignore-scripts
      - uses: actions/download-artifact@v8
        with:
          name: browser-inventory
          path: ${{ runner.temp }}/inventory
      - uses: actions/download-artifact@v8
        with:
          pattern: browser-shard-*
          path: ${{ runner.temp }}/shards
      # v8 flattens the download into `path` when the pattern matches exactly
      # one artifact (a one-shard FAST run); wrap it back under its shard dir
      # so the coverage loop sees one layout either way.
      - name: Normalize a single-shard artifact layout
        run: |
          if [ -f "$RUNNER_TEMP/shards/shard-report/identity.json" ]; then
            shard=$(node -e "console.log(JSON.parse(require('fs').readFileSync('$RUNNER_TEMP/shards/shard-report/identity.json','utf8')).shard)")
            dest="$RUNNER_TEMP/shards/browser-shard-$shard"
            mkdir -p "$dest"
            for entry in shard-report blob-report; do
              [ -d "$RUNNER_TEMP/shards/$entry" ] && mv "$RUNNER_TEMP/shards/$entry" "$dest/$entry"
            done
          fi
      - name: Merge the shard reports
        working-directory: web-console
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: ${{ runner.temp }}/merged/html
          PLAYWRIGHT_HTML_OPEN: never
          PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ runner.temp }}/merged/report.json
        run: |
          mkdir -p "$RUNNER_TEMP/blobs"
          find "$RUNNER_TEMP/shards" -path '*/blob-report/*.zip' -exec cp {} "$RUNNER_TEMP/blobs/" \;
          pnpm exec playwright merge-reports --reporter=html,json "$RUNNER_TEMP/blobs"
      - name: Verify complete coverage across shards
        working-directory: web-console
        run: |
          for shard in "$RUNNER_TEMP"/shards/browser-shard-*; do
            # Each artifact holds shard-report/{identity,report}.json.
            mkdir -p "$RUNNER_TEMP/runs/$(basename "$shard")"
            cp "$shard"/shard-report/*.json "$RUNNER_TEMP/runs/$(basename "$shard")/" 2>/dev/null || true
          done
          node scripts/browser-shards.ts verify "$RUNNER_TEMP/inventory/browser-inventory.json" "$RUNNER_TEMP/runs"
      - name: All selected shards succeeded
        run: test "${{ needs.browser-shard.result }}" = success
      - name: Merged browser report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: web-console-browser-report
          path: ${{ runner.temp }}/merged/
          if-no-files-found: ignore

  # The merge verdict: require this check ("Merge verification") in branch
  # protection. It runs after everything, whatever happened, and fails closed.
  verification:
    name: Merge verification
    needs:
      - plan
      - notifications
      - quality
      - rust-fast
      - documentation-contracts
      - rust-contracts
      - rust-contracts-shard
      - rust-contracts-report
      - rust-contracts-post
      - rust-boundaries
      - rust-boundaries-shard
      - rust-boundaries-report
      - rust-platform-core
      - rust-platform-boundaries
      - tui
      - app-server-protocol
      - desktop-macos
      - browser-prepare
      - web-client
      - browser-shard
      - browser-report
    if: always()
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      # Full history so the gate can accept GitHub stacked-PR merge commits:
      # second parent is still head, and the PR base is an ancestor of the
      # first parent (an intermediate stack merge) rather than the parent
      # itself. Ordinary PRs still match parents `[base, head]` exactly.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Every selected job succeeded, at the right profile, for the current head
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PLAN: ${{ needs.plan.outputs.plan }}
          NEEDS: ${{ toJSON(needs) }}
        run: python3 .github/scripts/verification.py gate
