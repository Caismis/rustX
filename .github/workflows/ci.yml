name: CI

# Two verification profiles (tests/README.md, "Verification profiles"):
#
# - FAST: every pull request push. The always-on checks plus the suites of
#   the surfaces the change touches.
# - FULL: every job, complete. Runs on main, nightly, on manual dispatch, and
#   on a pull request carrying the `full-verification` label, for its
#   current and every later head.
#
# The `plan` job (.github/scripts/verification.py) owns job selection: every
# gated job runs only when `run[<its id>]` is true. `verification` ("Merge
# verification") is the one verdict to require for merge: it fails unless
# every selected job succeeded, a high-risk change was verified by FULL, and
# the verified head is still the pull request's head.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches:
      - main
  schedule:
    - cron: "17 19 * * *"
  workflow_dispatch:

permissions:
  contents: read

# Artifacts are built once and consumed by other jobs, so every Node setup
# must use the same exact patch even when runners cache different releases.
env:
  NODE_VERSION: "24.22.0"

# A newer run for the same pull request (a push, or a label) supersedes its
# unfinished predecessor. main, scheduled and dispatched runs each form their
# own group and are never cancelled; another pull request never shares one.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    name: Verification plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
      run: ${{ steps.plan.outputs.run }}
      steps: ${{ steps.plan.outputs.steps }}
      browser: ${{ steps.plan.outputs.browser }}
    steps:
      - uses: actions/checkout@v4
      - name: Classify the change and select the profile's jobs
        id: plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/verification.py plan

  notifications:
    name: Notification metadata and signing
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - name: Test notification filters, signing, and secret isolation
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v

  # Static checks get their own job so formatting/lint failures report in
  # about two minutes instead of after a full test build.
  quality:
    name: Format, lint, and whitespace
    needs: plan
    if: fromJSON(needs.plan.outputs.run)['quality']
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98.1"
          components: rustfmt, clippy

      - name: Install SQLite binding build dependency
        uses: ./.github/actions/libclang
      # The one Rust cache policy, applied identically to every Rust-bearing
      # lane. Five properties matter and all five are deliberate:
      #
      # 1. It runs *after* the toolchain step, so the resolved compiler is part
      #    of the cache identity. The key the action builds already covers the
      #    runner OS and architecture, the rustc version and host triple,
      #    `rust-toolchain.toml`, the Cargo manifests and lockfile, and the
      #    build-relevant CARGO/CC/CFLAGS/CXX/CMAKE/RUST* environment. Linux
      #    and macOS artifacts therefore can never share a lineage.
      #
      # 2. `shared-key` names one stable lineage per semantic lane, replacing
      #    the action's automatic job-id component with a readable name. Lanes
      #    deliberately do NOT share a key with each other: GitHub cache
      #    entries are immutable and these jobs start concurrently, so a single
      #    shared key would let whichever lane finishes first freeze its own
      #    (smallest) `target/` as the entry every other lane then restores and
      #    can never correct. Per-lane lineages mean each lane stops rebuilding
      #    its own unchanged dependency graph on every run, which is the actual
      #    optimization; cross-populating siblings within one cold run is not a
      #    goal.
      #
      # 3. Only the dependency graph is cached. The action excludes workspace
      #    crates by default and that default is kept, so no rustX artifact is
      #    ever restored from a cache — the crate and its test code are always
      #    compiled from the checked-out source in every run.
      #
      # 4. The cache is an optimization and never a semantic authority. A cold,
      #    evicted, or stale cache changes nothing about which tests are
      #    selected or what they prove; it only changes how much dependency
      #    compilation is repeated. A completely cold runner remains valid.
      #
      # 5. Every lane may *restore* a compatible cache, but only a trusted push
      #    to `main` *publishes* one — that is what `save-if` encodes. Pull
      #    requests are cache consumers, never cache publishers: a PR cannot
      #    spend the repository's shared cache budget (the seven lineages are
      #    ~7.1 GB of a 10 GB LRU pool) and untrusted fork execution can never
      #    become a writer of the state trusted runs later restore. The reuse
      #    path is `main` cache -> future run with a compatible key. This
      #    workflow's `push` trigger is already `main`-only; the condition
      #    stays explicit so the ownership contract is locally obvious.
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: quality
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Test current and historical benchmark controllers and summaries
        run: python3 -m unittest discover -s benchmarks/runtime -p 'test_*.py' -v

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Check whitespace
        run: git diff --check

  # FAST Rust feedback for a pull request push that touches Rust: one
  # compilation of the library test harness and the `process` target (which
  # also places the real executables at target/debug/), the FAST selection of
  # unit and contract modules without the capacity suite (`::scale::`), and
  # the real process, stdio and WebSocket App Server workflows. FULL replaces
  # this job with the complete rust-contracts and rust-boundaries lanes; the
  # lane check proves every test this job omits is executed there.
  rust-fast:
    name: Fast Rust contracts and real-process workflows (Linux)
    needs: plan
    if: fromJSON(needs.plan.outputs.run)['rust-fast']
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERIFICATION_PROFILE: fast
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98.1"

      - name: Install SQLite binding build dependency
        uses: ./.github/actions/libclang
      # The rust-boundaries lineage: the same all-feature library, test
      # harness and integration-target dependency graph.
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-boundaries
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Install Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Sync the provider emulator environment
        working-directory: test-support/fake-provider
        run: uv sync --frozen

      - name: Compile the FAST harnesses and the real executables
        run: cargo test --all-features --no-run --lib --test process

      # Every unit and deterministic contract module except the in-crate
      # boundary suites (rust-boundaries), the capacity suite, and four heavy
      # contract groups, which run below when the change touches them.
      - name: Run the FAST unit and contract core
        env:
          RUSTX_REQUIRE_PROVIDER_EMULATOR: "1"
        run: 'cargo test --lib --all-features -- --skip boundary_suites:: --skip ::scale:: --skip durable::sqlite:: --skip local_runtime::session_runtime_manager::tests:: --skip local_runtime::session:: --skip runtime_client::response::'

      - name: Run the SQLite store contracts (durable changes)
        if: fromJSON(needs.plan.outputs.steps)['rust-fast:durable']
        run: 'cargo test --lib --all-features -- durable::sqlite:: --skip ::scale::'

      - name: Run the App Server and Session contracts (App Server or local runtime changes)
        if: fromJSON(needs.plan.outputs.steps)['rust-fast:app-server']
        env:
          RUSTX_REQUIRE_PROVIDER_EMULATOR: "1"
        run: 'cargo test --lib --all-features -- local_runtime::session_runtime_manager::tests:: local_runtime::session:: --skip ::scale::'

      - name: Run the runtime client response contracts (runtime client changes)
        if: fromJSON(needs.plan.outputs.steps)['rust-fast:runtime-client']
        run: 'cargo test --lib --all-features -- runtime_client::response:: --skip ::scale::'

      - name: Run the real-process App Server and CLI workflows
        env:
          RUSTX_REQUIRE_PROVIDER_EMULATOR: "1"
        run: cargo test --all-features --test process

      - name: Check test lane coverage
        run: cargo run --all-features --example check_test_lanes -- --job rust-fast

  # FAST documentation contracts: a low-risk documentation change merges on
  # FAST, but the `contracts` target reads the top-level, docs/, Web and TUI
  # Markdown (tests/contracts/documentation.rs, runtime_examples.rs). This
  # lane runs that target alone so such a change cannot merge unchecked. FULL
  # runs the same target in rust-contracts and does not select this job.
  documentation-contracts:
    name: Documentation contracts (Linux)
    needs: plan
    if: fromJSON(needs.plan.outputs.run)['documentation-contracts']
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERIFICATION_PROFILE: fast
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98.1"

      - name: Install SQLite binding build dependency
        uses: ./.github/actions/libclang
      # A consumer of the rust-contracts lineage (the same dependency graph):
      # this lane never publishes a cache of its own, so it adds no lineage to
      # the shared cache budget; see the policy note in the `quality` job.
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-contracts
          save-if: false

      - name: Run the documentation and runtime-example contracts
        run: cargo test --test contracts --all-features

  # Fast deterministic classes: source-module unit tests, the in-crate
  # scripted contract suites, and the pure contract targets. No cross-module
  # boundary conformance suite runs here: none needs a real process, a
  # provider, or a network beyond loopback fixture servers. (Unit tests of
  # boundary-owning modules still exercise their module's own primitive —
  # the bash tool's unit tests spawn bash, the uv backend's run uv — which
  # is what `--bins` is for: it builds the `bash-supervisor` binary those
  # unit tests exec.)
  #
  # Semantic class and compilation placement are different axes: the lib
  # test binary also contains the in-crate *boundary conformance* suites, so
  # they are excluded by their stable name prefix.
  rust-contracts:
    name: Deterministic contracts (Linux)
    needs: plan
    if: fromJSON(needs.plan.outputs.run)['rust-contracts']
    runs-on: ubuntu-latest
    # Preparation and the two native builds consumed about 11 minutes in
    # run 38883956631. Budget compilation and complete test execution here;
    # individual liveness guards and the other lanes retain their bounds.
    timeout-minutes: 45

    env:
      VERIFICATION_PROFILE: full
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98.1"

      - name: Install SQLite binding build dependency
        uses: ./.github/actions/libclang
      # One lineage per lane; see the policy note in the `quality` job.
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-contracts
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      # `cargo test --bins` builds the bin *test harnesses* but does not
      # place the binaries at `target/debug/`, where the bash tool's unit
      # tests look for `bash-supervisor` at runtime — so build them first.
      - name: Build the binaries the boundary-owning unit tests exec
        run: cargo build --bins

      # Source-module unit tests + the scripted contract suites
      # (`scripted_suites::`) + the App Server scripted contracts compiled
      # under the session runtime manager's private test module
      # (`local_runtime::session_runtime_manager::tests::`). The in-crate
      # boundary conformance suites are selected OUT by their
      # `boundary_suites::` prefix; they run in the boundary jobs.
      #
      # `--examples` runs the `session_list_benchmark` workload-checker tests;
      # `--bins` executes zero tests today, since no binary defines a
      # `#[test]`. Both selectors are kept: Cargo already owns test-target
      # discovery, so a test added to a bin or an example is picked up here
      # automatically — which is simpler than a second repository policy
      # saying those targets must stay test-free forever.
      - name: Run unit tests and the in-crate contract suites
        run: 'cargo test --lib --bins --examples --all-features -- --skip boundary_suites::'

      # contracts/: pure serialization/configuration fixture contracts.
      # provider/: adapter request serialization, stream parsing, error
      # normalization over the in-process FixtureServer. The provider
      # target also carries the #[ignore]d opt-in live smoke tests, which
      # never run here.
      - name: Run the pure contract targets
        run: cargo test --test contracts --test provider --all-features

      # Cargo/libtest discovery of this lane's targets against every Linux
      # step that selects them: an unassigned target, a stale filter or
      # --skip, or a Linux test no lane executes fails here. The checker's own
      # deterministic tests ran above as part of `--examples`.
      # Reuse the all-feature library already compiled by the tested targets.
      - name: Check test lane coverage
        run: cargo run --all-features --example check_test_lanes -- --job rust-contracts

  # Real boundaries: SQLite durability/recovery, the spawned rustx process
  # and stdio/IPC transport, the subagent child-process boundary, the tool
  # plane (shell, filesystem, executable discovery), and composed
  # provider-emulator conformance. The uv toolchain is mandatory for every
  # step that runs a uv-dependent boundary (the emulator and the managed
  # FastMCP children): RUSTX_REQUIRE_PROVIDER_EMULATOR=1 turns a missing
  # toolchain into a hard failure instead of a silent skip.
  rust-boundaries:
    name: Boundary suites (Linux)
    needs: plan
    if: fromJSON(needs.plan.outputs.run)['rust-boundaries']
    runs-on: ubuntu-latest
    # Cold libclang setup and both native builds exhausted 25 minutes in
    # runs 39798438811 and 39811600857. Budget the complete test and coverage
    # tail as well as preparation, with the same ceiling as rust-contracts.
    timeout-minutes: 45

    env:
      VERIFICATION_PROFILE: full
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98.1"

      - name: Install SQLite binding build dependency
        uses: ./.github/actions/libclang
      # One lineage per lane; see the policy note in the `quality` job.
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-boundaries
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Install Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Sync the provider emulator environment
        working-directory: test-support/fake-provider
        run: uv sync --frozen

      # The emulator's own pytest suite is platform-independent Python and
      # runs in this job only.
      - name: Run the provider-emulator tests
        working-directory: test-support/fake-provider
        run: uv run --frozen pytest

      # Compiling the external targets first also builds every real
      # executable (`rustx`, `bash-supervisor`, `interactive-supervisor`)
      # against the same all-feature library the tests link, and places them
      # at `target/debug/`. The in-crate text_spill suite execs
      # `bash-supervisor` there by path; `cargo test --lib` alone does not
      # build it. A separate `cargo build --bins` would compile one more
      # complete rustX library (no dev-dependency features) that no test in
      # this lane links. Default-feature real binaries are still built by the
      # contracts and TUI lanes.
      - name: Compile the external boundary targets and the real executables
        run: >-
          cargo test --all-features --no-run
          --test durable
          --test process
          --test subagent
          --test tools
          --test conformance
          --test cfg3_catalog
          --test cfg3_managed_output

      # The in-crate boundary conformance suites (real process death, real
      # bash supervision, staged subagent children, real MCP stdio fixture
      # children), selected by their stable name prefix.
      - name: Run the in-crate boundary suites
        env:
          RUSTX_REQUIRE_PROVIDER_EMULATOR: "1"
        run: 'cargo test --lib --all-features -- boundary_suites::'

      - name: Run the external boundary targets
        env:
          RUSTX_REQUIRE_PROVIDER_EMULATOR: "1"
        run: >-
          cargo test --all-features
          --test durable
          --test process
          --test subagent
          --test tools
          --test conformance
          --test cfg3_catalog
          --test cfg3_managed_output

      # See the same step in `rust-contracts`; this lane's targets are the
      # lib test harness and the external boundary targets. With
      # --all-features the checker links the library unit the external
      # targets already compiled (dev-dependency features included); without
      # it Cargo builds one more complete rustX library just for the checker.
      - name: Check test lane coverage
        run: cargo run --all-features --example check_test_lanes -- --job rust-boundaries

  # Rust platform coverage is intentional, not duplicated by habit. macOS
  # runs only platform-sensitive classes, natively; desktop-macos separately
  # executes Node boundaries.
  #
  # - rust-platform-core (FAST): the seven external targets —
  #   durable (SQLite/filesystem), process (spawned binary, signals,
  #   stdio/WebSocket), subagent (child process/control socket), tools
  #   (shell, PTY, filesystem, executable discovery), conformance (external
  #   emulator process), cfg3_catalog (configuration source files and the
  #   native writer lock race) and cfg3_managed_output (managed Tool output
  #   storage). They link the ordinary rustX library, so core never compiles
  #   the library test harness, the lane's dominant compilation (about 12
  #   of its 24 compile minutes in run 39015122730).
  # - rust-platform-boundaries (FULL): the same seven external targets, plus,
  #   from the lib test binary, the source-module unit tests and the in-crate
  #   boundary conformance suites (`boundary_suites::` — real SIGKILL process
  #   death, bash supervision, staged subagent children, MCP stdio fixture
  #   children), in one job. Running the lib half on a second runner in
  #   parallel was measured and rejected: with both caches cold (run
  #   39035924891) it shortened FULL by about one minute (39.0 vs 40.1 min)
  #   for about 17 more macOS runner-minutes, because that runner compiles
  #   the dependencies and the ordinary library again. The deterministic scripted contract
  #   suites are selected OUT by their `scripted_suites::` prefix: they are
  #   pure state-machine/planning/manual-clock contracts whose invariants
  #   carry no OS semantics, so rerunning them on macOS would be duplication
  #   without platform value.
  #
  # The contracts and provider targets assert deterministic JSON/SSE
  # translation with no process or filesystem semantics, so they are
  # Linux-only.
  rust-platform-core:
    name: Platform-sensitive external boundaries (macOS core)
    needs: plan
    if: fromJSON(needs.plan.outputs.run)['rust-platform-core']
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      VERIFICATION_PROFILE: fast
      # Job-local build metadata only: assertions, overflow checks, unwind,
      # optimization and release profiles retain their Cargo defaults.
      # rust-cache hashes the CARGO prefix, including these settings.
      CARGO_PROFILE_DEV_DEBUG: "1"
      CARGO_PROFILE_TEST_DEBUG: "1"
      # One rustX compilation peaks near 3.5 GB RSS on this runner
      # (/usr/bin/time -l), so compiler processes stay serialized; libtest
      # keeps its existing concurrency, assertions, selectors and deadlines.
      CARGO_BUILD_JOBS: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98.1"

      - name: Install SQLite binding build dependency
        uses: ./.github/actions/libclang
      # One lineage per lane; see the policy note in the `quality` job. The
      # macOS lineages share nothing with any Linux lane: the action's key
      # carries the runner OS, architecture and host triple.
      - name: Cache Rust dependencies
        id: rust-cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-platform-core
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Record native build environment
        shell: bash
        run: |
          {
            echo '## macOS native build measurement'
            sw_vers
            uname -m
            echo "Logical CPUs: $(sysctl -n hw.logicalcpu)"
            echo "Memory bytes: $(sysctl -n hw.memsize)"
            rustc -vV
            cargo -V
            echo "Rust cache exact hit: ${{ steps.rust-cache.outputs.cache-hit }}"
            echo "CARGO_INCREMENTAL=$CARGO_INCREMENTAL"
            echo "CARGO_PROFILE_DEV_DEBUG=$CARGO_PROFILE_DEV_DEBUG"
            echo "CARGO_PROFILE_TEST_DEBUG=$CARGO_PROFILE_TEST_DEBUG"
            echo "CARGO_BUILD_JOBS=$CARGO_BUILD_JOBS"
          } >> "$GITHUB_STEP_SUMMARY"

      # The conformance target and the in-crate boundary suites launch the
      # provider emulator with `uv run`.
      - name: Install Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Sync the provider emulator environment
        working-directory: test-support/fake-provider
        run: uv sync --frozen

      # Compiling the external targets also builds every real executable
      # against the same all-feature library and places it at target/debug/.
      - name: Compile the external boundary targets and the real executables
        run: >-
          /usr/bin/time -l cargo test --all-features --no-run --timings
          --test durable
          --test process
          --test subagent
          --test tools
          --test conformance
          --test cfg3_catalog
          --test cfg3_managed_output

      - name: Run the external boundary targets
        env:
          RUSTX_REQUIRE_PROVIDER_EMULATOR: "1"
        run: >-
          /usr/bin/time -l cargo test --all-features
          --test durable
          --test process
          --test subagent
          --test tools
          --test conformance
          --test cfg3_catalog
          --test cfg3_managed_output

      # Native macOS discovery: every required external target (see
      # REQUIREMENTS in the checker) must execute here.
      - name: Check test lane coverage
        run: cargo run --all-features --example check_test_lanes -- --job rust-platform-core

      - name: Native Cargo timing reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-core-cargo-timings
          path: target/cargo-timings/*.html
          retention-days: 7
          if-no-files-found: warn

  rust-platform-boundaries:
    name: Platform-sensitive boundaries (macOS full)
    needs: plan
    if: fromJSON(needs.plan.outputs.run)['rust-platform-boundaries']
    runs-on: macos-latest
    # Run 39068563822 spent 58m compiling before tests; 70m killed live tests.
    # Allow the full execution/coverage tail plus runner variance; see
    # docs/issue-480/ci-budget.md. Individual test deadlines stay unchanged.
    timeout-minutes: 100
    env:
      VERIFICATION_PROFILE: full
      # Job-local build metadata only: assertions, overflow checks, unwind,
      # optimization and release profiles retain their Cargo defaults.
      # rust-cache hashes the CARGO prefix, including these settings.
      CARGO_PROFILE_DEV_DEBUG: "1"
      CARGO_PROFILE_TEST_DEBUG: "1"
      # One rustX compilation peaks near 3.5 GB RSS on this runner
      # (/usr/bin/time -l), so compiler processes stay serialized; libtest
      # keeps its existing concurrency, assertions, selectors and deadlines.
      CARGO_BUILD_JOBS: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98.1"

      - name: Install SQLite binding build dependency
        uses: ./.github/actions/libclang
      # One lineage per lane; see the policy note in the `quality` job. The
      # macOS lineages share nothing with any Linux lane: the action's key
      # carries the runner OS, architecture and host triple.
      - name: Cache Rust dependencies
        id: rust-cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-platform-boundaries
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Record native build environment
        shell: bash
        run: |
          {
            echo '## macOS native build measurement'
            sw_vers
            uname -m
            echo "Logical CPUs: $(sysctl -n hw.logicalcpu)"
            echo "Memory bytes: $(sysctl -n hw.memsize)"
            rustc -vV
            cargo -V
            echo "Rust cache exact hit: ${{ steps.rust-cache.outputs.cache-hit }}"
            echo "CARGO_INCREMENTAL=$CARGO_INCREMENTAL"
            echo "CARGO_PROFILE_DEV_DEBUG=$CARGO_PROFILE_DEV_DEBUG"
            echo "CARGO_PROFILE_TEST_DEBUG=$CARGO_PROFILE_TEST_DEBUG"
            echo "CARGO_BUILD_JOBS=$CARGO_BUILD_JOBS"
          } >> "$GITHUB_STEP_SUMMARY"

      # The conformance target and the in-crate boundary suites launch the
      # provider emulator with `uv run`.
      - name: Install Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Sync the provider emulator environment
        working-directory: test-support/fake-provider
        run: uv sync --frozen

      # Compiling the external targets first also builds every real
      # executable against the same all-feature library and places it at
      # target/debug/, where the lib tests (bash/uv boundary-owning modules,
      # in-crate boundary suites) exec `bash-supervisor`.
      - name: Compile the external boundary targets and the real executables
        run: >-
          /usr/bin/time -l cargo test --all-features --no-run --timings
          --test durable
          --test process
          --test subagent
          --test tools
          --test conformance
          --test cfg3_catalog
          --test cfg3_managed_output

      # App Server scripted contracts live under the manager's cfg(test) module
      # to reach its private owner gates; their physical test class is still
      # deterministic and Linux-only, despite this different name prefix.
      #
      # `--bins` executes zero tests today and removing it was measured, but it
      # is retained so Cargo's normal target discovery picks up any future test
      # added to a binary. Binary test harnesses are not the real executables
      # the tests exec; those come from the external-target compilation.
      - name: Compile unit and in-crate boundary test harnesses
        run: /usr/bin/time -l cargo test --lib --bins --all-features --no-run --timings

      - name: Run unit tests and the in-crate boundary suites
        env:
          RUSTX_REQUIRE_PROVIDER_EMULATOR: "1"
        run: '/usr/bin/time -l cargo test --lib --bins --all-features -- --skip scripted_suites:: --skip local_runtime::session_runtime_manager::tests::'

      - name: Run the external boundary targets
        env:
          RUSTX_REQUIRE_PROVIDER_EMULATOR: "1"
        run: >-
          /usr/bin/time -l cargo test --all-features
          --test durable
          --test process
          --test subagent
          --test tools
          --test conformance
          --test cfg3_catalog
          --test cfg3_managed_output

      # Native macOS discovery: both --skip selectors must still exclude
      # tests, and `boundary_suites::` and every external target (see
      # REQUIREMENTS in the checker) must execute here entirely.
      - name: Check test lane coverage
        run: cargo run --all-features --example check_test_lanes -- --job rust-platform-boundaries

      - name: Native Cargo timing reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-cargo-timings
          path: target/cargo-timings/*.html
          retention-days: 7
          if-no-files-found: warn

  # The TUI is a separate job on purpose: the Rust suites must never depend on
  # Node being present.
  tui:
    name: TUI typecheck and tests
    needs: plan
    if: fromJSON(needs.plan.outputs.run)['tui']
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98.1"

      - name: Install SQLite binding build dependency
        uses: ./.github/actions/libclang
      # The real-child integration suite drives the shared provider emulator,
      # so this job needs the same Python 3.12 + uv toolchain as the Rust one.
      - name: Install Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Sync the provider emulator environment
        working-directory: test-support/fake-provider
        run: uv sync --frozen

      # Node comes from nvm's LTS line, declared explicitly. The intent is
      # "rustX TUI runs on the supported Node LTS", not "whatever Node the
      # runner happens to preinstall".
      - name: Install the Node LTS through nvm
        # `set -u` is deliberately not used: nvm's shell functions reference
        # unset variables internally and abort under it.
        run: |
          set -eo pipefail
          export NVM_DIR="$HOME/.nvm"
          mkdir -p "$NVM_DIR"
          curl -fsSL https://raw.githubusercontent.com/nvm-sh/nvm/v0.40.4/install.sh | bash
          # shellcheck source=/dev/null
          . "$NVM_DIR/nvm.sh"
          nvm install --lts
          nvm use --lts
          corepack enable
          # Cache the exact pnpm from tui/package.json's `packageManager` so
          # the later steps resolve it without hitting the network.
          (cd tui && corepack install)
          node --version
          # Put the resolved LTS bin directory ahead of the runner's
          # preinstalled Node for every later step.
          dirname "$(command -v node)" >> "$GITHUB_PATH"

      # The pnpm steps run with `tui` as the working directory on purpose:
      # Corepack resolves `packageManager` from the manifest in the current
      # directory, and from the repository root it cannot see tui's.
      - name: Report the resolved toolchain
        working-directory: tui
        run: |
          node --version
          pnpm --version

      - name: Install dependencies
        working-directory: tui
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        working-directory: tui
        run: pnpm typecheck

      # One lineage per lane; see the policy note in the `quality` job. This
      # pinned toolchain is installed before this cache step, just as in every
      # other Cargo-bearing lane; the resolved compiler remains part of its key.
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: tui
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      # The integration suite drives the real binary over the real stdio
      # transport, so it must exist before the tests run.
      - name: Build the rustx binary
        run: cargo build --bin rustx

      - name: Test
        working-directory: tui
        env:
          RUSTX_REQUIRE_PROVIDER_EMULATOR: "1"
        run: pnpm test

  app-server-protocol:
    name: App Server generated protocol
    needs: plan
    if: fromJSON(needs.plan.outputs.run)['app-server-protocol']
    runs-on: ubuntu-latest
    # FULL #1477 spent 11m03s downloading libclang, leaving too little of the
    # prior 15m budget for the native generator and both protocol checks.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98.1"
      - name: Install SQLite binding build dependency
        uses: ./.github/actions/libclang
      # One lineage per lane; see the policy note in the `quality` job. This
      # lane is Rust-bearing despite its Node surface: `pnpm check` shells out
      # to `cargo run --example generate_app_server_protocol`.
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: app-server-protocol
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install pinned protocol toolchain
        working-directory: protocol/app-server
        run: |
          corepack enable
          corepack install
          pnpm install --frozen-lockfile
      - name: Check schema and TypeScript drift
        working-directory: protocol/app-server
        run: pnpm check
      - name: Typecheck Rust fixtures and reference intersections
        working-directory: protocol/app-server
        run: pnpm typecheck

  desktop-macos:
    name: Desktop adapter and Host (macOS Node)
    needs: plan
    if: fromJSON(needs.plan.outputs.run)['desktop-macos']
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98.1"
      - name: Install SQLite binding build dependency
        uses: ./.github/actions/libclang
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: desktop-host
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      # The supervisor already compiles the rustx library; the real App Server
      # binary for the TUI Save integration suite adds only its own link.
      - name: Build native PTY ownership supervisor and the App Server
        run: cargo build --bin interactive-supervisor --bin rustx --locked
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install pinned Node dependencies
        run: |
          corepack enable
          (cd web-console && corepack install && pnpm install --frozen-lockfile)
          (cd tui && pnpm install --frozen-lockfile)
      # The TUI Save integration suite drives the shared provider emulator.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - name: Prepare the existing provider emulator
        working-directory: test-support/fake-provider
        run: uv sync --frozen
      # Real macOS Node/filesystem/process execution, including a harmless Node
      # child through launchDesktop. Fakes cover GUI argv and unavailable sessions;
      # this is not Finder/Terminal GUI smoke and does not duplicate browser E2E.
      - name: Desktop adapter and Host boundaries
        working-directory: web-console
        run: |
          pnpm run build:host
          pnpm exec vitest run test/desktop-host.test.ts test/document-archive.test.ts test/document-integration.test.ts test/workbench-host.test.ts
      # Client-local Save on the macOS filesystem: exclusive create, hard-link
      # publication, link-count cleanup and every ownership interleaving, 0600
      # creation under an inherited native ACL (macOS only), then byte-exact
      # Save from a real stdio child and a real WebSocket server.
      - name: TUI client-local Save (macOS filesystem, stdio and WebSocket)
        working-directory: tui
        env:
          RUSTX_REQUIRE_PROVIDER_EMULATOR: "1"
        run: node --test test/deliveries.test.ts test/delivery-integration.test.ts

  # Browser acceptance builds once and runs in two shards:
  #
  #   browser-prepare -> web-client
  #                   -> browser-shard (1/2, 2/2) -> browser-report
  #
  # browser-prepare compiles the real App Server, native Tool supervisors and
  # Artifact fixture and runs the one production Web build (Vite plus the
  # artifact provenance check) from the checked-out source, then records them
  # with their identity (commit, runner platform, Rust pin, Cargo command,
  # Node ABI, pnpm, Playwright, dependency sources) and per-file checksums
  # (web-console/scripts/browser-artifact.ts). Every consumer installs those
  # exact files only after verifying that identity against its own checkout
  # and runner; a mismatch fails, and nothing is rebuilt in its place. The
  # archive is a run-scoped workflow artifact, never a cache entry.
  browser-prepare:
    name: Browser inputs (build once)
    needs: plan
    if: fromJSON(needs.plan.outputs.run)['browser-prepare']
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install pinned browser toolchain
        working-directory: web-console
        run: |
          corepack enable
          corepack install
          pnpm install --frozen-lockfile
      # The Web build and the Playwright inventory load the shared TUI
      # protocol decoder, so the TUI's own dependencies must be present.
      - name: Install the TUI protocol decoder dependencies
        working-directory: tui
        run: pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98.1"
      - name: Install SQLite binding build dependency
        uses: ./.github/actions/libclang
      # One lineage per lane; see the policy note in the `quality` job.
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: web-console
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Build the real App Server, native Tool supervisors, Artifact fixture and production Web bundle
        working-directory: web-console
        run: node scripts/browser-artifact.ts pack "$RUNNER_TEMP/browser-prepared"
      # Playwright's own discovery of the checked-out suite, bound to these
      # inputs, narrowed to the plan's selection: FULL is every discovered
      # test in two shards; FAST is the @smoke tests, every test of a changed
      # spec and, for a presentation change, the presentation contracts
      # (screenshot-reference specs and @presentation tests).
      # Files go to shards by measured cost (test/e2e/shard-weights.json), as
      # each shard's Playwright --test-list. The coverage gate compares every
      # shard's run against this inventory.
      - name: Discover the browser test inventory and assign the shards
        working-directory: web-console
        env:
          BROWSER_SELECTION: ${{ needs.plan.outputs.browser }}
        run: |
          mkdir "$RUNNER_TEMP/browser-inventory"
          node scripts/browser-shards.ts inventory "$RUNNER_TEMP/browser-prepared/browser-prepared.json" "$RUNNER_TEMP/browser-inventory"
      - name: Package the prepared inputs
        run: tar -C "$RUNNER_TEMP/browser-prepared" -cf - . | zstd -T0 -3 -o "$RUNNER_TEMP/browser-prepared.tar.zst"
      - uses: actions/upload-artifact@v4
        with:
          name: browser-prepared
          path: ${{ runner.temp }}/browser-prepared.tar.zst
          compression-level: 0
          retention-days: 3
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: browser-inventory
          path: ${{ runner.temp }}/browser-inventory/
          retention-days: 14
          if-no-files-found: error

  web-client:
    name: Web client, Host and launcher tests
    needs: [plan, browser-prepare]
    if: fromJSON(needs.plan.outputs.run)['web-client']
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install pinned Web dependencies
        working-directory: web-console
        run: |
          corepack enable
          corepack install
          pnpm install --frozen-lockfile
      - name: Install the TUI protocol decoder dependencies
        working-directory: tui
        run: pnpm install --frozen-lockfile
      - name: Install and check development launchers
        working-directory: dev
        run: |
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm test
      - uses: ./.github/actions/document-runtime
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - name: Prepare the existing provider emulator
        working-directory: test-support/fake-provider
        run: uv sync --frozen
      # Native client tests exec the real App Server and PTY supervisor.
      - uses: ./.github/actions/browser-inputs
      - name: Typecheck
        working-directory: web-console
        run: pnpm typecheck
      - name: Deterministic native client and presentation tests
        working-directory: web-console
        run: pnpm test
      - name: Product UI translation ownership
        working-directory: web-console
        run: pnpm check:i18n
      - name: Source provenance and dependency notices
        working-directory: web-console
        run: pnpm check:provenance

  # Two runners, one Playwright worker each, each running whole spec files
  # from its assigned list. Each shard runs against the prepared inputs only after
  # browser-tests.sh re-verifies them, re-checks the installed production
  # bundle's provenance, and drives Chromium in the digest-pinned Playwright
  # container (fonts and rasterization included), exactly as `pnpm test:e2e`.
  browser-shard:
    name: Browser acceptance (shard ${{ matrix.shard }}/${{ strategy.job-total }})
    needs: [plan, browser-prepare]
    if: fromJSON(needs.plan.outputs.run)['browser-shard']
    runs-on: ubuntu-latest
    # Per-test deadlines, fixture budgets and required assertions stay unchanged.
    timeout-minutes: 45
    strategy:
      # Both shards always finish, so one failure never hides the other's.
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.browser).shards }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install pinned browser toolchain
        working-directory: web-console
        run: |
          corepack enable
          corepack install
          pnpm install --frozen-lockfile
      # Browser acceptance also connects the actual remote TUI client to the
      # same server, and drives the development launchers.
      - name: Install the TUI client and development launchers used by browser acceptance
        run: |
          (cd tui && pnpm install --frozen-lockfile)
          (cd dev && pnpm install --frozen-lockfile)
      - uses: ./.github/actions/document-runtime
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - name: Prepare the existing provider emulator
        working-directory: test-support/fake-provider
        run: uv sync --frozen
      - uses: ./.github/actions/browser-inputs
      - uses: actions/download-artifact@v4
        with:
          name: browser-inventory
          path: ${{ runner.temp }}/inventory
      - name: Record the shard's identity
        working-directory: web-console
        run: |
          mkdir -p shard-report
          node scripts/browser-shards.ts identity ${{ matrix.shard }}/${{ strategy.job-total }} shard-report/identity.json
      - name: Provenance of the installed production bundle
        working-directory: web-console
        run: node scripts/provenance.ts --artifact
      - name: Browser acceptance against the real App Server and Product Host
        working-directory: web-console
        env:
          RUSTX_BROWSER_PREPARED: "1"
          PLAYWRIGHT_BLOB_OUTPUT_NAME: report-${{ matrix.shard }}.zip
        run: bash scripts/browser-tests.sh --test-list "$RUNNER_TEMP/inventory/shard-${{ matrix.shard }}.txt"
      - name: Shard report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-shard-${{ matrix.shard }}
          path: |
            web-console/shard-report/
            web-console/blob-report/
          if-no-files-found: ignore
      - name: Browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence-shard-${{ matrix.shard }}
          path: web-console/test-results/
          if-no-files-found: ignore

  # The one browser verdict. It runs whenever preparation succeeded, so a
  # failed or cancelled shard still yields the merged report, and passes only
  # if both shards succeeded and every discovered test ran exactly once.
  browser-report:
    name: Browser acceptance coverage
    needs: [plan, browser-prepare, browser-shard]
    if: ${{ !cancelled() && fromJSON(needs.plan.outputs.run)['browser-report'] }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install pinned browser toolchain
        working-directory: web-console
        run: |
          corepack enable
          corepack install
          pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: browser-inventory
          path: ${{ runner.temp }}/inventory
      - uses: actions/download-artifact@v4
        with:
          pattern: browser-shard-*
          path: ${{ runner.temp }}/shards
      - name: Merge the shard reports
        working-directory: web-console
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: ${{ runner.temp }}/merged/html
          PLAYWRIGHT_HTML_OPEN: never
          PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ runner.temp }}/merged/report.json
        run: |
          mkdir -p "$RUNNER_TEMP/blobs"
          find "$RUNNER_TEMP/shards" -path '*/blob-report/*.zip' -exec cp {} "$RUNNER_TEMP/blobs/" \;
          pnpm exec playwright merge-reports --reporter=html,json "$RUNNER_TEMP/blobs"
      - name: Verify complete coverage across shards
        working-directory: web-console
        run: |
          for shard in "$RUNNER_TEMP"/shards/browser-shard-*; do
            # Each artifact holds shard-report/{identity,report}.json.
            mkdir -p "$RUNNER_TEMP/runs/$(basename "$shard")"
            cp "$shard"/shard-report/*.json "$RUNNER_TEMP/runs/$(basename "$shard")/" 2>/dev/null || true
          done
          node scripts/browser-shards.ts verify "$RUNNER_TEMP/inventory/browser-inventory.json" "$RUNNER_TEMP/runs"
      - name: Both shards succeeded
        run: test "${{ needs.browser-shard.result }}" = success
      - name: Merged browser report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-console-browser-report
          path: ${{ runner.temp }}/merged/
          if-no-files-found: ignore

  # The merge verdict: require this check ("Merge verification") in branch
  # protection. It runs after everything, whatever happened, and fails closed.
  verification:
    name: Merge verification
    needs:
      - plan
      - notifications
      - quality
      - rust-fast
      - documentation-contracts
      - rust-contracts
      - rust-boundaries
      - rust-platform-core
      - rust-platform-boundaries
      - tui
      - app-server-protocol
      - desktop-macos
      - browser-prepare
      - web-client
      - browser-shard
      - browser-report
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      # Depth 2 keeps the tested merge commit's parents, which the gate
      # matches against the event's base and head.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Every selected job succeeded, at the right profile, for the current head
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PLAN: ${{ needs.plan.outputs.plan }}
          NEEDS: ${{ toJSON(needs) }}
        run: python3 .github/scripts/verification.py gate
