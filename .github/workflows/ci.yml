name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: Format, lint, and test
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # The provider emulator (Issue #47) is an external process the
      # conformance suite launches with `uv run`. Without it those tests skip
      # themselves, which is why the run below also sets
      # RUSTX_REQUIRE_PROVIDER_EMULATOR.
      - name: Install Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Sync the provider emulator environment
        working-directory: test-support/fake-provider
        run: uv sync --frozen

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run the provider-emulator tests
        working-directory: test-support/fake-provider
        run: uv run --frozen pytest

      # One `cargo test` run covers the whole suite, conformance included, so
      # the workspace is compiled once. The environment variable turns a
      # missing Python toolchain into a hard failure instead of a silent skip.
      - name: Run tests
        env:
          RUSTX_REQUIRE_PROVIDER_EMULATOR: "1"
        run: cargo test --all-targets --all-features

      - name: Run the Agent Loop conformance suite explicitly
        env:
          RUSTX_REQUIRE_PROVIDER_EMULATOR: "1"
        run: cargo test --test issue47_conformance --all-features

      - name: Check whitespace
        run: git diff --check

  # The TUI is a separate job on purpose: the Rust suites must never depend on
  # Node being present.
  tui:
    name: TUI typecheck and tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The real-child integration suite drives the shared provider emulator,
      # so this job needs the same Python 3.12 + uv toolchain as the Rust one.
      - name: Install Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Sync the provider emulator environment
        working-directory: test-support/fake-provider
        run: uv sync --frozen

      # Node comes from nvm's LTS line, declared explicitly. The intent is
      # "rustX TUI runs on the supported Node LTS", not "whatever Node the
      # runner happens to preinstall".
      - name: Install the Node LTS through nvm
        # `set -u` is deliberately not used: nvm's shell functions reference
        # unset variables internally and abort under it.
        run: |
          set -eo pipefail
          export NVM_DIR="$HOME/.nvm"
          mkdir -p "$NVM_DIR"
          curl -fsSL https://raw.githubusercontent.com/nvm-sh/nvm/v0.40.4/install.sh | bash
          # shellcheck source=/dev/null
          . "$NVM_DIR/nvm.sh"
          nvm install --lts
          nvm use --lts
          corepack enable
          # Cache the exact pnpm from tui/package.json's `packageManager` so
          # the later steps resolve it without hitting the network.
          (cd tui && corepack install)
          node --version
          # Put the resolved LTS bin directory ahead of the runner's
          # preinstalled Node for every later step.
          dirname "$(command -v node)" >> "$GITHUB_PATH"

      # The pnpm steps run with `tui` as the working directory on purpose:
      # Corepack resolves `packageManager` from the manifest in the current
      # directory, and from the repository root it cannot see tui's.
      - name: Report the resolved toolchain
        working-directory: tui
        run: |
          node --version
          pnpm --version

      - name: Install dependencies
        working-directory: tui
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        working-directory: tui
        run: pnpm typecheck

      # The integration suite drives the real binary over the real stdio
      # transport, so it must exist before the tests run.
      - name: Build the rustx binary
        run: cargo build --bin rustx

      - name: Test
        working-directory: tui
        run: pnpm test
