name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  # Static checks get their own job so formatting/lint failures report in
  # about two minutes instead of after a full test build.
  quality:
    name: Format, lint, and whitespace
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98.1"
          components: rustfmt, clippy

      # The one Rust cache policy, applied identically to every Rust-bearing
      # lane. Five properties matter and all five are deliberate:
      #
      # 1. It runs *after* the toolchain step, so the resolved compiler is part
      #    of the cache identity. The key the action builds already covers the
      #    runner OS and architecture, the rustc version and host triple,
      #    `rust-toolchain.toml`, the Cargo manifests and lockfile, and the
      #    build-relevant CARGO/CC/CFLAGS/CXX/CMAKE/RUST* environment. Linux
      #    and macOS artifacts therefore can never share a lineage.
      #
      # 2. `shared-key` names one stable lineage per semantic lane, replacing
      #    the action's automatic job-id component with a readable name. Lanes
      #    deliberately do NOT share a key with each other: GitHub cache
      #    entries are immutable and these jobs start concurrently, so a single
      #    shared key would let whichever lane finishes first freeze its own
      #    (smallest) `target/` as the entry every other lane then restores and
      #    can never correct. Per-lane lineages mean each lane stops rebuilding
      #    its own unchanged dependency graph on every run, which is the actual
      #    optimization; cross-populating siblings within one cold run is not a
      #    goal.
      #
      # 3. Only the dependency graph is cached. The action excludes workspace
      #    crates by default and that default is kept, so no rustX artifact is
      #    ever restored from a cache — the crate and its test code are always
      #    compiled from the checked-out source in every run.
      #
      # 4. The cache is an optimization and never a semantic authority. A cold,
      #    evicted, or stale cache changes nothing about which tests are
      #    selected or what they prove; it only changes how much dependency
      #    compilation is repeated. A completely cold runner remains valid.
      #
      # 5. Every lane may *restore* a compatible cache, but only a trusted push
      #    to `main` *publishes* one — that is what `save-if` encodes. Pull
      #    requests are cache consumers, never cache publishers: a PR cannot
      #    spend the repository's shared cache budget (the seven lineages are
      #    ~7.1 GB of a 10 GB LRU pool) and untrusted fork execution can never
      #    become a writer of the state trusted runs later restore. The reuse
      #    path is `main` cache -> future run with a compatible key. This
      #    workflow's `push` trigger is already `main`-only; the condition
      #    stays explicit so the ownership contract is locally obvious.
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: quality
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Check whitespace
        run: git diff --check

  # Fast deterministic classes: source-module unit tests, the in-crate
  # scripted contract suites, and the pure contract targets. No cross-module
  # boundary conformance suite runs here: none needs a real process, a
  # provider, or a network beyond loopback fixture servers. (Unit tests of
  # boundary-owning modules still exercise their module's own primitive —
  # the bash tool's unit tests spawn bash, the uv backend's run uv — which
  # is what `--bins` is for: it builds the `bash-supervisor` binary those
  # unit tests exec.)
  #
  # Semantic class and compilation placement are different axes: the lib
  # test binary also contains the in-crate *boundary conformance* suites, so
  # they are excluded by their stable name prefix.
  rust-contracts:
    name: Deterministic contracts (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98.1"

      # One lineage per lane; see the policy note in the `quality` job.
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-contracts
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      # `cargo test --bins` builds the bin *test harnesses* but does not
      # place the binaries at `target/debug/`, where the bash tool's unit
      # tests look for `bash-supervisor` at runtime — so build them first.
      - name: Build the binaries the boundary-owning unit tests exec
        run: cargo build --bins

      # Source-module unit tests + the scripted contract suites
      # (`scripted_suites::`) + the App Server scripted contracts compiled
      # under the session runtime manager's private test module
      # (`local_runtime::session_runtime_manager::tests::`). The in-crate
      # boundary conformance suites are selected OUT by their
      # `boundary_suites::` prefix; they run in the boundary jobs.
      #
      # `--examples` runs the `session_list_benchmark` workload-checker tests;
      # `--bins` executes zero tests today, since no binary defines a
      # `#[test]`. Both selectors are kept: Cargo already owns test-target
      # discovery, so a test added to a bin or an example is picked up here
      # automatically — which is simpler than a second repository policy
      # saying those targets must stay test-free forever.
      - name: Run unit tests and the in-crate contract suites
        run: 'cargo test --lib --bins --examples --all-features -- --skip boundary_suites::'

      # contracts/: pure serialization/configuration fixture contracts.
      # provider/: adapter request serialization, stream parsing, error
      # normalization over the in-process FixtureServer. The provider
      # target also carries the #[ignore]d opt-in live smoke tests, which
      # never run here.
      - name: Run the pure contract targets
        run: cargo test --test contracts --test provider --all-features

      # Cargo/libtest discovery of this lane's targets against every Linux
      # step that selects them: an unassigned target, a stale filter or
      # --skip, or a Linux test no lane executes fails here. The checker's own
      # deterministic tests ran above as part of `--examples`.
      - name: Check test lane coverage
        run: cargo run --example check_test_lanes -- --job rust-contracts

  # Real boundaries: SQLite durability/recovery, the spawned rustx process
  # and stdio/IPC transport, the subagent child-process boundary, the tool
  # plane (shell, filesystem, executable discovery), and composed
  # provider-emulator conformance. The uv toolchain is mandatory for every
  # step that runs a uv-dependent boundary (the emulator and the managed
  # FastMCP children): RUSTX_REQUIRE_PROVIDER_EMULATOR=1 turns a missing
  # toolchain into a hard failure instead of a silent skip.
  rust-boundaries:
    name: Boundary suites (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98.1"

      # One lineage per lane; see the policy note in the `quality` job.
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-boundaries
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Install Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Sync the provider emulator environment
        working-directory: test-support/fake-provider
        run: uv sync --frozen

      # The emulator's own pytest suite is platform-independent Python and
      # runs in this job only.
      - name: Run the provider-emulator tests
        working-directory: test-support/fake-provider
        run: uv run --frozen pytest

      # The in-crate boundary conformance suites (real process death, real
      # bash supervision, staged subagent children, real MCP stdio fixture
      # children), selected by their stable name prefix. `cargo build --bins`
      # comes first: the text_spill suite execs the `bash-supervisor` binary
      # by path and `cargo test --lib` does not build it.
      - name: Build the binaries the in-crate boundary suites exec
        run: cargo build --bins

      - name: Run the in-crate boundary suites
        env:
          RUSTX_REQUIRE_PROVIDER_EMULATOR: "1"
        run: 'cargo test --lib --all-features -- boundary_suites::'

      - name: Run the external boundary targets
        env:
          RUSTX_REQUIRE_PROVIDER_EMULATOR: "1"
        run: >-
          cargo test --all-features
          --test durable
          --test process
          --test subagent
          --test tools
          --test conformance
          --test cfg3_catalog
          --test cfg3_managed_output

      # See the same step in `rust-contracts`; this lane's targets are the
      # lib test harness and the external boundary targets.
      - name: Check test lane coverage
        run: cargo run --example check_test_lanes -- --job rust-boundaries

  # Rust platform coverage is intentional, not duplicated by habit. This macOS
  # job runs the classes below; desktop-macos separately executes Node boundaries:
  #
  # - from the lib test binary: the source-module unit tests plus the
  #   in-crate boundary conformance suites (`boundary_suites::` — real
  #   SIGKILL process death, bash supervision, staged subagent children,
  #   MCP stdio fixture children). The deterministic scripted contract
  #   suites are selected OUT by their `scripted_suites::` prefix: they are
  #   pure state-machine/planning/manual-clock contracts whose invariants
  #   carry no OS semantics, so rerunning them on macOS would be duplication
  #   without platform value.
  # - external targets: durable (SQLite/filesystem), process (spawned
  #   binary, stdio/IPC), subagent (child process/control socket), tools
  #   (shell, filesystem, executable discovery), conformance (external
  #   emulator process), cfg3_catalog (configuration source resolution over
  #   real files) and cfg3_managed_output (managed Tool output storage).
  #
  # The contracts and provider targets assert deterministic JSON/SSE
  # translation with no process or filesystem semantics, so they are
  # Linux-only.
  rust-platform-boundaries:
    name: Platform-sensitive boundaries (macOS)
    runs-on: macos-latest
    # Keep the same budget and native selectors. See docs/pr-424-validation.md
    # for the audited cold-build cancellation and the pending native comparison.
    timeout-minutes: 40
    env:
      # Job-local build metadata only: assertions, overflow checks, unwind,
      # optimization and release profiles retain their Cargo defaults.
      # rust-cache hashes the CARGO prefix, including both settings.
      CARGO_PROFILE_DEV_DEBUG: "1"
      CARGO_PROFILE_TEST_DEBUG: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98.1"

      # One lineage per lane; see the policy note in the `quality` job. This is
      # the macOS lineage: it shares nothing with any Linux lane, because the
      # action's key carries the runner OS, architecture and host triple.
      - name: Cache Rust dependencies
        id: rust-cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-platform-boundaries
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Record native build environment
        shell: bash
        run: |
          {
            echo '## macOS native build measurement'
            sw_vers
            uname -m
            echo "Logical CPUs: $(sysctl -n hw.logicalcpu)"
            echo "Memory bytes: $(sysctl -n hw.memsize)"
            rustc -vV
            cargo -V
            echo "Rust cache exact hit: ${{ steps.rust-cache.outputs.cache-hit }}"
            echo "CARGO_INCREMENTAL=$CARGO_INCREMENTAL"
            echo "CARGO_PROFILE_DEV_DEBUG=$CARGO_PROFILE_DEV_DEBUG"
            echo "CARGO_PROFILE_TEST_DEBUG=$CARGO_PROFILE_TEST_DEBUG"
            echo 'Cargo HTML reports separate build units; /usr/bin/time -l records wall time and peak RSS per phase.'
            echo 'Ordinary libraries, cfg(test) libraries, real binaries and binary test harnesses remain distinct Cargo units.'
          } >> "$GITHUB_STEP_SUMMARY"

      # The conformance target launches the provider emulator with `uv run`.
      - name: Install Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Sync the provider emulator environment
        working-directory: test-support/fake-provider
        run: uv sync --frozen

      # Lib test binary: source-module unit tests (including the bash/uv
      # boundary-owning modules, whose OS primitives are platform-sensitive)
      # + the in-crate boundary conformance suites; the deterministic
      # scripted contract suites are skipped by prefix. The explicit bin
      # build is required: `cargo test --bins` alone does not place
      # `bash-supervisor` at `target/debug/` where the tests look for it.
      - name: Build the binaries the boundary tests exec
        # Match the test feature set for the actual target/debug executables.
        # Default-feature real binary builds still run in the Linux contract,
        # boundary and TUI lanes; their validation is not replaced by harnesses.
        run: /usr/bin/time -l cargo build --bins --all-features --timings

      # App Server scripted contracts live under the manager's cfg(test) module
      # to reach its private owner gates; their physical test class is still
      # deterministic and Linux-only, despite this different name prefix.
      #
      # `--bins` executes zero tests today and removing it was measured, but it
      # is retained so Cargo's normal target discovery picks up any future test
      # added to a binary. It is not a substitute for the explicit
      # `cargo build --bins` step above, which serves a different contract:
      # placing the real executables at `target/debug/` for tests to exec.
      - name: Compile unit and in-crate boundary test harnesses
        run: /usr/bin/time -l cargo test --lib --bins --all-features --no-run --timings

      - name: Run unit tests and the in-crate boundary suites
        env:
          RUSTX_REQUIRE_PROVIDER_EMULATOR: "1"
        run: '/usr/bin/time -l cargo test --lib --bins --all-features -- --skip scripted_suites:: --skip local_runtime::session_runtime_manager::tests::'

      - name: Compile the external boundary targets
        run: >-
          /usr/bin/time -l cargo test --all-features --no-run --timings
          --test durable
          --test process
          --test subagent
          --test tools
          --test conformance
          --test cfg3_catalog
          --test cfg3_managed_output

      - name: Run the external boundary targets
        env:
          RUSTX_REQUIRE_PROVIDER_EMULATOR: "1"
        run: >-
          /usr/bin/time -l cargo test --all-features
          --test durable
          --test process
          --test subagent
          --test tools
          --test conformance
          --test cfg3_catalog
          --test cfg3_managed_output

      # Native macOS discovery: both --skip selectors must still exclude
      # tests, and every required boundary suite (see REQUIREMENTS in the
      # checker) must execute here. The feature set matches the binaries
      # built above, so no library is rebuilt for the checker.
      - name: Check test lane coverage
        run: cargo run --all-features --example check_test_lanes -- --job rust-platform-boundaries

      - name: Native Cargo timing reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-cargo-timings
          path: target/cargo-timings/*.html
          retention-days: 7
          if-no-files-found: warn

  # The TUI is a separate job on purpose: the Rust suites must never depend on
  # Node being present.
  tui:
    name: TUI typecheck and tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98.1"

      # The real-child integration suite drives the shared provider emulator,
      # so this job needs the same Python 3.12 + uv toolchain as the Rust one.
      - name: Install Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Sync the provider emulator environment
        working-directory: test-support/fake-provider
        run: uv sync --frozen

      # Node comes from nvm's LTS line, declared explicitly. The intent is
      # "rustX TUI runs on the supported Node LTS", not "whatever Node the
      # runner happens to preinstall".
      - name: Install the Node LTS through nvm
        # `set -u` is deliberately not used: nvm's shell functions reference
        # unset variables internally and abort under it.
        run: |
          set -eo pipefail
          export NVM_DIR="$HOME/.nvm"
          mkdir -p "$NVM_DIR"
          curl -fsSL https://raw.githubusercontent.com/nvm-sh/nvm/v0.40.4/install.sh | bash
          # shellcheck source=/dev/null
          . "$NVM_DIR/nvm.sh"
          nvm install --lts
          nvm use --lts
          corepack enable
          # Cache the exact pnpm from tui/package.json's `packageManager` so
          # the later steps resolve it without hitting the network.
          (cd tui && corepack install)
          node --version
          # Put the resolved LTS bin directory ahead of the runner's
          # preinstalled Node for every later step.
          dirname "$(command -v node)" >> "$GITHUB_PATH"

      # The pnpm steps run with `tui` as the working directory on purpose:
      # Corepack resolves `packageManager` from the manifest in the current
      # directory, and from the repository root it cannot see tui's.
      - name: Report the resolved toolchain
        working-directory: tui
        run: |
          node --version
          pnpm --version

      - name: Install dependencies
        working-directory: tui
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        working-directory: tui
        run: pnpm typecheck

      # One lineage per lane; see the policy note in the `quality` job. This
      # pinned toolchain is installed before this cache step, just as in every
      # other Cargo-bearing lane; the resolved compiler remains part of its key.
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: tui
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      # The integration suite drives the real binary over the real stdio
      # transport, so it must exist before the tests run.
      - name: Build the rustx binary
        run: cargo build --bin rustx

      - name: Test
        working-directory: tui
        env:
          RUSTX_REQUIRE_PROVIDER_EMULATOR: "1"
        run: pnpm test

  app-server-protocol:
    name: App Server generated protocol
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98.1"
      # One lineage per lane; see the policy note in the `quality` job. This
      # lane is Rust-bearing despite its Node surface: `pnpm check` shells out
      # to `cargo run --example generate_app_server_protocol`.
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: app-server-protocol
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install pinned protocol toolchain
        working-directory: protocol/app-server
        run: |
          corepack enable
          corepack install
          pnpm install --frozen-lockfile
      - name: Check schema and TypeScript drift
        working-directory: protocol/app-server
        run: pnpm check
      - name: Typecheck Rust fixtures and reference intersections
        working-directory: protocol/app-server
        run: pnpm typecheck

  desktop-macos:
    name: Desktop adapter and Host (macOS Node)
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98.1"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: desktop-host
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      # The supervisor already compiles the rustx library; the real App Server
      # binary for the TUI Save integration suite adds only its own link.
      - name: Build native PTY ownership supervisor and the App Server
        run: cargo build --bin interactive-supervisor --bin rustx --locked
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install pinned Node dependencies
        run: |
          corepack enable
          (cd web-console && corepack install && pnpm install --frozen-lockfile)
          (cd tui && pnpm install --frozen-lockfile)
      # The TUI Save integration suite drives the shared provider emulator.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - name: Prepare the existing provider emulator
        working-directory: test-support/fake-provider
        run: uv sync --frozen
      # Real macOS Node/filesystem/process execution, including a harmless Node
      # child through launchDesktop. Fakes cover GUI argv and unavailable sessions;
      # this is not Finder/Terminal GUI smoke and does not duplicate browser E2E.
      - name: Desktop adapter and Host boundaries
        working-directory: web-console
        run: |
          pnpm run build:host
          pnpm exec vitest run test/desktop-host.test.ts test/document-archive.test.ts test/document-integration.test.ts test/workbench-host.test.ts
      # Client-local Save on the macOS filesystem: exclusive create, hard-link
      # publication, link-count cleanup and every ownership interleaving, 0600
      # creation under an inherited native ACL (macOS only), then byte-exact
      # Save from a real stdio child and a real WebSocket server.
      - name: TUI client-local Save (macOS filesystem, stdio and WebSocket)
        working-directory: tui
        env:
          RUSTX_REQUIRE_PROVIDER_EMULATOR: "1"
        run: node --test test/deliveries.test.ts test/delivery-integration.test.ts

  web-console:
    name: Full Web conformance
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install pinned browser toolchain
        working-directory: web-console
        run: |
          corepack enable
          corepack install
          pnpm install --frozen-lockfile
      # Browser acceptance also connects the actual remote TUI client to the
      # same server. Install its existing dependencies, never a private client.
      - name: Install the TUI client used by shared-server browser acceptance
        working-directory: tui
        run: pnpm install --frozen-lockfile
      - name: Install and check development launchers
        working-directory: dev
        run: |
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm test
      - name: Install isolated document conversion runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap apparmor-profiles libreoffice-writer libreoffice-impress fonts-liberation
          # Ubuntu restricts capabilities in unprivileged user namespaces.
          # Load its packaged bwrap-specific profile, which grants setup
          # capabilities to bwrap but denies them to its executed children.
          # Keep system-wide restrictions and converter network isolation.
          sudo apparmor_parser -r /usr/share/apparmor/extra-profiles/bwrap-userns-restrict
          test "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns)" = 1
          # A transient user service owns each converter cgroup. No root payload.
          sudo loginctl enable-linger "$USER"
          sudo systemctl start "user@$(id -u).service"
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u)/bus" >> "$GITHUB_ENV"
      - name: Verify document sandbox namespace admission
        run: >-
          bwrap --unshare-all --unshare-user --disable-userns --die-with-parent --new-session
          --cap-drop ALL --ro-bind /usr /usr --symlink usr/lib /lib
          --symlink usr/lib64 /lib64 -- /usr/bin/true
      - name: Verify aggregate Office resource admission
        run: node web-console/scripts/check-office-sandbox.ts
      # PTY lifecycle tests and browser fixtures use the native supervisors.
      # Rust-only jobs above remain independent of Node.
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98.1"
      # One lineage per lane; see the policy note in the `quality` job.
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: web-console
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - name: Prepare the existing provider emulator
        working-directory: test-support/fake-provider
        run: uv sync --frozen
      - name: Build the real App Server, native Tool supervisors and Artifact fixture
        run: cargo build --bins --example document_artifact_fixture --locked
      - name: Typecheck
        working-directory: web-console
        run: pnpm typecheck
      - name: Deterministic native client and presentation tests
        working-directory: web-console
        run: pnpm test
      - name: Product UI translation ownership
        working-directory: web-console
        run: pnpm check:i18n
      - name: Source provenance and dependency notices
        working-directory: web-console
        run: pnpm check:provenance
      # `pnpm test:e2e` is `pnpm build && bash scripts/browser-tests.sh`: the one
      # production build of this job (Vite plus the artifact provenance check)
      # runs from checked-in source immediately before browser acceptance, so
      # no earlier step builds or reuses `dist`. browser-tests.sh supplies
      # Chromium, fonts and rasterization libraries in one digest-pinned
      # Playwright container, also used for reference updates. No host
      # browser/font install or browser cache can change the rendering.
      - name: Production build and full product browser acceptance against the real App Server and Product Host
        working-directory: web-console
        run: pnpm test:e2e
      - name: Browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-console-browser-evidence
          path: web-console/test-results/
          if-no-files-found: ignore
