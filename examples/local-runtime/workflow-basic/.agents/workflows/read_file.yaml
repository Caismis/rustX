description: Read one explicitly supplied file through the native Read Tool.
timeout_ms: 30000
block:
  input:
    type: object
    properties:
      path:
        type: string
    required:
    - path
    additionalProperties: false
  nodes:
    start:
      type: start
    read:
      type: tool
      selector:
        origin: builtin
        name: read
      arguments:
        type: object
        fields:
          path:
            type: reference
            path:
            - args
            - path
      result:
        type: text
    done:
      type: return
      outputs:
      - {variable: text, value_selector: [read, text]}
  edges:
  - from: start
    to: read
  - from: read
    to: done
