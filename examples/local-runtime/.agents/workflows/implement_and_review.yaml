description: Plan greeting.py, gate implementation on human plan acceptance, then implement and run real
  checks in the shared Session workspace up to three times.
timeout_ms: 1800000
block:
  input:
    type: object
    properties:
      requirement:
        type: string
    required:
    - requirement
    additionalProperties: false
  output:
    type: object
    properties:
      status:
        type: string
        enum:
        - implemented
        - rejected
        - needs_revision
        - unanswered
      feedback:
        type: string
    required:
    - status
    - feedback
    additionalProperties: false
  nodes:
    start:
      type: start
    unanswered:
      type: branch
      cases:
      - id: 'true'
        condition:
          type: equal
          left:
            type: reference
            path:
            - intake_brief
            - requirement
          right:
            type: literal
            value: ''
    plan:
      type: agent
      profile: planner
      task:
      - type: literal
        value: Produce a concise implementation plan for the fixed greeting contract and supplied priority.
          Do not edit files or run commands. The plan is business data, never executable Workflow structure.
      - type: literal
        value: '


          brief: '
      - type: reference
        path:
        - intake_brief
      - type: literal
        value: '


          contract: {"requirement": "greeting(\"Ada\") == \"Hello, Ada!\"; greeting(\"\") == \"Hello,
          friend!\""}'
      output:
        type: json_schema
        schema:
          type: object
          properties:
            summary:
              type: string
            steps:
              type: array
              items:
                type: string
          required:
          - summary
          - steps
          additionalProperties: false
    review_plan:
      type: review
      subject:
        type: plan
        value:
          type: reference
          path:
          - plan
      context: []
    plan_accepted:
      type: branch
      cases:
      - id: 'true'
        condition:
          type: boolean
          value:
            type: reference
            path:
            - review_plan
            - accepted
    repair:
      type: loop
      loop_count: 3
      loop_variables:
      - label: plan
        var_type: object
        value:
          type: reference
          path:
          - plan
      - label: feedback
        var_type: string
        value:
          type: literal
          value: Implement the accepted plan.
      - label: passed
        var_type: boolean
        value:
          type: literal
          value: false
      - label: report
        var_type: object
        value:
          type: literal
          value: {}
      break_condition:
        type: boolean
        value:
          type: reference
          path:
          - repair
          - passed
      body:
        nodes:
          repair_start:
            type: start
          implement:
            type: agent
            profile: implementer
            task:
            - type: literal
              value: Implement or repair greeting.py so greeting(name) returns Hello, NAME! and uses friend
                for an empty name. Use the supplied plan and feedback as data. Change only greeting.py.
                Never claim verification from prose; the next fixed Tool runs the checker. Return the
                implemented plan as the declared output for the next round.
            - type: literal
              value: '


                plan: '
            - type: reference
              path:
              - repair
              - plan
            - type: literal
              value: '


                feedback: '
            - type: reference
              path:
              - repair
              - feedback
            output:
              type: json_schema
              schema:
                type: object
                properties:
                  plan:
                    type: object
                    properties:
                      summary:
                        type: string
                      steps:
                        type: array
                        items:
                          type: string
                    required:
                    - summary
                    - steps
                    additionalProperties: false
                required:
                - plan
                additionalProperties: false
          check:
            type: tool
            selector:
              origin: builtin
              name: bash
            arguments:
              type: literal
              value:
                command: "python3 -I -B - <<'PY'\n\"\"\"Fixed checker. Exit zero means checks ran, not\
                  \ that business checks passed.\"\"\"\nimport contextlib\nimport runpy\nimport sys\n\
                  from pathlib import Path\n\nsource = Path(\"greeting.py\")\nif source.stat().st_size\
                  \ > 4096:\n    raise ValueError(\"greeting.py exceeds the 4096-byte source limit\")\n\
                  # Implementation stdout cannot forge the checker's exact output contract.\nwith contextlib.redirect_stdout(sys.stderr):\n\
                  \    greeting = runpy.run_path(str(source))[\"greeting\"]\n    actual = [greeting(\"\
                  Ada\"), greeting(\"\")]\nif any(not isinstance(value, str) or len(value) > 256 for value\
                  \ in actual):\n    raise ValueError(\"greeting must return bounded strings\")\nsys.stdout.write(\"\
                  passed\" if actual == [\"Hello, Ada!\", \"Hello, friend!\"] else \"failed\")\nPY\n"
            result:
              type: json
              schema:
                type: object
                properties:
                  exit_code:
                    type: integer
                  stdout:
                    type: string
                    enum:
                    - passed
                    - failed
                  stderr:
                    type: string
                  combined:
                    type: string
                required:
                - exit_code
                - stdout
                - stderr
                - combined
                additionalProperties: false
          passed:
            type: branch
            cases:
            - id: 'true'
              condition:
                type: equal
                left:
                  type: reference
                  path:
                  - check
                  - stdout
                right:
                  type: literal
                  value: passed
          success:
            type: assigner
            items:
            - variable:
              - repair
              - plan
              operation: overwrite
              value:
                type: reference
                path:
                - implement
                - plan
            - variable:
              - repair
              - report
              operation: overwrite
              value:
                type: reference
                path:
                - check
            - variable:
              - repair
              - feedback
              operation: set
              value:
                type: literal
                value: Both fixed greeting cases passed.
            - variable:
              - repair
              - passed
              operation: set
              value:
                type: literal
                value: true
          failure:
            type: assigner
            items:
            - variable:
              - repair
              - plan
              operation: overwrite
              value:
                type: reference
                path:
                - implement
                - plan
            - variable:
              - repair
              - report
              operation: overwrite
              value:
                type: reference
                path:
                - check
            - variable:
              - repair
              - feedback
              operation: set
              value:
                type: literal
                value: The checker ran successfully but greeting.py failed at least one fixed case. Repair
                  greeting.py.
        edges:
        - from: repair_start
          to: implement
        - from: implement
          to: check
        - from: check
          to: passed
        - from: passed
          to: success
          port: 'true'
        - from: passed
          to: failure
          port: 'false'
    implemented:
      type: return
      output:
        type: object
        fields:
          status:
            type: literal
            value: implemented
          feedback:
            type: reference
            path:
            - repair
            - feedback
    rejected_plan:
      type: return
      output:
        type: object
        fields:
          status:
            type: literal
            value: rejected
          feedback:
            type: reference
            path:
            - review_plan
            - feedback
    exhausted:
      type: return
      output:
        type: object
        fields:
          status:
            type: literal
            value: needs_revision
          feedback:
            type: reference
            path:
            - repair
            - feedback
    declined:
      type: return
      output:
        type: literal
        value:
          status: unanswered
          feedback: Questionnaire declined; no implementation requested.
    intake_brief:
      type: loop
      loop_count: 1
      loop_variables:
      - label: requirement
        var_type: string
        value:
          type: reference
          path:
          - args
          - requirement
      - label: answers
        var_type: array[object]
        value:
          type: literal
          value: []
      body:
        nodes:
          intake_start:
            type: start
          missing:
            type: branch
            cases:
            - id: 'true'
              condition:
                type: equal
                left:
                  type: reference
                  path:
                  - args
                  - requirement
                right:
                  type: literal
                  value: ''
          question:
            type: tool
            selector:
              origin: builtin
              name: ask_user
            arguments:
              type: literal
              value:
                questions:
                - question: Which constraint should the greeting implementation prioritize?
                  header: Priority
                  options:
                  - label: Minimal change
                    description: Keep the implementation small.
                  - label: Clarity
                    description: Prefer explicit readable code.
            result:
              type: json
              schema:
                type: object
                properties:
                  cancelled:
                    type: boolean
                  answers:
                    type: array
                    items:
                      type: object
                required:
                - cancelled
                - answers
                additionalProperties: false
          answered:
            type: assigner
            items:
            - variable:
              - intake_brief
              - requirement
              operation: set
              value:
                type: literal
                value: Implement the fixed greeting contract using the selected priority.
            - variable:
              - intake_brief
              - answers
              operation: overwrite
              value:
                type: reference
                path:
                - question
                - answers
          unanswered_brief:
            type: assigner
            items:
            - variable:
              - intake_brief
              - requirement
              operation: clear
          cancelled:
            type: branch
            cases:
            - id: 'true'
              condition:
                type: boolean
                value:
                  type: reference
                  path:
                  - question
                  - cancelled
        edges:
        - from: intake_start
          to: missing
        - from: missing
          to: question
          port: 'true'
        - from: question
          to: cancelled
        - from: cancelled
          to: unanswered_brief
          port: 'true'
        - from: cancelled
          to: answered
          port: 'false'
    verified:
      type: branch
      cases:
      - id: 'true'
        condition:
          type: boolean
          value:
            type: reference
            path:
            - repair
            - passed
  edges:
  - from: unanswered
    to: declined
    port: 'true'
  - from: unanswered
    to: plan
    port: 'false'
  - from: plan
    to: review_plan
  - from: review_plan
    to: plan_accepted
  - from: plan_accepted
    to: repair
    port: 'true'
  - from: plan_accepted
    to: rejected_plan
    port: 'false'
  - from: start
    to: intake_brief
  - from: start
    to: unanswered
  - from: repair
    to: verified
  - from: verified
    to: implemented
    port: 'true'
  - from: verified
    to: exhausted
    port: 'false'
  - from: intake_brief
    to: unanswered
