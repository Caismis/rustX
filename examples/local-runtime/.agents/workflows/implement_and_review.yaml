description: Plan greeting.py, gate implementation on human plan acceptance, then
  implement and run real checks in the shared Session workspace up to three times.
timeout_ms: 1800000
block:
  input:
    type: object
    properties:
      requirement:
        type: string
    required:
    - requirement
    additionalProperties: false
  output:
    type: object
    properties:
      status:
        type: string
        enum:
        - implemented
        - rejected
        - needs_revision
        - unanswered
      feedback:
        type: string
    required:
    - status
    - feedback
    additionalProperties: false
  nodes:
    start:
      type: start
    unanswered:
      type: branch
      cases:
      - id: 'true'
        condition:
          type: equal
          left:
            type: reference
            path:
            - intake_brief
            - result
            - requirement
          right:
            type: literal
            value: ''
    plan:
      type: agent
      profile: planner
      task:
      - type: literal
        value: "Produce a concise implementation plan for the fixed greeting contract and supplied priority. Do not edit files or run commands. The plan is business data, never executable Workflow structure."
      input:
        brief:
          type: reference
          path:
          - intake_brief
          - result
        contract:
          type: literal
          value:
            requirement: greeting("Ada") == "Hello, Ada!"; greeting("") == "Hello,
              friend!"
      output:
        type: object
        properties:
          summary:
            type: string
          steps:
            type: array
            items:
              type: string
        required:
        - summary
        - steps
        additionalProperties: false
    review_plan:
      type: review
      subject:
        type: plan
        value:
          type: reference
          path:
          - plan
      context: []
    plan_accepted:
      type: branch
      cases:
      - id: 'true'
        condition:
          type: boolean
          value:
            type: reference
            path:
            - review_plan
            - accepted
    repair:
      type: loop
      max_iterations: 3
      input:
        type: object
        fields:
          plan:
            type: reference
            path:
            - plan
          feedback:
            type: literal
            value: Implement the accepted plan.
      until:
        type: boolean
        value:
          type: reference
          path:
          - result
          - passed
      carry:
        type: object
        fields:
          plan:
            type: reference
            path:
            - result
            - plan
          feedback:
            type: reference
            path:
            - result
            - feedback
      body:
        input:
          type: object
          properties:
            plan: &id001
              type: object
              properties:
                summary:
                  type: string
                steps:
                  type: array
                  items:
                    type: string
              required:
              - summary
              - steps
              additionalProperties: false
            feedback:
              type: string
          required:
          - plan
          - feedback
          additionalProperties: false
        output:
          type: object
          properties:
            plan: *id001
            feedback:
              type: string
            passed:
              type: boolean
            report: &id002
              type: object
              properties:
                exit_code:
                  type: integer
                stdout:
                  type: string
                  enum:
                  - passed
                  - failed
                stderr:
                  type: string
                combined:
                  type: string
              required:
              - exit_code
              - stdout
              - stderr
              - combined
              additionalProperties: false
          required:
          - plan
          - feedback
          - passed
          - report
          additionalProperties: false
        nodes:
          start:
            type: start
          implement:
            type: agent
            profile: implementer
            task:
            - type: literal
              value: "Implement or repair greeting.py so greeting(name) returns Hello, NAME! and uses friend for an empty name. Use the supplied plan and feedback as data. Change only greeting.py. Never claim verification from prose; the next fixed Tool runs the checker. Return the implemented plan as the declared output for the next iteration."
            input:
              plan:
                type: reference
                path:
                - args
                - plan
              feedback:
                type: reference
                path:
                - args
                - feedback
            output:
              type: object
              properties:
                plan: *id001
              required:
              - plan
              additionalProperties: false
          check:
            type: tool
            selector:
              origin: builtin
              name: bash
            arguments:
              type: literal
              value:
                command: "python3 -I -B - <<'PY'\n\"\"\"Fixed checker. Exit zero means\
                  \ checks ran, not that business checks passed.\"\"\"\nimport contextlib\n\
                  import runpy\nimport sys\nfrom pathlib import Path\n\nsource = Path(\"\
                  greeting.py\")\nif source.stat().st_size > 4096:\n    raise ValueError(\"\
                  greeting.py exceeds the 4096-byte source limit\")\n# Implementation\
                  \ stdout cannot forge the checker's exact output contract.\nwith\
                  \ contextlib.redirect_stdout(sys.stderr):\n    greeting = runpy.run_path(str(source))[\"\
                  greeting\"]\n    actual = [greeting(\"Ada\"), greeting(\"\")]\n\
                  if any(not isinstance(value, str) or len(value) > 256 for value\
                  \ in actual):\n    raise ValueError(\"greeting must return bounded\
                  \ strings\")\nsys.stdout.write(\"passed\" if actual == [\"Hello,\
                  \ Ada!\", \"Hello, friend!\"] else \"failed\")\nPY\n"
            result:
              type: json
              part: 0
              schema: *id002
          passed:
            type: branch
            cases:
            - id: 'true'
              condition:
                type: equal
                left:
                  type: reference
                  path:
                  - check
                  - stdout
                right:
                  type: literal
                  value: passed
          success:
            type: return
            output:
              type: object
              fields:
                plan:
                  type: reference
                  path:
                  - implement
                  - plan
                feedback:
                  type: literal
                  value: Both fixed greeting cases passed.
                passed:
                  type: literal
                  value: true
                report:
                  type: reference
                  path:
                  - check
          repair:
            type: return
            output:
              type: object
              fields:
                plan:
                  type: reference
                  path:
                  - implement
                  - plan
                feedback:
                  type: literal
                  value: The checker ran successfully but greeting.py failed at least
                    one fixed case. Repair greeting.py.
                passed:
                  type: literal
                  value: false
                report:
                  type: reference
                  path:
                  - check
        edges:
        - from: start
          to: implement
        - from: implement
          to: check
        - from: check
          to: passed
        - from: passed
          to: success
          port: 'true'
        - from: passed
          to: repair
          port: 'false'
    implemented:
      type: return
      output:
        type: object
        fields:
          status:
            type: literal
            value: implemented
          feedback:
            type: reference
            path:
            - repair
            - result
            - feedback
    rejected_plan:
      type: return
      output:
        type: object
        fields:
          status:
            type: literal
            value: rejected
          feedback:
            type: reference
            path:
            - review_plan
            - feedback
    exhausted:
      type: return
      output:
        type: object
        fields:
          status:
            type: literal
            value: needs_revision
          feedback:
            type: reference
            path:
            - repair
            - result
            - feedback
    declined:
      type: return
      output:
        type: literal
        value:
          status: unanswered
          feedback: Questionnaire declined; no implementation requested.
    intake_brief:
      type: loop
      input:
        type: object
        fields:
          requirement:
            type: reference
            path:
            - args
            - requirement
      until:
        type: boolean
        value:
          type: literal
          value: true
      carry:
        type: object
        fields:
          requirement:
            type: reference
            path:
            - result
            - requirement
      max_iterations: 1
      body:
        input:
          type: object
          properties:
            requirement:
              type: string
          required:
          - requirement
          additionalProperties: false
        output:
          type: object
          properties:
            requirement:
              type: string
            answers:
              type: array
              items:
                type: object
          required:
          - requirement
          - answers
          additionalProperties: false
        nodes:
          start:
            type: start
          missing:
            type: branch
            cases:
            - id: 'true'
              condition:
                type: equal
                left:
                  type: reference
                  path:
                  - args
                  - requirement
                right:
                  type: literal
                  value: ''
          question:
            type: tool
            selector:
              origin: builtin
              name: ask_user
            arguments:
              type: literal
              value:
                questions:
                - question: Which constraint should the greeting implementation prioritize?
                  header: Priority
                  options:
                  - label: Minimal change
                    description: Keep the implementation small.
                  - label: Clarity
                    description: Prefer explicit readable code.
            result:
              type: json
              part: 0
              schema:
                type: object
                properties:
                  cancelled:
                    type: boolean
                  answers:
                    type: array
                    items:
                      type: object
                required:
                - cancelled
                - answers
                additionalProperties: false
          declined:
            type: branch
            cases:
            - id: 'true'
              condition:
                type: boolean
                value:
                  type: reference
                  path:
                  - question
                  - cancelled
          answered:
            type: return
            output:
              type: object
              fields:
                requirement:
                  type: literal
                  value: Implement the fixed greeting contract using the selected
                    priority.
                answers:
                  type: reference
                  path:
                  - question
                  - answers
          unanswered:
            type: return
            output:
              type: object
              fields:
                requirement:
                  type: literal
                  value: ''
                answers:
                  type: literal
                  value: []
          provided:
            type: return
            output:
              type: object
              fields:
                requirement:
                  type: reference
                  path:
                  - args
                  - requirement
                answers:
                  type: literal
                  value: []
        edges:
        - from: start
          to: missing
        - from: missing
          to: question
          port: 'true'
        - from: missing
          to: provided
          port: 'false'
        - from: question
          to: declined
        - from: declined
          to: unanswered
          port: 'true'
        - from: declined
          to: answered
          port: 'false'
  edges:
  - from: unanswered
    to: declined
    port: 'true'
  - from: unanswered
    to: plan
    port: 'false'
  - from: plan
    to: review_plan
  - from: review_plan
    to: plan_accepted
  - from: plan_accepted
    to: repair
    port: 'true'
  - from: plan_accepted
    to: rejected_plan
    port: 'false'
  - from: repair
    to: implemented
    port: satisfied
  - from: repair
    to: exhausted
    port: exhausted
  - from: start
    to: intake_brief
  - from: intake_brief
    to: unanswered
    port: satisfied
  - from: intake_brief
    to: unanswered
    port: exhausted
  - from: start
    to: unanswered
