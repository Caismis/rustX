description: Two scoped proposal reviews, including a fixed second quality pass; no
  Git required.
timeout_ms: 600000
block:
  input:
    type: object
    properties:
      proposal:
        type: string
    required:
    - proposal
    additionalProperties: false
  nodes:
    start:
      type: start
    decision:
      type: branch
      cases:
      - id: 'true'
        condition:
          type: and
          predicates:
          - type: boolean
            value:
              type: reference
              path:
              - reviews_quality_refine
              - acceptable
          - type: boolean
            value:
              type: reference
              path:
              - reviews_security_review
              - acceptable
    ready:
      type: return
      outputs:
      - {variable: quality, value_selector: [reviews_quality_refine]}
      - {variable: security, value_selector: [reviews_security_review]}
    revise:
      type: return
      outputs:
      - {variable: quality, value_selector: [reviews_quality_refine]}
      - {variable: security, value_selector: [reviews_security_review]}
    reviews_quality_review:
      type: agent
      profile: reviewer
      task:
      - type: literal
        value: "Review the supplied proposal for quality. No external research is required."
      - type: literal
        value: "\n\nproposal: "
      - type: reference
        path: ["args", "proposal"]
      output:
        type: json_schema
        schema:
          type: object
          properties:
            summary:
              type: string
            acceptable:
              type: boolean
          required:
          - summary
          - acceptable
          additionalProperties: false
    reviews_quality_refine:
      type: agent
      profile: reviewer
      task:
      - type: literal
        value: "Independently check this quality assessment for unsupported claims. Return the corrected assessment."
      - type: literal
        value: "\n\nassessment: "
      - type: reference
        path: ["reviews_quality_review"]
      output:
        type: json_schema
        schema:
          type: object
          properties:
            summary:
              type: string
            acceptable:
              type: boolean
          required:
          - summary
          - acceptable
          additionalProperties: false
    reviews_security_review:
      type: agent
      profile: reviewer
      task:
      - type: literal
        value: "Review the supplied proposal for security. No external research is required."
      - type: literal
        value: "\n\nproposal: "
      - type: reference
        path: ["args", "proposal"]
      output:
        type: json_schema
        schema:
          type: object
          properties:
            summary:
              type: string
            acceptable:
              type: boolean
          required:
          - summary
          - acceptable
          additionalProperties: false
  edges:
  - from: decision
    to: ready
    port: 'true'
  - from: decision
    to: revise
    port: 'false'
  - from: start
    to: reviews_quality_review
  - from: reviews_quality_review
    to: reviews_quality_refine
  - from: reviews_quality_refine
    to: decision
  - from: start
    to: reviews_security_review
  - from: reviews_security_review
    to: decision
