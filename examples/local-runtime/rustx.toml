schema_version = 10
agent_id = "default-agent"

[context]
reserve_tokens = 4096
keep_recent_tokens = 12000

[context.summary_output_cap]
mode = "limit"
tokens = 1024

[model_timeout_policy]
response_start_timeout_ms = 30000
stream_idle_timeout_ms = 15000


# Runtime child capacity; Workflow static admission remains separate.
[subagents]
max_concurrent = 4

[environment]
RUSTX_EXAMPLE_MODE = "local-runtime"

# Resource existence grants no Root capability. Each selection is explicit.
[agent]
skills = "all"
agents = ["navigator"]
workflows = ["parallel_review", "implement_and_review"]

[agent.model]
model = "example/demo-model"
profile = "off"
# Explicit overrides may add keys the selected Profile does not own.
request_params = '{"top_p":0.9}'

[agent.model.max_output_tokens]
mode = "limit"
tokens = 2048

[agent.model.summary_model]
mode = "session"

# Each Plugin is one atomic overlay unit. Omitted Plugins are off.
[agent.plugins]
[agent.plugins.agent_status]
enabled = true

[agent.plugins.agent_status.time]
enabled = true
timezone = "Asia/Tokyo"

[agent.plugins.agent_status.background]
enabled = true

[agent.plugins.todo]
enabled = true

# Ordinary Tool exposure does not change execution or approval policy.
[agent.tools]
builtin = ["read", "write", "edit", "glob", "grep", "bash", "present"]

# Explicit provider/model declarations. Provider-native request parameters are
# JSON-encoded object strings, passed opaquely to the provider.
# TOML configuration; fixed Workflows use YAML and model-facing resources use Markdown.

[providers.example]
base_url = "https://api.example.invalid/v1"
api_key = "$RUSTX_EXAMPLE_API_KEY"

[models."example/demo-model"]
provider = "example"
id = "demo-model"
protocol = "openai_chat_completions"
context_window = 128000
max_output_tokens = 4096
# Each Profile is a complete, independent invocation preset.
default_profile = "off"

[models."example/demo-model".capabilities]
input_modalities = ["text"]
output_modalities = ["text"]
tool_calls = true
reasoning = true

[models."example/demo-model".profiles.off]
reasoning_enabled = false
request_params = '{"temperature":0.2}'

[models."example/demo-model".profiles.on]
reasoning_enabled = true
max_output_tokens = 2048
request_params = '''
{"temperature": 0.2, "reasoning_effort": "low"}
'''

[models."example/demo-model".compat]
chat_max_tokens_field = "max_completion_tokens"
chat_reasoning_replay = "reasoning"
chat_stream_usage = "supported"
chat_tool_protocol = "native"

# These global policies apply to every admitted Agent's native invocation.
[native_tools.read]
execution = "foreground_only"
concurrency = "parallel"
approval = "never"
[native_tools.grep]
execution = "foreground_only"
concurrency = "parallel"
approval = "never"
[native_tools.edit]
execution = "foreground_only"
concurrency = "sequential"
approval = "always"
[native_tools.bash]
execution = "model_selectable"
concurrency = "sequential"
approval = "always"
