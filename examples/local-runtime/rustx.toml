schema_version = 8
agent_id = "default-agent"

[context]
reserve_tokens = 4096
keep_recent_tokens = 12000

[context.summary_output_cap]
mode = "limit"
tokens = 1024

[model_timeout_policy]
response_start_timeout_ms = 30000
stream_idle_timeout_ms = 15000

[mcp_servers]

# Runtime child capacity; Workflow static admission remains separate.
[subagents]
max_concurrent = 4
workflow = ["reviewer", "planner", "implementer"]

[environment]
RUSTX_EXAMPLE_MODE = "local-runtime"

# Where Skill packages may be discovered. This is the default, spelled out:
# "global" is ~/.agents/skills and "workspace" is <workspace>/.agents/skills.
# Array order is not precedence; workspace always shadows global.
[skills]
sources = ["global", "workspace"]

# One Agent Profile selects from admitted resources. It does not create them.
# The root Agent needs no positive Skill list: it automatically sees every
# eligible Skill in the effective catalog. `disabled_skills` would subtract
# one from root visibility only, leaving it available to named Agents.
# Authoring `skills` here is an error even as `skills = []`: the root is
# rejected on presence, because an empty list would state the opposite of
# what root selection does.
[agent]
agents = ["navigator"]
workflows = ["parallel_review", "implement_and_review"]

[agent.model]
model = "example/demo-model"

[agent.model.request_params]
temperature = 0.1

[agent.model.reasoning_profile]
mode = "profile"
name = "off"

[agent.model.max_output_tokens]
mode = "limit"
tokens = 2048

[agent.model.summary_model]
mode = "session"

# This table replaces the complete extension composition. Empty means none.
[agent.extensions]
[agent.extensions.agent_status]
enabled = true

[agent.extensions.agent_status.time]
enabled = true
timezone = "Asia/Tokyo"

[agent.extensions.agent_status.background]
enabled = true

[agent.extensions.todo]
enabled = true

# Ordinary Tool exposure does not change execution or approval policy.
[agent.tools]
builtin = ["execution", "ask_user", "read", "write", "edit", "glob", "grep", "bash"]
