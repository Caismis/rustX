# Explicit provider/model declarations. Provider request overlays are JSON strings.
# TOML configuration; fixed Workflows use YAML and model-facing resources use Markdown.
schema_version = 1

[providers.example]
base_url = "https://api.example.invalid/v1"
api_key = "$RUSTX_EXAMPLE_API_KEY"

[[providers.example.models]]
id = "demo-model"
protocol = "openai_chat_completions"
context_window = 128000
max_output_tokens = 4096
request_params_json = "{\"temperature\": 0.2}"

[providers.example.models.capabilities]
input_modalities = ["text"]
output_modalities = ["text"]
tool_calls = true
reasoning = true

[providers.example.models.reasoning]
default_profile = "off"

[providers.example.models.reasoning.profiles.off]
enabled = false
request_params_json = "{}"

[providers.example.models.reasoning.profiles.on]
enabled = true
request_params_json = "{\"reasoning_effort\": \"low\"}"

[providers.example.models.compat]
chat_max_tokens_field = "max_completion_tokens"
chat_reasoning_replay = "reasoning"
chat_stream_usage = "supported"
chat_tool_protocol = "native"
