description: Revise a structured plan using explicit human feedback, with at most three attempts.
timeout_ms: 600000
block:
  input: &state
    type: object
    properties:
      plan: &plan
        type: object
        properties:
          title: {type: string}
          steps: {type: array, items: {type: string}}
        required: [title, steps]
        additionalProperties: false
      feedback: {type: string}
    required: [plan, feedback]
    additionalProperties: false
  output:
    type: object
    properties:
      status: {type: string, enum: [satisfied, exhausted]}
      iterations: {type: integer}
      result: &body_result
        type: object
        properties:
          plan: *plan
          accepted: {type: boolean}
          feedback: {type: string}
        required: [plan, accepted, feedback]
        additionalProperties: false
    required: [status, iterations, result]
    additionalProperties: false
  entry: feedback
  nodes:
    feedback:
      type: loop
      input: {type: reference, path: [args]}
      max_iterations: 3
      body:
        input: *state
        output: *body_result
        entry: revise
        nodes:
          revise:
            type: agent
            profile: reviewer
            task: Revise the supplied business plan using the explicit feedback. Return only the structured plan; do not change any Workflow structure.
            input:
              plan: {type: reference, path: [args, plan]}
              feedback: {type: reference, path: [args, feedback]}
            output: *plan
          review:
            type: review
            subject:
              type: plan
              value: {type: reference, path: [revise]}
            context: []
          done:
            type: return
            output:
              type: object
              fields:
                plan: {type: reference, path: [revise]}
                accepted: {type: reference, path: [review, accepted]}
                feedback: {type: reference, path: [review, feedback]}
        edges:
          - {from: revise, to: review}
          - {from: review, to: done}
      until:
        type: boolean
        value: {type: reference, path: [result, accepted]}
      carry:
        type: object
        fields:
          plan: {type: reference, path: [result, plan]}
          feedback: {type: reference, path: [result, feedback]}
    done:
      type: return
      # Preserve explicit exhaustion in the public business result.
      output: {type: reference, path: [feedback]}
  edges: [{from: feedback, to: done}]
