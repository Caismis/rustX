description: Review a request and choose a typed success or failure result.
block:
  input:
    type: object
    properties:
      task:
        type: string
    required:
    - task
    additionalProperties: false
  output:
    type: object
    properties:
      summary:
        type: string
    required:
    - summary
    additionalProperties: false
  entry: review
  nodes:
    review:
      type: agent
      profile: reviewer
      task: Review the request and commit the result.
      input:
        task:
          type: reference
          path:
          - args
          - task
      output:
        type: object
        properties:
          passed:
            type: boolean
          summary:
            type: string
        required:
        - passed
        - summary
        additionalProperties: false
    decision:
      type: branch
      condition:
        type: boolean
        value:
          type: reference
          path:
          - review
          - passed
    success:
      type: return
      output:
        type: object
        fields:
          summary:
            type: reference
            path:
            - review
            - summary
    failure:
      type: return
      output:
        type: object
        fields:
          summary:
            type: reference
            path:
            - args
            - task
  edges:
  - from: review
    to: decision
  - from: decision
    to: success
    port: true
  - from: decision
    to: failure
    port: false
