description: Run the project's two fixed greeting checks without a model request.
tools:
  - {origin: mcp, server_id: 'python:verify-greeting', name: verify_greeting}
timeout_ms: 600000
block:
  input: {type: object, properties: {}, additionalProperties: false}
  output: &findings
    type: object
    properties:
      passed: {type: boolean}
      failures:
        type: array
        items:
          type: object
          properties:
            case: {type: string}
            expected: {type: string}
            actual: {type: string}
          required: [case, expected, actual]
          additionalProperties: false
    required: [passed, failures]
    additionalProperties: false
  entry: check
  nodes:
    check:
      type: tool
      selector: {origin: mcp, server_id: 'python:verify-greeting', name: verify_greeting}
      arguments: {type: literal, value: {}}
      result: {type: json, part: 1, schema: *findings}
    done:
      type: return
      output: {type: reference, path: [check]}
  edges: [{from: check, to: done}]
