description: Run two independent review passes and return keyed results.
block:
  input:
    type: object
    properties:
      task:
        type: string
    required:
    - task
    additionalProperties: false
  output:
    type: object
    properties:
      security:
        type: object
        properties:
          summary:
            type: string
        required:
        - summary
        additionalProperties: false
      quality:
        type: object
        properties:
          summary:
            type: string
        required:
        - summary
        additionalProperties: false
    required:
    - security
    - quality
    additionalProperties: false
  entry: fanout
  nodes:
    fanout:
      type: parallel
      branches:
        security:
          input:
            type: object
            fields:
              task:
                type: reference
                path:
                - args
                - task
          block:
            input:
              type: object
              properties:
                task:
                  type: string
              required:
              - task
              additionalProperties: false
            output:
              type: object
              properties:
                summary:
                  type: string
              required:
              - summary
              additionalProperties: false
            entry: review
            nodes:
              review:
                type: agent
                profile: reviewer
                task: Review the security implications of the request.
                input:
                  task:
                    type: reference
                    path:
                    - args
                    - task
                output:
                  type: object
                  properties:
                    summary:
                      type: string
                  required: [summary]
                  additionalProperties: false
              done:
                type: return
                output:
                  type: reference
                  path:
                  - review
            edges:
            - from: review
              to: done
        quality:
          input:
            type: object
            fields:
              task:
                type: reference
                path:
                - args
                - task
          block:
            input:
              type: object
              properties:
                task:
                  type: string
              required:
              - task
              additionalProperties: false
            output:
              type: object
              properties:
                summary:
                  type: string
              required:
              - summary
              additionalProperties: false
            entry: review
            nodes:
              review:
                type: agent
                profile: reviewer
                task: Review the quality of the request.
                input:
                  task:
                    type: reference
                    path:
                    - args
                    - task
                output:
                  type: object
                  properties:
                    summary:
                      type: string
                  required: [summary]
                  additionalProperties: false
              done:
                type: return
                output:
                  type: reference
                  path:
                  - review
            edges:
            - from: review
              to: done
    done:
      type: return
      output:
        type: object
        fields:
          security:
            type: reference
            path:
            - fanout
            - security
          quality:
            type: reference
            path:
            - fanout
            - quality
  edges:
  - from: fanout
    to: done
