description: Run two fixed keyed text checks and return both results.
timeout_ms: 60000
block:
  input:
    type: object
    properties:
      text:
        type: string
    required:
    - text
    additionalProperties: false
  output:
    type: object
    properties:
      clarity: &id001
        type: object
        properties:
          passed:
            type: boolean
        required:
        - passed
        additionalProperties: false
      brevity: *id001
    required:
    - clarity
    - brevity
    additionalProperties: false
  nodes:
    start:
      type: start
    return_checks:
      type: return
      output:
        type: object
        fields:
          clarity:
            type: reference
            path:
            - check_text_clarity_assess_clarity
          brevity:
            type: reference
            path:
            - check_text_brevity_assess_brevity
    check_text_clarity_assess_clarity:
      type: agent
      profile: reviewer
      task: Is the supplied text understandable without unexplained jargon?
      input:
        text:
          type: reference
          path:
          - args
          - text
      output:
        type: object
        properties:
          passed:
            type: boolean
        required:
        - passed
        additionalProperties: false
    check_text_brevity_assess_brevity:
      type: agent
      profile: reviewer
      task: Does the supplied text avoid unnecessary repetition?
      input:
        text:
          type: reference
          path:
          - args
          - text
      output:
        type: object
        properties:
          passed:
            type: boolean
        required:
        - passed
        additionalProperties: false
  edges:
  - from: start
    to: check_text_clarity_assess_clarity
  - from: check_text_clarity_assess_clarity
    to: return_checks
  - from: start
    to: check_text_brevity_assess_brevity
  - from: check_text_brevity_assess_brevity
    to: return_checks
