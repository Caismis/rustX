description: Run two fixed keyed text checks and return both results.
timeout_ms: 60000
block:
  input:
    type: object
    properties:
      text:
        type: string
    required:
    - text
    additionalProperties: false
  nodes:
    start:
      type: start
    return_checks:
      type: return
      outputs:
      - {variable: clarity, value_selector: [check_text_clarity_assess_clarity]}
      - {variable: brevity, value_selector: [check_text_brevity_assess_brevity]}
    check_text_clarity_assess_clarity:
      type: agent
      profile: reviewer
      task:
      - type: literal
        value: "Is the supplied text understandable without unexplained jargon?"
      - type: literal
        value: "\n\ntext: "
      - type: reference
        path: ["args", "text"]
      output:
        type: json_schema
        schema:
          type: object
          properties:
            passed:
              type: boolean
          required:
          - passed
          additionalProperties: false
    check_text_brevity_assess_brevity:
      type: agent
      profile: reviewer
      task:
      - type: literal
        value: "Does the supplied text avoid unnecessary repetition?"
      - type: literal
        value: "\n\ntext: "
      - type: reference
        path: ["args", "text"]
      output:
        type: json_schema
        schema:
          type: object
          properties:
            passed:
              type: boolean
          required:
          - passed
          additionalProperties: false
  edges:
  - from: start
    to: check_text_clarity_assess_clarity
  - from: check_text_clarity_assess_clarity
    to: return_checks
  - from: start
    to: check_text_brevity_assess_brevity
  - from: check_text_brevity_assess_brevity
    to: return_checks
