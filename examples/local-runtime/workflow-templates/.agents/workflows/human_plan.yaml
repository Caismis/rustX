description: Ask a person to approve or reject a bounded plan, and return the action they chose.
timeout_ms: 120000
block:
  input:
    type: object
    properties:
      plan:
        type: object
        properties:
          summary:
            type: string
        required:
        - summary
        additionalProperties: false
    required:
    - plan
    additionalProperties: false
  output:
    type: object
    properties:
      action:
        type: string
        enum:
        - approve
        - reject
        - timeout
      content:
        type: string
    required:
    - action
    - content
    additionalProperties: false
  nodes:
    start:
      type: start
    review_plan:
      type: review
      content:
      - type: literal
        value: 'Approve this plan?


          '
      - type: reference
        path:
        - args
        - plan
        - summary
      actions:
      - id: approve
        title: Approve
      - id: reject
        title: Reject
      timeout_ms: 60000
    return_decision:
      type: return
      output:
        type: reference
        path:
        - review_plan
  edges:
  - from: start
    to: review_plan
  - from: review_plan
    to: return_decision
    port: approve
  - from: review_plan
    to: return_decision
    port: reject
  - from: review_plan
    to: return_decision
    port: timeout
