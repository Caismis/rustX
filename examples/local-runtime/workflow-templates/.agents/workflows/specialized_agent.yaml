description: Run one named role twice, specialized differently per node.
timeout_ms: 60000
block:
  input:
    type: object
    properties:
      topic:
        type: string
    required:
    - topic
    additionalProperties: false
  output: &id001
    type: object
    properties:
      summary:
        type: string
    required:
    - summary
    additionalProperties: false
  nodes:
    start:
      type: start
    describe:
      type: agent
      profile: reviewer
      task: Describe the supplied topic in one short sentence.
      input:
        topic:
          type: reference
          path:
          - args
          - topic
      output: *id001
    inspect:
      type: agent
      profile: reviewer
      task: Using the described topic, report what the repository files show.
      override:
        tools:
          builtin:
          - read
          - grep
        plugins: {}
      input:
        described:
          type: reference
          path:
          - describe
      output: *id001
    return_assessment:
      type: return
      output:
        type: reference
        path:
        - inspect
  edges:
  - from: start
    to: describe
  - from: describe
    to: inspect
  - from: inspect
    to: return_assessment
