description: Summarize a topic with one typed Agent result.
timeout_ms: 60000
block:
  input:
    type: object
    properties:
      topic:
        type: string
    required:
    - topic
    additionalProperties: false
  output: &id001
    type: object
    properties:
      summary:
        type: string
    required:
    - summary
    additionalProperties: false
  nodes:
    start:
      type: start
    summarize:
      type: agent
      profile: reviewer
      task:
      - type: literal
        value: "Summarize the supplied topic in one short sentence."
      - type: literal
        value: "\n\ntopic: "
      - type: reference
        path: ["args", "topic"]
      output: {type: json_schema, schema: *id001}
    return_summary:
      type: return
      output:
        type: reference
        path:
        - summarize
  edges:
  - from: start
    to: summarize
  - from: summarize
    to: return_summary
