description: Summarize a topic with one typed Agent result.
timeout_ms: 60000
block:
  input:
    type: object
    properties:
      topic:
        type: string
    required:
    - topic
    additionalProperties: false
  nodes:
    start:
      type: start
    summarize:
      type: agent
      profile: reviewer
      task:
      - type: literal
        value: "Summarize the supplied topic in one short sentence."
      - type: literal
        value: "\n\ntopic: "
      - type: reference
        path: ["args", "topic"]
      output:
        type: json_schema
        schema:
          type: object
          properties:
            summary:
              type: string
          required:
          - summary
          additionalProperties: false
    return_summary:
      type: return
      outputs:
      - {variable: summary, value_selector: [summarize, summary]}
  edges:
  - from: start
    to: summarize
  - from: summarize
    to: return_summary
