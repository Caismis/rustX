description: Collect two concurrent echoes, join them, then execute a bounded Loop.
block:
  input:
    type: object
    properties:
      message:
        type: string
        description: Text supplied by the caller.
    required:
    - message
    additionalProperties: false
  output:
    type: object
    properties:
      parallel:
        type: object
        properties:
          left:
            type: object
            properties:
              echo:
                type: string
            required:
            - echo
            additionalProperties: false
          right:
            type: object
            properties:
              echo:
                type: string
            required:
            - echo
            additionalProperties: false
        required:
        - left
        - right
        additionalProperties: false
      loop:
        type: object
        properties:
          status:
            type: string
          iterations:
            type: integer
          result:
            type: object
            properties:
              echo:
                type: string
            required:
            - echo
            additionalProperties: false
        required:
        - status
        - iterations
        - result
        additionalProperties: false
    required:
    - parallel
    - loop
    additionalProperties: false
  nodes:
    start:
      type: start
    left:
      type: loop
      input:
        type: object
        fields:
          message:
            type: reference
            path:
            - args
            - message
      until:
        type: boolean
        value:
          type: literal
          value: true
      carry:
        type: object
        fields:
          message:
            type: reference
            path:
            - result
            - echo
      max_iterations: 1
      body:
        input:
          type: object
          properties:
            message:
              type: string
              description: Text supplied by the caller.
          required:
          - message
          additionalProperties: false
        output:
          type: object
          properties:
            echo:
              type: string
          required:
          - echo
          additionalProperties: false
        nodes:
          start:
            type: start
          done:
            type: return
            output:
              type: object
              fields:
                echo:
                  type: reference
                  path:
                  - args
                  - message
        edges:
        - from: start
          to: done
    right:
      type: loop
      input:
        type: object
        fields:
          message:
            type: reference
            path:
            - args
            - message
      until:
        type: boolean
        value:
          type: literal
          value: true
      carry:
        type: object
        fields:
          message:
            type: reference
            path:
            - result
            - echo
      max_iterations: 1
      body:
        input:
          type: object
          properties:
            message:
              type: string
              description: Text supplied by the caller.
          required:
          - message
          additionalProperties: false
        output:
          type: object
          properties:
            echo:
              type: string
          required:
          - echo
          additionalProperties: false
        nodes:
          start:
            type: start
          done:
            type: return
            output:
              type: object
              fields:
                echo:
                  type: reference
                  path:
                  - args
                  - message
        edges:
        - from: start
          to: done
    repeat:
      type: loop
      input:
        type: object
        fields:
          message:
            type: reference
            path:
            - args
            - message
      until:
        type: boolean
        value:
          type: literal
          value: true
      carry:
        type: object
        fields:
          message:
            type: reference
            path:
            - result
            - echo
      max_iterations: 3
      body:
        input:
          type: object
          properties:
            message:
              type: string
              description: Text supplied by the caller.
          required:
          - message
          additionalProperties: false
        output:
          type: object
          properties:
            echo:
              type: string
          required:
          - echo
          additionalProperties: false
        nodes:
          start:
            type: start
          done:
            type: return
            output:
              type: object
              fields:
                echo:
                  type: reference
                  path:
                  - args
                  - message
        edges:
        - from: start
          to: done
    done:
      type: return
      output:
        type: object
        fields:
          parallel:
            type: object
            fields:
              left:
                type: reference
                path:
                - left
                - result
              right:
                type: reference
                path:
                - right
                - result
          loop:
            type: reference
            path:
            - repeat
  edges:
  - from: start
    to: left
  - from: start
    to: right
  - from: left
    to: repeat
    port: satisfied
  - from: left
    to: repeat
    port: exhausted
  - from: right
    to: repeat
    port: satisfied
  - from: right
    to: repeat
    port: exhausted
  - from: repeat
    to: done
    port: satisfied
  - from: repeat
    to: done
    port: exhausted
editor:
  nodes:
  - address:
      block: []
      node: left
    title: Left echo
    position:
      x: 360
      y: 80
  - address:
      block: []
      node: right
    title: Right echo
    position:
      x: 360
      y: 320
  notes:
  - id: author_note
    block:
    - node: repeat
    text: Author-only Markdown. A nested Return completes its own Block.
    theme: amber
    position:
      x: 32
      y: 300
    dimensions:
      width: 280
      height: 140
  orders: []
  display:
    title: Collect and repeat
