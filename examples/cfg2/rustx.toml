schema_version = 8

# Source eligibility is independent of Agent Tool exposure.
[mcp_servers.github]
enabled = true
url = "https://mcp.example.invalid/mcp"

[skills]
sources = ["global", "workspace"]

[agent]
agents = ["reviewer"]
workflows = ["review"]
disabled_skills = []

# Main has no direct external Tool authority.
[agent.tools]
builtin = ["read"]

# A Workspace model selection is complete; it never inherits a lower identity.
[agent.model]
model = "example/demo-model"

[agent.model.request_params]
temperature = 0.7
top_p = 0.95
chat_template_kwargs.enable_thinking = true
